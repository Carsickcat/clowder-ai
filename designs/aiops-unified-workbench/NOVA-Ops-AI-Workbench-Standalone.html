<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#071014" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2376f2c7'/%3E%3Cpath d='M8 23V9h4l8 9V9h4v14h-4l-8-9v9z' fill='%23071014'/%3E%3C/svg%3E" />
    <title>NOVA Ops · 场景驱动 AI 运维工作台</title>      <!-- Portable single-file build: no network or localhost dependency. -->
    <style>
:root {
  color-scheme: dark;
  --bg: #050a0d;
  --bg-deep: #030608;
  --surface-0: #081015;
  --surface-1: #0b151b;
  --surface-2: #101d24;
  --surface-3: #15252e;
  --line: rgba(175, 213, 224, 0.12);
  --line-strong: rgba(175, 213, 224, 0.22);
  --text: #edf8f7;
  --text-soft: #a9bdc0;
  --text-muted: #6f878c;
  --mint: #79f2c8;
  --cyan: #67d8ff;
  --violet: #a88cff;
  --amber: #ffca72;
  --red: #ff6f7d;
  --blue: #6ea8ff;
  --green: #72e6a5;
  --accent: var(--mint);
  --accent-soft: rgba(121, 242, 200, 0.12);
  --accent-line: rgba(121, 242, 200, 0.34);
  --shadow: 0 28px 90px rgba(0, 0, 0, 0.42);
  --radius-sm: 8px;
  --radius: 14px;
  --radius-lg: 22px;
  --font:
    Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
}

* {
  box-sizing: border-box;
}
html {
  min-width: 320px;
  background: var(--bg);
  scroll-behavior: smooth;
}
body {
  margin: 0;
  min-width: 320px;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
}
button,
input {
  font: inherit;
}
button {
  color: inherit;
}
button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}
svg.icon {
  width: 18px;
  height: 18px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
h1,
h2,
h3,
p {
  margin: 0;
}
button {
  border: 0;
}
.eyebrow {
  color: var(--text-muted);
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}
.dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
}
.dot--fact {
  background: var(--cyan);
}
.dot--ai {
  background: var(--violet);
}
.dot--human {
  background: var(--mint);
}

::-webkit-scrollbar {
  width: 10px;
  height: 10px;
}
::-webkit-scrollbar-thumb {
  background: rgba(151, 184, 191, 0.2);
  border: 3px solid transparent;
  border-radius: 999px;
  background-clip: padding-box;
}
::-webkit-scrollbar-track {
  background: transparent;
}

.home-shell,
.workbench-shell {
  min-height: 100vh;
  background:
    radial-gradient(circle at 20% -10%, rgba(103, 216, 255, 0.09), transparent 26rem),
    radial-gradient(circle at 82% 20%, rgba(121, 242, 200, 0.065), transparent 28rem), var(--bg);
}
.home-main {
  width: min(1500px, calc(100% - 56px));
  margin: 0 auto;
  padding: 56px 0 120px;
}
.home-hero {
  display: grid;
  grid-template-columns: minmax(0, 1.2fr) minmax(420px, 0.8fr);
  gap: 70px;
  align-items: end;
  min-height: 500px;
  padding: 54px 0 74px;
  border-bottom: 1px solid var(--line);
}
.home-hero__copy {
  max-width: 850px;
}
.home-hero__copy .eyebrow span {
  color: var(--mint);
}
.home-hero__copy h1 {
  margin-top: 28px;
  font-size: clamp(48px, 5.8vw, 88px);
  line-height: 0.98;
  letter-spacing: -0.055em;
  font-weight: 600;
}
.home-hero__copy h1 em {
  color: var(--mint);
  font-style: normal;
}
.home-hero__copy > p:not(.eyebrow) {
  max-width: 720px;
  margin-top: 28px;
  color: var(--text-soft);
  font-size: 18px;
  line-height: 1.75;
}
.home-hero__copy .outline-action {
  margin-top: 34px;
}
.home-status {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  min-height: 190px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-lg);
  overflow: hidden;
  background: rgba(7, 15, 19, 0.76);
  box-shadow: var(--shadow);
}
.home-status > div {
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 26px;
  border-right: 1px solid var(--line);
}
.home-status > div:last-child {
  border: 0;
}
.home-status__label {
  margin-bottom: auto;
  color: var(--text-muted);
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.12em;
}
.home-status strong {
  font-size: 38px;
  font-weight: 540;
  letter-spacing: -0.05em;
}
.home-status strong.text-amber {
  color: var(--amber);
}
.home-status small {
  margin-top: 6px;
  color: var(--text-soft);
  font-size: 12px;
  line-height: 1.4;
}
.capability-map,
.scenario-section,
.module-anatomy {
  padding: 84px 0 0;
}
.capability-map {
  max-height: 0;
  padding-top: 0;
  opacity: 0;
  overflow: hidden;
  transform: translateY(-12px);
  transition:
    max-height 0.5s ease,
    opacity 0.3s ease,
    transform 0.3s ease,
    padding 0.3s ease;
}
.capability-map.is-open {
  max-height: 620px;
  padding-top: 84px;
  opacity: 1;
  transform: translateY(0);
}
.capability-chain {
  display: grid;
  grid-template-columns: repeat(8, minmax(0, 1fr));
  margin-top: 34px;
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  overflow: hidden;
}
.capability-node {
  position: relative;
  min-height: 178px;
  padding: 20px 16px;
  border-right: 1px solid var(--line);
  background: linear-gradient(155deg, rgba(16, 29, 36, 0.78), rgba(7, 14, 18, 0.84));
}
.capability-node:last-child {
  border: 0;
}
.capability-node::after {
  content: "→";
  position: absolute;
  z-index: 2;
  top: 50%;
  right: -10px;
  display: grid;
  width: 20px;
  height: 20px;
  place-items: center;
  color: var(--text-muted);
  background: var(--surface-0);
  border: 1px solid var(--line);
  border-radius: 50%;
  font-size: 11px;
}
.capability-node:last-child::after {
  display: none;
}
.capability-node > span {
  color: var(--text-muted);
  font-family: var(--mono);
  font-size: 10px;
}
.capability-node strong,
.capability-node em,
.capability-node small {
  display: block;
}
.capability-node strong {
  margin-top: 42px;
  font-size: 13px;
}
.capability-node em {
  margin-top: 4px;
  color: var(--mint);
  font-size: 12px;
  font-style: normal;
}
.capability-node small {
  margin-top: 13px;
  color: var(--text-muted);
  font-size: 10px;
  line-height: 1.55;
}
.responsibility-line {
  display: flex;
  gap: 30px;
  align-items: center;
  margin-top: 20px;
  color: var(--text-soft);
  font-size: 12px;
}
.responsibility-line span {
  display: flex;
  gap: 8px;
  align-items: center;
}
.responsibility-line strong {
  color: var(--text);
}
.scenario-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
  margin-top: 34px;
}
.module-anatomy__grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 1px;
  margin-top: 34px;
  padding: 1px;
  background: var(--line);
  border-radius: var(--radius-lg);
  overflow: hidden;
}

.workbench-shell--violet {
  --accent: var(--violet);
  --accent-soft: rgba(168, 140, 255, 0.11);
  --accent-line: rgba(168, 140, 255, 0.35);
}
.workbench-shell--cyan {
  --accent: var(--cyan);
  --accent-soft: rgba(103, 216, 255, 0.1);
  --accent-line: rgba(103, 216, 255, 0.32);
}
.workbench-shell--amber {
  --accent: var(--amber);
  --accent-soft: rgba(255, 202, 114, 0.1);
  --accent-line: rgba(255, 202, 114, 0.34);
}
.workbench-layout {
  display: grid;
  grid-template-columns: 248px minmax(560px, 1fr) 340px;
  gap: 0;
  width: 100%;
  min-height: calc(100vh - 194px);
  border-top: 1px solid var(--line);
}
.journey-rail {
  position: sticky;
  top: 194px;
  align-self: start;
  height: calc(100vh - 194px);
  overflow: auto;
  border-right: 1px solid var(--line);
  background: rgba(6, 12, 15, 0.88);
}
.stage {
  min-width: 0;
  padding: 34px 36px 80px;
  overflow: hidden;
}
.ai-inspector {
  position: sticky;
  top: 194px;
  align-self: start;
  height: calc(100vh - 194px);
  overflow: hidden;
  border-left: 1px solid var(--line);
  background: rgba(8, 16, 21, 0.92);
}
.mobile-ai-trigger,
.mobile-journey-trigger,
.mobile-backdrop {
  display: none;
}

@media (max-width: 1260px) {
  .home-hero {
    grid-template-columns: 1fr;
  }
  .home-status {
    max-width: 760px;
  }
  .capability-chain {
    grid-template-columns: repeat(4, 1fr);
  }
  .capability-node:nth-child(4) {
    border-right: 0;
  }
  .capability-node:nth-child(-n + 4) {
    border-bottom: 1px solid var(--line);
  }
  .workbench-layout {
    grid-template-columns: 220px minmax(0, 1fr);
  }
  .ai-inspector {
    position: fixed;
    z-index: 50;
    top: 0;
    right: 0;
    width: min(420px, 90vw);
    height: 100vh;
    transform: translateX(102%);
    transition: transform 0.28s ease;
    box-shadow: -20px 0 80px rgba(0, 0, 0, 0.5);
  }
  .ai-inspector.is-open {
    transform: translateX(0);
  }
  .mobile-ai-trigger {
    position: fixed;
    z-index: 40;
    right: 24px;
    bottom: 24px;
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 13px 17px;
    border: 1px solid var(--accent-line);
    border-radius: 999px;
    background: var(--accent);
    color: #071014;
    font-weight: 750;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
  }
  .mobile-backdrop {
    position: fixed;
    z-index: 45;
    inset: 0;
    background: rgba(0, 0, 0, 0.54);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
  }
  .ai-inspector.is-open + .mobile-ai-trigger + .mobile-backdrop {
    display: block;
    opacity: 1;
    pointer-events: auto;
  }
}

@media (max-width: 900px) {
  .home-main {
    width: min(100% - 32px, 760px);
    padding-top: 20px;
  }
  .home-hero {
    min-height: auto;
    padding: 50px 0 56px;
    gap: 42px;
  }
  .home-hero__copy h1 {
    font-size: clamp(42px, 13vw, 64px);
  }
  .home-status {
    grid-template-columns: 1fr;
  }
  .home-status > div {
    min-height: 130px;
    border-right: 0;
    border-bottom: 1px solid var(--line);
  }
  .scenario-grid {
    grid-template-columns: 1fr;
  }
  .module-anatomy__grid {
    grid-template-columns: 1fr;
  }
  .capability-chain {
    grid-template-columns: repeat(2, 1fr);
  }
  .capability-node:nth-child(even) {
    border-right: 0;
  }
  .capability-node {
    border-bottom: 1px solid var(--line);
  }
  .responsibility-line {
    align-items: flex-start;
    flex-direction: column;
    gap: 10px;
  }
  .workbench-layout {
    display: block;
  }
  .journey-rail {
    position: fixed;
    z-index: 60;
    inset: 0 auto 0 0;
    width: min(330px, 88vw);
    height: 100vh;
    transform: translateX(-102%);
    transition: transform 0.25s;
    box-shadow: 20px 0 80px rgba(0, 0, 0, 0.6);
  }
  .journey-rail.is-mobile-open {
    transform: translateX(0);
  }
  .stage {
    padding: 24px 18px 100px;
  }
  .mobile-journey-trigger {
    display: flex;
    gap: 8px;
    align-items: center;
    margin: 14px 18px 0;
    padding: 10px 14px;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    background: var(--surface-1);
    color: var(--text-soft);
    font-size: 12px;
  }
}

@media (max-width: 520px) {
  .home-main {
    width: calc(100% - 24px);
  }
  .home-hero__copy > p:not(.eyebrow) {
    font-size: 15px;
  }
  .capability-node {
    min-height: 150px;
    padding: 15px 12px;
  }
  .capability-node strong {
    margin-top: 28px;
    font-size: 11px;
  }
  .stage {
    padding-inline: 12px;
  }
}

.product-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: min(1500px, calc(100% - 56px));
  height: 84px;
  margin: 0 auto;
  border-bottom: 1px solid var(--line);
}
.product-header--compact {
  width: 100%;
  height: 66px;
  padding: 0 22px;
  background: rgba(5, 10, 13, 0.9);
  border-bottom: 1px solid var(--line);
}
.brand {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 0;
  background: transparent;
  cursor: pointer;
  text-align: left;
}
.brand__mark {
  display: grid;
  width: 38px;
  height: 38px;
  place-items: center;
  background: var(--mint);
  color: var(--bg);
  border-radius: 10px;
  font-weight: 900;
  font-size: 19px;
  box-shadow: 0 0 28px rgba(121, 242, 200, 0.2);
}
.brand > span:last-child {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.brand strong {
  font-size: 14px;
  letter-spacing: 0.04em;
}
.brand small {
  color: var(--text-muted);
  font-family: var(--mono);
  font-size: 8px;
  letter-spacing: 0.13em;
}
.product-header__meta {
  display: flex;
  gap: 10px;
  align-items: center;
}
.live-dot,
.operator-chip {
  display: flex;
  gap: 7px;
  align-items: center;
  min-height: 34px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--text-muted);
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.08em;
}
.live-dot i {
  width: 6px;
  height: 6px;
  background: var(--mint);
  border-radius: 50%;
  box-shadow: 0 0 0 4px rgba(121, 242, 200, 0.08);
}
.operator-chip svg {
  width: 13px;
}
.outline-action,
.primary-action {
  display: inline-flex;
  gap: 9px;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  padding: 0 18px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 720;
  transition:
    transform 0.18s ease,
    border-color 0.18s ease,
    background 0.18s ease;
}
.outline-action {
  border: 1px solid var(--line-strong);
  background: rgba(12, 24, 30, 0.7);
  color: var(--text);
}
.outline-action:hover {
  border-color: var(--mint);
  transform: translateY(-1px);
}
.primary-action {
  background: var(--accent);
  color: #061014;
  box-shadow: 0 10px 28px color-mix(in srgb, var(--accent) 18%, transparent);
}
.primary-action:hover:not(:disabled) {
  transform: translateY(-1px);
  filter: brightness(1.05);
}
.primary-action:disabled {
  cursor: not-allowed;
  opacity: 0.35;
}
.section-kicker {
  display: flex;
  gap: 18px;
  align-items: flex-start;
}
.section-kicker > span {
  display: grid;
  width: 40px;
  height: 40px;
  place-items: center;
  border: 1px solid var(--line-strong);
  border-radius: 50%;
  color: var(--mint);
  font-family: var(--mono);
  font-size: 10px;
}
.section-kicker p {
  color: var(--text-muted);
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.15em;
}
.section-kicker h2 {
  margin-top: 7px;
  font-size: clamp(24px, 2.5vw, 36px);
  font-weight: 540;
  letter-spacing: -0.03em;
}
.scenario-card {
  position: relative;
  min-height: 435px;
  padding: 25px;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: linear-gradient(160deg, rgba(15, 28, 35, 0.92), rgba(6, 12, 16, 0.94));
  transition:
    border-color 0.22s,
    transform 0.22s;
}
.scenario-card::before {
  content: "";
  position: absolute;
  width: 230px;
  height: 230px;
  top: -120px;
  right: -70px;
  border-radius: 50%;
  filter: blur(2px);
  opacity: 0.12;
}
.scenario-card--violet::before {
  background: var(--violet);
}
.scenario-card--cyan::before {
  background: var(--cyan);
}
.scenario-card--amber::before {
  background: var(--amber);
}
.scenario-card:hover {
  transform: translateY(-4px);
  border-color: var(--line-strong);
}
.scenario-card__top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.scenario-card__number {
  color: var(--text-muted);
  font-family: var(--mono);
  font-size: 11px;
}
.scenario-card__role {
  margin-top: 54px;
  color: var(--text-muted);
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.14em;
}
.scenario-card h2 {
  margin-top: 10px;
  font-size: 28px;
  font-weight: 560;
  letter-spacing: -0.03em;
}
.scenario-card__trigger {
  min-height: 44px;
  margin-top: 13px;
  color: var(--text-soft);
  font-size: 13px;
  line-height: 1.65;
}
.scenario-card__question {
  margin-top: 24px;
  padding: 18px;
  background: rgba(4, 10, 13, 0.68);
  border: 1px solid var(--line);
  border-radius: 12px;
}
.scenario-card__question span {
  display: block;
  color: var(--text-muted);
  font-size: 10px;
}
.scenario-card__question strong {
  display: block;
  margin-top: 7px;
  font-size: 14px;
  line-height: 1.55;
}
.scenario-card__value {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  min-height: 52px;
  margin-top: 16px;
  color: var(--text-soft);
  font-size: 11px;
  line-height: 1.55;
}
.scenario-card__value svg {
  flex: 0 0 auto;
  width: 14px;
  margin-top: 2px;
  color: var(--mint);
}
.scenario-card__action {
  position: absolute;
  right: 25px;
  bottom: 24px;
  left: 25px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 44px;
  padding: 0 15px;
  border: 1px solid var(--line-strong);
  border-radius: 9px;
  background: rgba(11, 24, 30, 0.9);
  cursor: pointer;
  font-size: 12px;
  font-weight: 700;
}
.scenario-card__action:hover {
  background: var(--text);
  color: var(--bg);
}
.scenario-card__action svg {
  width: 14px;
}
.module-anatomy__item {
  position: relative;
  display: flex;
  gap: 12px;
  align-items: center;
  min-height: 112px;
  padding: 20px;
  background: var(--surface-0);
}
.module-anatomy__item > span {
  display: grid;
  flex: 0 0 auto;
  width: 34px;
  height: 34px;
  place-items: center;
  color: var(--mint);
  background: rgba(121, 242, 200, 0.08);
  border-radius: 9px;
}
.module-anatomy__item strong,
.module-anatomy__item small {
  display: block;
}
.module-anatomy__item strong {
  font-size: 13px;
}
.module-anatomy__item small {
  margin-top: 5px;
  color: var(--text-muted);
  font-size: 10px;
  line-height: 1.45;
}
.module-anatomy__item > em {
  position: absolute;
  top: 12px;
  right: 12px;
  color: rgba(169, 189, 192, 0.15);
  font-family: var(--mono);
  font-size: 8px;
  font-style: normal;
  letter-spacing: 0.1em;
}
.status-badge {
  display: inline-flex;
  gap: 6px;
  align-items: center;
  width: max-content;
  min-height: 23px;
  padding: 0 8px;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--text-soft);
  font-family: var(--mono);
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.05em;
}
.status-badge i {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: currentColor;
}
.status-badge--critical,
.status-badge--failed,
.status-badge--blocked {
  color: var(--red);
  background: rgba(255, 111, 125, 0.08);
  border-color: rgba(255, 111, 125, 0.25);
}
.status-badge--warning,
.status-badge--partial,
.status-badge--unknown,
.status-badge--review {
  color: var(--amber);
  background: rgba(255, 202, 114, 0.07);
  border-color: rgba(255, 202, 114, 0.24);
}
.status-badge--healthy,
.status-badge--passed,
.status-badge--completed,
.status-badge--approved {
  color: var(--green);
  background: rgba(114, 230, 165, 0.07);
  border-color: rgba(114, 230, 165, 0.24);
}
.status-badge--active,
.status-badge--recovering,
.status-badge--assigned {
  color: var(--cyan);
  background: rgba(103, 216, 255, 0.07);
  border-color: rgba(103, 216, 255, 0.24);
}
.status-badge--not_started,
.status-badge--scheduled,
.status-badge--neutral,
.status-badge--new {
  color: var(--text-muted);
}
.toast {
  position: fixed;
  z-index: 100;
  bottom: 24px;
  left: 50%;
  max-width: min(520px, calc(100% - 32px));
  padding: 13px 17px;
  transform: translate(-50%, 20px);
  opacity: 0;
  pointer-events: none;
  background: #eaf7f5;
  color: #061014;
  border-radius: 10px;
  box-shadow: 0 14px 50px rgba(0, 0, 0, 0.45);
  font-size: 12px;
  font-weight: 700;
  transition:
    opacity 0.2s,
    transform 0.2s;
}
.toast.is-visible {
  opacity: 1;
  transform: translate(-50%, 0);
}

@media (max-width: 900px) {
  .product-header {
    width: calc(100% - 32px);
  }
  .product-header--compact {
    width: 100%;
    padding: 0 15px;
  }
  .operator-chip {
    display: none;
  }
  .live-dot {
    padding: 0 9px;
  }
}

.context-strip {
  display: grid;
  grid-template-columns: auto repeat(3, minmax(120px, 0.7fr)) minmax(210px, 1.2fr);
  align-items: stretch;
  min-height: 72px;
  border-bottom: 1px solid var(--line);
  background: rgba(8, 16, 21, 0.92);
}
.context-strip > span {
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-width: 0;
  padding: 0 18px;
  border-right: 1px solid var(--line);
}
.context-strip .context-strip__lock {
  flex-direction: row;
  gap: 8px;
  align-items: center;
  color: var(--accent);
  font-family: var(--mono);
  font-size: 8px;
  letter-spacing: 0.1em;
  white-space: nowrap;
}
.context-strip__lock svg {
  width: 14px;
}
.context-strip small {
  color: var(--text-muted);
  font-family: var(--mono);
  font-size: 7px;
  letter-spacing: 0.1em;
}
.context-strip strong {
  overflow: hidden;
  margin-top: 5px;
  font-size: 10px;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.context-strip__change strong {
  color: var(--accent);
}
.module-nav {
  display: flex;
  justify-content: center;
  height: 56px;
  background: rgba(5, 10, 13, 0.94);
  border-bottom: 1px solid var(--line);
}
.module-nav button {
  position: relative;
  display: flex;
  gap: 8px;
  align-items: center;
  min-width: 112px;
  padding: 0 18px;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 11px;
}
.module-nav button::after {
  content: "";
  position: absolute;
  right: 18px;
  bottom: -1px;
  left: 18px;
  height: 2px;
  transform: scaleX(0);
  background: var(--accent);
  transition: transform 0.2s;
}
.module-nav button:hover,
.module-nav button.is-active {
  color: var(--text);
}
.module-nav button.is-active::after {
  transform: scaleX(1);
}
.module-nav svg {
  width: 15px;
}
.journey-rail__header {
  padding: 24px 20px 20px;
  border-bottom: 1px solid var(--line);
}
.journey-rail__header p {
  color: var(--accent);
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.1em;
}
.journey-rail__header strong {
  display: block;
  margin-top: 6px;
  font-size: 11px;
  font-weight: 600;
}
.journey-rail__header button {
  display: none;
}
.journey-rail__question {
  margin: 16px;
  padding: 15px;
  background: var(--accent-soft);
  border: 1px solid var(--accent-line);
  border-radius: 10px;
}
.journey-rail__question span {
  color: var(--text-muted);
  font-size: 9px;
}
.journey-rail__question strong {
  display: block;
  margin-top: 6px;
  font-size: 12px;
  line-height: 1.55;
}
.journey-rail nav {
  padding: 4px 0;
}
.journey-step {
  position: relative;
  display: flex;
  gap: 12px;
  align-items: center;
  width: 100%;
  min-height: 66px;
  padding: 10px 18px;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  text-align: left;
}
.journey-step:hover {
  background: rgba(255, 255, 255, 0.025);
  color: var(--text-soft);
}
.journey-step.is-active {
  background: var(--accent-soft);
  color: var(--text);
}
.journey-step > i {
  position: absolute;
  top: 8px;
  bottom: 8px;
  left: 0;
  width: 2px;
  background: var(--accent);
}
.journey-step__index {
  display: grid;
  flex: 0 0 auto;
  width: 28px;
  height: 28px;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 50%;
  font-family: var(--mono);
  font-size: 8px;
}
.journey-step.is-active .journey-step__index {
  border-color: var(--accent);
  color: var(--accent);
}
.journey-step.is-complete .journey-step__index {
  border-color: rgba(114, 230, 165, 0.3);
  background: rgba(114, 230, 165, 0.08);
  color: var(--green);
}
.journey-step__index svg {
  width: 13px;
}
.journey-step small,
.journey-step strong {
  display: block;
}
.journey-step small {
  font-family: var(--mono);
  font-size: 7px;
  letter-spacing: 0.09em;
}
.journey-step strong {
  margin-top: 3px;
  font-size: 11px;
  font-weight: 600;
}
.journey-rail__value {
  margin: 18px 16px 28px;
  padding-top: 16px;
  border-top: 1px solid var(--line);
}
.journey-rail__value span {
  color: var(--text-muted);
  font-size: 8px;
}
.journey-rail__value p {
  margin-top: 7px;
  color: var(--text-soft);
  font-size: 10px;
  line-height: 1.55;
}
.stage-header {
  padding-bottom: 28px;
}
.stage-header__meta {
  display: flex;
  gap: 10px;
  align-items: center;
  color: var(--text-muted);
  font-family: var(--mono);
  font-size: 8px;
  letter-spacing: 0.09em;
}
.stage-header h1 {
  margin-top: 18px;
  max-width: 850px;
  font-size: clamp(30px, 3.5vw, 48px);
  font-weight: 540;
  letter-spacing: -0.04em;
  line-height: 1.08;
}
.stage-header > p {
  max-width: 760px;
  margin-top: 14px;
  color: var(--text-soft);
  font-size: 13px;
  line-height: 1.7;
}
.decision-contract {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 24px;
}
.decision-contract > div {
  min-height: 92px;
  padding: 15px 17px;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: rgba(10, 20, 25, 0.7);
}
.decision-contract > div:first-child {
  border-color: rgba(168, 140, 255, 0.22);
  background: rgba(168, 140, 255, 0.05);
}
.decision-contract > div:last-child {
  border-color: var(--accent-line);
  background: var(--accent-soft);
}
.decision-contract span {
  display: flex;
  gap: 7px;
  align-items: center;
  color: var(--text-muted);
  font-family: var(--mono);
  font-size: 8px;
  letter-spacing: 0.08em;
}
.decision-contract svg {
  width: 13px;
}
.decision-contract p {
  margin-top: 9px;
  color: var(--text-soft);
  font-size: 11px;
  line-height: 1.55;
}
.stage-action {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 22px;
  margin-top: 22px;
  padding: 17px 18px;
  border: 1px solid var(--accent-line);
  border-radius: 13px;
  background: linear-gradient(90deg, var(--accent-soft), rgba(10, 20, 25, 0.82));
}
.stage-action > div small,
.stage-action > div strong {
  display: block;
}
.stage-action > div small {
  color: var(--text-muted);
  font-size: 8px;
}
.stage-action > div strong {
  margin-top: 6px;
  font-size: 11px;
  font-weight: 620;
}
.stage-action--complete {
  min-height: 62px;
  color: var(--green);
}
.stage-action--complete span {
  display: flex;
  gap: 8px;
  align-items: center;
  font-size: 11px;
  font-weight: 700;
}
.stage-action--complete small {
  color: var(--text-muted);
}
.deep-module-header {
  display: flex;
  gap: 26px;
  align-items: flex-start;
  padding-bottom: 28px;
}
.deep-module-header > button {
  display: flex;
  gap: 8px;
  align-items: center;
  min-width: max-content;
  padding: 9px 11px;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 10px;
}
.deep-module-header > div p {
  color: var(--accent);
  font-family: var(--mono);
  font-size: 8px;
  letter-spacing: 0.12em;
}
.deep-module-header h1 {
  margin-top: 7px;
  font-size: 34px;
  font-weight: 540;
}
.deep-module-header > div span {
  display: block;
  margin-top: 9px;
  color: var(--text-soft);
  font-size: 12px;
}

@media (max-width: 900px) {
  .context-strip {
    grid-template-columns: repeat(2, 1fr);
  }
  .context-strip > span {
    min-height: 54px;
    border-bottom: 1px solid var(--line);
  }
  .context-strip .context-strip__lock {
    display: none;
  }
  .context-strip__change {
    grid-column: span 2;
  }
  .module-nav {
    justify-content: flex-start;
    overflow-x: auto;
    padding-left: 8px;
  }
  .module-nav button {
    min-width: 88px;
    padding: 0 12px;
  }
  .journey-rail__header {
    display: grid;
    grid-template-columns: 1fr auto;
  }
  .journey-rail__header p {
    grid-column: 1;
  }
  .journey-rail__header strong {
    grid-column: 1;
  }
  .journey-rail__header button {
    display: grid;
    grid-row: 1 / span 2;
    grid-column: 2;
    width: 34px;
    place-items: center;
    background: transparent;
    color: var(--text-muted);
  }
  .decision-contract {
    grid-template-columns: 1fr;
  }
  .stage-action {
    align-items: stretch;
    flex-direction: column;
  }
  .stage-action .primary-action {
    width: 100%;
  }
  .deep-module-header {
    flex-direction: column;
    gap: 14px;
  }
}

.module-canvas {
  display: grid;
  gap: 14px;
}
.viz-panel {
  min-width: 0;
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: linear-gradient(155deg, rgba(15, 28, 35, 0.78), rgba(7, 14, 18, 0.8));
}
.panel-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 17px;
}
.panel-title p {
  color: var(--text-muted);
  font-family: var(--mono);
  font-size: 7px;
  letter-spacing: 0.12em;
}
.panel-title h2 {
  margin-top: 5px;
  font-size: 14px;
  font-weight: 620;
}
.panel-hint {
  color: var(--text-muted);
  font-family: var(--mono);
  font-size: 8px;
}
.module-two-column {
  display: grid;
  grid-template-columns: minmax(0, 1.45fr) minmax(280px, 0.75fr);
  gap: 14px;
}

/* Monitoring */
.metric-kpis {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.metric-kpis article {
  position: relative;
  min-height: 112px;
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: rgba(11, 23, 29, 0.72);
}
.metric-kpis span,
.metric-kpis strong,
.metric-kpis small {
  display: block;
}
.metric-kpis > article > span {
  color: var(--text-muted);
  font-family: var(--mono);
  font-size: 7px;
  letter-spacing: 0.09em;
}
.metric-kpis strong {
  margin-top: 15px;
  font-size: 26px;
  font-weight: 540;
  letter-spacing: -0.04em;
}
.metric-kpis small {
  margin-top: 4px;
  color: var(--text-soft);
  font-size: 9px;
}
.metric-kpis .status-badge {
  position: absolute;
  top: 14px;
  right: 14px;
}
.chart-legend {
  display: flex;
  gap: 12px;
  color: var(--text-muted);
  font-size: 8px;
}
.chart-legend span::before {
  content: "";
  display: inline-block;
  width: 14px;
  height: 2px;
  margin-right: 5px;
  vertical-align: middle;
  background: currentColor;
}
.legend-current {
  color: var(--accent);
}
.legend-baseline {
  color: #8c9ca0;
}
.legend-control {
  color: var(--cyan);
}
.chart-wrap {
  position: relative;
  min-height: 208px;
}
.chart-wrap svg {
  display: block;
  width: 100%;
  height: 190px;
  overflow: visible;
}
.chart-grid path {
  fill: none;
  stroke: rgba(175, 213, 224, 0.08);
  stroke-width: 1;
}
.line {
  fill: none;
  stroke-width: 2;
  vector-effect: non-scaling-stroke;
}
.line--current {
  stroke: var(--accent);
}
.line--baseline {
  stroke: rgba(180, 198, 201, 0.45);
  stroke-dasharray: 4 5;
}
.line--control {
  stroke: var(--cyan);
  stroke-width: 1.2;
}
.area {
  fill: url(#metricFill);
}
.change-line {
  stroke: var(--amber);
  stroke-width: 1;
  stroke-dasharray: 3 4;
  vector-effect: non-scaling-stroke;
}
.change-label {
  fill: var(--amber);
  font-family: var(--mono);
  font-size: 9px;
}
.chart-axis {
  display: flex;
  justify-content: space-between;
  padding: 0 12px;
  color: var(--text-muted);
  font-family: var(--mono);
  font-size: 7px;
}
.topology-flow {
  display: flex;
  align-items: stretch;
}
.topology-node {
  flex: 1;
  min-width: 0;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: transparent;
  color: inherit;
  cursor: pointer;
  text-align: left;
}
.topology-node.is-selected {
  box-shadow: 0 0 0 1px var(--accent);
}
.topology-node > span {
  color: var(--text-muted);
  font-family: var(--mono);
  font-size: 7px;
}
.topology-node strong,
.topology-node small {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.topology-node strong {
  margin-top: 14px;
  font-size: 10px;
}
.topology-node small {
  margin: 5px 0 12px;
  color: var(--text-soft);
  font-size: 9px;
}
.topology-node--critical {
  border-color: rgba(255, 111, 125, 0.28);
  background: rgba(255, 111, 125, 0.055);
}
.topology-node--warning,
.topology-node--unknown {
  border-color: rgba(255, 202, 114, 0.25);
  background: rgba(255, 202, 114, 0.04);
}
.topology-node--healthy {
  border-color: rgba(114, 230, 165, 0.2);
}
.topology-edge {
  display: grid;
  flex: 0 0 28px;
  place-items: center;
  color: var(--text-muted);
  font-style: normal;
}

/* Alerts */
.alert-collapse {
  display: grid;
  grid-template-columns: 1fr auto 1fr auto 1fr;
  align-items: center;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  background: rgba(10, 20, 25, 0.74);
}
.alert-collapse > div {
  min-height: 104px;
  padding: 17px;
  text-align: center;
}
.alert-collapse > i {
  color: var(--text-muted);
  font-style: normal;
}
.alert-collapse span,
.alert-collapse strong,
.alert-collapse small {
  display: block;
}
.alert-collapse span {
  color: var(--text-muted);
  font-family: var(--mono);
  font-size: 7px;
  letter-spacing: 0.1em;
}
.alert-collapse strong {
  margin-top: 9px;
  font-size: 29px;
  font-weight: 540;
}
.alert-collapse small {
  margin-top: 3px;
  color: var(--text-soft);
  font-size: 9px;
}
.cluster-row {
  display: grid;
  grid-template-columns: 40px minmax(0, 1fr) auto;
  gap: 12px;
  align-items: center;
  width: 100%;
  min-height: 72px;
  padding: 12px 8px;
  border-top: 1px solid var(--line);
  background: transparent;
  text-align: left;
}
.cluster-row:first-of-type {
  border-top: 0;
}
.cluster-row.is-primary {
  margin-bottom: 6px;
  padding-inline: 12px;
  border: 1px solid var(--accent-line);
  border-radius: 10px;
  background: var(--accent-soft);
}
.cluster-count {
  display: grid;
  width: 34px;
  height: 34px;
  place-items: center;
  border: 1px solid var(--line-strong);
  border-radius: 9px;
  font-family: var(--mono);
  font-size: 12px;
}
.cluster-row strong,
.cluster-row small {
  display: block;
}
.cluster-row strong {
  font-size: 11px;
}
.cluster-row small {
  margin-top: 5px;
  color: var(--text-muted);
  font-size: 9px;
}
.alert-side-stack {
  display: grid;
  gap: 14px;
}
.impact-numbers {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.impact-numbers span {
  padding: 12px;
  background: rgba(4, 10, 13, 0.5);
  border-radius: 9px;
}
.impact-numbers strong,
.impact-numbers small {
  display: block;
}
.impact-numbers strong {
  color: var(--red);
  font-size: 16px;
}
.impact-numbers small {
  margin-top: 6px;
  color: var(--text-muted);
  font-size: 8px;
}
.route-row {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  padding: 11px 0;
  border-top: 1px solid var(--line);
}
.route-row:first-of-type {
  border: 0;
}
.route-avatar {
  display: grid;
  width: 30px;
  height: 30px;
  place-items: center;
  background: var(--accent-soft);
  color: var(--accent);
  border-radius: 8px;
  font-size: 8px;
  font-weight: 800;
}
.route-row strong,
.route-row small {
  display: block;
}
.route-row strong {
  font-size: 10px;
}
.route-row small {
  margin-top: 4px;
  color: var(--text-muted);
  font-size: 8px;
}
.route-row em {
  color: var(--text-soft);
  font-family: var(--mono);
  font-size: 8px;
  font-style: normal;
}

/* Logs */
.log-query {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  gap: 11px;
  align-items: center;
  min-height: 48px;
  padding: 0 10px 0 15px;
  border: 1px solid var(--line-strong);
  border-radius: 10px;
  background: #050b0e;
}
.log-query > span {
  color: var(--text-muted);
}
.log-query code {
  overflow: hidden;
  color: var(--cyan);
  font-family: var(--mono);
  font-size: 10px;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.log-query button {
  height: 30px;
  padding: 0 12px;
  border-radius: 7px;
  background: var(--accent-soft);
  color: var(--accent);
  font-family: var(--mono);
  font-size: 8px;
}
.logs-layout {
  display: grid;
  grid-template-columns: minmax(0, 1.45fr) minmax(230px, 0.55fr);
  gap: 14px;
}
.pattern-table__head,
.pattern-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 70px 80px 74px;
  gap: 10px;
  align-items: center;
}
.pattern-table__head {
  padding: 0 10px 9px;
  color: var(--text-muted);
  font-family: var(--mono);
  font-size: 7px;
}
.pattern-row {
  width: 100%;
  min-height: 63px;
  padding: 8px 10px;
  border-top: 1px solid var(--line);
  background: transparent;
  text-align: left;
}
.pattern-row.is-selected {
  margin: 4px 0;
  border: 1px solid var(--accent-line);
  border-radius: 9px;
  background: var(--accent-soft);
}
.pattern-row > span {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 8px;
  align-items: center;
}
.pattern-row > span i {
  grid-row: 1 / span 2;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--red);
}
.pattern-row strong,
.pattern-row small {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.pattern-row strong {
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 500;
}
.pattern-row small {
  color: var(--text-muted);
  font-family: var(--mono);
  font-size: 7px;
}
.pattern-row em,
.pattern-row b,
.pattern-row time {
  font-family: var(--mono);
  font-size: 8px;
  font-style: normal;
  font-weight: 500;
}
.pattern-row b {
  color: var(--red);
}
.pattern-row time {
  color: var(--text-muted);
}
.facet-group {
  padding: 12px 0;
  border-top: 1px solid var(--line);
}
.facet-group:first-of-type {
  border: 0;
}
.facet-group > strong {
  display: block;
  margin-bottom: 9px;
  color: var(--text-soft);
  font-family: var(--mono);
  font-size: 8px;
}
.facet-group > div {
  display: grid;
  grid-template-columns: 65px minmax(30px, 1fr) 38px;
  gap: 7px;
  align-items: center;
  margin: 6px 0;
}
.facet-group span,
.facet-group em {
  color: var(--text-muted);
  font-family: var(--mono);
  font-size: 7px;
  font-style: normal;
}
.facet-group i {
  height: 5px;
  background: linear-gradient(90deg, var(--accent) var(--bar), rgba(255, 255, 255, 0.05) var(--bar));
  border-radius: 3px;
}
.log-line {
  display: grid;
  grid-template-columns: 90px 50px minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  min-height: 43px;
  padding: 7px 0;
  border-top: 1px solid var(--line);
}
.log-line time,
.log-line code {
  font-family: var(--mono);
  font-size: 8px;
}
.log-line time {
  color: var(--text-muted);
}
.log-line code {
  overflow: hidden;
  color: var(--text-soft);
  text-overflow: ellipsis;
  white-space: nowrap;
}
.log-level {
  font-family: var(--mono);
  font-size: 7px;
}
.log-level--error {
  color: var(--red);
}
.log-level--warn {
  color: var(--amber);
}
.log-line button {
  padding: 6px 8px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: transparent;
  color: var(--accent);
  font-family: var(--mono);
  font-size: 7px;
  cursor: pointer;
}

/* Checks */
.checks-overview {
  display: grid;
  grid-template-columns: 230px minmax(0, 1fr);
  gap: 14px;
}
.coverage-ring-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: linear-gradient(155deg, rgba(15, 28, 35, 0.78), rgba(7, 14, 18, 0.8));
}
.coverage-ring {
  display: grid;
  width: 132px;
  height: 132px;
  place-items: center;
  border-radius: 50%;
  background: conic-gradient(var(--accent) var(--coverage), rgba(255, 255, 255, 0.06) 0);
}
.coverage-ring::before {
  content: "";
  grid-area: 1 / 1;
  width: 104px;
  height: 104px;
  border-radius: 50%;
  background: var(--surface-0);
}
.coverage-ring > span {
  z-index: 1;
  grid-area: 1 / 1;
  text-align: center;
}
.coverage-ring strong,
.coverage-ring small {
  display: block;
}
.coverage-ring strong {
  font-size: 25px;
  font-weight: 560;
}
.coverage-ring small {
  margin-top: 4px;
  color: var(--text-muted);
  font-size: 8px;
}
.coverage-legend {
  display: flex;
  gap: 12px;
  margin-top: 15px;
  color: var(--text-muted);
  font-size: 8px;
}
.coverage-legend span {
  display: flex;
  gap: 4px;
  align-items: center;
}
.coverage-legend i {
  width: 6px;
  height: 6px;
  border-radius: 50%;
}
.coverage-legend .passed i {
  background: var(--green);
}
.coverage-legend .failed i {
  background: var(--red);
}
.coverage-legend .unknown i {
  background: var(--amber);
}
.coverage-warning,
.coverage-good {
  margin-top: 14px;
  padding: 9px;
  border-radius: 8px;
  font-size: 8px;
  line-height: 1.45;
  text-align: center;
}
.coverage-warning {
  color: var(--amber);
  background: rgba(255, 202, 114, 0.08);
}
.coverage-good {
  color: var(--green);
  background: rgba(114, 230, 165, 0.07);
}
.check-row {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto auto;
  gap: 10px;
  align-items: center;
  min-height: 58px;
  padding: 8px 0;
  border-top: 1px solid var(--line);
}
.check-row:first-child {
  border: 0;
}
.check-row > span:first-child {
  display: grid;
  width: 30px;
  height: 30px;
  place-items: center;
  background: var(--accent-soft);
  color: var(--accent);
  border-radius: 8px;
}
.check-row strong,
.check-row small {
  display: block;
}
.check-row strong {
  font-size: 10px;
}
.check-row small {
  margin-top: 4px;
  color: var(--text-muted);
  font-size: 8px;
}
.check-row em {
  color: var(--text-soft);
  font-family: var(--mono);
  font-size: 8px;
  font-style: normal;
}
.check-row {
  width: 100%;
  background: transparent;
  color: inherit;
  cursor: pointer;
  text-align: left;
}
.check-row.is-selected {
  margin: 2px 0;
  padding-inline: 8px;
  border: 1px solid var(--accent-line);
  border-radius: 8px;
  background: var(--accent-soft);
}
.run-row {
  display: grid;
  grid-template-columns: 10px 70px minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  min-height: 58px;
  border-top: 1px solid var(--line);
}
.run-row > span {
  width: 7px;
  height: 7px;
  border: 1px solid var(--accent);
  border-radius: 50%;
}
.run-row time {
  color: var(--text-muted);
  font-family: var(--mono);
  font-size: 8px;
}
.run-row strong,
.run-row small {
  display: block;
}
.run-row strong {
  font-size: 9px;
}
.run-row small {
  margin-top: 4px;
  color: var(--text-muted);
  font-size: 8px;
}
.finding-row {
  position: relative;
  padding: 12px 0 14px;
  border-top: 1px solid var(--line);
}
.finding-row > div {
  display: flex;
  gap: 8px;
  align-items: center;
}
.finding-row > div > span {
  color: var(--text-muted);
  font-family: var(--mono);
  font-size: 7px;
}
.finding-row > strong {
  display: block;
  margin-top: 10px;
  font-size: 11px;
}
.finding-row > small {
  display: block;
  margin-top: 6px;
  color: var(--text-muted);
  font-size: 8px;
}
.finding-row > em {
  position: absolute;
  right: 0;
  bottom: 14px;
  color: var(--accent);
  font-size: 8px;
  font-style: normal;
}

/* Synthetics */
.synthetic-summary {
  display: flex;
  gap: 14px;
  align-items: center;
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: linear-gradient(100deg, var(--accent-soft), rgba(8, 16, 21, 0.76));
}
.synthetic-summary > span {
  display: grid;
  width: 46px;
  height: 46px;
  place-items: center;
  color: var(--accent);
  background: rgba(0, 0, 0, 0.18);
  border: 1px solid var(--accent-line);
  border-radius: 13px;
}
.synthetic-summary > div {
  flex: 1;
}
.synthetic-summary p {
  color: var(--text-muted);
  font-family: var(--mono);
  font-size: 7px;
  letter-spacing: 0.1em;
}
.synthetic-summary h2 {
  margin-top: 5px;
  font-size: 16px;
}
.synthetic-summary small {
  display: block;
  margin-top: 5px;
  color: var(--text-soft);
  font-size: 9px;
}
.synthetic-summary > em {
  color: var(--accent);
  font-family: var(--mono);
  font-size: 9px;
  font-style: normal;
}
.region-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
  gap: 8px;
}
.region-card {
  position: relative;
  min-height: 112px;
  padding: 13px;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: rgba(11, 23, 29, 0.72);
  text-align: left;
}
.region-card.is-selected {
  border-color: var(--accent-line);
  background: var(--accent-soft);
}
.region-card > span {
  position: absolute;
  top: 11px;
  right: 11px;
}
.region-card > strong,
.region-card > small {
  display: block;
}
.region-card > strong {
  margin-top: 22px;
  font-size: 12px;
}
.region-card > small {
  margin-top: 4px;
  color: var(--text-muted);
  font-size: 8px;
}
.region-card > div {
  display: flex;
  justify-content: space-between;
  margin-top: 14px;
}
.region-card em,
.region-card b {
  font-family: var(--mono);
  font-size: 9px;
  font-style: normal;
}
.region-card em {
  color: var(--accent);
}
.region-card b {
  color: var(--text-soft);
  font-weight: 500;
}
.journey-steps {
  display: flex;
  align-items: center;
}
.journey-node {
  flex: 1;
  padding: 13px;
  border: 1px solid var(--line);
  border-radius: 10px;
}
.journey-node > span {
  color: var(--text-muted);
  font-family: var(--mono);
  font-size: 7px;
}
.journey-node strong,
.journey-node small {
  display: block;
}
.journey-node strong {
  margin-top: 11px;
  font-size: 9px;
}
.journey-node small {
  margin: 4px 0 10px;
  color: var(--text-muted);
  font-size: 8px;
}
.journey-node--failed {
  border-color: rgba(255, 111, 125, 0.3);
  background: rgba(255, 111, 125, 0.05);
}
.journey-node--unknown {
  border-color: rgba(255, 202, 114, 0.28);
  background: rgba(255, 202, 114, 0.04);
}
.journey-steps > i {
  display: grid;
  flex: 0 0 26px;
  place-items: center;
  color: var(--text-muted);
  font-style: normal;
}
.waterfall {
  margin-top: 20px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
}
.waterfall > div {
  display: grid;
  grid-template-columns: 90px minmax(0, 1fr) 70px;
  gap: 10px;
  align-items: center;
  margin: 8px 0;
}
.waterfall span,
.waterfall em {
  color: var(--text-muted);
  font-size: 8px;
  font-style: normal;
}
.waterfall i {
  width: var(--width);
  height: 7px;
  background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 35%, transparent));
  border-radius: 5px;
}

@media (max-width: 780px) {
  .module-two-column,
  .logs-layout,
  .checks-overview {
    grid-template-columns: 1fr;
  }
  .metric-kpis {
    grid-template-columns: 1fr;
  }
  .topology-flow {
    overflow-x: auto;
    padding-bottom: 8px;
  }
  .topology-node {
    flex: 0 0 135px;
  }
  .pattern-table__head {
    display: none;
  }
  .pattern-row {
    grid-template-columns: minmax(0, 1fr) 50px;
  }
  .pattern-row > b,
  .pattern-row > time {
    display: none;
  }
  .log-line {
    grid-template-columns: 70px 45px minmax(0, 1fr);
  }
  .log-line button {
    display: none;
  }
  .journey-steps {
    overflow-x: auto;
    padding-bottom: 8px;
  }
  .journey-node {
    flex: 0 0 130px;
  }
}

.ai-inspector__header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 76px;
  padding: 0 18px;
  border-bottom: 1px solid var(--line);
}
.ai-inspector__header > div {
  display: grid;
  grid-template-columns: auto 1fr;
  column-gap: 10px;
  align-items: center;
}
.ai-orb {
  display: grid;
  grid-row: 1 / span 2;
  width: 36px;
  height: 36px;
  place-items: center;
  border: 1px solid rgba(168, 140, 255, 0.34);
  border-radius: 11px;
  background: rgba(168, 140, 255, 0.1);
  color: var(--violet);
}
.ai-inspector__header p {
  color: var(--violet);
  font-family: var(--mono);
  font-size: 7px;
  letter-spacing: 0.1em;
}
.ai-inspector__header h2 {
  margin-top: 2px;
  font-size: 13px;
  font-weight: 620;
}
.ai-inspector__header button {
  display: grid;
  width: 32px;
  height: 32px;
  place-items: center;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
}
.ai-scope {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 3px 10px;
  align-items: center;
  margin: 12px;
  padding: 11px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: rgba(4, 10, 13, 0.52);
}
.ai-scope span {
  display: flex;
  grid-row: 1 / span 2;
  gap: 5px;
  align-items: center;
  color: var(--text-muted);
  font-family: var(--mono);
  font-size: 7px;
}
.ai-scope svg {
  width: 11px;
}
.ai-scope strong {
  font-size: 9px;
}
.ai-scope small {
  color: var(--text-muted);
  font-size: 7px;
}
.ai-inspector__body {
  height: calc(100% - 200px);
  overflow-y: auto;
  padding: 0 12px 20px;
}
.ai-section {
  padding: 13px 0;
  border-top: 1px solid var(--line);
}
.ai-section:first-child {
  border: 0;
}
.ai-section__title {
  display: flex;
  align-items: baseline;
  margin-bottom: 8px;
}
.ai-section__title span {
  color: var(--text-muted);
  font-family: var(--mono);
  font-size: 7px;
  letter-spacing: 0.1em;
}
.ai-section__title strong {
  margin-left: 7px;
  font-size: 9px;
}
.ai-section__title em {
  margin-left: auto;
  color: var(--text-muted);
  font-family: var(--mono);
  font-size: 8px;
  font-style: normal;
}
.ai-insight {
  margin-top: 7px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: rgba(12, 23, 29, 0.62);
}
.ai-insight--fact {
  border-left: 2px solid var(--cyan);
}
.ai-insight--hypothesis {
  border-left: 2px solid var(--violet);
}
.ai-insight--gap {
  border-left: 2px solid var(--amber);
}
.ai-insight--recommendation {
  border-left: 2px solid var(--mint);
}
.ai-insight__top {
  display: flex;
  justify-content: space-between;
  color: var(--text-muted);
  font-family: var(--mono);
  font-size: 6px;
  letter-spacing: 0.09em;
}
.ai-insight__top em {
  color: var(--violet);
  font-style: normal;
}
.ai-insight p {
  margin-top: 7px;
  color: var(--text-soft);
  font-size: 9px;
  line-height: 1.55;
}
.ai-source {
  display: block;
  margin-top: 8px;
  color: var(--cyan);
  font-family: var(--mono);
  font-size: 6px;
  line-height: 1.45;
}
.ai-source--gap {
  color: var(--amber);
}
.ai-verdicts {
  display: flex;
  gap: 4px;
  margin-top: 10px;
}
.ai-verdicts button {
  display: flex;
  gap: 4px;
  align-items: center;
  min-height: 24px;
  padding: 0 7px;
  border: 1px solid var(--line);
  border-radius: 5px;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 7px;
}
.ai-verdicts button:hover,
.ai-verdicts button.is-active {
  border-color: var(--accent-line);
  background: var(--accent-soft);
  color: var(--text);
}
.ai-verdicts svg {
  width: 10px;
}
.ai-disclaimer {
  position: absolute;
  right: 0;
  bottom: 0;
  left: 0;
  display: flex;
  gap: 7px;
  align-items: center;
  min-height: 49px;
  padding: 10px 14px;
  border-top: 1px solid var(--line);
  background: var(--surface-0);
  color: var(--text-muted);
  font-size: 7px;
  line-height: 1.45;
}
.ai-disclaimer svg {
  flex: 0 0 auto;
  width: 13px;
  color: var(--mint);
}

/* Human decision gate */
.decision-hero {
  display: flex;
  gap: 16px;
  align-items: center;
  padding: 21px;
  border: 1px solid var(--accent-line);
  border-radius: var(--radius);
  background: linear-gradient(110deg, var(--accent-soft), rgba(8, 16, 21, 0.72));
}
.decision-hero > span {
  display: grid;
  flex: 0 0 auto;
  width: 54px;
  height: 54px;
  place-items: center;
  background: rgba(0, 0, 0, 0.2);
  border: 1px solid var(--accent-line);
  border-radius: 15px;
  color: var(--accent);
}
.decision-hero > span svg {
  width: 25px;
  height: 25px;
}
.decision-hero p {
  color: var(--accent);
  font-family: var(--mono);
  font-size: 7px;
  letter-spacing: 0.1em;
}
.decision-hero h2 {
  margin-top: 6px;
  font-size: 19px;
}
.decision-hero small {
  display: block;
  margin-top: 6px;
  color: var(--text-soft);
  font-size: 9px;
}
.decision-guardrail {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 14px 17px;
  border: 1px solid rgba(255, 111, 125, 0.32);
  border-radius: 10px;
  background: rgba(255, 111, 125, 0.08);
  color: var(--red);
}
.decision-guardrail svg {
  flex: 0 0 auto;
}
.decision-guardrail strong,
.decision-guardrail p {
  display: block;
}
.decision-guardrail strong {
  font-size: 10px;
}
.decision-guardrail p {
  margin-top: 4px;
  color: #ffc2c8;
  font-size: 9px;
}
.decision-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(280px, 0.7fr);
  gap: 14px;
}
.decision-evidence > div {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.decision-evidence code,
.evidence-package code {
  padding: 6px 8px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: rgba(4, 10, 13, 0.6);
  color: var(--cyan);
  font-family: var(--mono);
  font-size: 7px;
}
.decision-evidence section {
  margin-top: 18px;
  padding: 13px;
  border: 1px solid rgba(255, 202, 114, 0.2);
  border-radius: 8px;
  background: rgba(255, 202, 114, 0.04);
}
.decision-evidence section span {
  color: var(--amber);
  font-family: var(--mono);
  font-size: 7px;
}
.decision-evidence section p {
  margin-top: 7px;
  color: var(--text-soft);
  font-size: 9px;
  line-height: 1.55;
}
.decision-option {
  display: grid;
  grid-template-columns: 24px minmax(0, 1fr);
  width: 100%;
  min-height: 58px;
  margin-top: 7px;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: transparent;
  cursor: pointer;
  text-align: left;
}
.decision-option:hover,
.decision-option.is-selected {
  border-color: var(--accent-line);
  background: var(--accent-soft);
}
.decision-option > span {
  display: grid;
  grid-row: 1 / span 2;
  width: 20px;
  height: 20px;
  place-items: center;
  border: 1px solid var(--line-strong);
  border-radius: 50%;
}
.decision-option.is-selected > span {
  border-color: var(--accent);
  color: var(--accent);
}
.decision-option svg {
  width: 11px;
}
.decision-option strong {
  align-self: end;
  font-size: 10px;
}
.decision-option small {
  align-self: start;
  margin-top: 3px;
  color: var(--text-muted);
  font-family: var(--mono);
  font-size: 7px;
}
.decision-option--danger.is-selected {
  border-color: rgba(255, 111, 125, 0.35);
  background: rgba(255, 111, 125, 0.06);
}
.decision-finish {
  width: 100%;
  margin-top: 13px;
}

/* Outcome */
.journey-outcome {
  max-width: 980px;
  margin: 24px auto;
  padding: 44px;
  border: 1px solid var(--accent-line);
  border-radius: 24px;
  background:
    radial-gradient(circle at 80% 0, var(--accent-soft), transparent 45%),
    linear-gradient(155deg, rgba(15, 28, 35, 0.94), rgba(6, 12, 16, 0.95));
  box-shadow: var(--shadow);
}
.journey-outcome__seal {
  display: inline-flex;
  gap: 7px;
  align-items: center;
  padding: 7px 10px;
  border: 1px solid rgba(114, 230, 165, 0.28);
  border-radius: 999px;
  color: var(--green);
  font-family: var(--mono);
  font-size: 7px;
  letter-spacing: 0.09em;
}
.journey-outcome__seal svg {
  width: 12px;
}
.journey-outcome > .eyebrow {
  margin-top: 32px;
  color: var(--accent);
}
.journey-outcome > h1 {
  margin-top: 10px;
  font-size: clamp(38px, 5vw, 64px);
  font-weight: 540;
  letter-spacing: -0.05em;
}
.journey-outcome > p:not(.eyebrow) {
  max-width: 700px;
  margin-top: 15px;
  color: var(--text-soft);
  font-size: 13px;
  line-height: 1.7;
}
.outcome-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-top: 32px;
}
.outcome-grid article {
  min-height: 130px;
  padding: 17px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: rgba(6, 12, 16, 0.6);
}
.outcome-grid span,
.outcome-grid strong,
.outcome-grid small {
  display: block;
}
.outcome-grid span {
  color: var(--text-muted);
  font-family: var(--mono);
  font-size: 7px;
  letter-spacing: 0.08em;
}
.outcome-grid strong {
  margin-top: 15px;
  font-size: 21px;
  font-weight: 560;
}
.outcome-grid small {
  margin-top: 8px;
  color: var(--text-muted);
  font-size: 9px;
  line-height: 1.5;
}
.evidence-package {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid var(--line);
}
.evidence-package > span {
  width: 100%;
  margin-bottom: 5px;
  color: var(--text-muted);
  font-family: var(--mono);
  font-size: 7px;
}
.outcome-actions {
  display: flex;
  gap: 10px;
  margin-top: 28px;
}

@media (max-width: 780px) {
  .decision-layout,
  .outcome-grid {
    grid-template-columns: 1fr;
  }
  .journey-outcome {
    padding: 26px 18px;
  }
  .outcome-actions {
    align-items: stretch;
    flex-direction: column;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto;
    transition-duration: 0.01ms;
    animation-duration: 0.01ms;
  }
}

    return `<span class="status-badge status-badge--${escapeHTML(status)}"><i></i>${escapeHTML(label)}</span>`;
  }
  function polylinePoints(values, width = 720, height = 190, padding = 14) {
    const max = Math.max(...values, 100);
    const min = Math.min(...values, 0);
    const range = max - min || 1;
    return values.map((value, index) => {
      const x = padding + index / (values.length - 1) * (width - padding * 2);
      const y = height - padding - (value - min) / range * (height - padding * 2);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(" ");
  }

  // designs/aiops-unified-workbench/views-ai.mjs

  // designs/aiops-unified-workbench/views-modules.mjs

          <g class="chart-grid"><path d="M14 35H706M14 80H706M14 125H706M14 170H706"/></g>

  function renderAlerts(data, progress) {

  function facetGroup(label, values) {
    const max = Math.max(...Object.values(values));

    ).join("")}</div>`;
  }
  function renderLogs(data, progress) {

        <div class="pattern-table">
          <div class="pattern-table__head"><span>\u6A21\u5F0F</span><span>\u6570\u91CF</span><span>\u53D8\u5316</span><span>\u9996\u73B0</span></div>

        </div>
      </article>
      <aside class="viz-panel facet-panel">
        ${panelTitle("PATTERN INSPECTOR", "\u5F02\u5E38\u96C6\u4E2D\u5728\u54EA\u4E9B\u7EF4\u5EA6")}
        ${Object.entries(data.facets).map(([label, values]) => facetGroup(label, values)).join("")}
      </aside>
    </div>
    <article class="viz-panel log-samples">
      ${panelTitle("VERIFIABLE SAMPLES", "\u9489\u5165\u8BC1\u636E\u5305\u7684\u539F\u59CB\u6837\u672C")}
      ${data.samples.map((sample) => {
      const pinned = operations.pinnedSampleIds.includes(sample.id);
      return `<div class="log-line ${pinned ? "is-pinned" : ""}"><time>${escapeHTML(sample.time)}</time><span class="log-level log-level--${sample.level.toLowerCase()}">${escapeHTML(sample.level)}</span><code>${escapeHTML(sample.text)}</code><button type="button" data-pin-log-sample="${escapeHTML(sample.id)}" ${pinned ? "disabled" : ""}>${pinned ? "PINNED" : "PIN"}</button></div>`;
    }).join("")}
    </article>
  </section>`;
  }
  function renderChecks(data, progress) {
    const coverage = data.coverage;
    return `<section class="module-canvas checks-canvas" data-module="checks">
    <div class="checks-overview">
      <article class="coverage-ring-card">
        <div class="coverage-ring" style="--coverage:${coverage.percent * 3.6}deg"><span><strong>${coverage.percent}%</strong><small>\u8BC1\u636E\u8986\u76D6</small></span></div>
        <div class="coverage-legend"><span class="passed"><i></i>${coverage.passed} \u901A\u8FC7</span><span class="failed"><i></i>${coverage.failed} \u5931\u8D25</span><span class="unknown"><i></i>${coverage.unknown} \u672A\u77E5</span></div>
        ${coverage.unknown ? '<p class="coverage-warning">Unknown \u4E0D\u8BA1\u5165\u5065\u5EB7\uFF0C\u5FC5\u987B\u8FDB\u5165\u5F85\u5904\u7F6E\u961F\u5217\u3002</p>' : '<p class="coverage-good">\u6240\u6709\u68C0\u67E5\u5747\u6709\u65B0\u9C9C\u8BC1\u636E\u3002</p>'}
      </article>
      <article class="viz-panel check-definition-panel">
        ${panelTitle("CHECK DEFINITIONS", "AI \u751F\u6210\u5019\u9009\uFF0C\u4EBA\u5BA1\u6838\u540E\u624D\u80FD\u8FD0\u884C")}
        <div class="check-table">
          ${data.definitions.map((check) => `<button type="button" data-focus-module="checks" data-focus-id="${check.id}" class="check-row ${progress.moduleSelections.checks === check.id ? "is-selected" : ""}"><span>${icon(check.source.startsWith("AI") ? "spark" : "shield")}</span><span><strong>${escapeHTML(check.name)}</strong><small>${escapeHTML(check.source)}</small></span><em>${escapeHTML(check.gate)}</em>${badge(check.state)}</button>`).join("")}

    </div>
    <div class="module-two-column">
      <article class="viz-panel run-timeline">

        ${data.runs.map((run) => `<div class="run-row"><span></span><time>${escapeHTML(run.at)}</time><div><strong>${statusLabel(run.status)}</strong><small>${escapeHTML(run.summary)}</small></div>${badge(run.status)}</div>`).join("")}

    <article class="viz-panel journey-steps-panel">
      ${panelTitle("STEP WATERFALL", "\u7528\u6237\u7A76\u7ADF\u5728\u54EA\u4E00\u6B65\u5931\u8D25")}
      <div class="journey-steps">
        ${data.steps.map((step, index) => `<div class="journey-node journey-node--${step.status}"><span>${index + 1}</span><strong>${escapeHTML(step.name)}</strong><small>${step.duration ? `${step.duration} ms` : "\u65E0\u6570\u636E"}</small>${badge(step.status)}</div>${index < data.steps.length - 1 ? "<i>\u2192</i>" : ""}`).join("")}
      </div>
      <div class="waterfall">
        ${data.steps.map((step) => `<div><span>${escapeHTML(step.name)}</span><i style="--width:${step.duration ? Math.max(8, step.duration / maxDuration * 100) : 2}%"></i><em>${step.duration ? `${step.duration} ms` : "\u2014"}</em></div>`).join("")}
      </div>
    </article>
  </section>`;
  }
  function renderDecision(scenario, progress) {
    const blocked = progress.status === "blocked";
    const selected = progress.decisionId;
    return `<section class="module-canvas decision-canvas" data-module="decision">
    <div class="decision-hero">
      <span>${icon("shield")}</span><div><p>HUMAN DECISION GATE</p><h2>${escapeHTML(scenario.decisionQuestion)}</h2><small>AI \u4E0D\u80FD\u66FF\u4F60\u7B7E\u5B57\uFF0C\u4E5F\u4E0D\u80FD\u7ED5\u8FC7\u73B0\u6709\u6743\u9650\u7CFB\u7EDF\u3002</small></div>
    </div>
    ${blocked ? `<div class="decision-guardrail">${icon("lock")}<div><strong>\u51B3\u7B56\u88AB\u963B\u65AD</strong><p>${escapeHTML(progress.blockReason)}</p></div></div>` : ""}
    <div class="decision-layout">
      <article class="viz-panel decision-evidence">
        ${panelTitle("EVIDENCE PACKAGE", `${progress.evidencePackage.length} \u9879\u8BC1\u636E\u5DF2\u9501\u5B9A`)}
        <div>${progress.evidencePackage.map((id) => `<code>${escapeHTML(id)}</code>`).join("")}</div>

      </article>
      <article class="viz-panel decision-options">
        ${panelTitle("YOUR DECISION", "\u9009\u62E9\u4E00\u4E2A\u53EF\u8FFD\u8D23\u7684\u4E0B\u4E00\u6B65")}
        ${scenario.decisions.map((decision) => `<button type="button" class="decision-option decision-option--${decision.tone} ${selected === decision.id ? "is-selected" : ""}" data-decision-id="${decision.id}"><span>${selected === decision.id ? icon("check") : ""}</span><strong>${escapeHTML(decision.label)}</strong><small>${decision.id}</small></button>`).join("")}

    </div>
  </section>`;
  }
  function renderModule(module, scenario, progress) {
    if (module === "decision") return renderDecision(scenario, progress);
    const data = scenario.datasets[module];
    if (!data) return `<section class="module-canvas empty-canvas">\u65E0\u53EF\u7528\u6570\u636E</section>`;
    return {
      metrics: renderMetrics,
      alerts: renderAlerts,
      logs: renderLogs,
      checks: renderChecks,
      synthetics: renderSynthetics
    }[module](data, progress);
  }

  // designs/aiops-unified-workbench/views.mjs
  function renderJourneyContent(state2) {

  // designs/aiops-unified-workbench/app.mjs
  var state = createInitialState();
  var toastTimer;

  function showToast(message) {
    window.clearTimeout(toastTimer);

    toast.classList.add("is-visible");
    toastTimer = window.setTimeout(() => toast.classList.remove("is-visible"), 2400);
  }
  function render() {
    app.innerHTML = renderApp(state);
    document.body.dataset.screen = state.screen;
  }
  function dispatch(action, message) {
    state = reduceWorkbench(state, action);
    render();
    if (message) showToast(message);
  }
  function handleNavigation(target) {
    if (target.closest("[data-go-home]")) {
      dispatch({ type: "go_home" }, "\u5DF2\u8FD4\u56DE\u573A\u666F\u5165\u53E3\u3002");
      return true;
    }
    const scenario = target.closest("[data-scenario-id]");
    if (scenario) {
      dispatch(
        { type: "start_scenario", scenarioId: scenario.dataset.scenarioId },
        "\u5DF2\u9501\u5B9A\u89D2\u8272\u3001\u670D\u52A1\u3001\u73AF\u5883\u3001\u65F6\u95F4\u7A97\u548C\u89E6\u53D1\u4E8B\u4EF6\u3002"
      );
      return true;
    }
    const step = target.closest("[data-step-index]");
    if (step) {
      dispatch({ type: "go_to_step", stepIndex: Number(step.dataset.stepIndex) });
      return true;
    }
    const module = target.closest("[data-module]");
    if (module?.matches("button")) {
      dispatch({ type: "open_module", module: module.dataset.module }, "\u5DF2\u8FDB\u5165\u4E13\u4E1A\u5DE5\u4F5C\u9762\uFF0C\u573A\u666F\u4E0A\u4E0B\u6587\u4FDD\u6301\u4E0D\u53D8\u3002");
      return true;
    }
    if (target.closest("[data-return-to-journey]")) {
      dispatch({ type: "return_to_journey" }, "\u5DF2\u56DE\u5230\u540C\u4E00\u6761\u7528\u6237\u65C5\u7A0B\u3002");
      return true;
    }
    return false;
  }
  function handleJourney(target) {
    const action = target.closest("[data-complete-step]");
    if (action) {
      dispatch(
        { type: "complete_current_step", actionId: action.dataset.completeStep },
        "\u672C\u6B65\u4EBA\u5DE5\u5224\u65AD\u5DF2\u8BB0\u5F55\uFF0C\u8BC1\u636E\u4E0E\u65C5\u7A0B\u72B6\u6001\u540C\u6B65\u66F4\u65B0\u3002"
      );
      return true;
    }
    const decision = target.closest("[data-decision-id]");
    if (decision) {
      dispatch({ type: "choose_decision", decisionId: decision.dataset.decisionId }, "\u4EBA\u5DE5\u51B3\u7B56\u5DF2\u9009\u62E9\uFF0C\u5C1A\u672A\u6B63\u5F0F\u63D0\u4EA4\u3002");

      dispatch({ type: "complete_journey" });
      const progress = state.scenarioProgress[scenarioId];
      showToast(progress.status === "blocked" ? progress.blockReason : "\u65C5\u7A0B\u5B8C\u6210\uFF1A\u51B3\u7B56\u3001\u8BC1\u636E\u5305\u4E0E\u590D\u9A8C\u95E8\u69DB\u5DF2\u751F\u6210\u3002");
      return true;

  }
  function handleAI(target) {

        "\u53CD\u9988\u5DF2\u5199\u5165\u5177\u4F53 AI \u5DE5\u4EF6\uFF0C\u4E0D\u4F1A\u6A21\u7CCA\u6210\u4E00\u6B21\u70B9\u8D5E\u3002"
      );
      return true;
    }
    return false;
  }
  function handleUtility(target) {
    const focus = target.closest("[data-focus-module]");
    if (focus) {
      dispatch(
        { type: "focus_module_item", module: focus.dataset.focusModule, artifactId: focus.dataset.focusId },
        `\u5DF2\u805A\u7126 ${focus.dataset.focusId}\uFF0C\u573A\u666F\u4E0A\u4E0B\u6587\u4FDD\u6301\u4E0D\u53D8\u3002`

    }
    if (target.closest("[data-toggle-capabilities]")) {

    }
    if (target.closest("[data-run-log-query]")) {
      dispatch({ type: "run_log_query" }, "\u67E5\u8BE2\u5DF2\u6267\u884C\uFF0C\u6A21\u5F0F\u6570\u91CF\u4E0E\u4E8B\u4EF6\u603B\u91CF\u5DF2\u5199\u5165\u5F53\u524D\u573A\u666F\u3002");
      return true;
    }
    const pin = target.closest("[data-pin-log-sample]");
    if (pin) {
      dispatch(
        { type: "pin_log_sample", sampleId: pin.dataset.pinLogSample },
        "\u539F\u59CB\u65E5\u5FD7\u6837\u672C\u5DF2\u9489\u5165\u573A\u666F\u8BC1\u636E\u5305\uFF0C\u5207\u6362\u9875\u9762\u540E\u4ECD\u4F1A\u4FDD\u7559\u3002"
      );
      return true;
    }
    return false;
  }
  document.addEventListener("click", (event) => {
    const target = event.target;
    if (handleNavigation(target)) return;
    if (handleJourney(target)) return;
    if (handleAI(target)) return;
    handleUtility(target);
  });
  render();
})();

    </script>
  </body>
</html>
