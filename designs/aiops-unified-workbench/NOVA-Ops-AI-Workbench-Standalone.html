<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='10' fill='%2366e0bd'/%3E%3Cpath d='M9 23V9h3l8 9V9h3v14h-3l-8-9v9z' fill='%23081018'/%3E%3C/svg%3E" />
    <title>NOVA Ops · AI 调查工作台</title>      <!-- Portable single-file build: no network or localhost dependency. -->
    <style>
:root {
  --bg-canvas: #081018;
  --bg-deep: #0b131d;
  --bg-panel: #101b27;
  --bg-panel-raised: #152231;
  --bg-panel-hover: #192838;
  --bg-input: #0d1722;
  --line-subtle: #223244;
  --line-strong: #33475c;
  --text-primary: #edf4f6;
  --text-secondary: #9fb0bf;
  --text-muted: #6f8294;
  --accent: #66e0bd;
  --accent-strong: #35c79c;
  --accent-soft: rgba(102, 224, 189, 0.12);
  --info: #63a8ff;
  --info-soft: rgba(99, 168, 255, 0.13);
  --purple: #b49aff;
  --purple-soft: rgba(180, 154, 255, 0.12);
  --warning: #f1bd67;
  --warning-soft: rgba(241, 189, 103, 0.12);
  --critical: #ff7d86;
  --critical-soft: rgba(255, 125, 134, 0.12);
  --positive: #65d98c;
  --positive-soft: rgba(101, 217, 140, 0.12);
  --shadow-panel: 0 24px 60px rgba(0, 0, 0, 0.24);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 18px;
  --radius-xl: 24px;
  --font-sans: Inter, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
  --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
}

* {
  box-sizing: border-box;
}

html {
  color-scheme: dark;
  background: var(--bg-canvas);
}

body {
  margin: 0;
  min-width: 320px;
  min-height: 100vh;
  color: var(--text-primary);
  background:
    radial-gradient(circle at 70% -20%, rgba(48, 112, 121, 0.18), transparent 34%),
    radial-gradient(circle at 18% 108%, rgba(77, 65, 125, 0.14), transparent 28%), var(--bg-canvas);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.45;
}

button,
input,
select {
  font: inherit;
}
button {
  color: inherit;
}
button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

h1,
h2,
h3,
p {
  margin: 0;
}
h1 {
  font-size: 19px;
  letter-spacing: -0.02em;
}
h2 {
  font-size: 15px;
  letter-spacing: -0.01em;
}
h3 {
  font-size: 14px;
}

.eyebrow {
  margin-bottom: 4px;
  color: var(--text-muted);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.13em;
  text-transform: uppercase;
}

.svg-symbols {
  position: absolute;
  width: 0;
  height: 0;
  overflow: hidden;
}
svg {
  width: 18px;
  height: 18px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}
#icon-grid path {
  fill: currentColor;
  stroke: none;
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 999px;
  background: var(--text-muted);
  box-shadow: 0 0 0 4px rgba(111, 130, 148, 0.1);
}
.status-dot--blocker {
  background: var(--critical);
  box-shadow: 0 0 0 4px var(--critical-soft);
}
.status-dot--unknown {
  background: var(--warning);
  box-shadow: 0 0 0 4px var(--warning-soft);
}
.status-dot--recovering {
  background: var(--positive);
  box-shadow: 0 0 0 4px var(--positive-soft);
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto;
    transition-duration: 0.01ms;
    animation-duration: 0.01ms;
    animation-iteration-count: 1;
  }
}

.app-shell {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 76px minmax(0, 1fr);
}

.product-nav {
  position: sticky;
  top: 0;
  z-index: 20;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 9px;
  padding: 18px 10px;
  border-right: 1px solid var(--line-subtle);
  background: rgba(7, 14, 22, 0.88);
  backdrop-filter: blur(18px);
}

.brand-mark {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  margin-bottom: 13px;
  border: 1px solid rgba(102, 224, 189, 0.45);
  border-radius: 13px 13px 13px 5px;
  color: #07130f;
  background: linear-gradient(145deg, #9bf0d6, #42c99f);
  box-shadow: 0 8px 24px rgba(53, 199, 156, 0.2);
  font-weight: 900;
}

.product-nav__item {
  width: 54px;
  min-height: 51px;
  display: grid;
  place-items: center;
  gap: 2px;
  padding: 6px;
  border: 1px solid transparent;
  border-radius: var(--radius-md);
  color: var(--text-muted);
  background: transparent;
  cursor: pointer;
}

.product-nav__item span {
  font-size: 10px;
}
.product-nav__item svg {
  width: 17px;
  height: 17px;
}
.product-nav__item:hover {
  color: var(--text-secondary);
  background: var(--bg-panel);
}
.product-nav__item.is-active {
  color: var(--accent);
  border-color: rgba(102, 224, 189, 0.2);
  background: var(--accent-soft);
}
.nav-spacer {
  flex: 1;
}
.operator-avatar {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border: 1px solid #52677b;
  border-radius: 50%;
  background: #203144;
  font-size: 11px;
  font-weight: 700;
}

.workspace {
  min-width: 0;
}
.workspace-header {
  height: 72px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 22px;
  border-bottom: 1px solid var(--line-subtle);
  background: rgba(9, 17, 26, 0.7);
  backdrop-filter: blur(18px);
}
.header-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}
.search-field {
  width: 300px;
  height: 38px;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 0 10px;
  border: 1px solid var(--line-subtle);
  border-radius: var(--radius-md);
  color: var(--text-muted);
  background: var(--bg-input);
}
.search-field svg {
  width: 15px;
}
.search-field span {
  flex: 1;
}
.search-field kbd {
  padding: 2px 6px;
  border: 1px solid var(--line-strong);
  border-radius: 5px;
  color: var(--text-secondary);
  background: var(--bg-panel);
  font-size: 10px;
}
.live-indicator {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--text-secondary);
  font-size: 12px;
}
.live-indicator span {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--positive);
  box-shadow: 0 0 0 4px var(--positive-soft);
}

.workbench-grid {
  display: grid;
  grid-template-columns: 282px minmax(580px, 1fr) 318px;
  min-height: calc(100vh - 72px);
}
.event-queue {
  padding: 20px 15px;
  border-right: 1px solid var(--line-subtle);
  background: rgba(10, 18, 27, 0.7);
}
.investigation {
  min-width: 0;
  padding: 18px;
  overflow: hidden;
}
.ai-panel {
  min-width: 0;
  padding: 18px 16px;
  border-left: 1px solid var(--line-subtle);
  background: rgba(11, 20, 30, 0.88);
}

.story-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.45fr) minmax(270px, 0.75fr);
  gap: 12px;
  margin: 12px 0;
}
.surface-panel {
  border: 1px solid var(--line-subtle);
  border-radius: var(--radius-lg);
  background: linear-gradient(180deg, rgba(21, 34, 49, 0.93), rgba(15, 26, 38, 0.96));
  box-shadow: var(--shadow-panel);
}
.story-panel,
.finding-card,
.lens-panel {
  padding: 16px;
}

@media (max-width: 1420px) {
  .workbench-grid {
    grid-template-columns: 246px minmax(540px, 1fr) 290px;
  }
  .search-field {
    width: 240px;
  }
}

@media (max-width: 1160px) {
  .workbench-grid {
    grid-template-columns: 230px minmax(0, 1fr);
  }
  .ai-panel {
    position: fixed;
    z-index: 40;
    top: 72px;
    right: 0;
    bottom: 0;
    width: 340px;
    transform: translateX(100%);
    transition: transform 0.22s ease;
    box-shadow: -24px 0 60px rgba(0, 0, 0, 0.35);
  }
  .ai-panel.is-open {
    transform: translateX(0);
  }
  .story-grid {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 780px) {
  .app-shell {
    display: block;
    padding-bottom: 66px;
  }
  .product-nav {
    position: fixed;
    z-index: 50;
    top: auto;
    right: 0;
    bottom: 0;
    left: 0;
    height: 64px;
    flex-direction: row;
    justify-content: space-around;
    padding: 6px 8px;
    border-top: 1px solid var(--line-subtle);
    border-right: 0;
  }
  .brand-mark,
  .nav-spacer,
  .operator-avatar {
    display: none;
  }
  .product-nav__item {
    width: auto;
    min-width: 48px;
    min-height: 48px;
  }
  .workspace-header {
    height: 64px;
    padding: 0 14px;
  }
  .workspace-header .eyebrow,
  .search-field,
  .live-indicator {
    display: none;
  }
  .workbench-grid {
    display: block;
    min-height: auto;
  }
  .event-queue {
    padding: 14px;
    border-right: 0;
    border-bottom: 1px solid var(--line-subtle);
  }
  .event-list {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: minmax(260px, 82vw);
    overflow-x: auto;
    padding-bottom: 6px;
  }
  .service-map-button {
    display: none;
  }
  .investigation {
    padding: 12px;
  }
  .context-lock {
    align-items: flex-start;
  }
  .context-chips {
    width: 100%;
    order: 3;
    overflow-x: auto;
    flex-wrap: nowrap;
  }
  .context-editor {
    flex-wrap: wrap;
  }
  .context-editor small {
    width: 100%;
    margin-left: 0;
  }
  .hypothesis-tree {
    grid-template-columns: 1fr;
  }
  .hypothesis-link {
    width: 1px;
    height: 10px;
    margin-left: 6px;
  }
  .incident-header {
    flex-direction: column;
  }
  .incident-meta {
    justify-content: flex-start;
  }
  .ai-panel {
    top: 64px;
    width: min(360px, 94vw);
  }
}

.panel-heading,
.section-heading,
.ai-panel__header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.panel-heading {
  margin-bottom: 14px;
}
.count-badge {
  min-width: 26px;
  height: 24px;
  display: grid;
  place-items: center;
  border-radius: 999px;
  color: var(--accent);
  background: var(--accent-soft);
  font-size: 11px;
  font-weight: 700;
}

.segmented {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 3px;
  margin-bottom: 13px;
  padding: 3px;
  border-radius: 10px;
  background: var(--bg-input);
}
.segmented button {
  padding: 6px 5px;
  border: 0;
  border-radius: 7px;
  color: var(--text-muted);
  background: transparent;
  cursor: pointer;
  font-size: 11px;
}
.segmented button.is-active {
  color: var(--text-primary);
  background: var(--bg-panel-raised);
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
}
.event-list {
  display: grid;
  gap: 8px;
}
.event-card {
  width: 100%;
  padding: 13px;
  text-align: left;
  border: 1px solid var(--line-subtle);
  border-radius: var(--radius-md);
  background: rgba(16, 27, 39, 0.72);
  cursor: pointer;
}
.event-card:hover {
  border-color: var(--line-strong);
  background: var(--bg-panel-hover);
}
.event-card.is-active {
  border-color: rgba(102, 224, 189, 0.44);
  background: linear-gradient(145deg, rgba(102, 224, 189, 0.1), rgba(21, 34, 49, 0.9));
  box-shadow: inset 3px 0 0 var(--accent);
}
.event-card__top,
.event-card__meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.event-card__top {
  margin-bottom: 8px;
}
.event-card__id {
  color: var(--text-muted);
  font-family: var(--font-mono);
  font-size: 10px;
}
.event-card h3 {
  margin-bottom: 5px;
  line-height: 1.35;
}
.event-card p {
  min-height: 32px;
  color: var(--text-muted);
  font-size: 11px;
}
.event-card__meta {
  margin-top: 10px;
  color: var(--text-secondary);
  font-size: 10px;
}

.service-map-button {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 14px;
  padding: 12px;
  text-align: left;
  border: 1px dashed var(--line-strong);
  border-radius: var(--radius-md);
  color: var(--text-secondary);
  background: transparent;
  cursor: pointer;
}
.service-map-button > span:nth-child(2) {
  flex: 1;
}
.service-map-button strong,
.service-map-button small {
  display: block;
}
.service-map-button strong {
  color: var(--text-primary);
  font-size: 11px;
}
.service-map-button small {
  color: var(--text-muted);
  font-size: 9px;
}
.map-orbit {
  position: relative;
  width: 30px;
  height: 30px;
  border: 1px solid var(--line-strong);
  border-radius: 50%;
}
.map-orbit i {
  position: absolute;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--accent);
}
.map-orbit i:nth-child(1) {
  top: 5px;
  left: 12px;
}
.map-orbit i:nth-child(2) {
  top: 17px;
  left: 6px;
}
.map-orbit i:nth-child(3) {
  top: 17px;
  right: 6px;
  background: var(--warning);
}
.service-map-popover {
  display: grid;
  gap: 7px;
  margin-top: 8px;
  padding: 10px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-md);
  background: var(--bg-panel-raised);
  box-shadow: var(--shadow-lg);
}
.service-map-popover__head {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  padding: 2px 2px 6px;
  color: var(--text-muted);
  font-size: 9px;
}
.service-map-popover__head strong {
  color: var(--text-primary);
  font-size: 10px;
}
.service-map-popover button {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px;
  text-align: left;
  border: 1px solid var(--line-subtle);
  border-radius: 8px;
  color: var(--text-secondary);
  background: var(--bg-panel);
  cursor: pointer;
}
.service-map-popover button:hover {
  border-color: var(--accent);
}
.service-map-popover button span:nth-child(2) {
  display: grid;
  gap: 2px;
}
.service-map-popover button small {
  color: var(--text-muted);
}
.service-map-popover .service-map-reset {
  justify-content: center;
  color: var(--info);
  background: transparent;
}

.icon-button {
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line-subtle);
  border-radius: 10px;
  color: var(--text-secondary);
  background: var(--bg-panel);
  cursor: pointer;
}
.icon-button:hover {
  color: var(--accent);
  border-color: var(--line-strong);
}
.quiet-button,
.text-button {
  border: 0;
  color: var(--text-secondary);
  background: transparent;
  cursor: pointer;
  font-size: 11px;
}
.quiet-button {
  padding: 6px 9px;
  border: 1px solid var(--line-subtle);
  border-radius: 8px;
}
.quiet-button[aria-pressed="true"] {
  color: var(--accent);
  border-color: rgba(102, 224, 189, 0.25);
  background: var(--accent-soft);
}
.text-button {
  color: var(--info);
}

.context-lock {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 11px;
  border: 1px solid var(--line-subtle);
  border-radius: var(--radius-md);
  background: rgba(12, 23, 34, 0.86);
}
.context-lock__title {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: none;
  color: var(--accent);
  font-size: 11px;
  font-weight: 700;
}
.context-lock__title svg {
  width: 14px;
  height: 14px;
}
.context-chips {
  min-width: 0;
  flex: 1;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.context-chip {
  padding: 5px 8px;
  border-radius: 7px;
  color: var(--text-secondary);
  background: var(--bg-panel-raised);
  font-family: var(--font-mono);
  font-size: 10px;
  white-space: nowrap;
}
.context-chip strong {
  margin-right: 4px;
  color: var(--text-muted);
  font-family: var(--font-sans);
  font-weight: 600;
}
.context-editor {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 7px;
  padding: 8px 10px;
  border: 1px solid rgba(99, 168, 255, 0.24);
  border-radius: 10px;
  color: var(--text-muted);
  background: rgba(99, 168, 255, 0.06);
  font-size: 10px;
}
.context-editor button {
  padding: 5px 8px;
  border: 1px solid var(--line-subtle);
  border-radius: 7px;
  color: var(--text-secondary);
  background: var(--bg-panel);
  cursor: pointer;
}
.context-editor button.is-active {
  color: var(--accent);
  border-color: rgba(102, 224, 189, 0.35);
  background: var(--accent-soft);
}
.context-editor small {
  margin-left: auto;
}

.incident-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 18px;
  padding: 21px 3px 15px;
}
.incident-title-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 7px;
}
.incident-header h2 {
  font-size: clamp(20px, 2.2vw, 28px);
  letter-spacing: -0.035em;
}
.incident-header p {
  max-width: 720px;
  color: var(--text-secondary);
}
.severity-pill {
  padding: 4px 8px;
  border-radius: 999px;
  color: var(--critical);
  background: var(--critical-soft);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.severity-pill--unknown {
  color: var(--warning);
  background: var(--warning-soft);
}
.severity-pill--recovering {
  color: var(--positive);
  background: var(--positive-soft);
}
.incident-meta {
  display: flex;
  justify-content: flex-end;
  gap: 18px;
  flex-wrap: wrap;
}
.incident-kpi {
  min-width: 92px;
}
.incident-kpi span,
.incident-kpi strong {
  display: block;
}
.incident-kpi span {
  margin-bottom: 3px;
  color: var(--text-muted);
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.incident-kpi strong {
  font-size: 14px;
}

.guardrail {
  display: none;
  align-items: flex-start;
  gap: 9px;
  margin-bottom: 12px;
  padding: 10px 12px;
  border: 1px solid rgba(241, 189, 103, 0.28);
  border-radius: var(--radius-md);
  color: #f6d99f;
  background: var(--warning-soft);
  font-size: 11px;
}
.guardrail.is-visible {
  display: flex;
}
.guardrail strong {
  color: var(--warning);
}

.workflow {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  padding: 6px;
  border: 1px solid var(--line-subtle);
  border-radius: var(--radius-md);
  background: var(--bg-input);
}
.workflow-step {
  position: relative;
  padding: 8px 9px 8px 32px;
  border-radius: 8px;
  color: var(--text-muted);
  font-size: 10px;
}
.workflow-step::before {
  position: absolute;
  left: 9px;
  top: 7px;
  width: 16px;
  height: 16px;
  display: grid;
  place-items: center;
  content: attr(data-index);
  border: 1px solid var(--line-strong);
  border-radius: 50%;
  font-size: 8px;
}
.workflow-step.is-active {
  color: var(--text-primary);
  background: var(--bg-panel-raised);
}
.workflow-step.is-active::before {
  color: #06110e;
  border-color: var(--accent);
  background: var(--accent);
}

  function deriveHealthState(event) {

        return {
          ...state2,
          activeEventId: nextEvent?.id ?? state2.activeEventId,
          activeLens: nextEvent ? "metrics" : state2.activeLens,
          serviceFilter: action.service,
          serviceMapOpen: false

      }
      case "toggle_context_lock":

      case "set_time_range":

              ...event.finding,

    } : {
      summary: "\u53D8\u66F4\u3001\u9519\u8BEF\u7387\u3001\u65E5\u5FD7\u914D\u7F6E\u5DEE\u5F02\u548C\u5BF9\u7167\u62E8\u6D4B\u5F62\u6210\u540C\u4E00\u6761\u56E0\u679C\u5019\u9009\u94FE\u3002\u4ECD\u9700\u4EBA\u5DE5\u786E\u8BA4 Finding\u3002",
      fact: "\u9519\u8BEF\u7387\u5728 rc3 \u7070\u5EA6\u5B8C\u6210\u540E 3 \u5206 12 \u79D2\u9996\u6B21\u504F\u79BB\uFF1B\u65E7\u7248\u672C\u627F\u8F7D\u533A\u57DF\u4FDD\u6301\u6B63\u5E38\u3002",
      hypothesis: "rc3 \u5C06\u8FDE\u63A5\u6C60\u4E0A\u9650\u4ECE 120 \u56DE\u9000\u4E3A 40\uFF0C\u652F\u4ED8\u8BF7\u6C42\u6392\u961F\u5E76\u89E6\u53D1\u8D85\u65F6\u3002",
      gap: "\u79FB\u52A8\u7AEF\u8BA2\u5355\u56DE\u8C03\u672A\u8986\u76D6\uFF1B\u7ED3\u8BBA\u4E0D\u53EF\u5916\u63A8\u5230\u5168\u90E8\u7ED3\u7B97\u6E20\u9053\u3002",
      action: "\u9489\u5165\u8D85\u65F6\u65E5\u5FD7\u4E0E\u914D\u7F6E\u5BA1\u8BA1\uFF0C\u786E\u8BA4 Finding \u540E\u7531 Owner \u6267\u884C\u53D7\u63A7\u56DE\u6EDA\u3002"
    };
    return `<section class="ai-summary"><p>${copy.summary}</p></section>
    <article class="ai-card"><div class="ai-card__label"><span>\u4E8B\u5B9E</span><span>01</span></div><p>${copy.fact}</p><div class="ai-source">\u6765\u6E90\uFF1A\u53EF\u590D\u6838\u9065\u6D4B / \u53D8\u66F4\u8BB0\u5F55</div></article>
    <article class="ai-card ai-card--hypothesis"><div class="ai-card__label"><span>\u63A8\u65AD</span><span>\u5F85\u786E\u8BA4</span></div><p>${copy.hypothesis}</p><div class="ai-source">\u72B6\u6001\uFF1A\u5019\u9009\u89E3\u91CA\uFF0C\u4E0D\u7B49\u4E8E\u4E8B\u5B9E</div></article>
    <article class="ai-card ai-card--gap"><div class="ai-card__label"><span>\u8BC1\u636E\u7F3A\u53E3</span><span>\u95E8\u7981</span></div><p>${copy.gap}</p></article>
    <article class="ai-card ai-card--action"><div class="ai-card__label"><span>\u5EFA\u8BAE\u52A8\u4F5C</span><span>\u9700\u4EBA\u5DE5</span></div><p>${copy.action}</p><button class="ai-action-button" data-ai-action="pin_recommended" type="button">\u9489\u5165\u63A8\u8350\u8BC1\u636E</button></article>
    <p class="ai-disclaimer">AI \u53EA\u7EC4\u7EC7\u53EF\u68C0\u67E5\u7684\u4E8B\u5B9E\u3001\u5047\u8BBE\u548C\u5EFA\u8BAE\uFF1B\u751F\u4EA7\u52A8\u4F5C\u3001\u6700\u7EC8\u5224\u5B9A\u4E0E\u6743\u9650\u4ECD\u7531\u89C4\u5219\u548C\u4EBA\u5DE5\u8D1F\u8D23\u3002</p>`;
  }
  function renderModuleNav(state2) {
    document.querySelectorAll("[data-module]").forEach((button) => {
      button.classList.toggle("is-active", button.dataset.module === state2.activeModule);
    });
  }

  // designs/aiops-unified-workbench/app.mjs
  var state = createInitialState();
  var toastTimer;
  var elements = {
    aiContent: document.querySelector("#ai-content"),
    aiPanel: document.querySelector("#ai-panel"),
    context: document.querySelector("#context-chips"),
    contextEditor: document.querySelector("#context-editor"),
    contextLockButton: document.querySelector("#context-lock-button"),
    contextLockLabel: document.querySelector("#context-lock-label"),
    eventCount: document.querySelector("#event-count"),
    eventList: document.querySelector("#event-list"),
    finding: document.querySelector("#finding-card"),
    guardrail: document.querySelector("#guardrail"),
    incident: document.querySelector("#incident-header"),
    hypothesisToggle: document.querySelector("#hypothesis-toggle"),
    lensContent: document.querySelector("#lens-content"),
    lensTabs: document.querySelector("#lens-tabs"),
    pinnedCount: document.querySelector("#pinned-count"),
    serviceMap: document.querySelector("#service-map"),
    serviceMapButton: document.querySelector(".service-map-button"),
    timeline: document.querySelector("#timeline"),
    toast: document.querySelector("#toast"),
    workflow: document.querySelector("#workflow")
  };
  function showToast(message) {
    window.clearTimeout(toastTimer);
    elements.toast.textContent = message;
    elements.toast.classList.add("is-visible");
    toastTimer = window.setTimeout(() => elements.toast.classList.remove("is-visible"), 2400);
  }
  function render() {
    const event = activeEvent(state);
    elements.eventList.innerHTML = renderEventQueue(state);
    elements.eventCount.textContent = filteredEvents(state).length;
    elements.context.innerHTML = renderContext(state);
    elements.contextEditor.innerHTML = renderContextEditor(state);
    elements.contextLockButton.setAttribute("aria-pressed", String(state.contextLocked));
    elements.contextLockButton.textContent = state.contextLocked ? "\u4FDD\u6301\u7EE7\u627F" : "\u5B8C\u6210\u5E76\u9501\u5B9A";
    elements.contextLockLabel.textContent = state.contextLocked ? "\u4E0A\u4E0B\u6587\u5DF2\u9501\u5B9A" : "\u6B63\u5728\u8C03\u6574\u4E0A\u4E0B\u6587";
    elements.incident.innerHTML = renderIncidentHeader(state);
    const guardrail = renderGuardrail(state);
    elements.guardrail.innerHTML = guardrail.html;
    elements.guardrail.classList.toggle("is-visible", guardrail.visible);
    elements.workflow.innerHTML = renderWorkflow(state);
    elements.timeline.innerHTML = renderTimeline(state);
    elements.hypothesisToggle.setAttribute("aria-expanded", String(state.hypothesisTreeExpanded));
    elements.hypothesisToggle.textContent = state.hypothesisTreeExpanded ? "\u6536\u8D77\u5047\u8BBE\u6811" : "\u5C55\u5F00\u5047\u8BBE\u6811";
    elements.finding.innerHTML = renderFinding(state);
    elements.lensTabs.innerHTML = renderLensTabs(state);
    elements.lensContent.innerHTML = renderLensContent(state);
    elements.pinnedCount.textContent = `${event.pinnedEvidenceIds.length} \u6761\u5DF2\u9489\u5165`;
    elements.serviceMap.innerHTML = renderServiceMap(state);
    elements.serviceMapButton.setAttribute("aria-expanded", String(state.serviceMapOpen));
    elements.aiContent.innerHTML = renderAI(state);
    elements.aiPanel.classList.toggle("is-open", state.aiPanelOpen);
    document.querySelectorAll(".ai-toggle").forEach((button) => {
      button.setAttribute("aria-pressed", String(state.aiPanelOpen));
    });
    document.querySelectorAll("[data-filter]").forEach((button) => {
      button.classList.toggle("is-active", button.dataset.filter === state.eventQueueFilter);
    });
    renderModuleNav(state);
  }
  function dispatch(action, message) {
    state = reduceWorkbench(state, action);
    render();
    if (message) showToast(message);
  }
  function recommendedEvidenceIds(eventId) {
    return {
      "HE-1042": ["log-timeout-01", "log-config-01"],
      "HE-1045": ["drift-log-01", "drift-check-01"],
      "HE-1047": ["gap-alert-01", "gap-check-01"]
    }[eventId] ?? [];
  }
  function handleWorkflow(action) {
    const handlers = {
      confirm_finding: () => dispatch({ type: "confirm_finding" }, "Finding \u5DF2\u786E\u8BA4\uFF0C\u5E76\u4FDD\u7559\u5B8C\u6574\u8BC1\u636E\u5F15\u7528\u3002"),
      assign_action: () => dispatch({ type: "assign_action", owner: "\u9648\u66E6" }, "\u6574\u6539\u5DF2\u5206\u6D3E\u7ED9\u9648\u66E6\u3002"),
      start_action: () => dispatch({ type: "start_action" }, "\u6574\u6539\u5F00\u59CB\uFF1B\u751F\u4EA7\u52A8\u4F5C\u4ECD\u9700\u65E2\u6709\u6743\u9650\u7CFB\u7EDF\u6267\u884C\u3002"),
      start_verification: () => dispatch({ type: "start_verification" }, "\u590D\u9A8C\u5DF2\u542F\u52A8\uFF1A\u53D1\u5E03\u68C0\u67E5 + \u7ED3\u7B97\u62E8\u6D4B\u3002"),
      complete_verification: () => {
        dispatch({ type: "complete_verification" });
        const verification = activeEvent(state).verification;
        showToast(
          verification.status === "blocked" ? `\u590D\u9A8C\u53D7\u963B\uFF1A${verification.blockReason}\uFF0C\u72B6\u6001\u4FDD\u6301 unknown\u3002` : "\u590D\u9A8C\u901A\u8FC7\uFF0C\u4E8B\u4EF6\u8FDB\u5165\u6062\u590D\u89C2\u5BDF\u3002"
        );
      }
    };
    handlers[action]?.();
  }
  function handleQueueAndNavigation(target) {
    const eventCard = target.closest("[data-event-id]");
    if (eventCard) {
      dispatch(
        { type: "select_event", eventId: eventCard.dataset.eventId },
        `\u5DF2\u8FDB\u5165 ${eventCard.dataset.eventId}\uFF0C\u8C03\u67E5\u4E0A\u4E0B\u6587\u5DF2\u9501\u5B9A\u3002`
      );
      return true;
    }
    const filter = target.closest("[data-filter]");
    if (filter) {
      dispatch({ type: "set_queue_filter", filter: filter.dataset.filter });
      return true;
    }
    const lens = target.closest("[data-lens]");
    if (lens) {
      dispatch(
        { type: "switch_lens", lens: lens.dataset.lens },
        `\u5DF2\u5207\u6362\u5230${lensNames[lens.dataset.lens]}\uFF0CHealthEvent \u4E0E\u65F6\u95F4\u7A97\u4FDD\u6301\u4E0D\u53D8\u3002`
      );
      return true;
    }
    const moduleButton = target.closest("[data-module]");
    if (moduleButton) {
      const module = moduleButton.dataset.module;
      dispatch(
        { type: "open_module", module },
        module === "investigations" ? "\u8FD4\u56DE\u4E8B\u4EF6\u8C03\u67E5\u5C42\u3002" : `\u4ECE\u4E13\u4E1A\u6A21\u5757\u6DF1\u94FE\u5230${lensNames[module]}\uFF0C\u4FDD\u7559\u5F53\u524D\u4E8B\u4EF6\u4E0A\u4E0B\u6587\u3002`
      );
      document.querySelector("#lens-content")?.scrollIntoView({ behavior: "smooth", block: "center" });
      return true;
    }
    return false;
  }
  function handleEvidence(target) {
    const pin = target.closest("[data-evidence-id]");
    if (pin) {
      const alreadyPinned = activeEvent(state).pinnedEvidenceIds.includes(pin.dataset.evidenceId);
      if (alreadyPinned) showToast("\u8FD9\u6761\u8BC1\u636E\u5DF2\u5728\u8C03\u67E5\u4E2D\uFF0C\u4E0D\u4F1A\u91CD\u590D\u8BA1\u6570\u3002");
      else
        dispatch(
          { type: "pin_evidence", evidenceId: pin.dataset.evidenceId },
          "\u8BC1\u636E\u5DF2\u9489\u5165\uFF0C\u5E76\u540C\u6B65\u5199\u5165\u65F6\u95F4\u7EBF\u4E0E Finding\u3002 "
        );
      return true;
    }
    const workflow = target.closest("[data-workflow-action]");
    if (workflow) {
      handleWorkflow(workflow.dataset.workflowAction);
      return true;
    }
    return false;
  }
  function handleAi(target) {
    if (target.closest("[data-ai-action='pin_recommended']")) {
      for (const evidenceId of recommendedEvidenceIds(state.activeEventId)) {
        state = reduceWorkbench(state, { type: "pin_evidence", evidenceId });
      }
      render();
      showToast("AI \u63A8\u8350\u8BC1\u636E\u5DF2\u9489\u5165\uFF1B\u8BF7\u4EBA\u5DE5\u68C0\u67E5\u540E\u786E\u8BA4 Finding\u3002 ");
      return true;
    }
    if (target.closest(".ai-toggle")) {
      dispatch({ type: "toggle_ai" }, state.aiPanelOpen ? "AI \u8C03\u67E5\u5458\u5DF2\u6536\u8D77\u3002" : "AI \u8C03\u67E5\u5458\u5DF2\u5C55\u5F00\u3002 ");
      return true;
    }
    return false;
  }
  function handleUtility(target) {
    if (target.closest("#hypothesis-toggle")) {
      dispatch(
        { type: "toggle_hypothesis_tree" },
        state.hypothesisTreeExpanded ? "\u5047\u8BBE\u6811\u5DF2\u5C55\u5F00\uFF0C\u53EF\u6838\u5BF9\u8BC1\u636E\u4E0E\u9A8C\u8BC1\u6761\u4EF6\u3002" : "\u5047\u8BBE\u6811\u5DF2\u6536\u8D77\u3002"
      );
      return true;
    }
    if (target.closest("#context-lock-button")) {
      dispatch(
        { type: "toggle_context_lock" },
        state.contextLocked ? "\u4E0A\u4E0B\u6587\u5DF2\u91CD\u65B0\u9501\u5B9A\u5E76\u5C06\u8DE8 Lens \u7EE7\u627F\u3002" : "\u4E0A\u4E0B\u6587\u5DF2\u89E3\u9501\uFF0C\u53EF\u8C03\u6574\u8C03\u67E5\u65F6\u95F4\u7A97\u3002"
      );
      return true;
    }
    const timeRange = target.closest("[data-time-range]");
    if (timeRange) {
      dispatch(
        { type: "set_time_range", timeRange: timeRange.dataset.timeRange },
        `\u8C03\u67E5\u65F6\u95F4\u7A97\u5DF2\u66F4\u65B0\u4E3A${timeRange.dataset.timeRange}\uFF1B\u5207\u6362 Lens \u540E\u7EE7\u7EED\u7EE7\u627F\u3002`
      );
      return true;
    }
    if (target.closest(".service-map-button")) {
      dispatch({ type: "toggle_service_map" }, state.serviceMapOpen ? "\u4E1A\u52A1\u5065\u5EB7\u5730\u56FE\u5DF2\u5C55\u5F00\u3002" : "\u4E1A\u52A1\u5065\u5EB7\u5730\u56FE\u5DF2\u6536\u8D77\u3002");
      return true;
    }
    const service = target.closest("[data-service]");
    if (service) {
      dispatch(
        { type: "select_service", service: service.dataset.service },
        service.dataset.service === "all" ? "\u5DF2\u6E05\u9664\u670D\u52A1\u7B5B\u9009\u3002" : `\u5DF2\u4ECE\u5065\u5EB7\u5730\u56FE\u8FDB\u5165 ${service.dataset.service} \u7684 HealthEvent\u3002`
      );
      return true;
    }
    return false;
  }
  document.addEventListener("click", (event) => {
    const target = event.target;
    if (handleQueueAndNavigation(target)) return;
    if (handleEvidence(target)) return;
    if (handleAi(target)) return;
    handleUtility(target);
  });
  render();
})();

    </script>
  </body>
</html>
