  if (state.phase !== 'plan' || !state.workspace) return state;
  const candidate = state.workspace.candidateChecks.find((item) => item.id === action.candidateId);
  if (!candidate) return state;
  return {
    ...state,
    candidateDisposition: {
      ...state.candidateDisposition,
      [candidate.id]: { status: 'rejected', reason: '保留为未覆盖风险' },
    },
  };
}

function updateCheckRule(state, action) {
  if (state.phase !== 'plan' || !state.workspace) return state;
  const check = selectCommittedChecks(state).find((item) => item.id === action.checkId);
  const rule = check?.metricRules.find((item) => item.id === action.ruleId);
  const operator = String(action.operator ?? '');
  const threshold =
    typeof action.threshold === 'string' && !action.threshold.trim() ? Number.NaN : Number(action.threshold);
  if (!rule?.editable || !rule.allowedOperators.includes(operator) || !Number.isFinite(threshold)) return state;
  if (rule.operator === operator && rule.threshold === threshold) return state;
  return {
    ...state,
    checkRuleOverrides: {
      ...state.checkRuleOverrides,
      [check.id]: {
        ...(state.checkRuleOverrides[check.id] ?? {}),
        [rule.id]: { operator, threshold },
      },
    },
  };
}

function submitIntent(state, action, playbookCatalog, compileIntent) {
  if (state.phase !== 'intake') return state;
  const workspace = compileIntent(action.request);
  const ordinal = state.nextTaskOrdinal;
  return {
    ...createDemoSession({
      library: state.library,
      actorId: state.actorId,
      nextTaskOrdinal: ordinal + 1,
      nextRunOrdinal: state.nextRunOrdinal,
      nextSavedOrdinal: state.nextSavedOrdinal,
      historyDiagnostics: state.historyDiagnostics,
    }),
    workspace,
    phase: 'plan',
    contextOptions: createContextOptions(workspace),
    conversation: [
      { role: 'user', text: workspace.request.contextReference || workspace.request.prompt },
      { role: 'assistant', text: `已生成：${workspace.declaredChange.entities[0]} 候选巡检计划` },
    ],
    activeRequest: { ...workspace.request },
    playbookMatch: matchInspectionPlaybook(workspace, playbookCatalog),
    taskInstance: createTaskInstance(ordinal, null, state.actorId),
  };
}

function toggleDraftContext(state, action) {
  if (!['intake', 'plan'].includes(state.phase) || !state.workspace) return state;
  const contextOptions = toggleContextSelection(state.contextOptions, action.contextId);
  return contextOptions === state.contextOptions ? state : { ...state, contextOptions };
}

function confirmInput(state) {
  if (state.phase !== 'intake' || !state.workspace) return state;
  return { ...state, phase: state.playbookMatch ? 'context' : 'plan' };
}

function dismissPlaybook(state) {
  if (state.phase !== 'context' || !state.playbookMatch || state.playbookDecision) return state;
  return {
    ...state,
    playbookDecision: 'dismissed',
    taskInstance: updateTaskInstance(
      state.taskInstance,
      {},
      { type: 'playbook-dismissed', playbookRef: playbookRef(state.playbookMatch) },
    ),
  };
}

function startPlaybookExecution(state) {
  if (
    state.phase !== 'context' ||
    state.playbookMatch?.status !== 'exact' ||
    state.playbookDecision ||
    !reconciliationAllowsExecution(state.workspace)
  ) {
    return state;
  }
  const checks = selectChecksForContext(state, state.playbookMatch.checks);
  const plannedState = {
    ...state,
    playbookDecision: 'applied',
    taskInstance: updateTaskInstance(
      state.taskInstance,
      {
        status: 'executing',
        sourcePlaybookRef: playbookRef(state.playbookMatch),
        inspectionPlan: createInspectionPlan(checks, playbookRef(state.playbookMatch)),
      },
      { type: 'playbook-applied', playbookRef: playbookRef(state.playbookMatch) },
    ),
  };
  return completeInspectionRun(plannedState);
}

function confirmPlaybookDifference(state) {
  if (
    state.phase !== 'context' ||
    state.playbookMatch?.status !== 'minor-drift' ||
    state.playbookDecision ||
    !reconciliationAllowsExecution(state.workspace)
  ) {
    return state;
  }
  return {
    ...state,
    phase: 'plan',
    playbookDecision: 'accepted-with-diff',
    taskInstance: updateTaskInstance(
      state.taskInstance,
      { sourcePlaybookRef: playbookRef(state.playbookMatch) },
      {
        type: 'playbook-differences-confirmed',
        playbookRef: playbookRef(state.playbookMatch),
        differenceIds: state.playbookMatch.differences.map((difference) => difference.id),
      },
    ),
  };
}

function reviewPlaybookDrift(state) {
  return state.phase === 'context' && state.playbookMatch?.status === 'major-drift'
    ? { ...state, playbookDriftReviewed: true }
    : state;
}

function regenerateFromPlaybook(state) {
  if (
    state.phase !== 'context' ||
    state.playbookMatch?.status !== 'major-drift' ||
    state.playbookDecision ||
    !state.playbookDriftReviewed
  ) {
    return state;
  }
  return {
    ...state,
    phase: 'plan',
    playbookDecision: 'regenerated',
    taskInstance: updateTaskInstance(
      state.taskInstance,
      { referencePlaybookRef: playbookRef(state.playbookMatch) },
      { type: 'playbook-regenerated', referencePlaybookRef: playbookRef(state.playbookMatch) },
    ),
  };
}

function acceptScope(state) {
  if (state.phase !== 'context' || !state.workspace) return state;
  if (state.playbookMatch && state.playbookDecision !== 'dismissed') return state;
  const { reconciliation } = state.workspace;
  return ['Conflict', 'Unverifiable'].includes(reconciliation.status) ? state : { ...state, phase: 'plan' };
}

function confirmPlan(state) {
  if (state.phase !== 'plan' || selectPlanReadiness(state).status !== 'ready') return state;
  const checks = selectCommittedChecks(state);
  const exactPlaybookRef = state.playbookMatch?.status === 'exact' ? playbookRef(state.playbookMatch) : null;
  const plannedState = {
    ...state,
    taskInstance: updateTaskInstance(
      state.taskInstance,
      {
        status: 'executing',
        sourcePlaybookRef: state.taskInstance.sourcePlaybookRef ?? exactPlaybookRef,
        inspectionPlan: createInspectionPlan(
          checks,
          state.taskInstance.sourcePlaybookRef ?? exactPlaybookRef,
          state.taskInstance.sourceSavedInspectionId,
        ),
      },
      { type: 'plan-confirmed', checkIds: checks.map((check) => check.id) },
    ),
  };
  return completeInspectionRun(plannedState);
}

function reportForCoverageGaps(workspace, inspectionPlan) {
  const gaps = workspace.coverageGaps ?? [];
  if (!gaps.length) return workspace.report;
  const includedCheckIds = new Set(inspectionPlan.checkIds);
  const uncovered = gaps.filter(
    (gap) => !gap.eligibleCandidateId || !includedCheckIds.has(gap.eligibleCandidateId),
  );
  const gapEntities = gaps.map((gap) => gap.entity);
  const retainedRisks = workspace.report.residualRisks.filter(
    (risk) => !gapEntities.some((entity) => risk.includes(entity)),
  );
  const residualRisks = [
    ...retainedRisks,
    ...uncovered.map((gap) => `未覆盖：${gap.entity}（${gap.reason}）`),
  ];
  const coveredEntities = workspace.blockingScope?.join('、') || workspace.declaredChange.entities.join('、');
  const scopeStatement = uncovered.length
    ? `结论仅覆盖声明范围内已锁定计划中的 ${coveredEntities}；声明外影响 ${uncovered.map((gap) => gap.entity).join('、')} 未覆盖。`
    : `结论覆盖声明范围内已锁定计划中的 ${coveredEntities} 及用户显式加入的声明外检查。`;
  return { ...workspace.report, scopeStatement, residualRisks };
}

function completeInspectionRun(state) {
  if (!state.workspace || state.taskInstance?.status !== 'executing' || !state.taskInstance.inspectionPlan)
    return state;
  const taskInstance = updateTaskInstance(state.taskInstance, { status: 'locked' }, { type: 'task-locked' });
  const id = runId(state.nextRunOrdinal, state.actorId);
  const run = createInspectionRun({
    id,
    taskInstance,
    definitionId: state.activeSavedInspectionId,
    selectedContext: state.contextOptions,
    report: reportForCoverageGaps(state.workspace, taskInstance.inspectionPlan),
    startedAt: taskInstance.startedAt,
    completedAt: demoTimestamp(state.nextRunOrdinal, 1),
  });
  return {
    ...state,
    phase: 'report',
    taskInstance,
    currentRunId: id,
    nextRunOrdinal: state.nextRunOrdinal + 1,
    library: {
      ...state.library,
      revision: state.library.revision + 1,
      runs: [...state.library.runs, run],
    },
  };
}

function toggleRootCause(state) {
  return state.phase === 'report' && state.workspace?.report.rcAgent
    ? { ...state, rcExpanded: !state.rcExpanded }
    : state;
}

function submitPlaybookProposal(state) {
  if (state.phase !== 'report' || state.taskInstance?.status !== 'locked' || state.playbookProposal) return state;
  const source = state.taskInstance.sourcePlaybookRef;
  return {
    ...state,
    playbookProposal: {
      id: `PB-PROP-${state.taskInstance.id}`,
      kind: source ? 'update' : 'create',
      sourceTaskInstanceId: state.taskInstance.id,
      sourcePlaybookRef: source ? { ...source } : null,
      targetVersion: source ? source.version + 1 : 1,
      status: 'pending-approval',
    },
  };
}

function createPersonalSavedInspection(state, action) {
  if (
    state.phase !== 'report' ||
    state.taskInstance?.status !== 'locked' ||
    !state.currentRunId ||
    state.savedDefinitionId
  ) {
    return state;
  }
  const currentRun = state.library.runs.find((run) => run.id === state.currentRunId);
  if (!currentRun) return state;
  const id = savedInspectionId(state.nextSavedOrdinal, state.actorId);
  let definition;
  try {
    definition = createSavedInspectionDefinition({
      id,
      name: action.name,
      request: state.activeRequest,
      workspace: state.workspace,
      selectedContext: state.contextOptions,
      taskInstance: state.taskInstance,
      sourceRunId: currentRun.id,
      now: action.now ?? demoTimestamp(state.nextSavedOrdinal),
    });
  } catch {
    return state;
  }
  return {
    ...state,
    savedDefinitionId: id,
    nextSavedOrdinal: state.nextSavedOrdinal + 1,
    toast: '已保存，下次可从首页直接执行',
    library: {
      ...state.library,
      revision: state.library.revision + 1,
      savedInspections: [...state.library.savedInspections, definition],
    },
  };
}

function savedPlan(definition) {
  return {
    ...definition.inspectionPlan,
    source: 'saved-inspection',
    sourceSavedInspectionId: definition.id,
    sourcePlaybookRef: definition.inspectionPlan.sourcePlaybookRef
      ? { ...definition.inspectionPlan.sourcePlaybookRef }
      : null,
    checkIds: [...definition.inspectionPlan.checkIds],
    checks: snapshotChecks(definition.inspectionPlan.checks),
  };
}

function selectedSavedContext(definition, workspace) {
  const selectedIds = new Set(definition.selectedContext.map((item) => item.id));
  const current = createContextOptions(workspace).map((item) => ({ ...item, selected: selectedIds.has(item.id) }));
  return current.some((item) => item.selected)
    ? current
    : definition.selectedContext.map((item) => ({ ...item, selected: true }));
}

function requestSavedInspectionRun(state, action, compileSavedDefinition) {
  if (state.phase !== 'intake' || state.workspace) return state;
  const definition = state.library.savedInspections.find((item) => item.id === action.definitionId);
  if (!definition) return state;
  let workspace;
  try {
    workspace = compileSavedDefinition(definition.request);
  } catch {
    return state;
  }
  const refresh = classifySavedInspectionRefresh(definition, workspace);
  const ordinal = state.nextTaskOrdinal;
  let taskInstance = createTaskInstance(ordinal, definition.id, state.actorId);
  if (refresh.status === 'exact') {
    taskInstance = updateTaskInstance(
      taskInstance,
      { status: 'executing', inspectionPlan: savedPlan(definition) },
      { type: 'saved-inspection-applied', definitionId: definition.id, refreshStatus: 'exact' },
    );
  }
  const preparedState = {
    ...createDemoSession({
      library: state.library,
      actorId: state.actorId,
      nextTaskOrdinal: ordinal + 1,
      nextRunOrdinal: state.nextRunOrdinal,
      nextSavedOrdinal: state.nextSavedOrdinal,
      historyDiagnostics: state.historyDiagnostics,
    }),
    phase: 'context',
    workspace,
    contextOptions: selectedSavedContext(definition, workspace),
    activeRequest: { ...definition.request },
    activeSavedInspectionId: definition.id,
    savedRunRefresh: refresh,
    taskInstance,
  };
  return refresh.status === 'exact' ? completeInspectionRun(preparedState) : preparedState;
}

function confirmSavedInspectionRun(state) {
  if (state.phase !== 'context' || state.savedRunRefresh?.status !== 'minor-drift') return state;
  const definition = state.library.savedInspections.find((item) => item.id === state.activeSavedInspectionId);
  if (!definition) return state;
  const plannedState = {
    ...state,
    taskInstance: updateTaskInstance(
      state.taskInstance,
      { status: 'executing', inspectionPlan: savedPlan(definition) },
      {
        type: 'saved-inspection-drift-confirmed',
        definitionId: definition.id,
        differenceIds: state.savedRunRefresh.differences.map((difference) => difference.id),
      },
    ),
  };
  return completeInspectionRun(plannedState);
}

function regenerateSavedInspection(state) {
  if (state.phase !== 'context' || state.savedRunRefresh?.status !== 'major-drift') return state;
  const definition = state.library.savedInspections.find((item) => item.id === state.activeSavedInspectionId);
  if (!definition) return state;
  return createDemoSession({
    library: state.library,
    actorId: state.actorId,
    nextTaskOrdinal: state.nextTaskOrdinal,
    nextRunOrdinal: state.nextRunOrdinal,
    nextSavedOrdinal: state.nextSavedOrdinal,
    composerPrefill: { ...definition.request },
    historyDiagnostics: state.historyDiagnostics,
  });
}

function resetSession(state) {
  return createDemoSession({
    library: state.library,
    actorId: state.actorId,
    nextTaskOrdinal: state.nextTaskOrdinal,
    nextRunOrdinal: state.nextRunOrdinal,
    nextSavedOrdinal: state.nextSavedOrdinal,
    historyDiagnostics: state.historyDiagnostics,
  });
}

function hydrateLibrary(state, action) {
  if (state.phase !== 'intake' || state.workspace || state.library.revision > 0) return state;
  return createDemoSession({
    library: action.library,
    actorId: state.actorId,
    historyDiagnostics: action.diagnostics,
  });
}

function mergeLibrary(state, action) {
  const library = mergeInspectionLibraries(state.library, action.library);
  const historyDiagnostics = action.diagnostics ?? state.historyDiagnostics;
  return JSON.stringify(library) === JSON.stringify(state.library) && historyDiagnostics === state.historyDiagnostics
    ? state
    : { ...state, library, historyDiagnostics };
}

function openSavedInspectionHistory(state, action) {
  if (state.phase !== 'intake' || state.workspace) return state;
  const exists = state.library.savedInspections.some((definition) => definition.id === action.definitionId);
  return exists ? { ...state, activeHistoryDefinitionId: action.definitionId } : state;
}

function closeSavedInspectionHistory(state) {
  return state.activeHistoryDefinitionId ? { ...state, activeHistoryDefinitionId: null } : state;
}

function markStorageFailure(state, action) {
  return { ...state, storageError: action.message || '本地保存失败', toast: null };
}

function setShareFeedback(state, action) {
  return state.phase === 'report' ? { ...state, shareToast: action.message ?? null } : state;
}

function createDemoReducer(options = {}) {
  const playbookCatalog = options.playbookCatalog ?? inspectionPlaybooks;
  const compileIntent = options.compileIntent ?? compileInspectionRequest;
  const compileSavedDefinition = options.compileSavedDefinition ?? compileInspectionRequest;
  const sessionHandlers = {
    INTENT_SUBMITTED: (state, action) => submitIntent(state, action, playbookCatalog, compileIntent),
    RESET: resetSession,
    LIBRARY_HYDRATED: hydrateLibrary,
    LIBRARY_MERGED: mergeLibrary,
    LIBRARY_SAVE_FAILED: markStorageFailure,
    SHARE_FEEDBACK_SET: setShareFeedback,
    CONTEXT_ITEM_TOGGLED: toggleDraftContext,
    INPUT_CONFIRMED: confirmInput,
    PLAYBOOK_DISMISSED: dismissPlaybook,
    PLAYBOOK_EXECUTION_STARTED: startPlaybookExecution,
    PLAYBOOK_DIFF_CONFIRMED: confirmPlaybookDifference,
    PLAYBOOK_DRIFT_REVIEWED: reviewPlaybookDrift,
    PLAYBOOK_REGENERATED: regenerateFromPlaybook,
    SCOPE_ACCEPTED: acceptScope,
    CANDIDATE_DISPOSED: disposeCandidate,
    CANDIDATE_INCLUDED: includeCandidate,
    CANDIDATE_EXCLUDED: excludeCandidate,
    CHECK_RULE_UPDATED: updateCheckRule,
    PLAN_CONFIRMED: confirmPlan,
    RC_TOGGLED: toggleRootCause,
    PLAYBOOK_PROPOSAL_SUBMITTED: submitPlaybookProposal,
    SAVED_INSPECTION_CREATED: createPersonalSavedInspection,
    SAVED_INSPECTION_HISTORY_OPENED: openSavedInspectionHistory,
    SAVED_INSPECTION_HISTORY_CLOSED: closeSavedInspectionHistory,
    SAVED_INSPECTION_RUN_REQUESTED: (state, action) => requestSavedInspectionRun(state, action, compileSavedDefinition),
    SAVED_INSPECTION_RUN_CONFIRMED: confirmSavedInspectionRun,
    SAVED_INSPECTION_REGENERATED: regenerateSavedInspection,
  };
  return (state, action) =>
    deepFreeze((sessionHandlers[action.type] ?? ((currentState) => currentState))(state, action));
}

const defaultReducer = createDemoReducer();

function demoReducer(state, action) {
  return defaultReducer(state, action);
}

function escapeHtml(value = '') {
  return String(value)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

const STATUS_RANK = Object.freeze({ Violated: 0, Inconclusive: 1, NotEvaluated: 1, Verified: 2 });

const REPORT_STATUS_COPY = Object.freeze({
  Verified: { symbol: '✓', label: '通过', tone: 'verified' },
  Violated: { symbol: '✕', label: '违例', tone: 'violated' },
  Inconclusive: { symbol: '?', label: '未决', tone: 'unresolved' },
  NotEvaluated: { symbol: '?', label: '未执行', tone: 'unresolved' },
});

function formatReportTime(value) {
  if (!value || Number.isNaN(new Date(value).getTime())) return '时间未知';
  return `${new Date(value).toISOString().slice(0, 16).replace('T', ' ')} UTC`;
}

function durationLabel(startedAt, completedAt) {
  const duration = new Date(completedAt).getTime() - new Date(startedAt).getTime();
  return Number.isFinite(duration) && duration >= 0 ? `${Math.round(duration / 1000)}s` : '耗时未知';
}

function formatReportMetadata(run, taskName) {
  const name = String(taskName ?? '').trim() || '未命名巡检';
  const window = run?.inspectionPlan?.checks?.[0]?.window ?? '窗口未知';
  const instanceId = run?.taskInstanceId ?? run?.id ?? '实例未知';
  const completedAt = formatReportTime(run?.completedAt);
  const duration = durationLabel(run?.startedAt, run?.completedAt);
  return {
    taskName: name,
    completedAt,
    window,
    instanceId,
    duration,
    line: `${name} · ${completedAt} · 窗口 ${window} · 实例 ${instanceId} · 耗时 ${duration}`,
  };
}

function numericRatio(measurement) {
  const gateValue = measurement.gate?.value;
  if (measurement.kind !== 'numeric' || !Number.isFinite(measurement.value) || !Number.isFinite(gateValue)) return null;
  if (gateValue === 0) return measurement.value === 0 ? 0 : 100;
  const ratio = Math.abs(measurement.value / gateValue);
  return Math.min(100, Math.max(0, Math.round(ratio * 1000) / 10));
}

function measurementStatus(measurement, resultStatus) {
  if (['Inconclusive', 'NotEvaluated'].includes(resultStatus)) return resultStatus;
  if (
    measurement.kind !== 'numeric' ||
    !Number.isFinite(measurement.value) ||
    !Number.isFinite(measurement.gate?.value)
  ) {
    return resultStatus;
  }
  const { operator, value: threshold } = measurement.gate;
  const passed =
    (operator === '<=' && measurement.value <= threshold) ||
    (operator === '>=' && measurement.value >= threshold) ||
    (operator === '<' && measurement.value < threshold) ||
    (operator === '>' && measurement.value > threshold);
  return passed ? 'Verified' : 'Violated';
}

function projectReportEvidence(report) {
  if (!Array.isArray(report?.checkResults)) {
    return (report?.keyEvidence ?? []).map((text, index) => ({
      id: `legacy-evidence-${index + 1}`,
      checkId: null,
      label: '历史证据',
      entity: '历史快照',
      kind: 'qualitative',
      displayValue: text,
      gateDisplayValue: '原报告未保存结构化门禁',
      status: index === 0 ? (report?.evidenceVerdict ?? 'NotEvaluated') : 'Verified',
      ratioPercent: null,
      order: index,
    }));
  }
  return report.checkResults
    .flatMap((result, resultIndex) =>
      result.measurements.map((measurement, measurementIndex) => ({
        ...measurement,
        checkId: result.checkId,
        status: measurementStatus(measurement, result.status),
        gateDisplayValue: measurement.gate.displayValue,
        ratioPercent: numericRatio(measurement),
        order: resultIndex * 100 + measurementIndex,
      })),
    )
    .sort(
      (left, right) => (STATUS_RANK[left.status] ?? 3) - (STATUS_RANK[right.status] ?? 3) || left.order - right.order,
    );
}

function projectReportChecks(run) {
  const results = new Map((run?.report?.checkResults ?? []).map((result) => [result.checkId, result]));
  return (run?.inspectionPlan?.checks ?? []).map((check) => {
    const result = results.get(check.id);
    const measurements = result?.measurements ?? [];
    return {
      check,
      status: result?.status ?? 'NotEvaluated',
      summary: result?.summary ?? '证据不足',
      actualDisplay: measurements.map((measurement) => measurement.displayValue).join(' / ') || '证据不足',
      gateDisplay:
        measurements.map((measurement) => measurement.gate.displayValue).join(' / ') || formatCheckRules(check),
    };
  });
}

function projectInterpretation(report) {
  const interpretation = report?.interpretation;
  return [
    ['whatHappened', '发生了什么'],
    ['likelyCause', '可能原因'],
    ['recommendedAction', '建议动作'],
  ].map(([key, label]) => ({
    key,
    label,
    text: interpretation?.[key]?.text ?? '证据不足',
    evidenceIds: interpretation?.[key]?.evidenceIds ?? [],
  }));
}

function projectCoverageSummary(report) {
  const checked = Array.isArray(report?.checkResults) ? report.checkResults.length : 0;
  const uncovered = (report?.residualRisks ?? []).filter((risk) => /^未覆盖：/.test(risk)).length;
  return { checked, uncovered };
}

function renderTrendChart(measurement) {
  const series = Array.isArray(measurement?.series)
    ? measurement.series.filter((point) => Number.isFinite(point?.value))
    : [];
  if (measurement?.kind !== 'numeric' || series.length < 2) return '';
  const threshold = measurement.gate?.value;
  const values = series.map((point) => point.value);
  if (Number.isFinite(threshold)) values.push(threshold);
  let minimum = Math.min(...values);
  let maximum = Math.max(...values);
  if (minimum === maximum) {
    const padding = Math.abs(minimum) * 0.05 || 1;
    minimum -= padding;
    maximum += padding;
  }
  const left = 16;
  const right = 304;
  const top = 12;
  const bottom = 76;
  const x = (index) => left + (index * (right - left)) / (series.length - 1);
  const y = (value) => bottom - ((value - minimum) / (maximum - minimum)) * (bottom - top);
  const points = series.map((point, index) => `${x(index).toFixed(1)},${y(point.value).toFixed(1)}`).join(' ');
  const thresholdLine = Number.isFinite(threshold)
    ? `<line class="trend-threshold-line" x1="${left}" y1="${y(threshold).toFixed(1)}" x2="${right}" y2="${y(threshold).toFixed(1)}"></line><text class="trend-threshold-label" x="${right}" y="${Math.max(10, y(threshold) - 4).toFixed(1)}" text-anchor="end">门禁 ${escapeHtml(measurement.gate.displayValue)}</text>`
    : '';
  const dots = series
    .map(
      (point, index) =>
        `<circle cx="${x(index).toFixed(1)}" cy="${y(point.value).toFixed(1)}" r="2.5"><title>${escapeHtml(point.label)} ${escapeHtml(point.value)}${escapeHtml(measurement.unit ?? '')}</title></circle>`,
    )
    .join('');
  return `<svg class="trend-chart" data-trend-metric-id="${escapeHtml(measurement.metricId ?? measurement.id)}" role="img" aria-label="${escapeHtml(measurement.label)}趋势" viewBox="0 0 320 96" preserveAspectRatio="none">
    <line class="trend-axis" x1="${left}" y1="${bottom}" x2="${right}" y2="${bottom}"></line>
    ${thresholdLine}
    <polyline class="trend-series-line" points="${points}"></polyline>${dots}
    <text class="trend-time-label" x="${left}" y="91">${escapeHtml(series[0].label)}</text><text class="trend-time-label" x="${right}" y="91" text-anchor="end">${escapeHtml(series.at(-1).label)}</text>
  </svg>`;
}

function requireShareableRun(run) {
  if (!run?.report || !run.completedAt) throw new TypeError('A completed inspection run is required');
  return run.report;
}

function buildReportShareText(run, taskName) {
  const report = requireShareableRun(run);
  const metadata = formatReportMetadata(run, taskName);
  const evidence = projectReportEvidence(report)
    .slice(0, 2)
    .map((item) => `${item.label} ${item.displayValue}`)
    .join('；');
  return [
    `结论：${report.actionLabel}`,
    `报告：${metadata.line}`,
    `关键证据：${evidence}`,
    `AI 解读：${projectInterpretation(report)[0].text}`,
    `结论边界：${report.scopeStatement}`,
  ].join('\n');
}

function buildReportFilename(run, taskName) {
  requireShareableRun(run);
  const safeName = [...String(taskName).trim()]
    .map((character) => (character.charCodeAt(0) < 32 || '<>:"/\\|?*'.includes(character) ? '-' : character))
    .join('')
    .replace(/-+/g, '-')
    .replace(/^[.\s-]+|[.\s-]+$/g, '')
    .slice(0, 80);
  const [date, time] = new Date(run.completedAt).toISOString().slice(0, 16).split('T');
  const stamp = `${date.replaceAll('-', '')}-${time.replace(':', '')}`;
  return `${safeName || '巡检报告'}-${stamp}.html`;
}

function buildStandaloneReportHtml(run, taskName) {
  const report = requireShareableRun(run);
  const metadata = formatReportMetadata(run, taskName);
  const name = escapeHtml(String(taskName).trim());
  const reportEvidence = projectReportEvidence(report);
  const evidenceTargets = new Map(
    reportEvidence.map((item, index) => [item.id, { id: `evidence-${index + 1}`, label: `证据 ${index + 1}` }]),
  );
  const evidence = reportEvidence
    .map((item, index) => {
      const status = REPORT_STATUS_COPY[item.status] ?? REPORT_STATUS_COPY.NotEvaluated;
      return `<article id="evidence-${index + 1}" class="evidence ${status.tone}"><div><strong>${escapeHtml(item.label)}</strong><span>${status.symbol} ${status.label}</span></div><small>${escapeHtml(item.entity)} · 证据 ${index + 1}</small><p>当前值 ${escapeHtml(item.displayValue)} · 门禁 ${escapeHtml(item.gateDisplayValue)}</p>${renderTrendChart(item)}</article>`;
    })
    .join('');
  const checks = projectReportChecks(run)
    .map((item) => {
      const status = REPORT_STATUS_COPY[item.status] ?? REPORT_STATUS_COPY.NotEvaluated;
      return `<tr><td>${status.symbol} ${status.label}</td><td>${escapeHtml(item.check.purpose)}</td><td>${escapeHtml(item.check.entity)}</td><td>${escapeHtml(item.actualDisplay)} / ${escapeHtml(item.gateDisplay)}</td></tr>`;
    })
    .join('');
  const interpretation = projectInterpretation(report)
    .map((item) => {
      const references = item.evidenceIds
        .map((evidenceId) => evidenceTargets.get(evidenceId))
        .filter(Boolean)
        .map((target) => `<a href="#${target.id}">${target.label}</a>`)
        .join('');
      return `<article><strong>${escapeHtml(item.label)}</strong><p>${escapeHtml(item.text)}</p><footer>${references || '<small>证据不足</small>'}</footer></article>`;
    })
    .join('');
  const risks = report.residualRisks.map((item) => `<li>${escapeHtml(item)}</li>`).join('');
  const doctype = '<!' + 'doctype html>';
  return `${doctype}
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>${name} · 巡检报告</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#07101f;color:#edf6ff}
    body{max-width:920px;margin:0 auto;padding:32px 20px;background:#07101f}
    header,section{border:1px solid #29415f;border-radius:16px;background:#0e1d33;padding:22px;margin-bottom:14px}
    header{border-color:#397462;background:linear-gradient(145deg,#153b37,#0e1d33)}
    h1{font-size:30px;margin:8px 0}h2{font-size:16px;margin:0 0 12px}p,li{line-height:1.7;color:#b9cadc}
    .meta{color:#72e6a6;font-size:12px}.pair,.evidence-grid,.interpretation{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .evidence{padding:14px;border:1px solid #29415f;border-radius:12px;background:#07101f}.evidence>div{display:flex;justify-content:space-between;gap:12px}.evidence.violated{border-color:#a94456}.evidence.unresolved{border-color:#8d6b35}.evidence small{color:#738aa3}
    table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #29415f;text-align:left;color:#b9cadc}
    .interpretation article{padding:14px;border:1px solid #29415f;border-radius:12px;background:#07101f}.interpretation footer{display:flex;flex-wrap:wrap;gap:8px}.interpretation a{color:#72e6a6;text-decoration:none;border:1px solid #397462;border-radius:999px;padding:3px 8px;font-size:12px}.interpretation small{color:#738aa3}
    .trend-chart{width:100%;height:112px;margin-top:12px;overflow:visible}.trend-axis{stroke:#29415f}.trend-series-line{fill:none;stroke:#72e6a6;stroke-width:2.5}.trend-chart circle{fill:#72e6a6}.trend-threshold-line{stroke:#ffb45b;stroke-width:1.5;stroke-dasharray:5 4}.trend-threshold-label,.trend-time-label{fill:#738aa3;font-size:9px}
    .pair section{margin:0}.foot{font-size:12px;color:#738aa3;text-align:center;border:0;background:transparent}
    @media(max-width:560px){body{padding:16px 12px}.pair,.evidence-grid,.interpretation{grid-template-columns:1fr}h1{font-size:24px}table{font-size:12px}}
  </style>
</head>
<body>
  <header><div class="meta">${escapeHtml(metadata.line)}</div><h1>${escapeHtml(report.actionLabel)}</h1><p>${escapeHtml(report.title)}</p></header>
  <section><h2>${name}</h2><p>${escapeHtml(report.summary)}</p></section>
  <section><h2>证据仪表盘</h2><div class="evidence-grid">${evidence}</div></section>
  <section><h2>检查结果</h2><table><thead><tr><th>状态</th><th>检查</th><th>对象</th><th>实际 / 门禁</th></tr></thead><tbody>${checks}</tbody></table></section>
  <section><h2>AI 解读</h2><div class="interpretation">${interpretation}</div></section>
  <div class="pair"><section><h2>结论边界</h2><p>${escapeHtml(report.scopeStatement)}</p></section><section><h2>残余风险</h2><ul>${risks}</ul></section></div>
  <section class="foot">本报告由 NOVA 巡检 Copilot 离线演示生成 · 数据为 mock</section>
</body>
</html>`;
}

const CONTEXT_GROUPS = [
  ['change', '近期变更'],
  ['service', '关联服务与依赖'],
  ['signal', '可用信号'],
];

function renderExamples() {
  return inspectionExamples
    .map(
      (example) => `
        <button class="example-fill" data-example-id="${example.id}" type="button">
          <span>填入示例</span>
          <strong>${escapeHtml(example.label)}</strong>
          <small>${escapeHtml(example.prompt)}</small>
        </button>`,
    )
    .join('');
}

function formatRunTime(value) {
  return value ? new Date(value).toLocaleString('zh-CN', { hour12: false }) : '—';
}

function runTone(run) {
  return ['Pause', 'Rollback'].includes(run?.report?.action) ? 'pause' : run ? 'proceed' : 'empty';
}

function renderMiniRunHistory(runs, diagnostics) {
  if (diagnostics?.status === 'degraded') return '<p class="run-history-unavailable">历史暂不可用</p>';
  if (!runs.length) return '<p class="run-history-empty">还没有执行记录</p>';
  const recent = runs.slice(0, 10).reverse();
  return `<div class="run-history-mini" aria-label="最近 ${recent.length} 次执行">${recent
    .map((run) => {
      const action = run.report?.actionLabel ?? run.report?.action ?? '未知结论';
      return `<span class="run-history-dot is-${runTone(run)}" title="${escapeHtml(formatRunTime(run.completedAt))} · ${escapeHtml(action)}"></span>`;
    })
    .join('')}<small>最近 ${recent.length} 次</small></div>`;
}

function renderSavedCard(card, diagnostics) {
  const { definition, runs, latestRun: run } = card;
  const action = run?.report?.actionLabel ?? run?.report?.action ?? '尚未执行';
  const completedAt = formatRunTime(run?.completedAt);
  return `<article class="saved-inspection-card" data-testid="saved-inspection-card">
    <button class="saved-inspection-copy" data-action="SAVED_INSPECTION_HISTORY_OPENED" data-definition-id="${escapeHtml(definition.id)}" type="button">
      <span class="readiness">本地 mock</span>
      <h3>${escapeHtml(definition.name)}</h3>
      <p>上次：${escapeHtml(action)} · ${escapeHtml(completedAt)}</p>
      ${renderMiniRunHistory(runs, diagnostics)}
    </button>
    <button class="saved-run-button" data-action="SAVED_INSPECTION_RUN_REQUESTED" data-definition-id="${escapeHtml(definition.id)}" type="button">直跑 <b>▶</b></button>
  </article>`;
}

function renderSavedInspectionHome(vm) {
  const { cards, historyDiagnostics, storageError } = vm.savedInspection;
  return `<section class="saved-inspection-home" data-testid="saved-inspection-home" aria-labelledby="saved-title">
    <header class="saved-inspection-heading">
      <div><h2 id="saved-title" data-stage-title>已保存巡检</h2><p>个人任务保存在当前浏览器</p></div>
      <span class="readiness">本地 mock</span>
    </header>
    ${storageError ? `<p class="storage-warning" role="status">${escapeHtml(storageError)}</p>` : ''}
    ${
      cards.length
        ? `<div class="saved-inspection-list">${cards.map((card) => renderSavedCard(card, historyDiagnostics)).join('')}</div>`
        : '<p class="saved-inspection-empty">还没有保存的巡检，从上方变更单开始。</p>'
    }
  </section>`;
}

function renderReleaseIntake(vm) {
  const prefill = vm.savedInspection.composerPrefill ?? {};
  return `<section class="release-intake" data-testid="release-intake" aria-labelledby="release-intake-title">
    <header class="stage-heading release-intake-heading">
      <div><span class="source-kind">发布验证</span><h2 id="release-intake-title" data-stage-title>从变更开始生成巡检计划</h2><p>平台会读取变更事实、Trace 拓扑与已批准规则；你只需确认最终计划。</p></div>
    </header>
    <form class="release-form" data-intent-form>
      <label class="release-reference-field"><span>变更单 / 发布单号</span><input name="context-reference" required value="${escapeHtml(prefill.contextReference ?? '')}" placeholder="例如 CHG-84501" autocomplete="off" /></label>
      <details class="release-risk-details" ${prefill.prompt ? 'open' : ''}>
        <summary>补充说明（可选）</summary>
        <label><span>本次关注什么（可选）</span><textarea name="inspection-intent" rows="2" placeholder="例如：关注扣款成功和 Redis 客户端">${escapeHtml(prefill.prompt ?? '')}</textarea></label>
        <input name="target-service" type="hidden" value="${escapeHtml(prefill.targetService ?? '')}" />
      </details>
      <button class="compile-button release-submit" type="submit"><span>生成巡检计划</span><b>→</b></button>
    </form>
    <details class="conversation-examples release-examples"><summary>填入演示变更</summary><div class="example-grid">${renderExamples()}</div></details>
  </section>`;
}

function renderHistoryEntry(run, taskName) {
  const action = run.report?.actionLabel ?? run.report?.action ?? '未知结论';
  return `<details class="saved-history-entry" data-run-id="${escapeHtml(run.id)}">
    <summary><span class="run-history-dot is-${runTone(run)}"></span><time>${escapeHtml(formatRunTime(run.completedAt))}</time><strong>${escapeHtml(action)}</strong><small>${escapeHtml(run.report?.summary ?? '')}</small></summary>
    ${renderHistoricalReportSnapshot(run, taskName)}
  </details>`;
}

function renderSavedInspectionHistory(vm) {
  const { historyDefinition: definition, historyRuns: runs, historyDiagnostics } = vm.savedInspection;
  const recent = runs.slice(0, 20);
  const earlier = runs.slice(20);
  return `<section class="saved-inspection-history" data-testid="saved-inspection-history" aria-labelledby="history-title">
    <header class="saved-history-heading">
      <div><button class="history-back" data-action="SAVED_INSPECTION_HISTORY_CLOSED" type="button">← 返回</button><h2 id="history-title" data-stage-title>${escapeHtml(definition.name)}</h2><p>创建于 ${escapeHtml(formatRunTime(definition.createdAt))} · 共执行 ${runs.length} 次</p></div>
      <button class="saved-run-button" data-action="SAVED_INSPECTION_RUN_REQUESTED" data-definition-id="${escapeHtml(definition.id)}" type="button">直跑 <b>▶</b></button>
    </header>
    <h3 class="saved-history-title">运行历史</h3>
    ${historyDiagnostics?.status === 'degraded' ? '<p class="storage-warning" role="status">历史暂不可用：已隔离损坏记录，仍可直跑</p>' : ''}
    ${recent.length ? `<div class="saved-history-list">${recent.map((run) => renderHistoryEntry(run, definition.name)).join('')}</div>` : '<p class="saved-inspection-empty">还没有执行记录</p>'}
    ${earlier.length ? `<details class="saved-history-earlier"><summary>显示更早（${earlier.length}）</summary>${earlier.map((run) => renderHistoryEntry(run, definition.name)).join('')}</details>` : ''}
  </section>`;
}

function renderContextGroup(options, kind, title) {
  const items = options.filter((item) => item.kind === kind);
  if (!items.length) return '';
  return `<section class="context-option-group" aria-labelledby="context-${kind}">
    <header><h3 id="context-${kind}">${title}</h3><span>${items.filter((item) => item.selected).length}/${items.length}</span></header>
    <div class="context-option-list">
      ${items
        .map(
          (
            item,
          ) => `<button class="context-option ${item.selected ? 'is-selected' : ''}" data-action="CONTEXT_ITEM_TOGGLED" data-context-id="${escapeHtml(item.id)}" aria-pressed="${item.selected}" type="button">
            <span class="context-check">${item.selected ? '✓' : '+'}</span>
            <span><strong>${escapeHtml(item.label)}</strong><small>${escapeHtml(item.detail)}</small></span>
          </button>`,
        )
        .join('')}
    </div>
  </section>`;
}

function renderContextSelection(vm) {
  return `<section class="context-selection" data-testid="context-selection" aria-labelledby="context-selection-title">
    <header class="stage-heading">
      <div><h2 id="context-selection-title" data-stage-title>确认巡检信息</h2><p>勾选本次要验证的范围</p></div>
      <button class="edit-intent" data-action="RESET" type="button">重新描述</button>
    </header>
    <div class="context-option-groups">
      ${CONTEXT_GROUPS.map(([kind, title]) => renderContextGroup(vm.savedInspection.contextOptions, kind, title)).join('')}
    </div>
    <button class="compile-button context-confirm" data-action="INPUT_CONFIRMED" type="button"><span>生成任务草案</span><b>→</b></button>
  </section>`;
}

function renderConversationComposer(vm) {
  const conversation = vm.savedInspection.conversation;
  return `<div class="conversation-shell">
    <div class="conversation-log" aria-live="polite">
      ${
        conversation.length
          ? conversation
              .map((message) => `<p class="conversation-message ${message.role}">${escapeHtml(message.text)}</p>`)
              .join('')
          : '<p class="conversation-empty">提交变更后，我会解释计划来源、覆盖缺口与报告结论。</p>'
      }
    </div>
    <p class="conversation-guidance">Agent 只解释候选和证据；门禁计算由确定性规则完成。</p>
  </div>`;
}

function renderIntake(vm) {
  if (vm.savedInspection.historyDefinition) return renderSavedInspectionHistory(vm);
  if (vm.workspace) return renderContextSelection(vm);
  return `<div class="release-home">${renderReleaseIntake(vm)}${renderSavedInspectionHome(vm)}</div>`;
}

function renderMetricList(metricRules = []) {
  return `<ul class="metric-name-list">${metricRules
    .map(
      (rule) =>
        `<li><strong>${escapeHtml(rule.label)}</strong><code>${escapeHtml(rule.metricId)}</code><span>${escapeHtml(rule.category)}</span></li>`,
    )
    .join('')}</ul>`;
}

function renderRuleEditor(check, rule) {
  if (!rule.editable) {
    return `<article class="metric-rule-row is-readonly"><div><strong>${escapeHtml(rule.label)}</strong><code>${escapeHtml(rule.metricId)}</code></div><span>${escapeHtml(formatMetricRule(rule))}</span><small>固定规则</small></article>`;
  }
  const operators = rule.allowedOperators
    .map(
      (operator) =>
        `<option value="${escapeHtml(operator)}" ${operator === rule.operator ? 'selected' : ''}>${escapeHtml(operator)}</option>`,
    )
    .join('');
  return `<form class="metric-rule-row rule-editor" data-rule-editor data-rule-check-id="${escapeHtml(check.id)}" data-rule-id="${escapeHtml(rule.id)}">
    <div><strong>${escapeHtml(rule.label)}</strong><code>${escapeHtml(rule.metricId)}</code><small>${escapeHtml(rule.category)}</small></div>
    <label><span>比较</span><select name="rule-operator" aria-label="${escapeHtml(rule.label)}比较符">${operators}</select></label>
    <label><span>门禁值</span><input name="rule-threshold" type="number" step="any" value="${escapeHtml(rule.threshold)}" aria-label="${escapeHtml(rule.label)}门禁值"><b>${escapeHtml(rule.unit)}</b></label>
    <button type="submit">应用</button>
  </form>`;
}

function renderCandidate(candidate, disposition) {
  const accepted = disposition?.status === 'accepted';
  const rejected = disposition?.status === 'rejected';
  const optional = candidate.criticality !== 'high' && !accepted && !rejected;
  const status = accepted ? '✓ 已加入' : rejected ? '— 本次不查' : optional ? '可选观察' : '可加入';
  return `
    <article class="candidate-card ${accepted ? 'is-accepted' : ''} ${rejected ? 'is-rejected' : ''} ${optional ? 'is-optional' : ''}">
      <header><span>AI 建议</span><strong class="candidate-result">${status}</strong></header>
      <h4>${escapeHtml(candidate.purpose)}</h4>
      <p><span>为什么建议查</span>${escapeHtml(candidate.rationale)}</p>
      <details class="candidate-details">
        <summary>查看细节</summary>
        <dl>
          <div><dt>黄金指标</dt><dd>${renderMetricList(candidate.metricRules)}</dd></div>
          <div><dt>目标实体</dt><dd>${escapeHtml(candidate.entity)}</dd></div>
        </dl>
      </details>
      <div class="candidate-actions">
        <button class="${accepted ? 'is-selected' : ''}" data-action="CANDIDATE_INCLUDED" data-candidate-id="${candidate.id}" aria-pressed="${accepted}" type="button">加入观察</button>
        <button class="button-ghost ${rejected ? 'is-selected' : ''}" data-action="CANDIDATE_EXCLUDED" data-candidate-id="${candidate.id}" aria-pressed="${rejected}" type="button">本次不查</button>
      </div>
      ${rejected ? `<small class="candidate-reason">已记录原因：${escapeHtml(disposition.reason)}</small>` : ''}
    </article>`;
}

function renderReleaseContextStrip(workspace) {
  const request = workspace.request ?? {};
  const primarySource = workspace.contextSources[0];
  return `<section class="release-context-strip" data-testid="release-context-strip" aria-label="本次变更事实">
    <div><span>变更</span><strong>${escapeHtml(request.contextReference || workspace.declaredChange.id)}</strong><small>${escapeHtml(workspace.declaredChange.summary)}</small></div>
    <div><span>阻断范围</span><strong>${workspace.blockingScope.map(escapeHtml).join(' · ')}</strong><small>仅声明目标默认进入门禁</small></div>
    <div><span>对账</span><strong>${escapeHtml(workspace.reconciliation.status)}</strong><small>${escapeHtml(primarySource?.freshness ?? '新鲜度未知')} · ${escapeHtml(primarySource?.kind ?? '来源未知')}</small></div>
    <button class="edit-intent" data-action="RESET" type="button">重新填写</button>
  </section>`;
}

function renderCoverageGap(gap, candidate, disposition) {
  const included = disposition?.status === 'accepted';
  const eligible = Boolean(candidate);
  return `<article class="coverage-gap-card ${eligible ? 'is-eligible' : 'is-unbound'} ${included ? 'is-included' : ''}" data-gap-entity="${escapeHtml(gap.entity)}">
    <div class="coverage-gap-copy"><span>${included ? '已加入锁定计划' : '本次尚未覆盖'}</span><h4>${escapeHtml(gap.entity)}</h4><p>${escapeHtml(gap.reason)}</p></div>
    <div class="coverage-gap-authority"><strong>${eligible ? '已有高权威规则' : '无可信规则'}</strong><small>${eligible ? escapeHtml(candidate.capability) : '本次不覆盖，将写入报告残余风险'}</small></div>
    ${
      eligible
        ? included
          ? `<button class="gap-action button-ghost" data-action="CANDIDATE_EXCLUDED" data-candidate-id="${escapeHtml(candidate.id)}" type="button">移出本次检查</button>`
          : `<button class="gap-action" data-action="CANDIDATE_INCLUDED" data-candidate-id="${escapeHtml(candidate.id)}" type="button">加入本次检查</button>`
        : ''
    }
  </article>`;
}

function renderCoverageGaps(workspace, disposition) {
  if (!workspace.coverageGaps?.length) return '';
  const candidates = new Map(workspace.candidateChecks.map((candidate) => [candidate.id, candidate]));
  return `<section class="coverage-gap-section" data-testid="coverage-gaps" aria-labelledby="coverage-gap-title">
    <header><div><span>影响面缺口</span><h3 id="coverage-gap-title">发现声明外影响（${workspace.coverageGaps.length} 项）</h3></div><small>不会静默进入阻断计划</small></header>
    <div class="coverage-gap-stack">${workspace.coverageGaps
      .map((gap) =>
        renderCoverageGap(gap, candidates.get(gap.eligibleCandidateId), disposition[gap.eligibleCandidateId]),
      )
      .join('')}</div>
  </section>`;
}

function renderSourceRefs(check, contextSources) {
  const sourceById = new Map(contextSources.map((source) => [source.id, source]));
  return check.sourceRefs
    .map((sourceId) => {
      const source = sourceById.get(sourceId);
      return `<li><span>${escapeHtml(source?.kind ?? '未知来源')}</span><strong>${escapeHtml(source?.label ?? sourceId)}</strong></li>`;
    })
    .join('');
}

function renderCheck(check, isCandidate, contextSources) {
  const summary = `${check.purpose} · ${check.entity}`;
  return `
    <details class="check-card ${isCandidate ? 'is-candidate-check' : ''}">
      <summary>
        <span class="check-summary-line" title="${escapeHtml(summary)}"><strong>${escapeHtml(check.purpose)}</strong><span> · ${escapeHtml(check.entity)}</span></span>
        <span class="check-toggle">查看细节⌄</span>
      </summary>
      <div class="check-body">
        <div class="check-rationale"><span>检查依据</span><p>${escapeHtml(check.rationale)}</p></div>
        <dl>
          <div><dt>目标实体</dt><dd>${escapeHtml(check.entity)}</dd></div>
          <div><dt>业务黄金指标</dt><dd>${renderMetricList(check.metricRules)}</dd></div>
          <div><dt>执行能力</dt><dd>${escapeHtml(check.capability)} <small>由已注册能力提供，不可在草案中修改</small></dd></div>
          <div class="check-rule-editor"><dt>判定规则</dt><dd><p class="rule-summary">${escapeHtml(formatCheckRules(check))}</p>${check.metricRules
            .map((rule) => renderRuleEditor(check, rule))
            .join('')}</dd></div>
          <div><dt>时间与基线</dt><dd>${escapeHtml(check.window)} · ${escapeHtml(check.baseline)}</dd></div>
          <div><dt>失败动作</dt><dd>${escapeHtml(check.failureAction)}</dd></div>
          <div class="check-sources"><dt>事实来源</dt><dd><ul>${renderSourceRefs(check, contextSources)}</ul></dd></div>
        </dl>
      </div>
    </details>`;
}

function renderPlanSummary(committedCount, planSummary) {
  return `<p class="plan-summary" data-testid="plan-summary"><strong>${planSummary.blocking} 项阻断</strong><span>+</span><strong>${planSummary.observing} 项观察</strong><small>${planSummary.uncovered ? ` · ${planSummary.uncovered} 项影响未覆盖` : ' · 当前影响已覆盖'}</small></p>`;
}

function renderPlanAction(readiness, committedCount) {
  const ready = readiness.status === 'ready';
  const label = ready
    ? '确认并开始巡检'
    : readiness.unresolvedCandidateIds.length
      ? '请先处理上方的建议项'
      : readiness.reconciliationBlocked
        ? '请先完成范围对账'
        : '暂时无法开始巡检';
  return `<button class="primary-action plan-primary-action" data-action="PLAN_CONFIRMED" ${ready ? '' : 'disabled'} type="button"><span>${label}</span><b>→</b></button>`;
}

function renderReadinessLabel(readiness) {
  if (readiness.status === 'ready') return '可以开始';
  if (readiness.unresolvedCandidateIds.length) return '有建议待确认';
  if (readiness.reconciliationBlocked) return '范围待确认';
  return '暂不可开始';
}

function sortChecks(checks) {
  const rank = { required: 0, recommended: 1 };
  return checks
    .map((check, index) => ({ check, index }))
    .sort(
      (left, right) => (rank[left.check.priority] ?? 2) - (rank[right.check.priority] ?? 2) || left.index - right.index,
    )
    .map(({ check }) => check);
}

function renderInspectionPlan(vm) {
  const disposition = vm.state.candidateDisposition;
  const gapCandidateIds = new Set(vm.workspace.coverageGaps.map((gap) => gap.eligibleCandidateId).filter(Boolean));
  const candidates = vm.workspace.candidateChecks
    .filter((candidate) => !gapCandidateIds.has(candidate.id))
    .map((candidate) => renderCandidate(candidate, disposition[candidate.id]))
    .join('');
  const acceptedIds = new Set(
    Object.entries(disposition)
      .filter(([, item]) => item.status === 'accepted')
      .map(([id]) => id),
  );
  const candidateSectionTitle = '可选观察';
  const candidateSectionClass = ' is-optional';
  const candidateSection = candidates
    ? `<section class="plan-section plan-confirmation${candidateSectionClass}" aria-labelledby="pending-title">
        <h3 id="pending-title">${candidateSectionTitle}</h3>
        <div class="candidate-stack">${candidates}</div>
      </section>`
    : '';
  return `
    <div class="plan-stage" data-testid="inspection-plan">
      ${renderReleaseContextStrip(vm.workspace)}
      <header class="stage-heading">
        <div><span class="source-kind">CandidateSet · ${escapeHtml(vm.workspace.candidateSetId)}</span><h2 data-stage-title>候选巡检计划</h2></div>
        <span class="readiness ${vm.readiness.status}">${renderReadinessLabel(vm.readiness)}</span>
      </header>
      ${renderPlanSummary(vm.committedChecks.length, vm.planSummary)}
      <p class="parallel-execution-note">确认后将一次锁定规则与范围；所有已选检查并行执行并生成不可变报告。</p>
      ${renderCoverageGaps(vm.workspace, disposition)}
      ${candidateSection}
      <section class="plan-section" aria-labelledby="formal-title">
        <h3 id="formal-title">将执行的检查</h3>
        <div class="check-stack">
          ${sortChecks(vm.committedChecks)
            .map((check) => renderCheck(check, acceptedIds.has(check.id), vm.workspace.contextSources))
            .join('')}
        </div>
      </section>
      ${renderPlanAction(vm.readiness, vm.committedChecks.length)}
    </div>`;
}

const STATUS_COPY = {
  exact: {
    stateLabel: '精准匹配',
    action: 'PLAYBOOK_EXECUTION_STARTED',
    actionLabel: '按方案直跑',
  },
  'minor-drift': {
    stateLabel: '需确认差异',
    action: 'PLAYBOOK_DIFF_CONFIRMED',
    actionLabel: '确认差异并继续',
  },
  'major-drift': {
    stateLabel: '禁止直跑',
    action: 'PLAYBOOK_REGENERATED',
    actionLabel: '重新生成（参考旧方案）',
  },
};

function renderMatchTitle(match) {
  if (match.status === 'exact') {
    return `命中方案：${escapeHtml(match.title)} · v${match.playbookRef.version}`;
  }
  if (match.status === 'major-drift') {
    return `方案 v${match.playbookRef.version} 不适用：${match.differences.length} 项重大差异`;
  }
  return '确认方案差异';
}

const DIRECTION_LABELS = {
  added: '新增',
  changed: '变更',
  removed: '失效',
};

function renderValidation(validation) {
  return `<li class="${escapeHtml(validation.status)}"><span>${escapeHtml(validation.label)}</span><strong>${escapeHtml(validation.detail)}</strong></li>`;
}

function renderDifferences(match) {
  return `<ul class="playbook-difference-list">
    ${match.differences
      .map(
        (
          difference,
        ) => `<li data-difference-dimension="${escapeHtml(difference.dimension)}" class="${escapeHtml(difference.severity)}">
          <span>${escapeHtml(difference.label)} · ${escapeHtml(DIRECTION_LABELS[difference.direction])}</span>
          <strong>${escapeHtml(difference.summary)}</strong>
        </li>`,
      )
      .join('')}
  </ul>`;
}

function renderDriftReview(match, driftReviewed) {
  if (match.status !== 'major-drift') return '';
  return driftReviewed
    ? '<p class="playbook-reviewed">✓ 已确认看完全部当前差异</p>'
    : `<button class="playbook-review-drift" data-action="PLAYBOOK_DRIFT_REVIEWED" type="button">确认已查看 ${match.differences.length} 项差异</button>`;
}

function renderMatchDetails(match, driftReviewed) {
  if (match.status === 'exact') {
    return `<details class="playbook-validation">
      <summary>五项校验通过 <span>查看详情</span></summary>
      <ul>${match.validations.map(renderValidation).join('')}</ul>
    </details>`;
  }
  const content = `${renderDifferences(match)}${renderDriftReview(match, driftReviewed)}`;
  return `<div class="playbook-differences-desktop">${content}</div>
    <details class="playbook-drawer">
      <summary>查看 ${match.differences.length} 项当前差异</summary>
      <div class="playbook-drawer-body">${content}</div>
    </details>`;
}

function renderMatchActions(match, driftReviewed) {
  const copy = STATUS_COPY[match.status];
  const disabled = match.status === 'major-drift' && !driftReviewed;
  const secondary =
    match.status === 'major-drift'
      ? ''
      : '<button class="playbook-dismiss" data-action="PLAYBOOK_DISMISSED" type="button">不用方案，重新生成</button>';
  return `<div class="playbook-actions">
    <button class="compile-button playbook-primary" data-action="${copy.action}" ${disabled ? 'disabled' : ''} type="button">
      <span>${disabled ? '看完差异后可重新生成' : copy.actionLabel}</span><b>→</b>
    </button>
    ${secondary}
  </div>`;
}

function renderPlaybookMatch(playbookView) {
  const match = playbookView?.match;
  if (!match) return '';
  const copy = STATUS_COPY[match.status];
  return `<section class="playbook-match ${match.status}" data-testid="playbook-match" data-match-status="${match.status}" aria-labelledby="playbook-match-title">
    <header class="playbook-match-header">
      <div><span class="match-state">${copy.stateLabel}</span><h2 id="playbook-match-title">${renderMatchTitle(match)}</h2></div>
      <div class="playbook-signals"><span class="readiness">匹配 ${match.score}%</span><span class="readiness">${escapeHtml(match.lastUsedLabel)}</span><span class="readiness">${match.differences.length} 项差异</span></div>
    </header>
    ${
      match.status === 'exact'
        ? '<div class="playbook-structure-note"><span class="info-tip" tabindex="0" aria-label="复用检查结构，证据重新采集" title="复用检查结构，证据重新采集">ⓘ</span><span>检查结构</span></div>'
        : `<div class="playbook-identity"><span>巡检方案</span><strong>${escapeHtml(match.title)} · v${match.playbookRef.version}</strong></div>`
    }
    ${match.status === 'minor-drift' ? `<p class="playbook-summary single-line-note" title="${escapeHtml(match.summary)}">${escapeHtml(match.summary)}</p>` : ''}
    ${renderMatchDetails(match, playbookView.driftReviewed)}
    ${renderMatchActions(match, playbookView.driftReviewed)}
  </section>`;
}

function renderPlaybookReference(playbookView) {
  const reference = playbookView?.reference;
  if (!reference) return '';
  return `<section class="playbook-reference" data-testid="playbook-reference">
    <span>旧方案仅作参考</span>
    <strong>${escapeHtml(reference.playbookRef.id)} · v${reference.playbookRef.version}</strong>
    <p>${escapeHtml(reference.summary)}</p>
  </section>`;
}

function renderPlaybookProposal(playbookView) {
  const task = playbookView?.taskInstance;
  if (!task || task.status !== 'locked') return '';
  const proposal = playbookView.proposal;
  const source = task.sourcePlaybookRef;
  const targetVersion = source ? source.version + 1 : 1;
  return `<section class="playbook-proposal" data-testid="playbook-proposal">
    <div><h3>保存方案</h3></div>
    <p class="single-line-note" title="历史任务 ${escapeHtml(task.id)} 已锁定">历史实例不受影响</p>
    ${
      proposal
        ? `<div class="playbook-proposal-status"><span>${proposal.kind === 'update' ? '方案更新' : '新方案'} v${proposal.targetVersion} · 待审批</span><strong>审批通过后，下次匹配才会生效</strong></div>`
        : `<button class="playbook-proposal-action" data-action="PLAYBOOK_PROPOSAL_SUBMITTED" type="button">${
            source ? `提交方案更新 → v${targetVersion}` : `保存为新方案 v${targetVersion}`
          }</button>`
    }
  </section>`;
}

function differenceList(differences) {
  return `<ul class="saved-refresh-differences">${differences
    .map((difference) => `<li>${escapeHtml(difference.summary ?? difference.id)}</li>`)
    .join('')}</ul>`;
}

function renderSavedInspectionRefresh(savedInspection) {
  const refresh = savedInspection?.refresh;
  const definition = savedInspection?.activeDefinition;
  if (!refresh || !definition || refresh.status === 'exact') return '';
  if (refresh.status === 'minor-drift') {
    return `<section class="saved-refresh reconciliation is-expanded" data-testid="saved-refresh" data-refresh-status="minor-drift">
      <span>已刷新当前事实</span>
      <h2>当前事实有差异</h2>
      <p>${escapeHtml(definition.name)} 的检查结构仍可执行，请先确认差异。</p>
      ${differenceList(refresh.differences)}
      <button class="compile-button" data-action="SAVED_INSPECTION_RUN_CONFIRMED" type="button"><span>仍要执行</span><b>→</b></button>
    </section>`;
  }
  return `<section class="saved-refresh reconciliation is-blocked" data-testid="saved-refresh" data-refresh-status="major-drift">
    <span>已刷新当前事实</span>
    <h2>当前结构已变化，不能直跑</h2>
    <p>${escapeHtml(definition.name)} 仅作参考；重新描述后会生成新任务。</p>
    ${differenceList(refresh.differences)}
    <button class="compile-button" data-action="SAVED_INSPECTION_REGENERATED" type="button"><span>回到对话重新生成</span><b>→</b></button>
  </section>`;
}

function renderSelectedContextResults(run) {
  if (!run?.selectedContextResults?.length) return '';
  return `<section class="report-context-results" data-testid="selected-context-results">
    <h3>本次选择的巡检结果</h3>
    <div class="report-context-grid">${run.selectedContextResults
      .map(
        (item) =>
          `<article><span>${escapeHtml(item.kind)}</span><strong>${escapeHtml(item.label)}</strong><small>✓ ${escapeHtml(item.status)}</small></article>`,
      )
      .join('')}</div>
  </section>`;
}

function suggestedName(vm) {
  const entity = vm.workspace?.declaredChange?.entities?.[0] ?? '服务';
  return `${entity} 巡检`;
}

function renderPersonalSave(vm) {
  const saved = vm.savedInspection;
  if (saved.activeDefinition) return '';
  if (saved.savedDefinitionId) {
    return `<p class="save-toast" role="status">${escapeHtml(saved.toast ?? '已保存，下次可从首页直接执行')}</p>`;
  }
  return `<section class="personal-save" aria-labelledby="personal-save-title">
    <div><h3 id="personal-save-title">保存这次巡检</h3><p>保存后下次可从首页直接执行</p></div>
    <form data-save-inspection-form>
      <input name="saved-inspection-name" required value="${escapeHtml(suggestedName(vm))}" aria-label="巡检名称" />
      <button type="submit">保存</button>
    </form>
  </section>`;
}

function renderReportJourneyDetails(vm) {
  const run = vm.savedInspection.currentRun;
  return `${renderSelectedContextResults(run)}
    ${renderPersonalSave(vm)}`;
}

function renderReportMetadata(run, taskName) {
  return `<p class="report-metadata" data-testid="report-metadata">${escapeHtml(formatReportMetadata(run, taskName).line)}</p>`;
}

function renderDecisionHero(report, extra = '') {
  const coverage = projectCoverageSummary(report);
  return `<div class="decision-hero">
    <div><h2>${escapeHtml(report.actionLabel)}</h2><p>${escapeHtml(report.title)}</p></div>
    <div class="decision-tools"><span class="coverage-badge ${coverage.uncovered ? 'has-gap' : ''}">覆盖：${coverage.checked} 项已验证 · ${coverage.uncovered} 项未覆盖</span>${extra}</div>
  </div>`;
}

function renderEvidenceSummary(report) {
  return `<div class="semantic-pair">
      <div><span>证据结论</span><code>${escapeHtml(report.evidenceVerdict)}</code></div>
      <div><span>行动决策</span><code>${escapeHtml(report.action)}</code></div>
    </div>
    <div class="evidence-badges">
      <span class="verified">✓ ${report.evidenceCounts.verified} 已验证</span>
      <span class="violated">! ${report.evidenceCounts.violated} 违例</span>
      <span class="unresolved">? ${report.evidenceCounts.unresolved} 未决</span>
    </div>
    <p class="report-summary">${escapeHtml(report.summary)}</p>`;
}

function renderEvidenceCard(item) {
  const status = REPORT_STATUS_COPY[item.status] ?? REPORT_STATUS_COPY.NotEvaluated;
  const measurement =
    item.kind === 'numeric'
      ? `<div class="evidence-measurement"><strong>${escapeHtml(item.displayValue)}</strong><span>门禁 ${escapeHtml(item.gateDisplayValue)}</span></div>
        <div class="evidence-track" role="progressbar" aria-label="${escapeHtml(item.label)}相对门禁" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${item.ratioPercent}"><i style="--evidence-progress:${item.ratioPercent}%"></i></div>`
      : `<div class="evidence-qualitative"><strong>${escapeHtml(item.displayValue)}</strong><span>门禁 ${escapeHtml(item.gateDisplayValue)}</span></div>`;
  return `<article tabindex="-1" class="evidence-card is-${status.tone}" data-evidence-id="${escapeHtml(item.id)}" data-check-id="${escapeHtml(item.checkId ?? '')}">
    <header><div><strong>${escapeHtml(item.label)}</strong><small>${escapeHtml(item.entity)}</small></div><span>${status.symbol} ${status.label}</span></header>
    ${measurement}
    ${renderTrendChart(item)}
  </article>`;
}

function renderEvidenceDashboard(report) {
  return `<section class="report-section evidence-dashboard" data-testid="evidence-dashboard" aria-labelledby="evidence-title">
    <header class="report-section-heading"><div><h3 id="evidence-title">证据仪表盘</h3><p>违例与未决优先显示</p></div></header>
    <div class="evidence-grid">${projectReportEvidence(report).map(renderEvidenceCard).join('')}</div>
  </section>`;
}

function renderCheckResult(item) {
  const { check } = item;
  const status = REPORT_STATUS_COPY[item.status] ?? REPORT_STATUS_COPY.NotEvaluated;
  return `<details class="report-check-result is-${status.tone}" data-testid="report-check-result">
    <summary>
      <span class="report-check-status">${status.symbol} ${status.label}</span>
      <span class="report-check-name"><strong>${escapeHtml(check.purpose)}</strong><small>${escapeHtml(check.entity)}</small></span>
      <span class="report-check-value"><small>实际值</small><strong>${escapeHtml(item.actualDisplay)}</strong></span>
      <span class="report-check-gate"><small>门禁</small><strong>${escapeHtml(item.gateDisplay)}</strong></span>
      <span class="report-check-toggle">查看细节⌄</span>
    </summary>
    <div class="report-check-body">
      <p>${escapeHtml(item.summary)}</p>
      <dl>
        <div><dt>目标实体</dt><dd>${escapeHtml(check.entity)}</dd></div>
        <div><dt>业务黄金指标</dt><dd>${check.metricRules.map((rule) => `<code>${escapeHtml(rule.label)} · ${escapeHtml(rule.metricId)}</code>`).join(' ')}</dd></div>
        <div><dt>执行能力</dt><dd>${escapeHtml(check.capability)}</dd></div>
        <div><dt>判定规则</dt><dd>${escapeHtml(formatCheckRules(check))}</dd></div>
        <div><dt>时间与基线</dt><dd>${escapeHtml(check.window)} · ${escapeHtml(check.baseline)}</dd></div>
        <div><dt>失败动作</dt><dd>${escapeHtml(check.failureAction)}</dd></div>
        <div><dt>事实来源</dt><dd>${check.sourceRefs.map((source) => `<code>${escapeHtml(source)}</code>`).join(' ')}</dd></div>
      </dl>
    </div>

}

function renderReportChecks(run, report) {
  return `<section class="report-section report-checks" data-testid="report-checks" aria-labelledby="report-checks-title">
    <header class="report-section-heading"><div><h3 id="report-checks-title">检查结果</h3><p>共 ${run?.inspectionPlan?.checks?.length ?? 0} 项已执行检查</p></div>
      <div class="evidence-badges"><span class="verified">✓ ${report.evidenceCounts.verified}</span><span class="violated">! ${report.evidenceCounts.violated}</span><span class="unresolved">? ${report.evidenceCounts.unresolved}</span></div>
    </header>
    <div class="report-check-list">${projectReportChecks(run).map(renderCheckResult).join('')}</div>
  </section>`;
}

function renderInterpretation(report) {
  const evidenceOrder = new Map(projectReportEvidence(report).map((item, index) => [item.id, index + 1]));
  return `<section class="report-section ai-interpretation" data-testid="ai-interpretation" aria-labelledby="interpretation-title">
    <header class="report-section-heading"><div><h3 id="interpretation-title">AI 解读</h3><p>只解释已锁定证据</p></div></header>
    <div class="interpretation-list">${projectInterpretation(report)
      .map(
        (section) =>
          `<article><span>${escapeHtml(section.label)}</span><p>${escapeHtml(section.text)}</p><footer>${
            section.evidenceIds.length
              ? section.evidenceIds
                  .map(
                    (id) =>
                      `<button type="button" data-evidence-target="${escapeHtml(id)}">证据 ${evidenceOrder.get(id) ?? '·'}</button>`,
                  )
                  .join('')
              : '<small>证据不足</small>'
          }</footer></article>`,
      )
      .join('')}</div>
  </section>`;
}

function renderBoundary(report) {
  return `<section class="report-section report-boundary"><div><h3>结论边界</h3><p>${escapeHtml(report.scopeStatement)}</p></div><div><h3>未覆盖 / 残余风险</h3><ul>${report.residualRisks.map((item) => `<li>${escapeHtml(item)}</li>`).join('')}</ul></div></section>`;
}

function renderReportCore(run, taskName, report) {
  return `${renderReportMetadata(run, taskName)}
    ${renderEvidenceSummary(report)}
    ${renderEvidenceDashboard(report)}
    ${renderReportChecks(run, report)}
    ${renderInterpretation(report)}
    ${renderBoundary(report)}`;
}

function comparisonText(item) {
  if (item.kind === 'added') return `新增覆盖：${item.after.label}`;
  if (item.kind === 'removed') return `移除覆盖：${item.before.label}`;
  if (item.evidenceChanged) return `${item.label}：趋势证据或门禁已变化`;
  return `${item.label}：${item.before.fact} → ${item.after.fact}`;
}

function renderRunComparison(comparison) {
  if (!comparison) return '';
  const heading = `与上次相比（${formatReportTime(comparison.previousCompletedAt)} → 本次）`;
  if (comparison.summary === 'stable') {
    return `<section class="run-comparison is-stable" data-testid="run-comparison"><h3>${escapeHtml(heading)}</h3><p>→ 与上次结论一致</p></section>`;
  }
  const labels = {
    improved: ['✓', '改善'],
    worsened: ['✕', '恶化'],
    stable: ['→', '持平'],
    added: ['+', '新增'],
    removed: ['−', '移除'],
  };
  return `<section class="run-comparison" data-testid="run-comparison"><h3>${escapeHtml(heading)}</h3><ul>${comparison.items
    .map((item) => {
      const [symbol, label] = labels[item.kind];
      return `<li class="is-${item.kind}"><span>${symbol}</span><div><strong>${label}</strong><p>${escapeHtml(comparisonText(item))}</p></div></li>`;
    })
    .join('')}</ul></section>`;
}

function renderShareControls(message) {
  return `<div class="report-share" aria-label="分享当前报告"><button data-share-action="copy" type="button">复制摘要</button><button data-share-action="export" type="button">导出报告</button>${message ? `<p class="share-toast" role="status">${escapeHtml(message)}</p>` : ''}</div>`;
}

function renderHistoricalReportSnapshot(run, taskName = '巡检报告') {
  const report = run.report;
  return `<div class="historical-report report-stage ${report.action.toLowerCase()}" data-testid="historical-report">
    <p class="historical-banner">历史快照 · ${escapeHtml(formatReportTime(run.completedAt))} · 不可修改</p>
    ${renderDecisionHero(report)}
    ${renderReportCore(run, taskName, report)}
    ${renderSelectedContextResults(run)}
  </div>`;
}

function renderCurrentReport(vm) {
  const report = vm.report;
  const run = vm.savedInspection.currentRun;
  const taskName =
    vm.savedInspection.reportDefinition?.name ?? `${vm.workspace?.declaredChange?.entities?.[0] ?? '服务'} 巡检`;
  return `<div class="report-stage ${report.action.toLowerCase()}" data-testid="final-report" data-current-run-id="${escapeHtml(run?.id ?? '')}">
    ${renderDecisionHero(report, renderShareControls(vm.state.shareToast))}
    ${renderRunComparison(vm.savedInspection.comparison)}
