    ${renderReportJourneyDetails(vm)}
    ${renderPlaybookProposal(vm.playbook)}
    ${
      report.rcAgent
        ? `<button class="rc-button" data-action="RC_TOGGLED" type="button">${vm.state.rcExpanded ? '收起 RC Agent' : '启动 RC Agent'}</button>${
            vm.state.rcExpanded
              ? `<section class="rc-panel"><span>${escapeHtml(report.rcAgent.title)}</span><h3>${escapeHtml(report.rcAgent.rootCause)}</h3><div class="rc-chain">${report.rcAgent.chain.map((item) => `<code>${escapeHtml(item)}</code>`).join('<i>→</i>')}</div><p>${escapeHtml(report.rcAgent.recommendation)}</p></section>`
              : ''
          }`
        : ''
    }
  </div>`;
}

const INSPECTION_LIBRARY_STORAGE_KEY = 'nova.inspection-library.v1';

function createInspectionLibraryStorage(storage, key = INSPECTION_LIBRARY_STORAGE_KEY) {
  function loadWithDiagnostics() {
    if (!storage) {
      return {
        library: createEmptyInspectionLibrary(),
        diagnostics: { status: 'unavailable', rejectedRunCount: 0 },
      };
    }
    try {
      return parseInspectionLibraryWithDiagnostics(storage.getItem(key));
    } catch {
      return {
        library: createEmptyInspectionLibrary(),
        diagnostics: { status: 'unavailable', rejectedRunCount: 0 },
      };
    }
  }

  return {
    load() {
      return loadWithDiagnostics().library;
    },

    loadWithDiagnostics,

    save(library) {
      if (!storage) return { ok: false, reason: 'storage-unavailable' };
      try {
        storage.setItem(key, serializeInspectionLibrary(library));
        return { ok: true };
      } catch {
        return { ok: false, reason: 'storage-write-failed' };
      }
    },

    merge(current, serialized) {
      const incoming = parseInspectionLibraryWithDiagnostics(serialized);
      return {
        library: mergeInspectionLibraries(current, incoming.library),
        diagnostics: incoming.diagnostics,
      };
    },
  };
}

const PHASES = [
  ['intake', '变更发起', '01'],
  ['plan', '候选计划', '02'],
  ['report', '证据报告', '03'],
];

function phaseIndex(phase) {
  if (phase === 'context') return 1;
  return PHASES.findIndex(([id]) => id === phase);
}

function renderProgress(state) {
  const current = phaseIndex(state.phase);
  return PHASES.map(
    ([id, label, number], index) => `
      <li class="phase-step ${index < current ? 'is-done' : ''} ${id === state.phase ? 'is-current' : ''}">
        <span>${index < current ? '✓' : number}</span>
        <strong>${label}</strong>
      </li>`,
  ).join('');
}

function renderSource(source) {
  return `
    <li class="source-card">
      <span class="source-kind">${escapeHtml(source.kind)}</span>
      <strong>${escapeHtml(source.label)}</strong>
      <p class="single-line-note" title="${escapeHtml(source.detail)}">${escapeHtml(source.detail)}</p>
      <small>更新 · ${escapeHtml(source.freshness)}</small>
    </li>`;
}

const IMPACT_LABELS = {
  businessJourney: ['业务场景', '用户结果'],
  goldenMetrics: ['黄金指标', '业务门禁'],
  traceDependencies: ['Trace 直接依赖', '运行时事实'],
  middleware: ['中间件', '资源依赖'],
};

function renderImpactMatrix(impactDimensions) {
  return `
    <section class="impact-block" aria-labelledby="impact-title">
      <header><h3 id="impact-title">影响面</h3></header>
      <div class="impact-matrix" data-testid="impact-matrix">
        ${Object.entries(impactDimensions)
          .map(([dimension, values]) => {
            const [label, hint] = IMPACT_LABELS[dimension];
            return `<article><span>${label}</span><strong>${values.map(escapeHtml).join(' · ')}</strong><small>${hint}</small></article>`;
          })
          .join('')}
      </div>
    </section>`;
}

function renderContext(vm) {
  const { workspace, scope, state } = vm;
  if (!workspace) {
    return `
      <section class="panel context-panel context-empty" aria-labelledby="context-title">
        <header class="panel-heading">
          <div><h2 id="context-title">变更信息</h2></div>
          <span class="source-status">等待输入</span>
        </header>
        <div class="context-placeholder"><strong>等待巡检目标</strong></div>
      </section>`;
  }
  const visible = phaseIndex(state.phase) >= 1;
  return `
    <section class="panel context-panel" aria-labelledby="context-title">
      <header class="panel-heading">
        <div><h2 id="context-title">变更信息</h2></div>
        <span class="source-status ${visible ? 'is-ready' : ''}">${visible ? '已确认' : '待确认'}</span>
      </header>
      <div class="prompt-card">
        <span>${workspace.entryKind === 'combined-context' ? '用户意图 + 外部上下文' : '用户巡检意图'}</span>
        <p>“${escapeHtml(workspace.prompt)}”</p>
      </div>
      <dl class="change-facts">
        <div><dt>声明对象</dt><dd>${escapeHtml(workspace.declaredChange.summary)}</dd></div>
        <div><dt>声明指纹</dt><dd><code>${escapeHtml(workspace.declaredChange.fingerprint)}</code></dd></div>
        <div><dt>实际变化</dt><dd>${visible ? escapeHtml(workspace.observedChange.summary) : '等待运行时事实对账'}</dd></div>
        <div><dt>实际指纹</dt><dd><code>${visible ? escapeHtml(workspace.observedChange.fingerprint) : '—'}</code></dd></div>
      </dl>
      ${
        visible
          ? `<div class="reconciliation ${scope.status === 'Exact' ? 'is-exact' : 'is-expanded'}">
              <span>变化对账</span>
              <strong>${scope.status}</strong>
              <p>${scope.status === 'Exact' ? '声明与运行时事实一致。' : `发现 ${scope.addedEntities.length} 个声明外实体，未自动纳入阻断范围。`}</p>
            </div>
            <ul class="entity-cloud">${scope.entities.map((entity) => `<li>${escapeHtml(entity)}</li>`).join('')}</ul>`
          : ''
      }
    </section>`;
}

function renderScope(vm) {
  const savedRefresh = renderSavedInspectionRefresh(vm.savedInspection);
  if (savedRefresh) return savedRefresh;
  return `
    <div class="scope-stage">
      ${renderPlaybookMatch(vm.playbook)}
      <h2 data-stage-title>确认巡检范围</h2>
      ${renderImpactMatrix(vm.workspace.impactDimensions)}
      <ul class="source-list">${vm.workspace.contextSources.map(renderSource).join('')}</ul>
      <div class="hypothesis-block">
        <span>本次要证伪的风险假设</span>
        <ol>${vm.workspace.hypotheses.map((item) => `<li>${escapeHtml(item)}</li>`).join('')}</ol>
      </div>
    </div>`;
}

function renderStage(vm) {
  const renderers = {
    intake: renderIntake,
    context: renderScope,
    plan: renderInspectionPlan,
    report: renderCurrentReport,
  };
  return renderers[vm.state.phase](vm);
}

function primaryAction(vm) {
  if (!vm.workspace) return '';
  if (vm.state.phase === 'intake') return '';
  if (vm.state.phase === 'plan') return '';
  if (vm.state.phase === 'context' && (vm.playbook.match || vm.savedInspection.refresh)) return '';
  const actions = {
    context: ['SCOPE_ACCEPTED', '生成任务'],
    report: ['RESET', '新建巡检工作区'],
  };
  const [action, label] = actions[vm.state.phase];
  return `<button class="primary-action" data-action="${action}" type="button"><span>${escapeHtml(label)}</span><b>→</b></button>`;
}

function planStatus(readiness) {
  if (readiness.status === 'ready') return '可以开始';
  if (readiness.unresolvedCandidateIds.length) return '有建议待确认';
  if (readiness.reconciliationBlocked) return '范围待确认';
  return '暂不可开始';
}

function renderCopilot(vm) {
  const status = !vm.workspace
    ? '等待输入'
    : {
        intake: '待确认',
        context: vm.playbook.match ? '方案待选择' : '范围待确认',
        plan: planStatus(vm.readiness),
        report: '报告已生成',
      }[vm.state.phase];
  return `
    <aside class="panel copilot-panel" aria-label="巡检对话">
      <header><span class="copilot-mark">✦</span><div><strong>巡检对话</strong></div><span class="online" aria-label="离线演示已就绪" title="离线演示已就绪">●</span></header>
      <div class="copilot-status"><span>状态</span><strong>${escapeHtml(status)}</strong></div>
      ${renderPlaybookReference(vm.playbook)}
      ${renderConversationComposer(vm)}
      ${primaryAction(vm)}
    </aside>`;
}

function renderApp(vm) {
  const workspaceId = vm.workspace?.id ?? 'new';
  const showContextPanel = Boolean(vm.workspace) && ['context', 'report'].includes(vm.state.phase);
  return `
    <div class="app-shell" data-phase="${vm.state.phase}" data-workspace="${escapeHtml(workspaceId)}">
      <header class="app-header">
        <a class="brand" href="#main"><span>N</span><div><strong>NOVA</strong><small>巡检工作台</small></div></a>
        <div class="title-lockup"><h1>AI 巡检 Copilot</h1></div>
        <div class="offline-badge"><span>●</span> 离线演示</div>
      </header>
      ${vm.workspace ? `<ol class="phase-rail" aria-label="工作阶段">${renderProgress(vm.state)}</ol>` : ''}
      <main id="main" class="workspace ${vm.workspace ? '' : 'is-home'} ${showContextPanel ? '' : 'without-context'}">
        ${showContextPanel ? renderContext(vm) : ''}
        <section class="panel stage-panel" aria-live="polite">${renderStage(vm)}</section>
        ${renderCopilot(vm)}
      </main>
      <footer class="app-footer"><span>NOVA 巡检 Copilot · v0.4</span><strong><span class="info-tip" title="离线演示不连接生产数据源">ⓘ</span> 所有数据均为 mock，不会触发真实生产动作</strong></footer>
    </div>`;
}

const root = document.querySelector('#app');
const libraryStorage = createInspectionLibraryStorage(window.localStorage);
const actorId = window.crypto.randomUUID();
const hydratedLibrary = libraryStorage.loadWithDiagnostics();
let state = demoReducer(createDemoSession({ actorId }), {
  type: 'LIBRARY_HYDRATED',
  library: hydratedLibrary.library,
  diagnostics: hydratedLibrary.diagnostics,
});

function render() {
  root.innerHTML = renderApp(selectViewModel(state));
}

function dispatch(action) {
  const next = demoReducer(state, action);
  if (next !== state) {
    const libraryChanged = next.library !== state.library;
    state = next;
    if (libraryChanged) {
      const saved = libraryStorage.save(state.library);
      if (!saved.ok) {
        state = demoReducer(state, {
          type: 'LIBRARY_SAVE_FAILED',
          message: '无法写入本地保存；本页内仍可继续使用',
        });
      }
    }
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

async function copyOfflineText(text) {
  if (window.location.protocol !== 'file:' && window.navigator.clipboard?.writeText) {
    try {
      await window.navigator.clipboard.writeText(text);
      return;
    } catch {
      // Non-file origins can still deny clipboard permission; retain the local DOM fallback.
    }
  }
  const textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.setAttribute('readonly', '');
  textarea.style.position = 'fixed';
  textarea.style.opacity = '0';
  document.body.append(textarea);
  textarea.select();
  const copied = document.execCommand?.('copy');
  textarea.remove();
  if (!copied) throw new Error('copy-unavailable');
}

function downloadOfflineReport(html, filename) {
  const url = URL.createObjectURL(new Blob([html], { type: 'text/html;charset=utf-8' }));
  const anchor = document.createElement('a');
  anchor.href = url;
  anchor.download = filename;
  document.body.append(anchor);
  anchor.click();
  anchor.remove();
  window.setTimeout(() => URL.revokeObjectURL(url), 0);
}

async function shareCurrentReport(action) {
  const vm = selectViewModel(state);
  const run = vm.savedInspection.currentRun;
  if (!run) return;
  const taskName =
    vm.savedInspection.reportDefinition?.name ?? `${vm.workspace?.declaredChange?.entities?.[0] ?? '服务'} 巡检`;
  try {
    if (action === 'copy') {
      await copyOfflineText(buildReportShareText(run, taskName));
      dispatch({ type: 'SHARE_FEEDBACK_SET', message: '摘要已复制' });
      return;
    }
    downloadOfflineReport(buildStandaloneReportHtml(run, taskName), buildReportFilename(run, taskName));
    dispatch({ type: 'SHARE_FEEDBACK_SET', message: '离线报告已导出' });
  } catch {
    dispatch({ type: 'SHARE_FEEDBACK_SET', message: '分享失败，请重试' });
  }
}

window.addEventListener('storage', (event) => {
  if (event.key !== INSPECTION_LIBRARY_STORAGE_KEY || typeof event.newValue !== 'string') return;
  const merged = libraryStorage.merge(state.library, event.newValue);
  dispatch({ type: 'LIBRARY_MERGED', library: merged.library, diagnostics: merged.diagnostics });
});

root.addEventListener('click', (event) => {
  const exampleButton = event.target.closest('[data-example-id]');
  if (exampleButton) {
    const example = inspectionExamples.find((item) => item.id === exampleButton.dataset.exampleId);
    const form = root.querySelector('[data-intent-form]');
    if (!example || !form) return;
    form.elements.namedItem('inspection-intent').value = example.prompt;
    form.elements.namedItem('target-service').value = example.targetService;
    form.elements.namedItem('context-reference').value = example.contextReference;
    form.elements.namedItem('inspection-intent').focus();
    return;
  }

  const shareButton = event.target.closest('[data-share-action]');
  if (shareButton) {
    void shareCurrentReport(shareButton.dataset.shareAction);
    return;
  }

  const evidenceButton = event.target.closest('[data-evidence-target]');
  if (evidenceButton) {
    const target = [...root.querySelectorAll('[data-evidence-id]')].find(
      (item) => item.dataset.evidenceId === evidenceButton.dataset.evidenceTarget,
    );
    if (!target) return;
    for (const item of root.querySelectorAll('.evidence-card.is-highlighted')) item.classList.remove('is-highlighted');
    target.classList.add('is-highlighted');
    target.focus({ preventScroll: true });
    target.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }

  const actionButton = event.target.closest('[data-action]');
  if (!actionButton || actionButton.disabled) return;
  const { action } = actionButton.dataset;
  if (action === 'CANDIDATE_DISPOSED') {
    dispatch({
      type: action,
      candidateId: actionButton.dataset.candidateId,
      disposition: actionButton.dataset.disposition,
      reason: actionButton.dataset.reason,
    });
    return;
  }
  if (['CANDIDATE_INCLUDED', 'CANDIDATE_EXCLUDED'].includes(action)) {
    dispatch({ type: action, candidateId: actionButton.dataset.candidateId });
    return;
  }
  if (action === 'CONTEXT_ITEM_TOGGLED') {
    dispatch({ type: action, contextId: actionButton.dataset.contextId });
    return;
  }
  if (['SAVED_INSPECTION_RUN_REQUESTED', 'SAVED_INSPECTION_HISTORY_OPENED'].includes(action)) {
    dispatch({ type: action, definitionId: actionButton.dataset.definitionId });
    return;
  }
  dispatch({ type: action });
});

root.addEventListener('submit', (event) => {
  const ruleForm = event.target.closest('[data-rule-editor]');
  if (ruleForm) {
    event.preventDefault();
    const data = new FormData(ruleForm);
    dispatch({
      type: 'CHECK_RULE_UPDATED',
      checkId: ruleForm.dataset.ruleCheckId,
      ruleId: ruleForm.dataset.ruleId,
      operator: data.get('rule-operator'),
      threshold: data.get('rule-threshold'),
    });
    return;
  }
  const saveForm = event.target.closest('[data-save-inspection-form]');
  if (saveForm) {
    event.preventDefault();
    const data = new FormData(saveForm);
    dispatch({ type: 'SAVED_INSPECTION_CREATED', name: data.get('saved-inspection-name') });
    return;
  }
  const form = event.target.closest('[data-intent-form]');
  if (!form) return;
  event.preventDefault();
  const data = new FormData(form);
  dispatch({
    type: 'INTENT_SUBMITTED',
    request: {
      prompt: data.get('inspection-intent'),
      targetService: data.get('target-service'),
      contextReference: data.get('context-reference'),
    },
  });
});

render();
})();
    </script>
  </body>
</html>
