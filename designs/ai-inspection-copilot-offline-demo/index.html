<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="AI 巡检任务生成与解读 Copilot 离线产品 Demo"
    />
    <title>AI 巡检 Copilot · 离线产品 Demo</title>
      <style>
:root {
  color-scheme: dark;
  --bg: #07101f;
  --bg-soft: #0a1629;
  --surface: rgba(14, 29, 51, 0.88);
  --surface-strong: #10233d;
  --surface-hover: #142c4a;
  --line: rgba(144, 177, 219, 0.16);
  --line-strong: rgba(144, 177, 219, 0.28);
  --text: #edf6ff;
  --text-soft: #9fb3ca;
  --text-faint: #6f87a3;
  --cyan: #5ae7d2;
  --cyan-soft: rgba(90, 231, 210, 0.13);
  --blue: #6d91ff;
  --blue-soft: rgba(109, 145, 255, 0.14);
  --amber: #f6ba5b;
  --amber-soft: rgba(246, 186, 91, 0.14);
  --red: #ff6d7f;
  --red-soft: rgba(255, 109, 127, 0.14);
  --green: #72e6a6;
  --green-soft: rgba(114, 230, 166, 0.12);
  --radius-sm: 10px;
  --radius: 16px;
  --radius-lg: 24px;
  --shadow: 0 24px 80px rgba(0, 0, 0, 0.28);
  --font: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
}

* {
  box-sizing: border-box;
}
html {
  min-width: 320px;
  scroll-behavior: smooth;
}
body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at 12% -10%, rgba(65, 126, 226, 0.2), transparent 34%),
    radial-gradient(circle at 88% 0%, rgba(47, 205, 179, 0.12), transparent 30%), var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
}
button,
input,
textarea {
  font: inherit;
}
button {
  color: inherit;
}
a {
  color: inherit;
  text-decoration: none;
}
code {
  font-family: var(--mono);
}
h1,
h2,
h3,
h4,
p {
  margin-top: 0;
}
button:focus-visible,
a:focus-visible {
  outline: 2px solid var(--cyan);
  outline-offset: 3px;
}

.app-shell {
  width: min(1760px, 100%);
  margin: 0 auto;
  padding: 20px 26px 0;
}
.app-header {
  min-height: 68px;
  display: grid;
  grid-template-columns: 250px 1fr auto;
  align-items: center;
  gap: 24px;
  border-bottom: 1px solid var(--line);
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand > span {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(90, 231, 210, 0.38);
  border-radius: 11px;
  background: linear-gradient(145deg, rgba(90, 231, 210, 0.19), rgba(109, 145, 255, 0.14));
  color: var(--cyan);
  font-weight: 800;
  box-shadow: inset 0 0 20px rgba(90, 231, 210, 0.08);
}
.brand div {
  display: flex;
  flex-direction: column;
  letter-spacing: 0.08em;
}
.brand strong {
  font-size: 15px;
}
.brand small {
  color: var(--text-faint);
  font-size: 9px;
}
.title-lockup {
  min-width: 0;
}
.title-lockup span {
  color: var(--cyan);
  font: 600 10px / 1 var(--mono);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.title-lockup h1 {
  margin: 0;
  overflow: hidden;
  font-size: 18px;
  font-weight: 600;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.offline-badge {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 8px 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--text-soft);
  font: 600 10px / 1 var(--mono);
}
.offline-badge span {
  color: var(--cyan);
}
.phase-rail {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  margin: 0;
  padding: 18px 0;
  list-style: none;
}
.workspace {
  display: grid;
  grid-template-columns: minmax(240px, 0.72fr) minmax(480px, 1.85fr) minmax(270px, 0.8fr);
  gap: 14px;
  align-items: start;
}
.workspace.is-home {
  grid-template-columns: minmax(0, 1fr) minmax(300px, 0.38fr);
}
.workspace.without-context:not(.is-home) {
  grid-template-columns: minmax(0, 1fr) minmax(270px, 0.34fr);
}
.panel {
  min-width: 0;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: linear-gradient(160deg, rgba(16, 35, 61, 0.92), rgba(9, 21, 39, 0.92));
  box-shadow: var(--shadow);
}
.context-panel,
.copilot-panel {
  position: sticky;
  top: 14px;
}
.context-panel {
  padding: 18px;
}
.stage-panel {
  min-height: 600px;
  padding: clamp(20px, 3vw, 34px);
}
.copilot-panel {
  overflow: hidden;
}
.app-footer {
  display: flex;
  justify-content: space-between;
  gap: 24px;
  margin-top: 18px;
  padding: 16px 2px 18px;
  border-top: 1px solid var(--line);
  color: var(--text-faint);
  font-size: 11px;
}
.app-footer strong {
  color: var(--text-soft);
  font-weight: 500;
}

.phase-step {
  position: relative;
  display: flex;
  align-items: center;
  gap: 9px;
  color: var(--text-faint);
  font-size: 11px;
}
.phase-step::after {
  position: absolute;
  right: 12px;
  left: 38px;
  height: 1px;
  background: var(--line);
  content: "";
}
.phase-step:last-child::after {
  display: none;
}
.phase-step > span {
  position: relative;
  z-index: 1;
  width: 27px;
  height: 27px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line-strong);
  border-radius: 50%;
  background: var(--bg-soft);
  font: 600 9px / 1 var(--mono);
}
.phase-step.is-current {
  color: var(--text);
}
.phase-step.is-current > span {
  border-color: var(--cyan);
  background: var(--cyan-soft);
  color: var(--cyan);
  box-shadow: 0 0 18px rgba(90, 231, 210, 0.16);
}
.phase-step.is-done > span {
  border-color: rgba(114, 230, 166, 0.44);
  background: var(--green-soft);
  color: var(--green);
}
.panel-heading,
.stage-heading {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
}
.panel-heading h2,
.stage-heading h2 {
  margin: 5px 0 0;
  font-size: 17px;
}
.module-tag {
  color: var(--cyan);
  font: 600 9px / 1 var(--mono);
  letter-spacing: 0.07em;
  text-transform: uppercase;
}
.source-status,
.readiness {
  flex: 0 0 auto;
  padding: 6px 8px;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--text-faint);
  font: 600 9px / 1 var(--mono);
}
.source-status.is-ready,
.readiness.ready {
  border-color: rgba(114, 230, 166, 0.35);
  background: var(--green-soft);
  color: var(--green);
}
.readiness.blocked {
  border-color: rgba(246, 186, 91, 0.35);
  background: var(--amber-soft);
  color: var(--amber);
}
.prompt-card {
  margin: 20px 0 16px;
  padding: 14px;
  border: 1px solid rgba(109, 145, 255, 0.25);
  border-radius: var(--radius-sm);
  background: var(--blue-soft);
}
.prompt-card span,
.hypothesis-block > span,
.copilot-message > span,
.copilot-principles > span {
  color: var(--blue);
  font: 600 9px / 1 var(--mono);
  letter-spacing: 0.07em;
  text-transform: uppercase;
}
.prompt-card p {
  margin: 8px 0 0;
  color: #dbe8ff;
  font-size: 13px;
  line-height: 1.6;
}
.change-facts {
  display: grid;
  gap: 11px;
  margin: 0;
}
.change-facts div {
  min-width: 0;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
}
.change-facts dt {
  margin-bottom: 4px;
  color: var(--text-faint);
  font-size: 10px;
}
.change-facts dd {
  margin: 0;
  color: var(--text-soft);
  font-size: 12px;
  line-height: 1.45;
}
.change-facts code {
  overflow-wrap: anywhere;
  color: #bed1ff;
  font-size: 10px;
}
.reconciliation {
  margin-top: 16px;
  padding: 13px;
  border: 1px solid;
  border-radius: var(--radius-sm);
}
.reconciliation.is-exact {
  border-color: rgba(114, 230, 166, 0.3);
  background: var(--green-soft);
}
.reconciliation.is-expanded {
  border-color: rgba(246, 186, 91, 0.3);
  background: var(--amber-soft);
}
.reconciliation span {
  display: block;
  color: var(--text-faint);
  font: 600 9px / 1 var(--mono);
}
.reconciliation strong {
  display: block;
  margin-top: 6px;
  color: var(--text);
}
.reconciliation p {
  margin: 5px 0 0;
  color: var(--text-soft);
  font-size: 11px;
  line-height: 1.5;
}
.entity-cloud {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 12px 0 0;
  padding: 0;
  list-style: none;
}
.entity-cloud li {
  padding: 5px 7px;
  border: 1px solid var(--line);
  border-radius: 7px;
  color: var(--text-soft);
  font: 9px / 1 var(--mono);
}
.context-placeholder {
  display: grid;
  min-height: 430px;
  place-items: center;
  align-content: center;
  padding: 24px;
  text-align: center;
}
.context-placeholder > span {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line-strong);
  border-radius: 14px;
  color: var(--text-faint);
  font: 700 10px / 1 var(--mono);
}
.context-placeholder strong {
  margin-top: 16px;
  font-size: 13px;
}
.context-placeholder p {
  max-width: 220px;
  margin: 8px 0 0;
  color: var(--text-faint);
  font-size: 10px;
  line-height: 1.55;
}
.product-intake {
  max-width: 780px;
  margin: 0 auto;
  padding: 18px 0 8px;
}
.product-intake h2 {
  margin: 0 0 8px;
  font-size: 18px;
  font-weight: 600;
}
.intake-lead {
  max-width: 650px;
  margin: 0;
  color: var(--text-soft);
  line-height: 1.5;
}
.intent-form {
  display: grid;
  gap: 14px;
  margin-top: 18px;
  padding: 18px;
  border: 1px solid rgba(90, 231, 210, 0.24);
  border-radius: var(--radius-lg);
  background: rgba(7, 16, 31, 0.42);
}
.intent-form label {
  display: grid;
  gap: 8px;
}
.intent-form label > span {
  color: var(--text-soft);
  font-size: 10px;
  font-weight: 700;
}
.intent-form textarea,
.intent-form input {
  width: 100%;
  border: 1px solid var(--line-strong);
  border-radius: 10px;
  outline: 0;
  background: rgba(7, 16, 31, 0.72);
  color: var(--text);
}
.intent-form textarea {
  min-height: 112px;
  resize: vertical;
  padding: 14px;
  line-height: 1.6;
}
.intent-form input {
  padding: 11px 12px;
}
.intent-form textarea:focus,
.intent-form input:focus {
  border-color: var(--cyan);
  box-shadow: 0 0 0 3px rgba(90, 231, 210, 0.1);
}
.intent-fields {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}
.compile-button {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 13px 15px;
  border: 1px solid rgba(90, 231, 210, 0.42);
  border-radius: 10px;
  background: linear-gradient(135deg, rgba(90, 231, 210, 0.24), rgba(109, 145, 255, 0.18));
  color: #ecfffc;
  cursor: pointer;
  font-weight: 800;
}
.compile-button b {
  color: var(--cyan);
  font-size: 17px;
}
.compile-button:disabled {
  border-color: var(--line);
  background: rgba(111, 135, 163, 0.08);
  color: var(--text-faint);
  cursor: not-allowed;
}
.example-area {
  margin-top: 24px;
}
.example-area > div:first-child {
  display: flex;
  gap: 9px;
  align-items: baseline;
}
.example-area > div:first-child strong {
  font-size: 11px;
}
.example-area > div:first-child span {
  color: var(--text-faint);
  font-size: 9px;
}
.example-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin-top: 10px;
}
.example-fill {
  min-width: 0;
  padding: 13px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: rgba(7, 16, 31, 0.46);
  text-align: left;
  cursor: pointer;
}
.example-fill:hover {
  border-color: rgba(90, 231, 210, 0.38);
  background: var(--surface-hover);
}
.example-fill span,
.example-fill strong,
.example-fill small {
  display: block;
}
.example-fill span {
  color: var(--cyan);
  font: 700 8px / 1 var(--mono);
  text-transform: uppercase;
}
.example-fill strong {
  margin: 7px 0 5px;
  font-size: 11px;
}
.example-fill small {
  overflow: hidden;
  color: var(--text-faint);
  font-size: 9px;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.edit-intent {
  margin-top: 16px;
  padding: 8px 11px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: transparent;
  color: var(--text-soft);
  cursor: pointer;
  font-size: 10px;
}
.stage-empty {
  display: grid;
  min-height: 420px;
  place-items: center;
  align-content: center;
  text-align: center;
}
.stage-orb {
  width: 74px;
  height: 74px;
  display: grid;
  place-items: center;
  margin-bottom: 18px;
  border: 1px solid rgba(90, 231, 210, 0.38);
  border-radius: 24px;
  background: linear-gradient(145deg, rgba(90, 231, 210, 0.18), rgba(109, 145, 255, 0.16));
  color: var(--cyan);
  font-size: 28px;
  box-shadow: 0 20px 60px rgba(48, 168, 170, 0.12);
}
.stage-kicker {
  color: var(--cyan);
  font: 600 10px / 1 var(--mono);
  text-transform: uppercase;
}
.stage-empty h2 {
  margin-bottom: 10px;
  font-size: 18px;
  font-weight: 600;
}
.stage-empty > p:not(.stage-kicker) {
  max-width: 560px;
  color: var(--text-soft);
  line-height: 1.7;
}
.understanding-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
  width: 100%;
  margin-top: 28px;
  text-align: left;
}
.understanding-grid div {
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: rgba(7, 16, 31, 0.45);
}
.understanding-grid span {
  display: block;
  margin-bottom: 7px;
  color: var(--text-faint);
  font-size: 9px;
}
.understanding-grid strong {
  font-size: 11px;
  line-height: 1.45;
}
.scope-stage > h2 {
  margin: 0 0 14px;
  font-size: 18px;
  font-weight: 600;
}
.playbook-match {
  margin-bottom: 28px;
  padding: 20px;
  border: 1px solid;
  border-radius: var(--radius);
  background: rgba(7, 16, 31, 0.48);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.025);
}
.playbook-match.exact {
  border-color: rgba(114, 230, 166, 0.34);
  background: linear-gradient(145deg, var(--green-soft), rgba(7, 16, 31, 0.48));
}
.playbook-match.minor-drift {
  border-color: rgba(246, 186, 91, 0.38);
  background: linear-gradient(145deg, var(--amber-soft), rgba(7, 16, 31, 0.48));
}
.playbook-match.major-drift {
  border-color: rgba(255, 109, 127, 0.42);
  background: linear-gradient(145deg, var(--red-soft), rgba(7, 16, 31, 0.5));
}
.playbook-match-header {
  display: flex;
  justify-content: space-between;
  gap: 18px;
  align-items: flex-start;
}
.playbook-match-header h2 {
  margin: 7px 0 0;
  font-size: 18px;
  font-weight: 600;
}
.match-state {
  color: var(--text-faint);
  font-size: 9px;
  font-weight: 700;
}
.playbook-signals,
.playbook-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
.playbook-signals .readiness {
  border-color: var(--line-strong);
  background: rgba(7, 16, 31, 0.36);
}
.playbook-identity {
  display: flex;
  gap: 9px;
  align-items: baseline;
  margin-top: 19px;
}
.playbook-identity > span {
  color: var(--text-faint);
  font: 600 9px / 1 var(--mono);
  text-transform: uppercase;
}
.playbook-identity > strong {
  font-size: 14px;
}
.playbook-summary,
.playbook-freshness {
  color: var(--text-soft);
  line-height: 1.6;
}
.playbook-structure-note {
  display: flex;
  gap: 7px;
  align-items: center;
  margin: 14px 0 10px;
  color: var(--text-faint);
  font-size: 9px;
}
.info-tip {
  color: var(--cyan);
  cursor: help;
}
.single-line-note {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.playbook-summary {
  margin: 9px 0 15px;
}
.playbook-freshness {
  margin: 16px 0;
  padding-top: 13px;
  border-top: 1px solid var(--line);
  font-size: 10px;
}
.playbook-validation {
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: rgba(7, 16, 31, 0.38);
}
.playbook-validation summary {
  display: flex;
  justify-content: space-between;
  padding: 12px 14px;
  cursor: pointer;
  color: var(--green);
  font-size: 11px;
  font-weight: 700;
}
.playbook-validation summary span {
  color: var(--text-faint);
  font-weight: 500;
}
.playbook-validation ul,
.playbook-difference-list {
  display: grid;
  gap: 8px;
  margin: 0;
  padding: 0;
  list-style: none;
}
.playbook-validation ul {
  padding: 0 14px 14px;
}
.playbook-validation li,
.playbook-difference-list li {
  display: grid;
  gap: 5px;
  padding: 11px 12px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: rgba(7, 16, 31, 0.42);
}
.playbook-validation li span,
.playbook-difference-list li span {
  color: var(--text-faint);
  font: 600 9px / 1 var(--mono);
  text-transform: uppercase;
}
.playbook-validation li strong,
.playbook-difference-list li strong {
  font-size: 11px;
  line-height: 1.5;
}
.playbook-difference-list li.review span {
  color: var(--amber);
}
.playbook-difference-list li.blocking span {
  color: var(--red);
}
.playbook-drawer {
  display: none;
}
.playbook-reviewed {
  margin: 11px 0 0;
  color: var(--green);
  font-size: 10px;
}
.playbook-review-drift,
.playbook-dismiss,
.playbook-proposal-action {
  border: 0;
  background: none;
  cursor: pointer;
}
.playbook-review-drift {
  margin-top: 11px;
  padding: 0;
  color: var(--text-soft);
  font-size: 10px;
  font-weight: 700;
}
.playbook-primary {
  min-width: 225px;
}
.playbook-dismiss {
  padding: 9px 4px;
  color: var(--text-soft);
  font-size: 10px;
  text-decoration: underline;
  text-underline-offset: 4px;
}
.scope-stage > p,
.stage-lead {
  color: var(--text-soft);
  line-height: 1.65;
}
.impact-block {
  margin: 22px 0;
  padding: 16px;
  border: 1px solid rgba(90, 231, 210, 0.24);
  border-radius: var(--radius);
  background: rgba(7, 16, 31, 0.42);
}
.impact-block > header span {
  color: var(--cyan);
  font: 700 8px / 1 var(--mono);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.impact-block > header h3 {
  margin: 0;
  font-size: 15px;
}
.impact-matrix {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 9px;
  margin-top: 13px;
}
.impact-matrix article {
  min-width: 0;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: rgba(7, 16, 31, 0.52);
}
.impact-matrix span,
.impact-matrix small {
  display: block;
  color: var(--text-faint);
  font-size: 8px;
}
.impact-matrix strong {
  display: block;
  margin: 7px 0;
  color: #e3f7f4;
  font-size: 10px;
  line-height: 1.45;
  overflow-wrap: anywhere;
}
.source-list {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin: 24px 0;
  padding: 0;
  list-style: none;
}

    <div id="app"></div>
    <script>
(() => {
"use strict";
const EVIDENCE_VERDICTS = Object.freeze(['Verified', 'Violated', 'Inconclusive', 'NotEvaluated']);

const ACTION_STATUSES = Object.freeze(['Proceed', 'Proceed-with-conditions', 'Pause', 'Rollback']);

const ACTION_STATUS_SET = new Set(ACTION_STATUSES);
const EVIDENCE_VERDICT_SET = new Set(EVIDENCE_VERDICTS);

const REQUIRED_CHECK_FIELDS = Object.freeze([
  'id',
  'priority',
  'purpose',
  'entity',
  'capability',
  'metricRules',
  'window',
  'baseline',
  'severity',
  'failureAction',
  'rationale',
  'sourceRefs',
]);

function deepFreeze(value) {
  if (!value || typeof value !== 'object' || Object.isFrozen(value)) {
    return value;
  }
  for (const child of Object.values(value)) deepFreeze(child);
  return Object.freeze(value);
}

function sortedUnique(values = []) {
  return [...new Set(values.filter(Boolean))].sort((left, right) => left.localeCompare(right));
}

function assertCheckContract(check, sourceIds) {
  for (const field of REQUIRED_CHECK_FIELDS) {
    const value = check?.[field];
    const missing =
      value === undefined || value === null || value === '' || (Array.isArray(value) && value.length === 0);
    if (missing) throw new Error(`Check ${check?.id ?? 'unknown'} missing ${field}`);
  }
  for (const sourceRef of check.sourceRefs) {
    if (!sourceIds.has(sourceRef)) {
      throw new Error(`Unknown sourceRef ${sourceRef} on ${check.id}`);
    }
  }
  const ruleIds = new Set();
  for (const rule of check.metricRules) {
    const validRule =
      rule &&
      typeof rule === 'object' &&
      nonEmptyString(rule.id) &&
      nonEmptyString(rule.metricId) &&
      rule.id === rule.metricId &&
      nonEmptyString(rule.label) &&
      nonEmptyString(rule.category) &&
      nonEmptyString(rule.operator) &&
      Number.isFinite(rule.threshold) &&
      nonEmptyString(rule.unit) &&
      typeof rule.editable === 'boolean' &&
      stringArray(rule.allowedOperators) &&
      rule.allowedOperators.includes(rule.operator) &&
      nonEmptyString(rule.sourceRef) &&
      check.sourceRefs.includes(rule.sourceRef) &&
      sourceIds.has(rule.sourceRef) &&
      !ruleIds.has(rule.id);
    if (!validRule) throw new Error(`Check ${check.id} has invalid metricRule ${rule?.id ?? 'unknown'}`);
    ruleIds.add(rule.id);
  }
  return true;
}

function nonEmptyString(value) {
  return typeof value === 'string' && value.trim().length > 0;
}

function stringArray(value) {
  return Array.isArray(value) && value.every(nonEmptyString);
}

function validEvidenceCounts(counts) {
  return (
    counts &&
    typeof counts === 'object' &&
    ['verified', 'violated', 'unresolved'].every((key) => Number.isInteger(counts[key]) && counts[key] >= 0)
  );
}

function validRootCauseAgent(agent) {
  return (
    agent == null ||
    (typeof agent === 'object' &&
      nonEmptyString(agent.title) &&
      nonEmptyString(agent.rootCause) &&
      stringArray(agent.chain) &&
      nonEmptyString(agent.recommendation))
  );
}

function validMeasurement(measurement) {
  if (
    !measurement ||
    typeof measurement !== 'object' ||
    !nonEmptyString(measurement.id) ||
    !nonEmptyString(measurement.label) ||
    !nonEmptyString(measurement.entity) ||
    !['numeric', 'qualitative'].includes(measurement.kind) ||
    !nonEmptyString(measurement.displayValue) ||
    !measurement.gate ||
    typeof measurement.gate !== 'object' ||
    !nonEmptyString(measurement.gate.displayValue)
  ) {
    return false;
  }
  if (measurement.kind === 'qualitative') return true;
  return (
    Number.isFinite(measurement.value) &&
    nonEmptyString(measurement.unit) &&
    Number.isFinite(measurement.gate.value) &&
    nonEmptyString(measurement.gate.operator) &&
    nonEmptyString(measurement.gate.unit)
  );
}

function validV2ReportContract(report) {
  const hasResults = Object.hasOwn(report, 'checkResults');
  const hasInterpretation = Object.hasOwn(report, 'interpretation');
  if (!hasResults && !hasInterpretation) return true;
  if (!hasResults || !hasInterpretation || !Array.isArray(report.checkResults) || !report.checkResults.length) {
    return false;
  }
  const checkIds = new Set();
  const measurementIds = new Set();
  for (const result of report.checkResults) {
    if (
      !result ||
      typeof result !== 'object' ||
      !nonEmptyString(result.checkId) ||
      checkIds.has(result.checkId) ||
      !EVIDENCE_VERDICT_SET.has(result.status) ||
      !nonEmptyString(result.summary) ||
      !Array.isArray(result.measurements) ||
      !result.measurements.length ||
      !result.measurements.every(validMeasurement)
    ) {
      return false;
    }
    checkIds.add(result.checkId);
    for (const measurement of result.measurements) {
      if (measurementIds.has(measurement.id)) return false;
      measurementIds.add(measurement.id);
    }
  }
  const interpretationKeys = ['whatHappened', 'likelyCause', 'recommendedAction'];
  return interpretationKeys.every((key) => {
    const section = report.interpretation?.[key];
    if (!section || typeof section !== 'object' || !nonEmptyString(section.text) || !stringArray(section.evidenceIds)) {
      return false;
    }
    if (section.text === '证据不足') return section.evidenceIds.length === 0;
    return section.evidenceIds.length > 0 && section.evidenceIds.every((id) => measurementIds.has(id));
  });
}

function validReportContract(report) {
  return (
    report &&
    typeof report === 'object' &&
    EVIDENCE_VERDICT_SET.has(report.evidenceVerdict) &&
    ACTION_STATUS_SET.has(report.action) &&
    nonEmptyString(report.actionLabel) &&
    nonEmptyString(report.title) &&
    nonEmptyString(report.summary) &&
    nonEmptyString(report.scopeStatement) &&
    validEvidenceCounts(report.evidenceCounts) &&
    stringArray(report.keyEvidence) &&
    stringArray(report.residualRisks) &&
    validRootCauseAgent(report.rcAgent) &&
    validV2ReportContract(report)
  );
}

function reconcileChange(declaredChange, observedChange) {
  if (!declaredChange?.entities?.length || !observedChange?.entities?.length) {
    return deepFreeze({
      status: 'Unverifiable',
      declaredEntities: sortedUnique(declaredChange?.entities),
      observedEntities: sortedUnique(observedChange?.entities),
      resolvedEntities: [],
      addedEntities: [],
      missingEntities: [],
    });
  }

  const declaredEntities = sortedUnique(declaredChange.entities);
  const observedEntities = sortedUnique(observedChange.entities);
  const declared = new Set(declaredEntities);
  const observed = new Set(observedEntities);
  const addedEntities = observedEntities.filter((entity) => !declared.has(entity));
  const missingEntities = declaredEntities.filter((entity) => !observed.has(entity));
  const shared = observedEntities.filter((entity) => declared.has(entity));
  let status = 'Exact';
  if (shared.length === 0) status = 'Conflict';
  else if (addedEntities.length && !missingEntities.length) {
    status = 'Observed-Superset';
  } else if (missingEntities.length && !addedEntities.length) {
    status = 'Observed-Subset';
  } else if (addedEntities.length || missingEntities.length) {
    status = 'Conflict';
  }

  return deepFreeze({
    status,
    declaredEntities,
    observedEntities,
    resolvedEntities: status === 'Conflict' ? [] : observedEntities,
    blockingEntities: ['Conflict', 'Unverifiable'].includes(status) ? [] : declaredEntities,
    coverageGapEntities: status === 'Conflict' ? [] : addedEntities,
    addedEntities,
    missingEntities,
  });
}

const DEFAULT_ALLOWED_OPERATORS = Object.freeze(['<=', '>=', '<', '>']);

const catalogEntries = {
  'order.submit.success_rate': ['订单提交成功率', '业务结果', '%'],
  'payment.confirm.success_rate': ['支付确认成功率', '业务结果', '%'],
  'http.error_rate': ['HTTP 错误率', '服务黄金信号', '%'],
  'http.duration.p95': ['服务延迟 p95', '服务黄金信号', 'ms'],
  'http.duration.p95.change_rate': ['服务延迟 p95 增幅', '服务黄金信号', '%'],
  'span.client.error_rate': ['下游调用错误率', '依赖黄金信号', '%'],
  'span.client.duration.p95': ['下游调用延迟 p95', '依赖黄金信号', 'ms'],
  'span.client.duration.p95.change_rate': ['下游延迟 p95 增幅', '依赖黄金信号', '%'],
  'redis.hit_rate': ['缓存命中率', '中间件黄金信号', '%'],
  'redis.command_latency': ['缓存命令 p99', '中间件黄金信号', 'ms'],
  'container.memory.working_set': ['容器内存工作集趋势', '资源黄金信号', '基线比'],
  'invoice.queue.lag': ['发票队列积压增长率', '异步业务信号', '%'],
  'db.pool.wait_p95': ['连接等待 p95', '数据库黄金信号', 'ms'],
  'db.pool.utilization': ['连接池占用', '数据库黄金信号', '%'],
};

const metricCatalog = Object.freeze(
  Object.fromEntries(
    Object.entries(catalogEntries).map(([metricId, [label, category, unit]]) => [
      metricId,
      Object.freeze({
        metricId,
        label,
        category,
        unit,
        allowedOperators: DEFAULT_ALLOWED_OPERATORS,
        sourceRef: 'metric-catalog',
      }),
    ]),
  ),
);

function createMetricRule(metricId, operator, threshold, options = {}) {
  const entry = metricCatalog[metricId];
  const label = options.label ?? entry?.label;
  const category = options.category ?? entry?.category;
  const unit = options.unit ?? entry?.unit;
  const allowedOperators = options.allowedOperators ?? entry?.allowedOperators ?? DEFAULT_ALLOWED_OPERATORS;
  if (
    !metricId ||
    !label ||
    !category ||
    !unit ||
    !allowedOperators.includes(operator) ||
    !Number.isFinite(threshold)
  ) {
    throw new TypeError(`Invalid metric rule for ${metricId || 'unknown metric'}`);
  }
  return {
    id: metricId,
    metricId,
    label,
    category,
    operator,
    threshold,
    unit,
    editable: options.editable !== false,
    allowedOperators: [...allowedOperators],
    sourceRef: options.sourceRef ?? entry?.sourceRef ?? 'metric-catalog',
  };
}

function formatMetricRule(rule) {
  return `${rule.operator} ${rule.threshold}${rule.unit}`;
}

function formatCheckRules(check) {
  return check.metricRules.map((rule) => `${rule.label} ${formatMetricRule(rule)}`).join('；');
}

const TREND_LABELS = Object.freeze(['-15m', '-12m', '-9m', '-6m', '-3m', '现在']);

function createTrendSeries(...values) {
  if (values.length !== TREND_LABELS.length || values.some((value) => !Number.isFinite(value))) {
    throw new TypeError('Trend evidence requires six finite values');
  }
  return TREND_LABELS.map((label, index) => ({ label, value: values[index] }));
}

function check(input) {
  return {
    priority: 'required',
    window: '变更前 15 分钟 vs 变更后 15 分钟',
    baseline: '过去 7 天同星期、同时段',
    severity: 'critical',
    ...input,
  };
}

const naturalLanguagePass = {
  id: 'natural-language-pass',
  entryKind: 'natural-language',
  eyebrow: 'Journey 01 · Natural language',
  title: '订单服务升级验收',
  subtitle: '订单发布验证',
  prompt: '今晚升级 order-api v4.8.0，帮我确认订单提交和支付链路有没有问题。',
  declaredChange: {

function genericCheck(input) {
  return {
    priority: 'required',
    window: '变更前 15 分钟 vs 变更后 15 分钟',
    baseline: '过去 7 天同星期、同时段',
    severity: 'critical',
    ...input,
  };
}

function extractService(prompt) {
  return (
    prompt.match(/\b[a-z][a-z0-9-]*(?:-api|-service|-worker|-gateway)\b/i)?.[0] ??
    prompt.match(/\b[a-z][a-z0-9]+-[a-z0-9-]+\b/i)?.[0] ??
    'target-service'
  );
}

function extractServices(prompt) {
  const servicePattern = /\b[a-z][a-z0-9-]*(?:-api|-service|-worker|-gateway)\b/gi;
  return [...new Set([...prompt.matchAll(servicePattern)].map(([service]) => service.toLowerCase()))];
}

function extractVersion(prompt) {
  return prompt.match(/\bv\d+(?:\.\d+)+\b/i)?.[0] ?? '待确认版本';
}

function normalizeRequest(request) {
  const prompt = request?.prompt?.trim() ?? '';
  const contextReference = request?.contextReference?.trim() ?? '';
  if (!prompt && !contextReference) throw new Error('A release reference or inspection intent is required');
  const referenceTarget = /^CHG-84501$/i.test(contextReference) ? 'payment-api' : '';
  return {
    prompt: prompt || `验证变更 ${contextReference}`,
    targetService: request?.targetService?.trim() || referenceTarget || extractService(prompt),
    contextReference,
  };
}

function compileKnownWorkspace(request) {
  const isPaymentRisk =
    ['CHG-84217', 'CHG-84501'].includes(request.contextReference) ||
    (/payment-api/i.test(request.prompt) && /redis|超时/i.test(request.prompt));
  if (isPaymentRisk) {
    const workspace = cloneFixture('change-ticket-risk');
    workspace.prompt = request.prompt;
    workspace.eyebrow = 'User-defined inspection workspace';
    workspace.title = `${request.targetService} 巡检工作区`;
    workspace.subtitle = '用户目标与运行时对账共同编译的高风险验证工作区';
    workspace.entryKind = request.contextReference ? 'combined-context' : 'user-intent';
    if (request.contextReference) {
      workspace.declaredChange.id = request.contextReference;
      workspace.contextSources[0].label = request.contextReference;
    }
    return workspace;
  }
  if (/order-api/i.test(request.prompt) || request.targetService === 'order-api') {
    const workspace = cloneFixture('natural-language-pass');
    workspace.prompt = request.prompt;
    workspace.eyebrow = 'User-defined inspection workspace';
    workspace.title = `${request.targetService} 巡检工作区`;
    workspace.subtitle = '用户目标动态编译的服务升级验证工作区';
    workspace.entryKind = request.contextReference ? 'combined-context' : 'user-intent';
    if (request.contextReference) workspace.declaredChange.id = request.contextReference;
    return workspace;
  }
  return null;
}

function compileInspectionRequest(input) {
  const request = normalizeRequest(input);
  const workspace = compileKnownWorkspace(request) ?? compileGenericWorkspace(request);
  workspace.request = request;
  workspace.reconciliation = reconcileChange(workspace.declaredChange, workspace.observedChange);
  workspace.candidateSetId = `candidate-set:${workspace.declaredChange.id}`;
  workspace.blockingScope = [...workspace.reconciliation.blockingEntities];
  workspace.coverageGaps = workspace.reconciliation.coverageGapEntities.map((entity) => {
    const candidate = workspace.candidateChecks.find(
      (check) => check.entity === entity && check.ruleSourceAuthority === 'approved',
    );
    return {
      id: `coverage-gap:${entity}`,
      entity,
      status: 'uncovered',
      reason:
        entity === 'invoice-worker'
          ? '共享配置包触达该服务，但当前没有已批准的直接规则绑定'
          : '运行时配置指纹显示该实体位于声明外影响面',
      sourceRefs: ['runtime-diff'].filter((sourceId) =>
        workspace.contextSources.some((source) => source.id === sourceId),
      ),
      eligibleCandidateId: candidate?.id ?? null,
    };
  });
  return deepFreeze(workspace);
}

function resolveApprovedChecks(playbook, workspace) {
  const currentChecks = new Map(workspace.committedChecks.map((check) => [check.id, check]));
  const checkIds = [...playbook.checkIds];
  return {
    checkIds,
    checks: checkIds.flatMap((checkId) => {
      const check = currentChecks.get(checkId);
      return check ? [check] : [];
    }),
    unresolvedCheckIds: checkIds.filter((checkId) => !currentChecks.has(checkId)),
  };
}

  const promptSignals = playbook.matchRules?.promptSignals ?? [];
  return (
    targetServices.some((candidate) => candidate.toLowerCase() === service) &&
    (promptSignals.length === 0 || promptSignals.some((signal) => prompt.includes(signal.toLowerCase())))
  );
}

function selectInspectionPlaybookDefinition(workspace, catalog = inspectionPlaybooks) {
  let selected = null;
  for (const playbook of catalog) {
    if (!matchesPlaybookDefinition(playbook, workspace)) continue;
    if (!selected || playbook.version > selected.version) selected = playbook;
  }
  return selected;
}

function matchInspectionPlaybook(workspace, catalog = inspectionPlaybooks) {
  const playbook = selectInspectionPlaybookDefinition(workspace, catalog);
  if (!playbook) return null;

  const hasUnresolvedChecks = resolveApprovedChecks(playbook, workspace).unresolvedCheckIds.length > 0;
  if (hasUnresolvedChecks) {
    return playbook.scenarioKey === 'payment-config'
      ? majorPaymentMatch(playbook, workspace)
      : incompatibleStructureMatch(playbook, workspace);
  }

  if (playbook.scenarioKey === 'order-release') return exactOrderMatch(playbook, workspace);
  if (playbook.scenarioKey === 'payment-config') {
    const prompt = workspace?.request?.prompt?.toLowerCase() ?? '';
    const majorDrift = prompt.includes('risk-api') || prompt.includes('拆分');
    return majorDrift ? majorPaymentMatch(playbook, workspace) : minorPaymentMatch(playbook, workspace);
  }
  return null;
}

const INSPECTION_LIBRARY_SCHEMA_VERSION = 1;

function clone(value) {
  if (Array.isArray(value)) return value.map(clone);
  if (value && typeof value === 'object') {
    return Object.fromEntries(Object.entries(value).map(([key, item]) => [key, clone(item)]));
  }
  return value;
}

function stripRuntimePayload(value) {
  if (Array.isArray(value)) return value.map(stripRuntimePayload);
  if (!value || typeof value !== 'object') return value;
  return Object.fromEntries(
    Object.entries(value)
      .filter(([key]) => !['evidence', 'report'].includes(key))
      .map(([key, item]) => [key, stripRuntimePayload(item)]),
  );
}

function sortedUnique(values = []) {
  return [...new Set(values.filter(Boolean))].sort();
}

function nonEmptyString(value) {
  return typeof value === 'string' && value.trim().length > 0;
}

function stringArray(value, { allowEmpty = true } = {}) {
  return Array.isArray(value) && (allowEmpty || value.length > 0) && value.every(nonEmptyString);
}

function validRequest(request) {
  return (
    request &&
    typeof request === 'object' &&
    nonEmptyString(request.prompt) &&
    (request.targetService === undefined || typeof request.targetService === 'string') &&
    (request.contextReference === undefined || typeof request.contextReference === 'string')
  );
}

function validContextItem(item) {
  return (
    item &&
    typeof item === 'object' &&
    nonEmptyString(item.id) &&
    nonEmptyString(item.kind) &&
    nonEmptyString(item.label) &&
    typeof item.detail === 'string'
  );
}

function validMetricRule(rule) {
  return (
    rule &&
    typeof rule === 'object' &&
    nonEmptyString(rule.id) &&
    nonEmptyString(rule.metricId) &&
    nonEmptyString(rule.label) &&
    nonEmptyString(rule.category) &&
    nonEmptyString(rule.operator) &&
    Number.isFinite(rule.threshold) &&
    nonEmptyString(rule.unit) &&
    typeof rule.editable === 'boolean' &&
    stringArray(rule.allowedOperators, { allowEmpty: false }) &&
    rule.allowedOperators.includes(rule.operator) &&
    nonEmptyString(rule.sourceRef)
  );
}

function legacyMetricRules(check) {
  const sourceRef = check.sourceRefs.includes('metric-catalog')
    ? 'metric-catalog'
    : (check.sourceRefs.at(-1) ?? 'legacy-snapshot');
  const create = (metricId, operator, threshold, options = {}) =>
    createMetricRule(metricId, operator, threshold, { sourceRef, ...options });
  if (check.id === 'candidate-memory-trend') {
    return [create('container.memory.working_set', '<=', 1, { editable: false })];
  }
  if (check.id === 'order-success') return [create('order.submit.success_rate', '>=', 99.59)];
  if (check.id === 'payment-success') return [create('payment.confirm.success_rate', '>=', 99.82)];
  if (check.id === 'business-outcome') {
    const metricId = String(check.metric).split(' + ')[0];
    return [
      create(metricId, '>=', 99.59, {
        label: `${check.entity}成功率`,
        category: '业务结果',
        unit: '%',
      }),
    ];
  }
  if (check.id === 'service-golden-signals' || check.id === 'payment-service') {
    if (check.entity === 'order-api') {
      return [create('http.error_rate', '<=', 0.5), create('http.duration.p95', '<=', 198)];
    }
    if (check.entity === 'payment-api') {
      return [create('http.error_rate', '<=', 0.3), create('http.duration.p95', '<=', 216)];
    }
    return [create('http.error_rate', '<=', 0.5), create('http.duration.p95.change_rate', '<=', 10)];
  }
  if (check.id === 'payment-dependency' || check.id === 'downstream-dependency') {
    return [create('span.client.error_rate', '<=', 0), create('span.client.duration.p95.change_rate', '<=', 8)];
  }
  if (check.id === 'cache-health' || check.id === 'middleware-health') {
    return [create('redis.hit_rate', '>=', 94.4), create('redis.command_latency', '<=', 6)];
  }
  if (check.id === 'candidate-db-wait') {
    return [create('db.pool.wait_p95', '<=', 20), create('db.pool.utilization', '<=', 80)];
  }
  if (check.id === 'invoice-backlog') return [create('invoice.queue.lag', '<=', 5)];
  const metricId = String(check.metric ?? check.id).split(' + ')[0];
  return [
    create(metricId, '<=', 0, {
      label: metricId,
      category: '历史指标',
      unit: '%',
      editable: false,
    }),
  ];
}

function upgradeCheck(check) {
  if (Array.isArray(check.metricRules)) return clone(check);
  if (!nonEmptyString(check.metric) || !nonEmptyString(check.rule)) return clone(check);
  const { metric: _legacyMetric, rule: _legacyRule, ...rest } = check;
  return { ...clone(rest), metricRules: legacyMetricRules(check) };
}

function upgradePlan(plan) {
  return plan && Array.isArray(plan.checks) ? { ...clone(plan), checks: plan.checks.map(upgradeCheck) } : clone(plan);
}

function upgradeLibraryPlans(value) {
  const upgraded = clone(value);
  if (!upgraded || typeof upgraded !== 'object') return upgraded;
  if (Array.isArray(upgraded.savedInspections)) {
    upgraded.savedInspections = upgraded.savedInspections.map((definition) => ({
      ...definition,
      inspectionPlan: upgradePlan(definition.inspectionPlan),
    }));
  }
  if (Array.isArray(upgraded.runs)) {
    upgraded.runs = upgraded.runs.map((run) => ({ ...run, inspectionPlan: upgradePlan(run.inspectionPlan) }));
  }
  return upgraded;
}

function validPlan(plan) {
  if (
    !plan ||
    typeof plan !== 'object' ||
    !stringArray(plan.checkIds, { allowEmpty: false }) ||
    !Array.isArray(plan.checks) ||
    plan.checks.length !== plan.checkIds.length
  ) {
    return false;
  }
  const checkIds = new Set(plan.checkIds);
  return plan.checks.every(
    (check) =>
      check &&
      typeof check === 'object' &&
      nonEmptyString(check.id) &&
      checkIds.has(check.id) &&
      stringArray(check.sourceRefs) &&
      Array.isArray(check.metricRules) &&
      check.metricRules.length > 0 &&
      check.metricRules.every(validMetricRule),
  );
}

function validBaseline(baseline) {
  return (
    baseline &&
    typeof baseline === 'object' &&
    nonEmptyString(baseline.fingerprint) &&
    stringArray(baseline.entities, { allowEmpty: false }) &&
    stringArray(baseline.checkIds, { allowEmpty: false })
  );
}

function validDefinition(definition) {
  return (
    definition &&
    typeof definition === 'object' &&
    nonEmptyString(definition.id) &&
    Number.isInteger(definition.version) &&
    definition.version > 0 &&
    nonEmptyString(definition.name) &&
    nonEmptyString(definition.createdAt) &&
    nonEmptyString(definition.updatedAt) &&
    nonEmptyString(definition.sourceRunId) &&
    validRequest(definition.request) &&
    Array.isArray(definition.selectedContext) &&
    definition.selectedContext.length > 0 &&
    definition.selectedContext.every(validContextItem) &&
    validPlan(definition.inspectionPlan) &&
    validBaseline(definition.baseline)
  );
}

function validRun(run) {
  return (
    run &&
    typeof run === 'object' &&
    nonEmptyString(run.id) &&
    nonEmptyString(run.taskInstanceId) &&
    run.status === 'locked' &&
    nonEmptyString(run.startedAt) &&
    nonEmptyString(run.completedAt) &&
    Array.isArray(run.selectedContextResults) &&
    validPlan(run.inspectionPlan) &&
    (run.executionResults === undefined ||
      (Array.isArray(run.executionResults) && run.executionResults.every(validExecutionResult))) &&
    validReportContract(run.report)
  );
}

const EXECUTION_RESULT_STATUSES = new Set(['Verified', 'Violated', 'Inconclusive', 'NotEvaluated']);

function validExecutionResult(result) {
  return (
    result &&
    typeof result === 'object' &&
    nonEmptyString(result.id) &&
    nonEmptyString(result.label) &&
    EXECUTION_RESULT_STATUSES.has(result.status) &&
    typeof result.fact === 'string'
  );
}

function normalizeLibrary(value) {
  value = upgradeLibraryPlans(value);
  if (
    !value ||
    value.schemaVersion !== INSPECTION_LIBRARY_SCHEMA_VERSION ||
    !Number.isInteger(value.revision) ||
    value.revision < 0 ||
    !Array.isArray(value.savedInspections) ||
    !Array.isArray(value.runs) ||
    !value.savedInspections.every(validDefinition) ||
    !value.runs.every(validRun)
  ) {
    return null;
  }
  return deepFreeze({
    schemaVersion: INSPECTION_LIBRARY_SCHEMA_VERSION,
    revision: value.revision,
    savedInspections: clone(value.savedInspections),
    runs: clone(value.runs),
  });
}

function createEmptyInspectionLibrary() {
  return deepFreeze({
    schemaVersion: INSPECTION_LIBRARY_SCHEMA_VERSION,
    revision: 0,
    savedInspections: [],
    runs: [],
  });
}

function parseInspectionLibrary(serialized) {
  return parseInspectionLibraryWithDiagnostics(serialized).library;
}

function parseInspectionLibraryWithDiagnostics(serialized) {
  const unavailable = () =>
    deepFreeze({
      library: createEmptyInspectionLibrary(),
      diagnostics: { status: 'unavailable', rejectedRunCount: 0 },
    });
  if (typeof serialized !== 'string' || !serialized.trim()) {
    return deepFreeze({
      library: createEmptyInspectionLibrary(),
      diagnostics: { status: 'available', rejectedRunCount: 0 },
    });
  }
  try {
    const value = upgradeLibraryPlans(JSON.parse(serialized));
    if (
      !value ||
      value.schemaVersion !== INSPECTION_LIBRARY_SCHEMA_VERSION ||
      !Number.isInteger(value.revision) ||
      value.revision < 0 ||
      !Array.isArray(value.savedInspections) ||
      !value.savedInspections.every(validDefinition) ||
      !Array.isArray(value.runs)
    ) {
      return unavailable();
    }
    const validRuns = value.runs.filter(validRun);
    const rejectedRunCount = value.runs.length - validRuns.length;
    return deepFreeze({
      library: {
        schemaVersion: INSPECTION_LIBRARY_SCHEMA_VERSION,
        revision: value.revision,
        savedInspections: clone(value.savedInspections),
        runs: clone(validRuns),
      },
      diagnostics: {
        status: rejectedRunCount ? 'degraded' : 'available',
        rejectedRunCount,
      },
    });
  } catch {
    return unavailable();
  }
}

function serializeInspectionLibrary(library) {
  const normalized = normalizeLibrary(library);
  if (!normalized) throw new TypeError('Invalid inspection library envelope');
  return JSON.stringify(normalized);
}

function contextOption(id, kind, label, detail) {
  return { id, kind, label, detail, selected: true };
}

function createContextOptions(workspace) {
  if (!workspace) return deepFreeze([]);
  const changes = (workspace.contextSources ?? []).map((source) =>
    contextOption(`change:${source.id}`, 'change', source.label, source.detail),
  );
  const services = sortedUnique([
    ...(workspace.declaredChange?.entities ?? []),
    ...(workspace.observedChange?.entities ?? []),
  ]).map((entity) => contextOption(`service:${entity}`, 'service', entity, '本次巡检关联服务'));
  const signals = (workspace.committedChecks ?? []).map((check) =>
    contextOption(
      `signal:${check.id}`,
      'signal',
      check.title ?? check.purpose ?? check.metric ?? check.id,
      check.metric ?? check.purpose ?? check.id,
    ),
  );
  return deepFreeze([...changes, ...services, ...signals]);
}

function toggleContextSelection(options, contextId) {
  const target = options.find((option) => option.id === contextId);
  if (!target) return options;
  if (target.selected && options.filter((option) => option.selected).length === 1) return options;
  if (
    target.selected &&
    target.kind === 'signal' &&
    options.filter((option) => option.kind === 'signal' && option.selected).length === 1
  ) {
    return options;
  }
  return deepFreeze(
    options.map((option) => (option.id === contextId ? { ...option, selected: !option.selected } : option)),
  );
}

function planSnapshot(inspectionPlan) {
  if (!inspectionPlan || !Array.isArray(inspectionPlan.checkIds) || !Array.isArray(inspectionPlan.checks)) {
    throw new TypeError('A locked inspection plan is required');
  }
  return stripRuntimePayload({
    source: inspectionPlan.source,
    sourcePlaybookRef: inspectionPlan.sourcePlaybookRef ? clone(inspectionPlan.sourcePlaybookRef) : null,
    checkIds: [...inspectionPlan.checkIds],
    checks: inspectionPlan.checks,
  });
}

function createSavedInspectionDefinition({
  id,
  name,
  request,
  workspace,
  selectedContext,
  taskInstance,
  sourceRunId,
  now,
  version = 1,
}) {
  if (typeof name !== 'string' || !name.trim()) throw new TypeError('Saved inspection name is required');
  if (!id || !sourceRunId || !now) throw new TypeError('Saved inspection identity and timestamp are required');
  if (taskInstance?.status !== 'locked') throw new TypeError('Only a locked inspection task can be saved');
  const chosen = (selectedContext ?? []).filter((item) => item.selected !== false).map(clone);
  if (!chosen.length) throw new TypeError('At least one selected context item is required');
  return deepFreeze({
    id,
    version,
    name: name.trim(),
    createdAt: now,
    updatedAt: now,
    sourceRunId,
    request: clone(request),
    selectedContext: chosen,
    inspectionPlan: planSnapshot(taskInstance.inspectionPlan),
    baseline: {
      fingerprint: workspace.declaredChange.fingerprint,
      entities: sortedUnique(workspace.observedChange?.entities ?? workspace.declaredChange.entities),
      checkIds: [...taskInstance.inspectionPlan.checkIds],
    },
  });
}

function selectedContextResults(selectedContext) {
  return selectedContext
    .filter((item) => item.selected !== false)
    .map((item) => ({
      contextId: item.id,
      kind: item.kind,
      label: item.label,
      status: 'Verified',
      detail: item.detail,
    }));
}

const REPORT_RESULT_RANK = Object.freeze({ Violated: 0, Inconclusive: 1, NotEvaluated: 1, Verified: 2 });

function missingRuleMeasurement(check, rule) {
  return {
    id: `missing-${check.id}-${rule.metricId.replaceAll('.', '-')}`,
    metricId: rule.metricId,
    label: rule.label,
    entity: check.entity,
    kind: 'qualitative',
    displayValue: '证据不足',
    gate: {
      operator: rule.operator,
      value: rule.threshold,
      unit: rule.unit,
      displayValue: `${rule.operator} ${rule.threshold}${rule.unit}`,
    },
  };
}

function missingCheckResult(check) {
  return {
    checkId: check.id,
    status: 'NotEvaluated',
    summary: `${check.purpose}：证据不足`,
    measurements: check.metricRules.map((rule) => missingRuleMeasurement(check, rule)),
  };
}

function evaluateNumericRule(value, rule) {
  if (rule.operator === '<=') return value <= rule.threshold;
  if (rule.operator === '>=') return value >= rule.threshold;
  if (rule.operator === '<') return value < rule.threshold;
  if (rule.operator === '>') return value > rule.threshold;
  return false;
}

function materializeCheckResult(check, sourceResult) {
  const result = clone(sourceResult ?? missingCheckResult(check));
  const rules = new Map(check.metricRules.map((rule) => [rule.metricId, rule]));
  const sourceMeasurements = new Map(result.measurements.map((measurement) => [measurement.metricId, measurement]));
  const evaluated = [];
  const missingRules = [];
  const ruleMeasurements = check.metricRules.map((rule) => {
    const measurement = sourceMeasurements.get(rule.metricId);
    const requiresNumericEvidence = rule.editable !== false;
    if (
      !measurement ||
      (requiresNumericEvidence && (measurement.kind !== 'numeric' || !Number.isFinite(measurement.value)))
    ) {
      missingRules.push(rule);
      return missingRuleMeasurement(check, rule);
    }
    if (measurement.kind !== 'numeric' || !Number.isFinite(measurement.value)) {
      return measurement;
    }
    const passed = evaluateNumericRule(measurement.value, rule);
    evaluated.push({ measurement, rule, passed });
    return {
      ...measurement,
      metricId: rule.metricId,
      gate: {
        operator: rule.operator,
        value: rule.threshold,
        unit: rule.unit,
        displayValue: `${rule.operator} ${rule.threshold}${rule.unit}`,
      },
      ...(measurement.series ? { series: measurement.series } : {}),
    };
  });
  const contextualMeasurements = result.measurements.filter((measurement) => !rules.has(measurement.metricId));
  const measurements = [...ruleMeasurements, ...contextualMeasurements];
  let status = result.status;
  if (missingRules.length) {
    status = 'NotEvaluated';
  } else if (!['Inconclusive', 'NotEvaluated'].includes(status) && evaluated.length) {
    status = evaluated.every((item) => item.passed) ? 'Verified' : 'Violated';
  }
  const summary = missingRules.length
    ? `${check.purpose}：${missingRules.map((rule) => rule.label).join('、')}证据不足`
    : evaluated.length && !['Inconclusive', 'NotEvaluated'].includes(status)
      ? evaluated
          .map(
            ({ measurement, rule, passed }) =>
              `${rule.label} ${measurement.displayValue}（门禁 ${formatMetricRule(rule)}，${passed ? '通过' : '违例'}）`,
          )
          .join('；')
      : result.summary;
  return { ...result, status, summary, measurements };
}

function hasLockedTrendEvidence(report) {
  return (
    Array.isArray(report?.checkResults) &&
    report.checkResults.every((result) =>
      result.measurements.every(
        (measurement) =>
          measurement.kind !== 'numeric' ||
          (Array.isArray(measurement.series) &&
            measurement.series.length >= 2 &&
            measurement.series.every((point) =>
              Boolean(point && typeof point.label === 'string' && point.label.trim() && Number.isFinite(point.value)),
            )),
      ),
    )
  );
}

function reportCounts(checkResults) {
  return checkResults.reduce(
    (counts, result) => {
      if (result.status === 'Verified') counts.verified += 1;
      else if (result.status === 'Violated') counts.violated += 1;
      else counts.unresolved += 1;
      return counts;
    },
    { verified: 0, violated: 0, unresolved: 0 },
  );
}

function interpretationForResults(report, checkResults, allowSourceNarrative) {
  const evidenceIds = new Set(
    checkResults.flatMap((result) => result.measurements.map((measurement) => measurement.id)),
  );
  const groundSection = (section) => {
    if (!allowSourceNarrative) return { text: '证据不足', evidenceIds: [] };
    const anchors = section?.evidenceIds ?? [];
    return section?.text && anchors.length && anchors.every((id) => evidenceIds.has(id))
      ? { text: section.text, evidenceIds: anchors }
      : { text: '证据不足', evidenceIds: [] };
  };
  const summarizeResults = (results) => {
    const grounded = results.filter((result) => result.measurements.length);
    return grounded.length
      ? {
          text: grounded.map((result) => result.summary).join('；'),
          evidenceIds: grounded.map((result) => result.measurements[0].id),
        }
      : { text: '证据不足', evidenceIds: [] };
  };
  const violated = checkResults.filter((result) => result.status === 'Violated');
  if (violated.length) {
    const whatHappened = groundSection(report.interpretation.whatHappened);
    const recommendedAction = groundSection(report.interpretation.recommendedAction);
    return {
      whatHappened: whatHappened.evidenceIds.length ? whatHappened : summarizeResults(violated),
      likelyCause: groundSection(report.interpretation.likelyCause),
      recommendedAction: recommendedAction.evidenceIds.length
        ? recommendedAction
        : {
            text: '按违例检查的失败动作处置，并在证据恢复前保持当前变更范围。',
            evidenceIds: summarizeResults(violated).evidenceIds,
          },
    };
  }
  const unresolved = checkResults.filter((result) => ['Inconclusive', 'NotEvaluated'].includes(result.status));
  if (unresolved.length) {
    const unresolvedEvidenceIds = unresolved.flatMap((result) =>
      result.measurements.map((measurement) => measurement.id),
    );
    return {
      whatHappened: { text: unresolved.map((result) => result.summary).join('；'), evidenceIds: unresolvedEvidenceIds },
      likelyCause: { text: '证据不足', evidenceIds: [] },
      recommendedAction: {
        text: '保持当前进度，补足未决检查证据后再扩大变更范围。',
        evidenceIds: unresolvedEvidenceIds,
      },
    };
  }
  const verifiedEvidenceIds = checkResults.flatMap((result) =>
    result.measurements.slice(0, 1).map((measurement) => measurement.id),
  );
  const whatHappened = groundSection(report.interpretation.whatHappened);
  const recommendedAction = groundSection(report.interpretation.recommendedAction);
  return {
    whatHappened: whatHappened.evidenceIds.length ? whatHappened : summarizeResults(checkResults),
    likelyCause: groundSection(report.interpretation.likelyCause),
    recommendedAction: recommendedAction.evidenceIds.length
      ? recommendedAction
      : {
          text: '锁定计划内的检查均通过；按当前计划继续，并保持原观察窗口。',
          evidenceIds: verifiedEvidenceIds,
        },
    ...(verifiedEvidenceIds.length ? {} : { whatHappened: { text: '证据不足', evidenceIds: [] } }),
  };
}

function materializedDecision(report, counts, removedConclusiveResult) {
  if (counts.violated > 0) {
    const retainOriginalCopy = report.evidenceVerdict === 'Violated' && !removedConclusiveResult;
    return {
      evidenceVerdict: 'Violated',
      action: 'Pause',
      actionLabel: retainOriginalCopy ? report.actionLabel : '建议暂停并处理违例',
      title: retainOriginalCopy ? report.title : '编辑后的检查门禁发现违例',
      summary: retainOriginalCopy ? report.summary : `锁定计划中有 ${counts.violated} 项检查触及门禁。`,
      rcAgent: retainOriginalCopy ? report.rcAgent : null,
    };
  }
  if (counts.unresolved > 0) {
    return {
      evidenceVerdict: 'Inconclusive',
      action: 'Proceed-with-conditions',
      actionLabel: '建议保持当前进度并继续观察',
      title: '部分检查证据不足',
      summary: `已执行检查未发现违例，但有 ${counts.unresolved} 项证据不足。`,
      rcAgent: null,
    };
  }
  const retainOriginalCopy = report.evidenceVerdict === 'Verified' && !removedConclusiveResult;
  return {
    evidenceVerdict: 'Verified',
    action: 'Proceed',
    actionLabel: retainOriginalCopy ? report.actionLabel : '建议按当前检查计划继续',
    title: retainOriginalCopy ? report.title : '已执行检查未发现关键违例',
    summary: retainOriginalCopy ? report.summary : `锁定计划内的 ${counts.verified} 项检查均通过确定性验证。`,
    rcAgent: null,
  };
}

function materializeReportForPlan(report, inspectionPlan) {
  if (!Array.isArray(report?.checkResults) || !report.interpretation) return clone(report);
  const resultByCheckId = new Map(report.checkResults.map((result) => [result.checkId, result]));
  const checkResults = inspectionPlan.checks.map((check) =>
    materializeCheckResult(check, resultByCheckId.get(check.id)),
  );
  const counts = reportCounts(checkResults);
  const orderedEvidence = [...checkResults].sort(
    (left, right) =>
      REPORT_RESULT_RANK[left.status] - REPORT_RESULT_RANK[right.status] ||
      inspectionPlan.checkIds.indexOf(left.checkId) - inspectionPlan.checkIds.indexOf(right.checkId),
  );
  const planCheckIds = new Set(inspectionPlan.checkIds);
  const removedConclusiveResult = report.checkResults.some(
    (result) => !planCheckIds.has(result.checkId) && ['Verified', 'Violated'].includes(result.status),
  );
  const sourceByCheckId = new Map(report.checkResults.map((result) => [result.checkId, result]));
  const executionTruthChanged =
    removedConclusiveResult ||
    checkResults.some((result) => {
      const source = sourceByCheckId.get(result.checkId);
      if (!source || source.status !== result.status) return true;
      if (source.measurements.length !== result.measurements.length) return true;
      const sourceMeasurements = new Map(source.measurements.map((measurement) => [measurement.id, measurement]));
      return result.measurements.some((measurement) => {
        const sourceMeasurement = sourceMeasurements.get(measurement.id);
        if (!sourceMeasurement || sourceMeasurement.kind !== measurement.kind) return true;
        if (measurement.kind !== 'numeric') return false;
        return (
          sourceMeasurement.gate?.operator !== measurement.gate?.operator ||
          sourceMeasurement.gate?.value !== measurement.gate?.value ||
          sourceMeasurement.gate?.unit !== measurement.gate?.unit
        );
      });
    });
  const hasUnresolved = counts.unresolved > 0;
  const materialized = {
    ...clone(report),
    ...materializedDecision(report, counts, removedConclusiveResult),
    evidenceCounts: counts,
    keyEvidence: orderedEvidence.slice(0, 3).map((result) => result.summary),
    residualRisks: hasUnresolved
      ? checkResults.filter((result) => result.status !== 'Verified').map((result) => result.summary)
      : clone(report.residualRisks),
    checkResults,
    interpretation: interpretationForResults(report, checkResults, !executionTruthChanged),
  };
  if (!validReportContract(materialized)) throw new TypeError('Inspection run requires a valid report contract');
  return materialized;
}

function createInspectionRun({
  id,
  taskInstance,
  definitionId = null,
  selectedContext,
  report,
  startedAt,
  completedAt,
}) {
  if (!id || !startedAt || !completedAt) throw new TypeError('Inspection run identity and timestamps are required');
  if (taskInstance?.status !== 'locked') throw new TypeError('Inspection run requires a locked task');
  const runReport = materializeReportForPlan(report, taskInstance.inspectionPlan);
  if (!hasLockedTrendEvidence(runReport)) {
    throw new TypeError('Inspection run requires persisted trend series for numeric measurements');
  }
  return deepFreeze({
    id,
    taskInstanceId: taskInstance.id,
    definitionId,
    startedAt,
    completedAt,
    status: 'locked',
    selectedContextResults: selectedContextResults(selectedContext ?? []),
    inspectionPlan: planSnapshot(taskInstance.inspectionPlan),
    report: runReport,
  });
}

function chooseDefinition(left, right) {
  if (!left) return right;
  if (!right) return left;
  if (right.version !== left.version) return right.version > left.version ? right : left;
  return String(right.updatedAt).localeCompare(String(left.updatedAt)) > 0 ? right : left;
}

function mergeInspectionLibraries(leftInput, rightInput) {
  const left = normalizeLibrary(leftInput) ?? createEmptyInspectionLibrary();
  const right = normalizeLibrary(rightInput) ?? createEmptyInspectionLibrary();
  const definitions = new Map();
  for (const definition of [...left.savedInspections, ...right.savedInspections]) {
    definitions.set(definition.id, chooseDefinition(definitions.get(definition.id), definition));
  }
  const runs = new Map();
  for (const run of [...left.runs, ...right.runs]) {
    if (!runs.has(run.id)) runs.set(run.id, run);
  }
  const savedInspections = [...definitions.values()].sort((a, b) => a.id.localeCompare(b.id)).map(clone);
  const mergedRuns = [...runs.values()].sort((a, b) => a.id.localeCompare(b.id)).map(clone);
  const rightDefinitions = [...right.savedInspections].sort((a, b) => a.id.localeCompare(b.id));
  const rightRuns = [...right.runs].sort((a, b) => a.id.localeCompare(b.id));
  const incomingAlreadyContainsUnion =
    JSON.stringify(savedInspections) === JSON.stringify(rightDefinitions) &&
    JSON.stringify(mergedRuns) === JSON.stringify(rightRuns);
  return deepFreeze({
    schemaVersion: INSPECTION_LIBRARY_SCHEMA_VERSION,
    revision: Math.max(left.revision, right.revision) + (incomingAlreadyContainsUnion ? 0 : 1),
    savedInspections,
    runs: mergedRuns,
  });
}

function classifySavedInspectionRefresh(definition, workspace) {
  if (!validDefinition(definition) || !workspace) {
    return deepFreeze({ status: 'major-drift', differences: [{ id: 'definition-unavailable', severity: 'blocking' }] });
  }
  const currentCheckIds = new Set((workspace.committedChecks ?? []).map((check) => check.id));
  const missingCheckIds = definition.baseline.checkIds.filter((id) => !currentCheckIds.has(id));
  const fingerprintChanged = workspace.declaredChange?.fingerprint !== definition.baseline.fingerprint;
  if (missingCheckIds.length || fingerprintChanged) {
    return deepFreeze({
      status: 'major-drift',
      differences: [
        ...(missingCheckIds.length
          ? [{ id: 'check-structure', severity: 'blocking', summary: `缺少检查项：${missingCheckIds.join('、')}` }]
          : []),
        ...(fingerprintChanged ? [{ id: 'change-fingerprint', severity: 'blocking', summary: '变更指纹已变化' }] : []),
      ],
    });
  }
  const baselineEntities = new Set(definition.baseline.entities);
  const currentEntities = sortedUnique(workspace.observedChange?.entities ?? workspace.declaredChange?.entities);
  const addedEntities = currentEntities.filter((entity) => !baselineEntities.has(entity));
  const selectedSignalCheckIds = new Set(
    definition.selectedContext
      .filter((item) => item.kind === 'signal' && item.id.startsWith('signal:'))
      .map((item) => item.id.slice('signal:'.length)),
  );
  const extraCheckIds = [...currentCheckIds].filter(
    (id) => selectedSignalCheckIds.has(id) && !definition.baseline.checkIds.includes(id),
  );
  if (addedEntities.length || extraCheckIds.length) {
    return deepFreeze({
      status: 'minor-drift',
      differences: [
        ...addedEntities.map((entity) => ({
          id: `entity:${entity}`,
          severity: 'review',
          summary: `新增关联服务 ${entity}`,
        })),
        ...extraCheckIds.map((id) => ({ id: `check:${id}`, severity: 'review', summary: `新增检查项 ${id}` })),
      ],
    });
  }
  return deepFreeze({ status: 'exact', differences: [] });
}

const RESULT_RANK = Object.freeze({
  Violated: 0,
  Inconclusive: 1,
  NotEvaluated: 1,
  Verified: 2,
});

function selectRunsForDefinition(definition, runs = []) {
  if (!definition) return [];
  const unique = new Map();
  for (const run of runs) {
    if (run?.definitionId === definition.id || run?.id === definition.sourceRunId) unique.set(run.id, run);
  }
  return [...unique.values()].sort(
    (left, right) =>
      String(right.completedAt).localeCompare(String(left.completedAt)) ||
      String(right.id).localeCompare(String(left.id)),
  );
}

function compareExecutionResult(id, before, after) {
  if (!before) return { id, label: after.label, kind: 'added', before: null, after };
  if (!after) return { id, label: before.label, kind: 'removed', before, after: null };
  if (
    before.status === after.status &&
    before.fact === after.fact &&
    before.label === after.label &&
    before.signature === after.signature
  ) {
    return null;
  }
  const beforeRank = RESULT_RANK[before.status];
  const afterRank = RESULT_RANK[after.status];
  const kind = afterRank > beforeRank ? 'improved' : afterRank < beforeRank ? 'worsened' : 'stable';
  return {
    id,
    label: after.label,
    kind,
    before,
    after,
    ...(before.fact === after.fact && before.signature !== after.signature ? { evidenceChanged: true } : {}),
  };
}

function reportComparisonResults(run) {
  if (!Array.isArray(run?.report?.checkResults)) return null;
  const labels = new Map((run.inspectionPlan?.checks ?? []).map((check) => [check.id, check.purpose]));
  return run.report.checkResults.map((result) => ({
    id: result.checkId,
    label: labels.get(result.checkId) ?? result.checkId,
    status: result.status,
    fact: result.summary,
    signature: JSON.stringify({ status: result.status, summary: result.summary, measurements: result.measurements }),
  }));
}

function comparisonResults(run) {
  const reportResults = reportComparisonResults(run);
  if (reportResults) return reportResults;
  if (!Array.isArray(run?.executionResults)) return null;
  return run.executionResults.map((result) => ({ ...result, signature: null }));
}

function compareInspectionRuns(currentRun, previousRun) {
  const currentResults = comparisonResults(currentRun);
  const previousResults = comparisonResults(previousRun);
  if (!currentResults || !previousResults) return null;
  const current = new Map(currentResults.map((result) => [result.id, result]));
  const previous = new Map(previousResults.map((result) => [result.id, result]));
  const ids = [...new Set([...current.keys(), ...previous.keys()])].sort();
  const items = [];
  for (const id of ids) {
    const item = compareExecutionResult(id, previous.get(id), current.get(id));
    if (item) items.push(item);
  }
  return deepFreeze({
    previousRunId: previousRun.id,
    previousCompletedAt: previousRun.completedAt,
    summary: items.length ? 'changed' : 'stable',
    items,
  });
}

function requireWorkspace(state) {
  if (!state.workspace) throw new Error('Inspection workspace is not compiled');
  return state.workspace;
}

function applyRuleOverrides(state, checks) {
  return checks.map((check) => {
    const overrides = state.checkRuleOverrides?.[check.id];
    if (!overrides) return check;
    let changed = false;
    const metricRules = check.metricRules.map((rule) => {
      const override = overrides[rule.id];
      if (!override) return rule;
      changed = true;
      return { ...rule, operator: override.operator, threshold: override.threshold };
    });
    return changed ? { ...check, metricRules } : check;
  });
}

function selectResolvedScope(state) {
  const workspace = requireWorkspace(state);
  return {
    status: workspace.reconciliation.status,
    entities: workspace.blockingScope ?? workspace.reconciliation.blockingEntities,
    addedEntities: workspace.reconciliation.addedEntities,
    coverageGaps: workspace.coverageGaps ?? [],
  };
}

function selectPlanReadiness(state) {
  const workspace = requireWorkspace(state);
  const reconciliationBlocked = ['Conflict', 'Unverifiable'].includes(workspace.reconciliation.status);
  return {
    status: reconciliationBlocked ? 'blocked' : 'ready',
    unresolvedCandidateIds: [],
    reconciliationBlocked,
  };
}

function selectCommittedChecks(state) {
  const workspace = requireWorkspace(state);
  if (state.taskInstance?.inspectionPlan) {
    const checks = state.taskInstance.inspectionPlan.checks;
    const sourceIds = new Set(workspace.contextSources.map((source) => source.id));
    for (const check of checks) assertCheckContract(check, sourceIds);
    return checks;
  }
  const baseChecks =
    state.playbookMatch?.status === 'exact' || state.playbookDecision === 'accepted-with-diff'
      ? state.playbookMatch.checks
      : workspace.committedChecks;
  const selectedBaseChecks = selectChecksForContext(state, baseChecks);
  const acceptedCandidates = workspace.candidateChecks.filter(
    (candidate) => state.candidateDisposition[candidate.id]?.status === 'accepted',
  );
  const checks = applyRuleOverrides(state, [...selectedBaseChecks, ...acceptedCandidates]);
  const sourceIds = new Set(workspace.contextSources.map((source) => source.id));
  for (const check of checks) assertCheckContract(check, sourceIds);
  return checks;
}

function selectChecksForContext(state, checks) {
  const signalOptions = state.contextOptions.filter((item) => item.kind === 'signal');
  if (!signalOptions.length) return checks;
  const selectedSignalIds = new Set(
    signalOptions.filter((item) => item.selected).map((item) => item.id.slice('signal:'.length)),
  );
  return checks.filter((check) => selectedSignalIds.has(check.id));
}

function selectPlanSummary(state) {
  const workspace = requireWorkspace(state);
  const dispositions = state.candidateDisposition;
  const baseChecks =
    state.playbookMatch?.status === 'exact' || state.playbookDecision === 'accepted-with-diff'
      ? state.playbookMatch.checks
      : workspace.committedChecks;
  const selectedBaseChecks = selectChecksForContext(state, baseChecks);
  const pendingCandidates = workspace.candidateChecks.filter((candidate) => !dispositions[candidate.id]);
  const committedChecks = selectCommittedChecks(state);
  const blocking = committedChecks.filter(
    (check) => check.priority === 'required' || check.criticality === 'high',
  ).length;
  const observing = committedChecks.length - blocking;
  const includedCandidateIds = new Set(
    Object.entries(dispositions)
      .filter(([, disposition]) => disposition.status === 'accepted')
      .map(([id]) => id),
  );
  const uncovered = (workspace.coverageGaps ?? []).filter(
    (gap) => !gap.eligibleCandidateId || !includedCandidateIds.has(gap.eligibleCandidateId),
  ).length;
  return {
    required: selectedBaseChecks.filter((check) => check.priority === 'required').length,
    recommended: workspace.candidateChecks.filter((candidate) => dispositions[candidate.id]?.status === 'accepted')
      .length,
    pending: pendingCandidates.length,
    requiredPending: pendingCandidates.filter((candidate) => candidate.criticality === 'high').length,
    optionalPending: pendingCandidates.filter((candidate) => candidate.criticality !== 'high').length,
    rejected: workspace.candidateChecks.filter((candidate) => dispositions[candidate.id]?.status === 'rejected').length,
    blocking,
    observing,
    uncovered,
  };
}

function selectReportView(state) {
  const workspace = requireWorkspace(state);
  if (state.phase !== 'report') return null;
  return state.library.runs.find((run) => run.id === state.currentRunId)?.report ?? workspace.report;
}

function selectPlaybookView(state) {
  const matchVisible =
    state.phase === 'context' && Boolean(state.playbookMatch) && state.playbookDecision !== 'dismissed';
  return {
    match: matchVisible ? state.playbookMatch : null,
    reference: state.playbookDecision === 'regenerated' ? state.playbookMatch : null,
    decision: state.playbookDecision,
    driftReviewed: state.playbookDriftReviewed,
    taskInstance: state.taskInstance,
    proposal: state.playbookProposal,
  };
}

function selectSavedInspectionView(state) {
  const savedInspections = [...state.library.savedInspections].sort((left, right) =>
    String(right.updatedAt).localeCompare(String(left.updatedAt)),
  );
  const currentRun = state.library.runs.find((run) => run.id === state.currentRunId) ?? null;
  const historyDefinition =
    savedInspections.find((definition) => definition.id === state.activeHistoryDefinitionId) ?? null;
  const historyRuns = selectRunsForDefinition(historyDefinition, state.library.runs);
  const reportDefinitionId = state.activeSavedInspectionId ?? state.savedDefinitionId;
  const reportDefinition = savedInspections.find((definition) => definition.id === reportDefinitionId) ?? null;
  const reportRuns = selectRunsForDefinition(reportDefinition, state.library.runs);
  const currentRunIndex = currentRun ? reportRuns.findIndex((run) => run.id === currentRun.id) : -1;
  const comparison =
    currentRunIndex >= 0 && reportRuns[currentRunIndex + 1]
      ? compareInspectionRuns(currentRun, reportRuns[currentRunIndex + 1])
      : null;
  return {
    definitions: savedInspections,
    runs: state.library.runs,
    cards: savedInspections.map((definition) => {
      const definitionRuns = selectRunsForDefinition(definition, state.library.runs);
      return { definition, runs: definitionRuns, latestRun: definitionRuns[0] ?? null };
    }),
    activeDefinition: savedInspections.find((definition) => definition.id === state.activeSavedInspectionId) ?? null,
    historyDefinition,
    historyRuns,
    historyDiagnostics: state.historyDiagnostics,
    reportDefinition,
    comparison,
    refresh: state.savedRunRefresh,
    contextOptions: state.contextOptions,
    selectedContext: state.contextOptions.filter((item) => item.selected),
    currentRun,
    savedDefinitionId: state.savedDefinitionId,
    composerPrefill: state.composerPrefill,
    conversation: state.conversation,
    storageError: state.storageError,
    toast: state.toast,
  };
}

function selectViewModel(state) {
  if (!state.workspace) {
    return {
      state,
      workspace: null,
      scope: null,
      readiness: null,
      committedChecks: [],
      planSummary: null,
      report: null,
      playbook: selectPlaybookView(state),
      savedInspection: selectSavedInspectionView(state),
    };
  }
  return {
    state,
    workspace: state.workspace,
    scope: selectResolvedScope(state),
    readiness: selectPlanReadiness(state),
    committedChecks: selectCommittedChecks(state),
    planSummary: selectPlanSummary(state),
    report: selectReportView(state),
    playbook: selectPlaybookView(state),
    savedInspection: selectSavedInspectionView(state),
  };
}

function createDemoSession(options = {}) {
  const library = options.library
    ? mergeInspectionLibraries(createEmptyInspectionLibrary(), options.library)
    : createEmptyInspectionLibrary();
  return deepFreeze({
    workspace: null,
    phase: 'intake',
    candidateDisposition: {},
    checkRuleOverrides: {},
    rcExpanded: false,
    playbookMatch: null,
    playbookDecision: null,
    playbookDriftReviewed: false,
    playbookProposal: null,
    taskInstance: null,
    library,
    contextOptions: [],
    conversation: [],
    activeRequest: null,
    activeSavedInspectionId: null,
    activeHistoryDefinitionId: null,
    savedRunRefresh: null,
    composerPrefill: options.composerPrefill ?? null,
    currentRunId: null,
    savedDefinitionId: null,
    storageError: null,
    toast: null,
    shareToast: null,
    historyDiagnostics: {
      status: options.historyDiagnostics?.status ?? 'available',
      rejectedRunCount: options.historyDiagnostics?.rejectedRunCount ?? 0,
    },
    actorId: normalizeActorId(options.actorId),
    nextTaskOrdinal:
      options.nextTaskOrdinal ??
      nextOrdinal(
        library.runs.map((run) => run.taskInstanceId),
        'INS',
        48,
      ),
    nextRunOrdinal:
      options.nextRunOrdinal ??
      nextOrdinal(
        library.runs.map((run) => run.id),
        'RUN',
        48,
      ),
    nextSavedOrdinal:
      options.nextSavedOrdinal ??
      nextOrdinal(
        library.savedInspections.map((definition) => definition.id),
        'SAVED',
        1,
      ),
  });
}

function nextOrdinal(ids, prefix, fallback) {
  const ordinals = ids
    .map((id) => new RegExp(`^${prefix}-(\\d+)(?:$|-)`).exec(String(id))?.[1])
    .filter(Boolean)
    .map(Number);
  return ordinals.length ? Math.max(...ordinals) + 1 : fallback;
}

function normalizeActorId(actorId) {
  return typeof actorId === 'string' ? actorId.replace(/[^a-zA-Z0-9]/g, '') : '';
}

function scopedId(prefix, ordinal, width, actorId) {
  const base = `${prefix}-${String(ordinal).padStart(width, '0')}`;
  return actorId ? `${base}-${actorId}` : base;
}

function taskId(ordinal, actorId) {
  return scopedId('INS', ordinal, 4, actorId);
}

function runId(ordinal, actorId) {
  return scopedId('RUN', ordinal, 4, actorId);
}

function savedInspectionId(ordinal, actorId) {
  return scopedId('SAVED', ordinal, 3, actorId);
}

function demoTimestamp(ordinal, offset = 0) {
  return new Date(Date.UTC(2026, 7, 16, 6, ordinal + offset)).toISOString();
}

function createTaskInstance(ordinal, sourceSavedInspectionId = null, actorId = '') {
  const id = taskId(ordinal, actorId);
  return {
    id,
    status: 'draft',
    startedAt: demoTimestamp(ordinal),
    sourceSavedInspectionId,
    sourcePlaybookRef: null,
    referencePlaybookRef: null,
    inspectionPlan: null,
    auditTrail: [{ type: 'task-created', taskInstanceId: id }],
  };
}

function updateTaskInstance(taskInstance, patch, auditEvent) {
  if (!taskInstance || taskInstance.status === 'locked') return taskInstance;
  return {
    ...taskInstance,
    ...patch,
    auditTrail: auditEvent ? [...taskInstance.auditTrail, auditEvent] : taskInstance.auditTrail,
  };
}

function playbookRef(match) {
  return match ? { ...match.playbookRef } : null;
}

function snapshotChecks(checks) {
  return checks.map((check) => ({
    ...check,
    sourceRefs: [...check.sourceRefs],
    metricRules: check.metricRules.map((rule) => ({
      ...rule,
      allowedOperators: [...rule.allowedOperators],
    })),
  }));
}

function createInspectionPlan(checks, sourcePlaybookRef = null, sourceSavedInspectionId = null) {
  return {
    source: sourceSavedInspectionId ? 'saved-inspection' : sourcePlaybookRef ? 'approved-playbook' : 'generated',
    sourcePlaybookRef: sourcePlaybookRef ? { ...sourcePlaybookRef } : null,
    sourceSavedInspectionId,
    checkIds: checks.map((check) => check.id),
    checks: snapshotChecks(checks),
  };
}

function reconciliationAllowsExecution(workspace) {
  return workspace && !['Conflict', 'Unverifiable'].includes(workspace.reconciliation.status);
}

function disposeCandidate(state, action) {
  if (state.phase !== 'plan' || !state.workspace) return state;
  const candidate = state.workspace.candidateChecks.find((item) => item.id === action.candidateId);
  if (!candidate || !['accepted', 'rejected'].includes(action.disposition)) {
    return state;
  }
  const reason = action.reason?.trim() ?? '';
  if (action.disposition === 'rejected' && !reason) return state;
  return {
    ...state,
    candidateDisposition: {
      ...state.candidateDisposition,
      [candidate.id]: {
        status: action.disposition,
        reason: reason || null,
      },
    },
  };
}

function includeCandidate(state, action) {
  if (state.phase !== 'plan' || !state.workspace) return state;
  const candidate = state.workspace.candidateChecks.find((item) => item.id === action.candidateId);
  if (!candidate || candidate.ruleSourceAuthority !== 'approved') return state;
  const matchingGap = state.workspace.coverageGaps?.find((gap) => gap.eligibleCandidateId === candidate.id);
  if (state.workspace.coverageGaps?.some((gap) => gap.entity === candidate.entity) && !matchingGap) return state;
  return {
    ...state,
    candidateDisposition: {
      ...state.candidateDisposition,
      [candidate.id]: { status: 'accepted', reason: '用户在锁定前显式加入' },
    },
  };
}

function excludeCandidate(state, action) {
