<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="AI 巡检任务生成与解读 Copilot 离线产品 Demo"
    />
    <title>AI 巡检 Copilot · 离线产品 Demo</title>
      <style>
:root {
  color-scheme: dark;
  --bg: #07101f;
  --bg-soft: #0a1629;
  --surface: rgba(14, 29, 51, 0.88);
  --surface-strong: #10233d;
  --surface-hover: #142c4a;
  --line: rgba(144, 177, 219, 0.16);
  --line-strong: rgba(144, 177, 219, 0.28);
  --text: #edf6ff;
  --text-soft: #9fb3ca;
  --text-faint: #6f87a3;
  --cyan: #5ae7d2;
  --cyan-soft: rgba(90, 231, 210, 0.13);
  --blue: #6d91ff;
  --blue-soft: rgba(109, 145, 255, 0.14);
  --amber: #f6ba5b;
  --amber-soft: rgba(246, 186, 91, 0.14);
  --red: #ff6d7f;
  --red-soft: rgba(255, 109, 127, 0.14);
  --green: #72e6a6;
  --green-soft: rgba(114, 230, 166, 0.12);
  --radius-sm: 10px;
  --radius: 16px;
  --radius-lg: 24px;
  --shadow: 0 24px 80px rgba(0, 0, 0, 0.28);
  --font: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
}

* {
  box-sizing: border-box;
}
html {
  min-width: 320px;
  scroll-behavior: smooth;
}
body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at 12% -10%, rgba(65, 126, 226, 0.2), transparent 34%),
    radial-gradient(circle at 88% 0%, rgba(47, 205, 179, 0.12), transparent 30%), var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
}
button,
input,
textarea {
  font: inherit;
}
button {
  color: inherit;
}
a {
  color: inherit;
  text-decoration: none;
}
code {
  font-family: var(--mono);
}
h1,
h2,
h3,
h4,
p {
  margin-top: 0;
}
button:focus-visible,
a:focus-visible {
  outline: 2px solid var(--cyan);
  outline-offset: 3px;
}

.app-shell {
  width: min(1760px, 100%);
  margin: 0 auto;
  padding: 20px 26px 0;
}
.app-header {
  min-height: 68px;
  display: grid;
  grid-template-columns: 250px 1fr auto;
  align-items: center;
  gap: 24px;
  border-bottom: 1px solid var(--line);
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand > span {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(90, 231, 210, 0.38);
  border-radius: 11px;
  background: linear-gradient(145deg, rgba(90, 231, 210, 0.19), rgba(109, 145, 255, 0.14));
  color: var(--cyan);
  font-weight: 800;
  box-shadow: inset 0 0 20px rgba(90, 231, 210, 0.08);
}
.brand div {
  display: flex;
  flex-direction: column;
  letter-spacing: 0.08em;
}
.brand strong {
  font-size: 15px;
}
.brand small {
  color: var(--text-faint);
  font-size: 9px;
}
.title-lockup {
  min-width: 0;
}
.title-lockup span {
  color: var(--cyan);
  font: 600 10px / 1 var(--mono);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.title-lockup h1 {
  margin: 0;
  overflow: hidden;
  font-size: 18px;
  font-weight: 600;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.offline-badge {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 8px 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--text-soft);
  font: 600 10px / 1 var(--mono);
}
.offline-badge span {
  color: var(--cyan);
}
.phase-rail {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  margin: 0;
  padding: 18px 0;
  list-style: none;
}
.workspace {
  display: grid;
  grid-template-columns: minmax(240px, 0.72fr) minmax(480px, 1.85fr) minmax(270px, 0.8fr);
  gap: 14px;
  align-items: start;
}
.workspace.is-home {
  grid-template-columns: minmax(0, 1fr) minmax(300px, 0.38fr);
}
.panel {
  min-width: 0;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: linear-gradient(160deg, rgba(16, 35, 61, 0.92), rgba(9, 21, 39, 0.92));
  box-shadow: var(--shadow);
}
.context-panel,
.copilot-panel {
  position: sticky;
  top: 14px;
}
.context-panel {
  padding: 18px;
}
.stage-panel {
  min-height: 600px;
  padding: clamp(20px, 3vw, 34px);
}
.copilot-panel {
  overflow: hidden;
}
.app-footer {
  display: flex;
  justify-content: space-between;
  gap: 24px;
  margin-top: 18px;
  padding: 16px 2px 18px;
  border-top: 1px solid var(--line);
  color: var(--text-faint);
  font-size: 11px;
}
.app-footer strong {
  color: var(--text-soft);
  font-weight: 500;
}

.phase-step {
  position: relative;
  display: flex;
  align-items: center;
  gap: 9px;
  color: var(--text-faint);
  font-size: 11px;
}
.phase-step::after {
  position: absolute;
  right: 12px;
  left: 38px;
  height: 1px;
  background: var(--line);
  content: "";
}
.phase-step:last-child::after {
  display: none;
}
.phase-step > span {
  position: relative;
  z-index: 1;
  width: 27px;
  height: 27px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line-strong);
  border-radius: 50%;
  background: var(--bg-soft);
  font: 600 9px / 1 var(--mono);
}
.phase-step.is-current {
  color: var(--text);
}
.phase-step.is-current > span {
  border-color: var(--cyan);
  background: var(--cyan-soft);
  color: var(--cyan);
  box-shadow: 0 0 18px rgba(90, 231, 210, 0.16);
}
.phase-step.is-done > span {
  border-color: rgba(114, 230, 166, 0.44);
  background: var(--green-soft);
  color: var(--green);
}
.panel-heading,
.stage-heading {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
}
.panel-heading h2,
.stage-heading h2 {
  margin: 5px 0 0;
  font-size: 17px;
}
.module-tag {
  color: var(--cyan);
  font: 600 9px / 1 var(--mono);
  letter-spacing: 0.07em;
  text-transform: uppercase;
}
.source-status,
.readiness {
  flex: 0 0 auto;
  padding: 6px 8px;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--text-faint);
  font: 600 9px / 1 var(--mono);
}
.source-status.is-ready,
.readiness.ready {
  border-color: rgba(114, 230, 166, 0.35);
  background: var(--green-soft);
  color: var(--green);
}
.readiness.blocked {
  border-color: rgba(246, 186, 91, 0.35);
  background: var(--amber-soft);
  color: var(--amber);
}
.prompt-card {
  margin: 20px 0 16px;
  padding: 14px;
  border: 1px solid rgba(109, 145, 255, 0.25);
  border-radius: var(--radius-sm);
  background: var(--blue-soft);
}
.prompt-card span,
.hypothesis-block > span,
.copilot-message > span,
.copilot-principles > span {
  color: var(--blue);
  font: 600 9px / 1 var(--mono);
  letter-spacing: 0.07em;
  text-transform: uppercase;
}
.prompt-card p {
  margin: 8px 0 0;
  color: #dbe8ff;
  font-size: 13px;
  line-height: 1.6;
}
.change-facts {
  display: grid;
  gap: 11px;
  margin: 0;
}
.change-facts div {
  min-width: 0;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
}
.change-facts dt {
  margin-bottom: 4px;
  color: var(--text-faint);
  font-size: 10px;
}
.change-facts dd {
  margin: 0;
  color: var(--text-soft);
  font-size: 12px;
  line-height: 1.45;
}
.change-facts code {
  overflow-wrap: anywhere;
  color: #bed1ff;
  font-size: 10px;
}
.reconciliation {
  margin-top: 16px;
  padding: 13px;
  border: 1px solid;
  border-radius: var(--radius-sm);
}
.reconciliation.is-exact {
  border-color: rgba(114, 230, 166, 0.3);
  background: var(--green-soft);
}
.reconciliation.is-expanded {
  border-color: rgba(246, 186, 91, 0.3);
  background: var(--amber-soft);
}
.reconciliation span {
  display: block;
  color: var(--text-faint);
  font: 600 9px / 1 var(--mono);
}
.reconciliation strong {
  display: block;
  margin-top: 6px;
  color: var(--text);
}
.reconciliation p {
  margin: 5px 0 0;
  color: var(--text-soft);
  font-size: 11px;
  line-height: 1.5;
}
.entity-cloud {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 12px 0 0;
  padding: 0;
  list-style: none;
}
.entity-cloud li {
  padding: 5px 7px;
  border: 1px solid var(--line);
  border-radius: 7px;
  color: var(--text-soft);
  font: 9px / 1 var(--mono);
}
.context-placeholder {
  display: grid;
  min-height: 430px;
  place-items: center;
  align-content: center;
  padding: 24px;
  text-align: center;
}
.context-placeholder > span {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line-strong);
  border-radius: 14px;
  color: var(--text-faint);
  font: 700 10px / 1 var(--mono);
}
.context-placeholder strong {
  margin-top: 16px;
  font-size: 13px;
}
.context-placeholder p {
  max-width: 220px;
  margin: 8px 0 0;
  color: var(--text-faint);
  font-size: 10px;
  line-height: 1.55;
}
.product-intake {
  max-width: 780px;
  margin: 0 auto;
  padding: 18px 0 8px;
}
.product-intake h2 {
  margin: 0 0 8px;
  font-size: 18px;
  font-weight: 600;
}
.intake-lead {
  max-width: 650px;
  margin: 0;
  color: var(--text-soft);
  line-height: 1.5;
}
.intent-form {
  display: grid;
  gap: 14px;
  margin-top: 18px;
  padding: 18px;
  border: 1px solid rgba(90, 231, 210, 0.24);
  border-radius: var(--radius-lg);
  background: rgba(7, 16, 31, 0.42);
}
.intent-form label {
  display: grid;
  gap: 8px;
}
.intent-form label > span {
  color: var(--text-soft);
  font-size: 10px;
  font-weight: 700;
}
.intent-form textarea,
.intent-form input {
  width: 100%;
  border: 1px solid var(--line-strong);
  border-radius: 10px;
  outline: 0;
  background: rgba(7, 16, 31, 0.72);
  color: var(--text);
}
.intent-form textarea {
  min-height: 112px;
  resize: vertical;
  padding: 14px;
  line-height: 1.6;
}
.intent-form input {
  padding: 11px 12px;
}
.intent-form textarea:focus,
.intent-form input:focus {
  border-color: var(--cyan);
  box-shadow: 0 0 0 3px rgba(90, 231, 210, 0.1);
}
.intent-fields {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}
.compile-button {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 13px 15px;
  border: 1px solid rgba(90, 231, 210, 0.42);
  border-radius: 10px;
  background: linear-gradient(135deg, rgba(90, 231, 210, 0.24), rgba(109, 145, 255, 0.18));
  color: #ecfffc;
  cursor: pointer;
  font-weight: 800;
}
.compile-button b {
  color: var(--cyan);
  font-size: 17px;
}
.compile-button:disabled {
  border-color: var(--line);
  background: rgba(111, 135, 163, 0.08);
  color: var(--text-faint);
  cursor: not-allowed;
}
.example-area {
  margin-top: 24px;
}
.example-area > div:first-child {
  display: flex;
  gap: 9px;
  align-items: baseline;
}
.example-area > div:first-child strong {
  font-size: 11px;
}
.example-area > div:first-child span {
  color: var(--text-faint);
  font-size: 9px;
}
.example-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin-top: 10px;
}
.example-fill {
  min-width: 0;
  padding: 13px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: rgba(7, 16, 31, 0.46);
  text-align: left;
  cursor: pointer;
}
.example-fill:hover {
  border-color: rgba(90, 231, 210, 0.38);
  background: var(--surface-hover);
}
.example-fill span,
.example-fill strong,
.example-fill small {
  display: block;
}
.example-fill span {
  color: var(--cyan);
  font: 700 8px / 1 var(--mono);
  text-transform: uppercase;
}
.example-fill strong {
  margin: 7px 0 5px;
  font-size: 11px;
}
.example-fill small {
  overflow: hidden;
  color: var(--text-faint);
  font-size: 9px;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.edit-intent {
  margin-top: 16px;
  padding: 8px 11px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: transparent;
  color: var(--text-soft);
  cursor: pointer;
  font-size: 10px;
}
.stage-empty {
  display: grid;
  min-height: 420px;
  place-items: center;
  align-content: center;
  text-align: center;
}
.stage-orb {
  width: 74px;
  height: 74px;
  display: grid;
  place-items: center;
  margin-bottom: 18px;
  border: 1px solid rgba(90, 231, 210, 0.38);
  border-radius: 24px;
  background: linear-gradient(145deg, rgba(90, 231, 210, 0.18), rgba(109, 145, 255, 0.16));
  color: var(--cyan);
  font-size: 28px;
  box-shadow: 0 20px 60px rgba(48, 168, 170, 0.12);
}
.stage-kicker {
  color: var(--cyan);
  font: 600 10px / 1 var(--mono);
  text-transform: uppercase;
}
.stage-empty h2 {
  margin-bottom: 10px;
  font-size: 18px;
  font-weight: 600;
}
.stage-empty > p:not(.stage-kicker) {
  max-width: 560px;
  color: var(--text-soft);
  line-height: 1.7;
}
.understanding-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
  width: 100%;
  margin-top: 28px;
  text-align: left;
}
.understanding-grid div {
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: rgba(7, 16, 31, 0.45);
}
.understanding-grid span {
  display: block;
  margin-bottom: 7px;
  color: var(--text-faint);
  font-size: 9px;
}
.understanding-grid strong {
  font-size: 11px;
  line-height: 1.45;
}
.scope-stage > h2 {
  margin: 0 0 14px;
  font-size: 18px;
  font-weight: 600;
}
.playbook-match {
  margin-bottom: 28px;
  padding: 20px;
  border: 1px solid;
  border-radius: var(--radius);
  background: rgba(7, 16, 31, 0.48);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.025);
}
.playbook-match.exact {
  border-color: rgba(114, 230, 166, 0.34);
  background: linear-gradient(145deg, var(--green-soft), rgba(7, 16, 31, 0.48));
}
.playbook-match.minor-drift {
  border-color: rgba(246, 186, 91, 0.38);
  background: linear-gradient(145deg, var(--amber-soft), rgba(7, 16, 31, 0.48));
}
.playbook-match.major-drift {
  border-color: rgba(255, 109, 127, 0.42);
  background: linear-gradient(145deg, var(--red-soft), rgba(7, 16, 31, 0.5));
}
.playbook-match-header {
  display: flex;
  justify-content: space-between;
  gap: 18px;
  align-items: flex-start;
}
.playbook-match-header h2 {
  margin: 7px 0 0;
  font-size: 18px;
  font-weight: 600;
}
.match-state {
  color: var(--text-faint);
  font-size: 9px;
  font-weight: 700;
}
.playbook-signals,
.playbook-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
.playbook-signals .readiness {
  border-color: var(--line-strong);
  background: rgba(7, 16, 31, 0.36);
}
.playbook-identity {
  display: flex;
  gap: 9px;
  align-items: baseline;
  margin-top: 19px;
}
.playbook-identity > span {
  color: var(--text-faint);
  font: 600 9px / 1 var(--mono);
  text-transform: uppercase;
}
.playbook-identity > strong {
  font-size: 14px;
}
.playbook-summary,
.playbook-freshness {
  color: var(--text-soft);
  line-height: 1.6;
}
.playbook-structure-note {
  display: flex;
  gap: 7px;
  align-items: center;
  margin: 14px 0 10px;
  color: var(--text-faint);
  font-size: 9px;
}
.info-tip {
  color: var(--cyan);
  cursor: help;
}
.single-line-note {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.playbook-summary {
  margin: 9px 0 15px;
}
.playbook-freshness {
  margin: 16px 0;
  padding-top: 13px;
  border-top: 1px solid var(--line);
  font-size: 10px;
}
.playbook-validation {
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: rgba(7, 16, 31, 0.38);
}
.playbook-validation summary {
  display: flex;
  justify-content: space-between;
  padding: 12px 14px;
  cursor: pointer;
  color: var(--green);
  font-size: 11px;
  font-weight: 700;
}
.playbook-validation summary span {
  color: var(--text-faint);
  font-weight: 500;
}
.playbook-validation ul,
.playbook-difference-list {
  display: grid;
  gap: 8px;
  margin: 0;
  padding: 0;
  list-style: none;
}
.playbook-validation ul {
  padding: 0 14px 14px;
}
.playbook-validation li,
.playbook-difference-list li {
  display: grid;
  gap: 5px;
  padding: 11px 12px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: rgba(7, 16, 31, 0.42);
}
.playbook-validation li span,
.playbook-difference-list li span {
  color: var(--text-faint);
  font: 600 9px / 1 var(--mono);
  text-transform: uppercase;
}
.playbook-validation li strong,
.playbook-difference-list li strong {
  font-size: 11px;
  line-height: 1.5;
}
.playbook-difference-list li.review span {
  color: var(--amber);
}
.playbook-difference-list li.blocking span {
  color: var(--red);
}
.playbook-drawer {
  display: none;
}
.playbook-reviewed {
  margin: 11px 0 0;
  color: var(--green);
  font-size: 10px;
}
.playbook-review-drift,
.playbook-dismiss,
.playbook-proposal-action {
  border: 0;
  background: none;
  cursor: pointer;
}
.playbook-review-drift {
  margin-top: 11px;
  padding: 0;
  color: var(--text-soft);
  font-size: 10px;
  font-weight: 700;
}
.playbook-primary {
  min-width: 225px;
}
.playbook-dismiss {
  padding: 9px 4px;
  color: var(--text-soft);
  font-size: 10px;
  text-decoration: underline;
  text-underline-offset: 4px;
}
.scope-stage > p,
.stage-lead {
  color: var(--text-soft);
  line-height: 1.65;
}
.impact-block {
  margin: 22px 0;
  padding: 16px;
  border: 1px solid rgba(90, 231, 210, 0.24);
  border-radius: var(--radius);
  background: rgba(7, 16, 31, 0.42);
}
.impact-block > header span {
  color: var(--cyan);
  font: 700 8px / 1 var(--mono);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.impact-block > header h3 {
  margin: 0;
  font-size: 15px;
}
.impact-matrix {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 9px;
  margin-top: 13px;
}
.impact-matrix article {
  min-width: 0;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: rgba(7, 16, 31, 0.52);
}
.impact-matrix span,
.impact-matrix small {
  display: block;
  color: var(--text-faint);
  font-size: 8px;
}
.impact-matrix strong {
  display: block;
  margin: 7px 0;
  color: #e3f7f4;
  font-size: 10px;
  line-height: 1.45;
  overflow-wrap: anywhere;
}
.source-list {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin: 24px 0;
  padding: 0;
  list-style: none;
}
.source-card {
  min-width: 0;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);

  'metric',
  'window',
  'baseline',
  'rule',

function deepFreeze(value) {
  if (!value || typeof value !== 'object' || Object.isFrozen(value)) {
    return value;
  }
  for (const child of Object.values(value)) deepFreeze(child);
  return Object.freeze(value);
}

function sortedUnique(values = []) {
  return [...new Set(values.filter(Boolean))].sort((left, right) => left.localeCompare(right));

    const missing =
      value === undefined || value === null || value === '' || (Array.isArray(value) && value.length === 0);
    if (missing) throw new Error(`Check ${check?.id ?? 'unknown'} missing ${field}`);

function extractService(prompt) {
  return (
    prompt.match(/\b[a-z][a-z0-9-]*(?:-api|-service|-worker|-gateway)\b/i)?.[0] ??
    prompt.match(/\b[a-z][a-z0-9]+-[a-z0-9-]+\b/i)?.[0] ??
    'target-service'
  );
}

function extractServices(prompt) {
  const servicePattern = /\b[a-z][a-z0-9-]*(?:-api|-service|-worker|-gateway)\b/gi;
  return [...new Set([...prompt.matchAll(servicePattern)].map(([service]) => service.toLowerCase()))];
}

function extractVersion(prompt) {
  return prompt.match(/\bv\d+(?:\.\d+)+\b/i)?.[0] ?? '待确认版本';
}

function normalizeRequest(request) {
  const prompt = request?.prompt?.trim() ?? '';
  if (!prompt) throw new Error('Inspection intent is required');
  return {
    prompt,
    targetService: request?.targetService?.trim() || extractService(prompt),
    contextReference: request?.contextReference?.trim() ?? '',
  };
}

function compileInspectionRequest(input) {

  return deepFreeze(workspace);
}

function resolveApprovedChecks(playbook, workspace) {
  const currentChecks = new Map(workspace.committedChecks.map((check) => [check.id, check]));
  const checkIds = [...playbook.checkIds];
  return {
    checkIds,
    checks: checkIds.flatMap((checkId) => {
      const check = currentChecks.get(checkId);
      return check ? [check] : [];
    }),
    unresolvedCheckIds: checkIds.filter((checkId) => !currentChecks.has(checkId)),
  };
}

function snapshot(playbook, workspace, input) {
  return deepFreeze({
    playbookRef: { id: playbook.id, version: playbook.version },
    title: playbook.title,
    scenarioKey: playbook.scenarioKey,
    approvedAt: playbook.approvedAt,
    lastUsedAt: playbook.lastUsedAt,
    lastUsedLabel: relativeDayLabel(playbook.lastUsedAt),
    ...resolveApprovedChecks(playbook, workspace),
    ...input,
  });
}
