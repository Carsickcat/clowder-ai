<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />

    <title>AI 巡检 Copilot · 离线产品 Demo</title>
      <style>
:root {
  color-scheme: dark;
  --bg: #07101f;
  --bg-soft: #0a1629;
  --surface: rgba(14, 29, 51, 0.88);
  --surface-strong: #10233d;
  --surface-hover: #142c4a;
  --line: rgba(144, 177, 219, 0.16);
  --line-strong: rgba(144, 177, 219, 0.28);
  --text: #edf6ff;
  --text-soft: #9fb3ca;
  --text-faint: #6f87a3;
  --cyan: #5ae7d2;
  --cyan-soft: rgba(90, 231, 210, 0.13);
  --blue: #6d91ff;
  --blue-soft: rgba(109, 145, 255, 0.14);
  --amber: #f6ba5b;
  --amber-soft: rgba(246, 186, 91, 0.14);
  --red: #ff6d7f;
  --red-soft: rgba(255, 109, 127, 0.14);
  --green: #72e6a6;
  --green-soft: rgba(114, 230, 166, 0.12);
  --radius-sm: 10px;
  --radius: 16px;
  --radius-lg: 24px;
  --shadow: 0 24px 80px rgba(0, 0, 0, 0.28);
  --font: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
}

* { box-sizing: border-box; }
html { min-width: 320px; scroll-behavior: smooth; }
body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at 12% -10%, rgba(65, 126, 226, 0.2), transparent 34%),
    radial-gradient(circle at 88% 0%, rgba(47, 205, 179, 0.12), transparent 30%),
    var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
}
button, input, textarea { font: inherit; }
button { color: inherit; }
a { color: inherit; text-decoration: none; }
code { font-family: var(--mono); }
h1, h2, h3, h4, p { margin-top: 0; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }

.app-shell { width: min(1760px, 100%); margin: 0 auto; padding: 20px 26px 0; }
.app-header { min-height: 68px; display: grid; grid-template-columns: 250px 1fr auto; align-items: center; gap: 24px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 12px; }
.brand > span { width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid rgba(90, 231, 210, 0.38); border-radius: 11px; background: linear-gradient(145deg, rgba(90, 231, 210, 0.19), rgba(109, 145, 255, 0.14)); color: var(--cyan); font-weight: 800; box-shadow: inset 0 0 20px rgba(90, 231, 210, 0.08); }
.brand div { display: flex; flex-direction: column; letter-spacing: 0.08em; }
.brand strong { font-size: 15px; }
.brand small { color: var(--text-faint); font-size: 9px; }
.title-lockup { min-width: 0; }
.title-lockup span { color: var(--cyan); font: 600 10px/1 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; }
.title-lockup h1 { margin: 5px 0 0; overflow: hidden; font-size: clamp(17px, 2vw, 22px); text-overflow: ellipsis; white-space: nowrap; }
.offline-badge { display: flex; align-items: center; gap: 7px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 999px; color: var(--text-soft); font: 600 10px/1 var(--mono); }
.offline-badge span { color: var(--cyan); }
.phase-rail { display: grid; grid-template-columns: repeat(5, 1fr); margin: 0; padding: 18px 0; list-style: none; }
.workspace { display: grid; grid-template-columns: minmax(240px, 0.72fr) minmax(480px, 1.85fr) minmax(270px, 0.8fr); gap: 14px; align-items: start; }
.panel { min-width: 0; border: 1px solid var(--line); border-radius: var(--radius); background: linear-gradient(160deg, rgba(16, 35, 61, 0.92), rgba(9, 21, 39, 0.92)); box-shadow: var(--shadow); }
.context-panel, .copilot-panel { position: sticky; top: 14px; }
.context-panel { padding: 18px; }
.stage-panel { min-height: 670px; padding: clamp(20px, 3vw, 34px); }
.copilot-panel { overflow: hidden; }
.app-footer { display: flex; justify-content: space-between; gap: 24px; margin-top: 18px; padding: 16px 2px 18px; border-top: 1px solid var(--line); color: var(--text-faint); font-size: 11px; }
.app-footer strong { color: var(--text-soft); font-weight: 500; }

.phase-step { position: relative; display: flex; align-items: center; gap: 9px; color: var(--text-faint); font-size: 11px; }
.phase-step::after { position: absolute; right: 12px; left: 38px; height: 1px; background: var(--line); content: ""; }
.phase-step:last-child::after { display: none; }
.phase-step > span { position: relative; z-index: 1; width: 27px; height: 27px; display: grid; place-items: center; border: 1px solid var(--line-strong); border-radius: 50%; background: var(--bg-soft); font: 600 9px/1 var(--mono); }
.phase-step.is-current { color: var(--text); }
.phase-step.is-current > span { border-color: var(--cyan); background: var(--cyan-soft); color: var(--cyan); box-shadow: 0 0 18px rgba(90, 231, 210, 0.16); }
.phase-step.is-done > span { border-color: rgba(114, 230, 166, 0.44); background: var(--green-soft); color: var(--green); }
.panel-heading, .stage-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.panel-heading h2, .stage-heading h2 { margin: 5px 0 0; font-size: 17px; }
.module-tag { color: var(--cyan); font: 600 9px/1 var(--mono); letter-spacing: 0.07em; text-transform: uppercase; }
.source-status, .readiness { flex: 0 0 auto; padding: 6px 8px; border: 1px solid var(--line); border-radius: 999px; color: var(--text-faint); font: 600 9px/1 var(--mono); }
.source-status.is-ready, .readiness.ready { border-color: rgba(114, 230, 166, 0.35); background: var(--green-soft); color: var(--green); }
.readiness.blocked { border-color: rgba(246, 186, 91, 0.35); background: var(--amber-soft); color: var(--amber); }
.prompt-card { margin: 20px 0 16px; padding: 14px; border: 1px solid rgba(109, 145, 255, 0.25); border-radius: var(--radius-sm); background: var(--blue-soft); }
.prompt-card span, .hypothesis-block > span, .copilot-message > span, .copilot-principles > span { color: var(--blue); font: 600 9px/1 var(--mono); letter-spacing: 0.07em; text-transform: uppercase; }
.prompt-card p { margin: 8px 0 0; color: #dbe8ff; font-size: 13px; line-height: 1.6; }
.change-facts { display: grid; gap: 11px; margin: 0; }
.change-facts div { min-width: 0; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.change-facts dt { margin-bottom: 4px; color: var(--text-faint); font-size: 10px; }

.change-facts code { overflow-wrap: anywhere; color: #bed1ff; font-size: 10px; }
.reconciliation { margin-top: 16px; padding: 13px; border: 1px solid; border-radius: var(--radius-sm); }
.reconciliation.is-exact { border-color: rgba(114, 230, 166, 0.3); background: var(--green-soft); }
.reconciliation.is-expanded { border-color: rgba(246, 186, 91, 0.3); background: var(--amber-soft); }
.reconciliation span { display: block; color: var(--text-faint); font: 600 9px/1 var(--mono); }
.reconciliation strong { display: block; margin-top: 6px; color: var(--text); }
.reconciliation p { margin: 5px 0 0; color: var(--text-soft); font-size: 11px; line-height: 1.5; }
.entity-cloud { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 0; padding: 0; list-style: none; }
.entity-cloud li { padding: 5px 7px; border: 1px solid var(--line); border-radius: 7px; color: var(--text-soft); font: 9px/1 var(--mono); }
.context-placeholder { display: grid; min-height: 430px; place-items: center; align-content: center; padding: 24px; text-align: center; }
.context-placeholder > span { width: 42px; height: 42px; display: grid; place-items: center; border: 1px solid var(--line-strong); border-radius: 14px; color: var(--text-faint); font: 700 10px/1 var(--mono); }
.context-placeholder strong { margin-top: 16px; font-size: 13px; }
.context-placeholder p { max-width: 220px; margin: 8px 0 0; color: var(--text-faint); font-size: 10px; line-height: 1.55; }
.product-intake { max-width: 780px; margin: 0 auto; padding: 18px 0 8px; }
.product-intake > .stage-orb { margin: 0 0 18px; }
.product-intake h2 { margin: 8px 0 10px; font-size: clamp(30px, 5vw, 48px); }
.intake-lead { max-width: 650px; margin: 0; color: var(--text-soft); line-height: 1.7; }
.intent-form { display: grid; gap: 14px; margin-top: 28px; padding: 20px; border: 1px solid rgba(90, 231, 210, 0.24); border-radius: var(--radius-lg); background: linear-gradient(145deg, rgba(90, 231, 210, 0.08), rgba(109, 145, 255, 0.05)); }
.intent-form label { display: grid; gap: 8px; }

.intent-form textarea, .intent-form input { width: 100%; border: 1px solid var(--line-strong); border-radius: 10px; outline: 0; background: rgba(7, 16, 31, 0.72); color: var(--text); }
.intent-form textarea { min-height: 112px; resize: vertical; padding: 14px; line-height: 1.6; }
.intent-form input { padding: 11px 12px; }
.intent-form textarea:focus, .intent-form input:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(90, 231, 210, 0.1); }
.intent-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.compile-button { display: flex; justify-content: space-between; align-items: center; padding: 13px 15px; border: 1px solid rgba(90, 231, 210, 0.42); border-radius: 10px; background: linear-gradient(135deg, rgba(90, 231, 210, 0.24), rgba(109, 145, 255, 0.18)); color: #ecfffc; cursor: pointer; font-weight: 800; }

.example-area { margin-top: 24px; }
.example-area > div:first-child { display: flex; gap: 9px; align-items: baseline; }

.example-fill span, .example-fill strong, .example-fill small { display: block; }
.example-fill span { color: var(--cyan); font: 700 8px/1 var(--mono); text-transform: uppercase; }
.example-fill strong { margin: 7px 0 5px; font-size: 11px; }

.edit-intent { margin-top: 16px; padding: 8px 11px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--text-soft); cursor: pointer; font-size: 10px; }

.stage-kicker { color: var(--cyan); font: 600 10px/1 var(--mono); text-transform: uppercase; }

.understanding-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; width: 100%; margin-top: 28px; text-align: left; }
.understanding-grid div { padding: 14px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: rgba(7, 16, 31, 0.45); }

.scope-stage > h2 { margin: 12px 0 8px; font-size: 30px; }

.source-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 24px 0; padding: 0; list-style: none; }
.source-card { min-width: 0; padding: 14px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: rgba(7, 16, 31, 0.46); }
.source-kind { display: inline-flex; margin-bottom: 10px; padding: 4px 6px; border-radius: 5px; background: var(--blue-soft); color: var(--blue); font: 600 8px/1 var(--mono); }
.source-card strong { display: block; }
.source-card p { margin: 7px 0; color: var(--text-soft); font-size: 11px; line-height: 1.5; }

.hypothesis-block { padding: 18px; border: 1px solid rgba(90, 231, 210, 0.22); border-radius: var(--radius); background: var(--cyan-soft); }

.stage-heading { margin-bottom: 8px; }

.plan-stats span { display: block; color: var(--text-faint); font-size: 8px; }
.plan-stats strong { display: block; margin-top: 5px; color: var(--cyan); font: 700 18px/1 var(--mono); }
.plan-section { margin-top: 20px; }
.plan-section > h3 { margin: 0; color: var(--text-soft); font-size: 11px; }
.candidate-stack, .check-stack { display: grid; gap: 10px; margin-top: 18px; }

const EVIDENCE_VERDICTS = Object.freeze([
  "Verified",

]);

  "Pause",

]);

const REQUIRED_CHECK_FIELDS = Object.freeze([
  "id",
  "priority",
  "purpose",
  "entity",
  "capability",
  "metric",
  "window",
  "baseline",
  "rule",
  "severity",
  "failureAction",
  "rationale",
  "sourceRefs",

function deepFreeze(value) {
  if (!value || typeof value !== "object" || Object.isFrozen(value)) {
    return value;
  }
  for (const child of Object.values(value)) deepFreeze(child);
  return Object.freeze(value);
}

function sortedUnique(values = []) {
  return [...new Set(values.filter(Boolean))].sort((left, right) =>
    left.localeCompare(right),
  );
}

function assertCheckContract(check, sourceIds) {
  for (const field of REQUIRED_CHECK_FIELDS) {
    const value = check?.[field];
    const missing =
      value === undefined ||
      value === null ||
      value === "" ||
      (Array.isArray(value) && value.length === 0);
    if (missing) throw new Error(`Check ${check?.id ?? "unknown"} missing ${field}`);
  }
  for (const sourceRef of check.sourceRefs) {
    if (!sourceIds.has(sourceRef)) {
      throw new Error(`Unknown sourceRef ${sourceRef} on ${check.id}`);
    }
  }
  return true;
}

function reconcileChange(declaredChange, observedChange) {
  if (!declaredChange?.entities?.length || !observedChange?.entities?.length) {
    return deepFreeze({
      status: "Unverifiable",
      declaredEntities: sortedUnique(declaredChange?.entities),
      observedEntities: sortedUnique(observedChange?.entities),
      resolvedEntities: [],
      addedEntities: [],
      missingEntities: [],
    });
  }

  const declaredEntities = sortedUnique(declaredChange.entities);
  const observedEntities = sortedUnique(observedChange.entities);
  const declared = new Set(declaredEntities);
  const observed = new Set(observedEntities);
  const addedEntities = observedEntities.filter((entity) => !declared.has(entity));
  const missingEntities = declaredEntities.filter((entity) => !observed.has(entity));
  const shared = observedEntities.filter((entity) => declared.has(entity));
  let status = "Exact";
  if (shared.length === 0) status = "Conflict";
  else if (addedEntities.length && !missingEntities.length) {
    status = "Observed-Superset";
  } else if (missingEntities.length && !addedEntities.length) {
    status = "Observed-Subset";
  } else if (addedEntities.length || missingEntities.length) {
    status = "Conflict";
  }

  return deepFreeze({
    status,
    declaredEntities,
    observedEntities,
    resolvedEntities: status === "Conflict" ? [] : observedEntities,
    addedEntities,
    missingEntities,
  });
}

  return prompt.match(/\bv\d+(?:\.\d+)+\b/i)?.[0] ?? "待确认版本";
}

function normalizeRequest(request) {
  const prompt = request?.prompt?.trim() ?? "";
  if (!prompt) throw new Error("Inspection intent is required");
  return {
    prompt,
    targetService:
      request?.targetService?.trim() || extractService(prompt),
    contextReference: request?.contextReference?.trim() ?? "",
  };
}

function compileKnownWorkspace(request) {
  const isPaymentRisk =
    request.contextReference === "CHG-84217" ||
    (/payment-api/i.test(request.prompt) && /redis|超时/i.test(request.prompt));
  if (isPaymentRisk) {
    const workspace = cloneFixture("change-ticket-risk");
    workspace.prompt = request.prompt;
    workspace.eyebrow = "User-defined inspection workspace";
    workspace.title = `${request.targetService} 巡检工作区`;
    workspace.subtitle = "用户目标与运行时对账共同编译的高风险验证工作区";
    workspace.entryKind = request.contextReference
      ? "combined-context"
      : "user-intent";
    if (request.contextReference) {
      workspace.declaredChange.id = request.contextReference;
      workspace.contextSources[0].label = request.contextReference;
    }
    return workspace;
  }
  if (/order-api/i.test(request.prompt)) {
    const workspace = cloneFixture("natural-language-pass");
    workspace.prompt = request.prompt;
    workspace.eyebrow = "User-defined inspection workspace";
    workspace.title = `${request.targetService} 巡检工作区`;
    workspace.subtitle = "用户目标动态编译的服务升级验证工作区";
    workspace.entryKind = request.contextReference
      ? "combined-context"
      : "user-intent";
    return workspace;
  }
  return null;
}

function compileInspectionRequest(input) {
  const request = normalizeRequest(input);
  const workspace = compileKnownWorkspace(request) ?? compileGenericWorkspace(request);
  workspace.request = request;
  workspace.reconciliation = reconcileChange(
    workspace.declaredChange,
    workspace.observedChange,
  );
  return deepFreeze(workspace);
}

function requireWorkspace(state) {
  if (!state.workspace) throw new Error("Inspection workspace is not compiled");
  return state.workspace;
}

function selectResolvedScope(state) {
  const workspace = requireWorkspace(state);
  return {
    status: workspace.reconciliation.status,
    entities: workspace.reconciliation.resolvedEntities,
    addedEntities: workspace.reconciliation.addedEntities,
  };
}

function selectPlanReadiness(state) {
  const workspace = requireWorkspace(state);
  const unresolvedCandidateIds = workspace.candidateChecks
    .filter(
      (candidate) =>
        candidate.criticality === "high" &&
        !["accepted", "rejected"].includes(
          state.candidateDisposition[candidate.id]?.status,
        ),
    )
    .map((candidate) => candidate.id);
  const reconciliationBlocked = ["Conflict", "Unverifiable"].includes(
    workspace.reconciliation.status,
  );
  return {
    status:
      reconciliationBlocked || unresolvedCandidateIds.length
        ? "blocked"
        : "ready",
    unresolvedCandidateIds,
    reconciliationBlocked,
  };
}

function selectCommittedChecks(state) {
  const workspace = requireWorkspace(state);
  const acceptedCandidates = workspace.candidateChecks.filter(
    (candidate) =>
      state.candidateDisposition[candidate.id]?.status === "accepted",
  );
  const checks = [...workspace.committedChecks, ...acceptedCandidates];
  const sourceIds = new Set(
    workspace.contextSources.map((source) => source.id),
  );
  for (const check of checks) assertCheckContract(check, sourceIds);
  return checks;
}

function selectPlanSummary(state) {
  const workspace = requireWorkspace(state);
  const dispositions = state.candidateDisposition;
  return {
    required: workspace.committedChecks.filter(
      (check) => check.priority === "required",
    ).length,
    recommended: workspace.candidateChecks.filter(
      (candidate) => dispositions[candidate.id]?.status === "accepted",
    ).length,
    pending: workspace.candidateChecks.filter(
      (candidate) => !dispositions[candidate.id],
    ).length,
    rejected: workspace.candidateChecks.filter(
      (candidate) => dispositions[candidate.id]?.status === "rejected",
    ).length,
  };
}

function selectExecutionView(state) {
  const workspace = requireWorkspace(state);
  return workspace.execution.map((step, index) => ({
    ...step,
    progress:
      state.phase === "report" || index <= state.executionStep
        ? "complete"
        : index === state.executionStep + 1 && state.phase === "execution"
          ? "active"
          : "queued",
  }));
}

function selectReportView(state) {
  const workspace = requireWorkspace(state);
  return state.phase === "report" ? workspace.report : null;
}

function selectViewModel(state) {
  if (!state.workspace) {
    return {
      state,
      workspace: null,
      scope: null,
      readiness: null,
      committedChecks: [],
      planSummary: null,
      execution: [],
      report: null,
    };
  }
  return {
    state,
    workspace: state.workspace,
    scope: selectResolvedScope(state),
    readiness: selectPlanReadiness(state),
    committedChecks: selectCommittedChecks(state),
    planSummary: selectPlanSummary(state),
    execution: selectExecutionView(state),
    report: selectReportView(state),
  };
}

function createDemoSession() {
  return deepFreeze({
    workspace: null,
    phase: "intake",
    candidateDisposition: {},
    executionStep: -1,
    rcExpanded: false,
  });
}

function disposeCandidate(state, action) {
  if (state.phase !== "plan" || !state.workspace) return state;
  const candidate = state.workspace.candidateChecks.find(
    (item) => item.id === action.candidateId,
  );
  if (!candidate || !["accepted", "rejected"].includes(action.disposition)) {
    return state;
  }
  const reason = action.reason?.trim() ?? "";
  if (action.disposition === "rejected" && !reason) return state;
  return {
    ...state,
    candidateDisposition: {
      ...state.candidateDisposition,
      [candidate.id]: {
        status: action.disposition,
        reason: reason || null,
      },
    },
  };
}

function reduceSession(state, action) {
  switch (action.type) {
    case "INTENT_SUBMITTED":
      if (state.phase !== "intake") return state;
      return {
        ...createDemoSession(),
        workspace: compileInspectionRequest(action.request),
      };
    case "RESET":
      return createDemoSession();
    case "INPUT_CONFIRMED":
      return state.phase === "intake" && state.workspace
        ? { ...state, phase: "context" }
        : state;
    case "SCOPE_ACCEPTED": {
      if (state.phase !== "context" || !state.workspace) return state;
      const { reconciliation } = state.workspace;
      return ["Conflict", "Unverifiable"].includes(reconciliation.status)
        ? state
        : { ...state, phase: "plan" };
    }
    case "CANDIDATE_DISPOSED":
      return disposeCandidate(state, action);
    case "PLAN_CONFIRMED":
      return state.phase === "plan" &&
        selectPlanReadiness(state).status === "ready"
        ? { ...state, phase: "execution", executionStep: -1 }
        : state;
    case "EXECUTION_ADVANCED": {
      if (state.phase !== "execution" || !state.workspace) return state;
      const lastIndex = state.workspace.execution.length - 1;
      const nextStep = state.executionStep + 1;
      return nextStep >= lastIndex
        ? { ...state, phase: "report", executionStep: lastIndex }
        : { ...state, executionStep: nextStep };
    }
    case "RC_TOGGLED":
      return state.phase === "report" && state.workspace?.report.rcAgent
        ? { ...state, rcExpanded: !state.rcExpanded }
        : state;
    default:
      return state;
  }
}

function demoReducer(state, action) {
  return deepFreeze(reduceSession(state, action));
}

      </section>
      <section class="plan-section" aria-labelledby="formal-title">
        <h3 id="formal-title">正式检查</h3>
        <div class="check-stack">
          ${vm.committedChecks
            .map((check) =>
              renderCheck(
                check,
                acceptedIds.has(check.id),
                vm.workspace.contextSources,
              ),
            )
            .join("")}
        </div>
      </section>
    </div>`;
}

const PHASES = [
  ["intake", "输入理解", "01"],
  ["context", "范围对账", "02"],
  ["plan", "任务草案", "03"],
  ["execution", "执行取证", "04"],
  ["report", "行动报告", "05"],
];

function phaseIndex(phase) {
  return PHASES.findIndex(([id]) => id === phase);
}

function renderProgress(state) {
  const current = phaseIndex(state.phase);
  return PHASES.map(
    ([id, label, number], index) => `
      <li class="phase-step ${index < current ? "is-done" : ""} ${id === state.phase ? "is-current" : ""}">
        <span>${index < current ? "✓" : number}</span>
        <strong>${label}</strong>
      </li>`,
  ).join("");
}

function renderSource(source) {
  return `
    <li class="source-card">
      <span class="source-kind">${escapeHtml(source.kind)}</span>
      <strong>${escapeHtml(source.label)}</strong>
      <p>${escapeHtml(source.detail)}</p>
      <small>新鲜度 · ${escapeHtml(source.freshness)}</small>
    </li>`;
}

const IMPACT_LABELS = {
  businessJourney: ["业务场景", "用户结果"],
  goldenMetrics: ["黄金指标", "业务门禁"],
  traceDependencies: ["Trace 直接依赖", "运行时事实"],
  middleware: ["中间件", "资源依赖"],
};

function renderImpactMatrix(impactDimensions) {
  return `
    <section class="impact-block" aria-labelledby="impact-title">
      <header><span>Blast radius</span><h3 id="impact-title">本次影响面四维视图</h3></header>
      <div class="impact-matrix" data-testid="impact-matrix">
        ${Object.entries(impactDimensions)
          .map(([dimension, values]) => {
            const [label, hint] = IMPACT_LABELS[dimension];
            return `<article><span>${label}</span><strong>${values.map(escapeHtml).join(" · ")}</strong><small>${hint}</small></article>`;
          })
          .join("")}
      </div>
    </section>`;
}

function renderContext(vm) {
  const { workspace, scope, state } = vm;
  if (!workspace) {
    return `
      <section class="panel context-panel context-empty" aria-labelledby="context-title">
        <header class="panel-heading">
          <div><span class="module-tag">Module 01 · Input compiler</span><h2 id="context-title">输入与变更理解</h2></div>
          <span class="source-status">等待输入</span>
        </header>
        <div class="context-placeholder"><span>01</span><strong>由用户定义巡检目标</strong><p>提交后，这里会展示实体理解、声明变化、运行时对账和证据边界。</p></div>
      </section>`;
  }
  const visible = phaseIndex(state.phase) >= 1;
  return `
    <section class="panel context-panel" aria-labelledby="context-title">
      <header class="panel-heading">
        <div><span class="module-tag">Module 01 · Input compiler</span><h2 id="context-title">输入与变更理解</h2></div>
        <span class="source-status ${visible ? "is-ready" : ""}">${visible ? "已确认" : "待确认"}</span>
      </header>
      <div class="prompt-card">
        <span>${workspace.entryKind === "combined-context" ? "用户意图 + 外部上下文" : "用户巡检意图"}</span>
        <p>“${escapeHtml(workspace.prompt)}”</p>
      </div>
      <dl class="change-facts">
        <div><dt>声明对象</dt><dd>${escapeHtml(workspace.declaredChange.summary)}</dd></div>
        <div><dt>声明指纹</dt><dd><code>${escapeHtml(workspace.declaredChange.fingerprint)}</code></dd></div>
        <div><dt>实际变化</dt><dd>${visible ? escapeHtml(workspace.observedChange.summary) : "等待运行时事实对账"}</dd></div>
        <div><dt>实际指纹</dt><dd><code>${visible ? escapeHtml(workspace.observedChange.fingerprint) : "—"}</code></dd></div>
      </dl>
      ${
        visible
          ? `<div class="reconciliation ${scope.status === "Exact" ? "is-exact" : "is-expanded"}">
              <span>Change Reconciliation</span>
              <strong>${scope.status}</strong>
              <p>${scope.status === "Exact" ? "声明与运行时事实一致。" : `发现 ${scope.addedEntities.length} 个声明外实体，已扩大巡检范围。`}</p>
            </div>
            <ul class="entity-cloud">${scope.entities.map((entity) => `<li>${escapeHtml(entity)}</li>`).join("")}</ul>`
          : ""
      }
    </section>`;
}

function renderScope(vm) {
  return `
    <div class="scope-stage">
      <span class="module-tag">Module 02 · Scope resolver</span>
      <h2>多源事实已经对齐</h2>
      <p>不是把图谱上的所有关系塞进任务，而是用业务目标、运行时 Trace 和已注册能力收敛检查范围。</p>
      ${renderImpactMatrix(vm.workspace.impactDimensions)}
      <ul class="source-list">${vm.workspace.contextSources.map(renderSource).join("")}</ul>
      <div class="hypothesis-block">
        <span>本次要证伪的风险假设</span>
        <ol>${vm.workspace.hypotheses.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ol>
      </div>
    </div>`;
}

function renderExecution(vm) {
  return `
    <div class="execution-stage">
      <header class="stage-heading"><div><span class="module-tag">Deterministic execution</span><h2>现有巡检引擎正在取证</h2></div><span class="live-dot">● MOCK LIVE</span></header>
      <p class="stage-lead">页面只播放确定性 mock；每一步都绑定 Check Contract，不生成生产查询。</p>
      <ol class="execution-list">
        ${vm.execution
          .map(
            (step, index) => `<li class="execution-item ${step.progress} ${step.status.toLowerCase()}">
              <span class="execution-number">${String(index + 1).padStart(2, "0")}</span>
              <div><strong>${escapeHtml(step.label)}</strong><p>${step.progress === "complete" ? escapeHtml(step.fact) : step.progress === "active" ? "等待运行下一步 mock 证据" : "排队等待前置检查"}</p></div>
              <code>${step.progress === "complete" ? step.status : step.progress}</code>
            </li>`,
          )
          .join("")}
      </ol>
    </div>`;
}

function renderReport(vm) {
  const report = vm.report;
  return `
    <div class="report-stage ${report.action.toLowerCase()}" data-testid="final-report">
      <div class="decision-hero">
        <span>Action first · ${report.action}</span>
        <h2>${escapeHtml(report.actionLabel)}</h2>
        <p>${escapeHtml(report.title)}</p>
      </div>
      <div class="semantic-pair">
        <div><span>证据结论</span><code>${report.evidenceVerdict}</code><small>系统知道了什么</small></div>
        <div><span>行动决策</span><code>${report.action}</code><small>SRE 现在该做什么</small></div>
      </div>
      <div class="evidence-badges">
        <span class="verified">✓ ${report.evidenceCounts.verified} 已验证</span>
        <span class="violated">! ${report.evidenceCounts.violated} 违例</span>
        <span class="unresolved">? ${report.evidenceCounts.unresolved} 未决</span>
      </div>
      <p class="report-summary">${escapeHtml(report.summary)}</p>
      <div class="report-columns">
        <section><h3>关键证据</h3><ul>${report.keyEvidence.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul></section>
        <section><h3>结论边界</h3><p>${escapeHtml(report.scopeStatement)}</p><h3>残余风险</h3><ul>${report.residualRisks.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul></section>
      </div>
      ${
        report.rcAgent
          ? `<button class="rc-button" data-action="RC_TOGGLED" type="button">${vm.state.rcExpanded ? "收起 RC Agent" : "启动 RC Agent"}</button>
            ${
              vm.state.rcExpanded
                ? `<section class="rc-panel"><span>${escapeHtml(report.rcAgent.title)}</span><h3>${escapeHtml(report.rcAgent.rootCause)}</h3><div class="rc-chain">${report.rcAgent.chain.map((item) => `<code>${escapeHtml(item)}</code>`).join("<i>→</i>")}</div><p>${escapeHtml(report.rcAgent.recommendation)}</p></section>`
                : ""
            }`
          : ""
      }
    </div>`;
}

function renderStage(vm) {
  const renderers = {
    intake: renderIntake,
    context: renderScope,
    plan: renderInspectionPlan,
    execution: renderExecution,
    report: renderReport,
  };
  return renderers[vm.state.phase](vm);
}

function primaryAction(vm) {
  if (!vm.workspace) return "";
  const actions = {
    intake: ["INPUT_CONFIRMED", "确认理解结果"],
    context: ["SCOPE_ACCEPTED", "接受范围并生成任务"],
    plan: ["PLAN_CONFIRMED", vm.readiness.status === "ready" ? "确认任务并开始执行" : "请先处置高风险候选"],
    execution: ["EXECUTION_ADVANCED", vm.state.executionStep + 1 >= vm.workspace.execution.length - 1 ? "完成执行并生成报告" : "运行下一步 mock 检查"],
    report: ["RESET", "新建巡检工作区"],
  };
  const [action, label] = actions[vm.state.phase];
  const disabled = vm.state.phase === "plan" && vm.readiness.status !== "ready";
  return `<button class="primary-action" data-action="${action}" ${disabled ? "disabled" : ""} type="button"><span>${escapeHtml(label)}</span><b>→</b></button>`;
}

function renderCopilot(vm) {
  if (!vm.workspace) {
    return `
      <aside class="panel copilot-panel" aria-label="Copilot 解释">
        <header><span class="copilot-mark">✦</span><div><small>NOVA COPILOT</small><strong>可信任务编译器</strong></div><span class="online">READY</span></header>
        <div class="copilot-message"><span>产品边界</span><h3>由用户决定如何使用</h3><p>输入目标、服务和可选上下文；系统据此编译工作区，而不是让你先选一个固定场景。</p></div>
        <div class="copilot-principles"><span>护栏</span><ul><li>示例不是产品模式</li><li>电子流只是可选事实来源</li><li>不会触发真实生产动作</li></ul></div>
      </aside>`;
  }
  const copy = {
    intake: ["先确认我理解得对不对", "实体不唯一或缺少版本时，我不会静默猜测。"],
    context: ["范围不是知识图谱全展开", "我只保留业务目标、运行时事实与可执行能力共同支持的关系。"],
    plan: ["候选不是正式任务", vm.readiness.status === "ready" ? "当前计划已满足确认条件。" : "高关键度候选仍未处置，计划不能确认。"],
    execution: ["执行与解释分开", "确定性引擎产生证据；Copilot 只组织理由和下一步。"],
    report: ["结论有边界", vm.report?.scopeStatement ?? "报告尚未生成"],
  }[vm.state.phase];
  return `
    <aside class="panel copilot-panel" aria-label="Copilot 解释">
      <header><span class="copilot-mark">✦</span><div><small>NOVA COPILOT</small><strong>可信任务编译器</strong></div><span class="online">ONLINE</span></header>
      <div class="copilot-message"><span>当前判断</span><h3>${escapeHtml(copy[0])}</h3><p>${escapeHtml(copy[1])}</p></div>
      <div class="copilot-principles"><span>护栏</span><ul><li>不生成任意生产查询</li><li>不把缺失证据写成正常</li><li>不代替 SRE 执行发布动作</li></ul></div>
      ${primaryAction(vm)}
    </aside>`;
}

function renderApp(vm) {
  const eyebrow = vm.workspace?.eyebrow ?? "User-defined inspection workspace";
  const workspaceId = vm.workspace?.id ?? "new";
  return `
    <div class="app-shell" data-phase="${vm.state.phase}" data-workspace="${escapeHtml(workspaceId)}">
      <header class="app-header">
        <a class="brand" href="#main"><span>N</span><div><strong>NOVA</strong><small>OPS INTELLIGENCE</small></div></a>
        <div class="title-lockup"><span>${escapeHtml(eyebrow)}</span><h1>AI 巡检任务生成与解读 Copilot</h1></div>
        <div class="offline-badge"><span>●</span> OFFLINE · MOCK ONLY</div>
      </header>
      <ol class="phase-rail" aria-label="工作阶段">${renderProgress(vm.state)}</ol>
      <main id="main" class="workspace">
        ${renderContext(vm)}
        <section class="panel stage-panel" aria-live="polite">${renderStage(vm)}</section>
        ${renderCopilot(vm)}
      </main>
      <footer class="app-footer"><span>AI Inspection Copilot · Offline Product Demo v0.2</span><strong>所有数据均为 mock，不会触发真实生产动作</strong></footer>
    </div>`;
}

const root = document.querySelector("#app");
let state = createDemoSession();

function render() {
  root.innerHTML = renderApp(selectViewModel(state));
}

function dispatch(action) {
  const next = demoReducer(state, action);
  if (next !== state) {
    state = next;
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
}

root.addEventListener("click", (event) => {
  const exampleButton = event.target.closest("[data-example-id]");
  if (exampleButton) {
    const example = inspectionExamples.find(
      (item) => item.id === exampleButton.dataset.exampleId,
    );
    const form = root.querySelector("[data-intent-form]");
    if (!example || !form) return;
    form.elements.namedItem("inspection-intent").value = example.prompt;
    form.elements.namedItem("target-service").value = example.targetService;
    form.elements.namedItem("context-reference").value =
      example.contextReference;
    form.elements.namedItem("inspection-intent").focus();
    return;
  }

  const actionButton = event.target.closest("[data-action]");
  if (!actionButton || actionButton.disabled) return;
  const { action } = actionButton.dataset;
  if (action === "CANDIDATE_DISPOSED") {
    dispatch({
      type: action,
      candidateId: actionButton.dataset.candidateId,
      disposition: actionButton.dataset.disposition,
      reason: actionButton.dataset.reason,
    });
    return;
  }
  dispatch({ type: action });
});

root.addEventListener("submit", (event) => {
  const form = event.target.closest("[data-intent-form]");
  if (!form) return;
  event.preventDefault();
  const data = new FormData(form);
  dispatch({
    type: "INTENT_SUBMITTED",
    request: {
      prompt: data.get("inspection-intent"),
      targetService: data.get("target-service"),
      contextReference: data.get("context-reference"),
    },
  });
});

render();
})();
    </script>
  </body>
</html>
