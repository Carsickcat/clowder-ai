      validation('metric', 'changed', '支付成功率指标口径已升级'),
      validation('dependency', 'changed', '运行时发现新的数据库只读实例'),
      validation('permission'),
      validation('template'),
    ],
    differences: [
      {
        id: 'payment-read-replica',
        dimension: 'dependency',
        label: '依赖',
        direction: 'added',
        severity: 'review',
        summary: 'settlement-db 新增只读实例，已扩大本次影响面',
      },
      {
        id: 'payment-success-vocabulary',
        dimension: 'metric',
        label: '指标',
        direction: 'changed',
        severity: 'review',
        summary: '支付成功率口径 v2 → v3，判定阈值保持不变',
      },
    ],
  });
}

function majorPaymentMatch(playbook, workspace) {
  return snapshot(playbook, workspace, {
    status: 'major-drift',
    score: 61,
    summary: '2 项重大差异',
    validations: [
      validation('entity', 'blocking', '核心服务已发生拆分'),
      validation('metric', 'blocking', '旧检查无法覆盖新实体'),
      validation('dependency', 'changed', '调用路径新增 risk-api'),
      validation('permission'),
      validation('template', 'blocking', '3 项检查缺少当前实体绑定'),
    ],
    differences: [
      {
        id: 'payment-service-split',
        dimension: 'entity',
        label: '实体',
        direction: 'changed',
        severity: 'blocking',
        summary: 'payment-api 已拆分为 payment-api + risk-api',
      },
      {
        id: 'payment-unbound-checks',
        dimension: 'template',
        label: '模板',
        direction: 'removed',
        severity: 'blocking',
        summary: '3 项关键检查在当前服务目录中没有对应实体',
      },
    ],
  });
}

function incompatibleStructureMatch(playbook, workspace) {
  const unresolvedCheckIds = resolveApprovedChecks(playbook, workspace).unresolvedCheckIds;
  return snapshot(playbook, workspace, {
    status: 'major-drift',
    score: 58,
    summary: '检查结构不可用',
    validations: [
      validation('entity'),
      validation('metric'),
      validation('dependency'),
      validation('permission'),
      validation('template', 'blocking', `${unresolvedCheckIds.length} 项审批检查缺少当前实体绑定`),
    ],
    differences: [
      {
        id: 'unresolved-approved-checks',
        dimension: 'template',
        label: '模板',
        direction: 'removed',
        severity: 'blocking',
        summary: `无法绑定：${unresolvedCheckIds.join('、')}`,
      },
    ],
  });
}

function matchesPlaybookDefinition(playbook, workspace) {
  const service = workspace?.request?.targetService?.toLowerCase() ?? '';
  const prompt = workspace?.request?.prompt?.toLowerCase() ?? '';
  const targetServices = playbook.matchRules?.targetServices ?? [];
  const promptSignals = playbook.matchRules?.promptSignals ?? [];
  return (
    targetServices.some((candidate) => candidate.toLowerCase() === service) &&
    (promptSignals.length === 0 || promptSignals.some((signal) => prompt.includes(signal.toLowerCase())))
  );
}

function selectInspectionPlaybookDefinition(workspace, catalog = inspectionPlaybooks) {
  let selected = null;
  for (const playbook of catalog) {
    if (!matchesPlaybookDefinition(playbook, workspace)) continue;
    if (!selected || playbook.version > selected.version) selected = playbook;
  }
  return selected;
}

function matchInspectionPlaybook(workspace, catalog = inspectionPlaybooks) {
  const playbook = selectInspectionPlaybookDefinition(workspace, catalog);
  if (!playbook) return null;

  const hasUnresolvedChecks = resolveApprovedChecks(playbook, workspace).unresolvedCheckIds.length > 0;
  if (hasUnresolvedChecks) {
    return playbook.scenarioKey === 'payment-config'
      ? majorPaymentMatch(playbook, workspace)
      : incompatibleStructureMatch(playbook, workspace);
  }

  if (playbook.scenarioKey === 'order-release') return exactOrderMatch(playbook, workspace);
  if (playbook.scenarioKey === 'payment-config') {
    const prompt = workspace?.request?.prompt?.toLowerCase() ?? '';
    const majorDrift = prompt.includes('risk-api') || prompt.includes('拆分');
    return majorDrift ? majorPaymentMatch(playbook, workspace) : minorPaymentMatch(playbook, workspace);
  }
  return null;
}

const INSPECTION_LIBRARY_SCHEMA_VERSION = 1;

function clone(value) {
  if (Array.isArray(value)) return value.map(clone);
  if (value && typeof value === 'object') {
    return Object.fromEntries(Object.entries(value).map(([key, item]) => [key, clone(item)]));
  }
  return value;
}

function stripRuntimePayload(value) {
  if (Array.isArray(value)) return value.map(stripRuntimePayload);
  if (!value || typeof value !== 'object') return value;
  return Object.fromEntries(
    Object.entries(value)
      .filter(([key]) => !['evidence', 'report'].includes(key))
      .map(([key, item]) => [key, stripRuntimePayload(item)]),
  );
}

function sortedUnique(values = []) {
  return [...new Set(values.filter(Boolean))].sort();
}

function nonEmptyString(value) {
  return typeof value === 'string' && value.trim().length > 0;
}

function stringArray(value, { allowEmpty = true } = {}) {
  return Array.isArray(value) && (allowEmpty || value.length > 0) && value.every(nonEmptyString);
}

function validRequest(request) {
  return (
    request &&
    typeof request === 'object' &&
    nonEmptyString(request.prompt) &&
    (request.targetService === undefined || typeof request.targetService === 'string') &&
    (request.contextReference === undefined || typeof request.contextReference === 'string')
  );
}

function validContextItem(item) {
  return (
    item &&
    typeof item === 'object' &&
    nonEmptyString(item.id) &&
    nonEmptyString(item.kind) &&
    nonEmptyString(item.label) &&
    typeof item.detail === 'string'
  );
}

function validPlan(plan) {
  if (
    !plan ||
    typeof plan !== 'object' ||
    !stringArray(plan.checkIds, { allowEmpty: false }) ||
    !Array.isArray(plan.checks) ||
    plan.checks.length !== plan.checkIds.length
  ) {
    return false;
  }
  const checkIds = new Set(plan.checkIds);
  return plan.checks.every(
    (check) =>
      check &&
      typeof check === 'object' &&
      nonEmptyString(check.id) &&
      checkIds.has(check.id) &&
      stringArray(check.sourceRefs),
  );
}

function validBaseline(baseline) {
  return (
    baseline &&
    typeof baseline === 'object' &&
    nonEmptyString(baseline.fingerprint) &&
    stringArray(baseline.entities, { allowEmpty: false }) &&
    stringArray(baseline.checkIds, { allowEmpty: false })
  );
}

function validDefinition(definition) {
  return (
    definition &&
    typeof definition === 'object' &&
    nonEmptyString(definition.id) &&
    Number.isInteger(definition.version) &&
    definition.version > 0 &&
    nonEmptyString(definition.name) &&
    nonEmptyString(definition.createdAt) &&
    nonEmptyString(definition.updatedAt) &&
    nonEmptyString(definition.sourceRunId) &&
    validRequest(definition.request) &&
    Array.isArray(definition.selectedContext) &&
    definition.selectedContext.length > 0 &&
    definition.selectedContext.every(validContextItem) &&
    validPlan(definition.inspectionPlan) &&
    validBaseline(definition.baseline)
  );
}

function validRun(run) {
  return (
    run &&
    typeof run === 'object' &&
    nonEmptyString(run.id) &&
    nonEmptyString(run.taskInstanceId) &&
    run.status === 'locked' &&
    nonEmptyString(run.startedAt) &&
    nonEmptyString(run.completedAt) &&
    Array.isArray(run.selectedContextResults) &&
    validPlan(run.inspectionPlan) &&
    (run.executionResults === undefined ||
      (Array.isArray(run.executionResults) && run.executionResults.every(validExecutionResult))) &&
    run.report &&
    typeof run.report === 'object'
  );
}

const EXECUTION_RESULT_STATUSES = new Set(['Verified', 'Violated', 'Inconclusive', 'NotEvaluated']);

function validExecutionResult(result) {
  return (
    result &&
    typeof result === 'object' &&
    nonEmptyString(result.id) &&
    nonEmptyString(result.label) &&
    EXECUTION_RESULT_STATUSES.has(result.status) &&
    typeof result.fact === 'string'
  );
}

function normalizeLibrary(value) {
  if (
    !value ||
    value.schemaVersion !== INSPECTION_LIBRARY_SCHEMA_VERSION ||
    !Number.isInteger(value.revision) ||
    value.revision < 0 ||
    !Array.isArray(value.savedInspections) ||
    !Array.isArray(value.runs) ||
    !value.savedInspections.every(validDefinition) ||
    !value.runs.every(validRun)
  ) {
    return null;
  }
  return deepFreeze({
    schemaVersion: INSPECTION_LIBRARY_SCHEMA_VERSION,
    revision: value.revision,
    savedInspections: clone(value.savedInspections),
    runs: clone(value.runs),
  });
}

function createEmptyInspectionLibrary() {
  return deepFreeze({
    schemaVersion: INSPECTION_LIBRARY_SCHEMA_VERSION,
    revision: 0,
    savedInspections: [],
    runs: [],
  });
}

function parseInspectionLibrary(serialized) {
  return parseInspectionLibraryWithDiagnostics(serialized).library;
}

function parseInspectionLibraryWithDiagnostics(serialized) {
  const unavailable = () =>
    deepFreeze({
      library: createEmptyInspectionLibrary(),
      diagnostics: { status: 'unavailable', rejectedRunCount: 0 },
    });
  if (typeof serialized !== 'string' || !serialized.trim()) {
    return deepFreeze({
      library: createEmptyInspectionLibrary(),
      diagnostics: { status: 'available', rejectedRunCount: 0 },
    });
  }
  try {
    const value = JSON.parse(serialized);
    if (
      !value ||
      value.schemaVersion !== INSPECTION_LIBRARY_SCHEMA_VERSION ||
      !Number.isInteger(value.revision) ||
      value.revision < 0 ||
      !Array.isArray(value.savedInspections) ||
      !value.savedInspections.every(validDefinition) ||
      !Array.isArray(value.runs)
    ) {
      return unavailable();
    }
    const validRuns = value.runs.filter(validRun);
    const rejectedRunCount = value.runs.length - validRuns.length;
    return deepFreeze({
      library: {
        schemaVersion: INSPECTION_LIBRARY_SCHEMA_VERSION,
        revision: value.revision,
        savedInspections: clone(value.savedInspections),
        runs: clone(validRuns),
      },
      diagnostics: {
        status: rejectedRunCount ? 'degraded' : 'available',
        rejectedRunCount,
      },
    });
  } catch {
    return unavailable();
  }
}

function serializeInspectionLibrary(library) {
  const normalized = normalizeLibrary(library);
  if (!normalized) throw new TypeError('Invalid inspection library envelope');
  return JSON.stringify(normalized);
}

function contextOption(id, kind, label, detail) {
  return { id, kind, label, detail, selected: true };
}

function createContextOptions(workspace) {
  if (!workspace) return deepFreeze([]);
  const changes = (workspace.contextSources ?? []).map((source) =>
    contextOption(`change:${source.id}`, 'change', source.label, source.detail),
  );
  const services = sortedUnique([
    ...(workspace.declaredChange?.entities ?? []),
    ...(workspace.observedChange?.entities ?? []),
  ]).map((entity) => contextOption(`service:${entity}`, 'service', entity, '本次巡检关联服务'));
  const signals = (workspace.committedChecks ?? []).map((check) =>
    contextOption(
      `signal:${check.id}`,
      'signal',
      check.title ?? check.purpose ?? check.metric ?? check.id,
      check.metric ?? check.purpose ?? check.id,
    ),
  );
  return deepFreeze([...changes, ...services, ...signals]);
}

function toggleContextSelection(options, contextId) {
  const target = options.find((option) => option.id === contextId);
  if (!target) return options;
  if (target.selected && options.filter((option) => option.selected).length === 1) return options;
  if (
    target.selected &&
    target.kind === 'signal' &&
    options.filter((option) => option.kind === 'signal' && option.selected).length === 1
  ) {
    return options;
  }
  return deepFreeze(
    options.map((option) => (option.id === contextId ? { ...option, selected: !option.selected } : option)),
  );
}

function planSnapshot(inspectionPlan) {
  if (!inspectionPlan || !Array.isArray(inspectionPlan.checkIds) || !Array.isArray(inspectionPlan.checks)) {
    throw new TypeError('A locked inspection plan is required');
  }
  return stripRuntimePayload({
    source: inspectionPlan.source,
    sourcePlaybookRef: inspectionPlan.sourcePlaybookRef ? clone(inspectionPlan.sourcePlaybookRef) : null,
    checkIds: [...inspectionPlan.checkIds],
    checks: inspectionPlan.checks,
  });
}

function createSavedInspectionDefinition({
  id,
  name,
  request,
  workspace,
  selectedContext,
  taskInstance,
  sourceRunId,
  now,
  version = 1,
}) {
  if (typeof name !== 'string' || !name.trim()) throw new TypeError('Saved inspection name is required');
  if (!id || !sourceRunId || !now) throw new TypeError('Saved inspection identity and timestamp are required');
  if (taskInstance?.status !== 'locked') throw new TypeError('Only a locked inspection task can be saved');
  const chosen = (selectedContext ?? []).filter((item) => item.selected !== false).map(clone);
  if (!chosen.length) throw new TypeError('At least one selected context item is required');
  return deepFreeze({
    id,
    version,
    name: name.trim(),
    createdAt: now,
    updatedAt: now,
    sourceRunId,
    request: clone(request),
    selectedContext: chosen,
    inspectionPlan: planSnapshot(taskInstance.inspectionPlan),
    baseline: {
      fingerprint: workspace.declaredChange.fingerprint,
      entities: sortedUnique(workspace.observedChange?.entities ?? workspace.declaredChange.entities),
      checkIds: [...taskInstance.inspectionPlan.checkIds],
    },
  });
}

function selectedContextResults(selectedContext) {
  return selectedContext
    .filter((item) => item.selected !== false)
    .map((item) => ({
      contextId: item.id,
      kind: item.kind,
      label: item.label,
      status: 'Verified',
      detail: item.detail,
    }));
}

function createInspectionRun({
  id,
  taskInstance,
  definitionId = null,
  selectedContext,
  executionResults,
  report,
  startedAt,
  completedAt,
}) {
  if (!id || !startedAt || !completedAt) throw new TypeError('Inspection run identity and timestamps are required');
  if (taskInstance?.status !== 'locked') throw new TypeError('Inspection run requires a locked task');
  if (!Array.isArray(executionResults) || !executionResults.every(validExecutionResult)) {
    throw new TypeError('Inspection run requires structured execution results');
  }
  return deepFreeze({
    id,
    taskInstanceId: taskInstance.id,
    definitionId,
    startedAt,
    completedAt,
    status: 'locked',
    selectedContextResults: selectedContextResults(selectedContext ?? []),
    inspectionPlan: planSnapshot(taskInstance.inspectionPlan),
    executionResults: executionResults.map(({ id: resultId, label, status, fact }) => ({
      id: resultId,
      label,
      status,
      fact,
    })),
    report: clone(report),
  });
}

function chooseDefinition(left, right) {
  if (!left) return right;
  if (!right) return left;
  if (right.version !== left.version) return right.version > left.version ? right : left;
  return String(right.updatedAt).localeCompare(String(left.updatedAt)) > 0 ? right : left;
}

function mergeInspectionLibraries(leftInput, rightInput) {
  const left = normalizeLibrary(leftInput) ?? createEmptyInspectionLibrary();
  const right = normalizeLibrary(rightInput) ?? createEmptyInspectionLibrary();
  const definitions = new Map();
  for (const definition of [...left.savedInspections, ...right.savedInspections]) {
    definitions.set(definition.id, chooseDefinition(definitions.get(definition.id), definition));
  }
  const runs = new Map();
  for (const run of [...left.runs, ...right.runs]) {
    if (!runs.has(run.id)) runs.set(run.id, run);
  }
  const savedInspections = [...definitions.values()].sort((a, b) => a.id.localeCompare(b.id)).map(clone);
  const mergedRuns = [...runs.values()].sort((a, b) => a.id.localeCompare(b.id)).map(clone);
  const rightDefinitions = [...right.savedInspections].sort((a, b) => a.id.localeCompare(b.id));
  const rightRuns = [...right.runs].sort((a, b) => a.id.localeCompare(b.id));
  const incomingAlreadyContainsUnion =
    JSON.stringify(savedInspections) === JSON.stringify(rightDefinitions) &&
    JSON.stringify(mergedRuns) === JSON.stringify(rightRuns);
  return deepFreeze({
    schemaVersion: INSPECTION_LIBRARY_SCHEMA_VERSION,
    revision: Math.max(left.revision, right.revision) + (incomingAlreadyContainsUnion ? 0 : 1),
    savedInspections,
    runs: mergedRuns,
  });
}

function classifySavedInspectionRefresh(definition, workspace) {
  if (!validDefinition(definition) || !workspace) {
    return deepFreeze({ status: 'major-drift', differences: [{ id: 'definition-unavailable', severity: 'blocking' }] });
  }
  const currentCheckIds = new Set((workspace.committedChecks ?? []).map((check) => check.id));
  const missingCheckIds = definition.baseline.checkIds.filter((id) => !currentCheckIds.has(id));
  const fingerprintChanged = workspace.declaredChange?.fingerprint !== definition.baseline.fingerprint;
  if (missingCheckIds.length || fingerprintChanged) {
    return deepFreeze({
      status: 'major-drift',
      differences: [
        ...(missingCheckIds.length
          ? [{ id: 'check-structure', severity: 'blocking', summary: `缺少检查项：${missingCheckIds.join('、')}` }]
          : []),
        ...(fingerprintChanged ? [{ id: 'change-fingerprint', severity: 'blocking', summary: '变更指纹已变化' }] : []),
      ],
    });
  }
  const baselineEntities = new Set(definition.baseline.entities);
  const currentEntities = sortedUnique(workspace.observedChange?.entities ?? workspace.declaredChange?.entities);
  const addedEntities = currentEntities.filter((entity) => !baselineEntities.has(entity));
  const selectedSignalCheckIds = new Set(
    definition.selectedContext
      .filter((item) => item.kind === 'signal' && item.id.startsWith('signal:'))
      .map((item) => item.id.slice('signal:'.length)),
  );
  const extraCheckIds = [...currentCheckIds].filter(
    (id) => selectedSignalCheckIds.has(id) && !definition.baseline.checkIds.includes(id),
  );
  if (addedEntities.length || extraCheckIds.length) {
    return deepFreeze({
      status: 'minor-drift',
      differences: [
        ...addedEntities.map((entity) => ({
          id: `entity:${entity}`,
          severity: 'review',
          summary: `新增关联服务 ${entity}`,
        })),
        ...extraCheckIds.map((id) => ({ id: `check:${id}`, severity: 'review', summary: `新增检查项 ${id}` })),
      ],
    });
  }
  return deepFreeze({ status: 'exact', differences: [] });
}

const RESULT_RANK = Object.freeze({
  Violated: 0,
  Inconclusive: 1,
  NotEvaluated: 1,
  Verified: 2,
});

function selectRunsForDefinition(definition, runs = []) {
  if (!definition) return [];
  const unique = new Map();
  for (const run of runs) {
    if (run?.definitionId === definition.id || run?.id === definition.sourceRunId) unique.set(run.id, run);
  }
  return [...unique.values()].sort(
    (left, right) =>
      String(right.completedAt).localeCompare(String(left.completedAt)) ||
      String(right.id).localeCompare(String(left.id)),
  );
}

function compareExecutionResult(id, before, after) {
  if (!before) return { id, label: after.label, kind: 'added', before: null, after };
  if (!after) return { id, label: before.label, kind: 'removed', before, after: null };
  if (before.status === after.status && before.fact === after.fact && before.label === after.label) return null;
  const beforeRank = RESULT_RANK[before.status];
  const afterRank = RESULT_RANK[after.status];
  const kind = afterRank > beforeRank ? 'improved' : afterRank < beforeRank ? 'worsened' : 'stable';
  return { id, label: after.label, kind, before, after };
}

function compareInspectionRuns(currentRun, previousRun) {
  if (!Array.isArray(currentRun?.executionResults) || !Array.isArray(previousRun?.executionResults)) return null;
  const current = new Map(currentRun.executionResults.map((result) => [result.id, result]));
  const previous = new Map(previousRun.executionResults.map((result) => [result.id, result]));
  const ids = [...new Set([...current.keys(), ...previous.keys()])].sort();
  const items = [];
  for (const id of ids) {
    const item = compareExecutionResult(id, previous.get(id), current.get(id));
    if (item) items.push(item);
  }
  return deepFreeze({
    previousRunId: previousRun.id,
    previousCompletedAt: previousRun.completedAt,
    summary: items.length ? 'changed' : 'stable',
    items,
  });
}

function requireWorkspace(state) {
  if (!state.workspace) throw new Error('Inspection workspace is not compiled');
  return state.workspace;
}

function selectResolvedScope(state) {
  const workspace = requireWorkspace(state);
  return {
    status: workspace.reconciliation.status,
    entities: workspace.reconciliation.resolvedEntities,
    addedEntities: workspace.reconciliation.addedEntities,
  };
}

function selectPlanReadiness(state) {
  const workspace = requireWorkspace(state);
  const unresolvedCandidateIds = workspace.candidateChecks
    .filter(
      (candidate) =>
        candidate.criticality === 'high' &&
        !['accepted', 'rejected'].includes(state.candidateDisposition[candidate.id]?.status),
    )
    .map((candidate) => candidate.id);
  const reconciliationBlocked = ['Conflict', 'Unverifiable'].includes(workspace.reconciliation.status);
  return {
    status: reconciliationBlocked || unresolvedCandidateIds.length ? 'blocked' : 'ready',
    unresolvedCandidateIds,
    reconciliationBlocked,
  };
}

function selectCommittedChecks(state) {
  const workspace = requireWorkspace(state);
  if (state.taskInstance?.inspectionPlan) {
    const checks = state.taskInstance.inspectionPlan.checks;
    const sourceIds = new Set(workspace.contextSources.map((source) => source.id));
    for (const check of checks) assertCheckContract(check, sourceIds);
    return checks;
  }
  const baseChecks =
    state.playbookDecision === 'accepted-with-diff' ? state.playbookMatch.checks : workspace.committedChecks;
  const selectedBaseChecks = selectChecksForContext(state, baseChecks);
  const acceptedCandidates = workspace.candidateChecks.filter(
    (candidate) => state.candidateDisposition[candidate.id]?.status === 'accepted',
  );
  const checks = [...selectedBaseChecks, ...acceptedCandidates];
  const sourceIds = new Set(workspace.contextSources.map((source) => source.id));
  for (const check of checks) assertCheckContract(check, sourceIds);
  return checks;
}

function selectChecksForContext(state, checks) {
  const signalOptions = state.contextOptions.filter((item) => item.kind === 'signal');
  if (!signalOptions.length) return checks;
  const selectedSignalIds = new Set(
    signalOptions.filter((item) => item.selected).map((item) => item.id.slice('signal:'.length)),
  );
  return checks.filter((check) => selectedSignalIds.has(check.id));
}

function selectPlanSummary(state) {
  const workspace = requireWorkspace(state);
  const dispositions = state.candidateDisposition;
  const baseChecks =
    state.playbookDecision === 'accepted-with-diff' ? state.playbookMatch.checks : workspace.committedChecks;
  const selectedBaseChecks = selectChecksForContext(state, baseChecks);
  return {
    required: selectedBaseChecks.filter((check) => check.priority === 'required').length,
    recommended: workspace.candidateChecks.filter((candidate) => dispositions[candidate.id]?.status === 'accepted')
      .length,
    pending: workspace.candidateChecks.filter((candidate) => !dispositions[candidate.id]).length,
    rejected: workspace.candidateChecks.filter((candidate) => dispositions[candidate.id]?.status === 'rejected').length,
  };
}

function selectExecutionView(state) {
  const workspace = requireWorkspace(state);
  return workspace.execution.map((step, index) => ({
    ...step,
    progress:
      state.phase === 'report' || index <= state.executionStep
        ? 'complete'
        : index === state.executionStep + 1 && state.phase === 'execution'
          ? 'active'
          : 'queued',
  }));
}

function selectReportView(state) {
  const workspace = requireWorkspace(state);
  return state.phase === 'report' ? workspace.report : null;
}

function selectPlaybookView(state) {
  const matchVisible =
    state.phase === 'context' && Boolean(state.playbookMatch) && state.playbookDecision !== 'dismissed';
  return {
    match: matchVisible ? state.playbookMatch : null,
    reference: state.playbookDecision === 'regenerated' ? state.playbookMatch : null,
    decision: state.playbookDecision,
    driftReviewed: state.playbookDriftReviewed,
    taskInstance: state.taskInstance,
    proposal: state.playbookProposal,
  };
}

function selectSavedInspectionView(state) {
  const savedInspections = [...state.library.savedInspections].sort((left, right) =>
    String(right.updatedAt).localeCompare(String(left.updatedAt)),
  );
  const currentRun = state.library.runs.find((run) => run.id === state.currentRunId) ?? null;
  const historyDefinition =
    savedInspections.find((definition) => definition.id === state.activeHistoryDefinitionId) ?? null;
  const historyRuns = selectRunsForDefinition(historyDefinition, state.library.runs);
  const reportDefinitionId = state.activeSavedInspectionId ?? state.savedDefinitionId;
  const reportDefinition = savedInspections.find((definition) => definition.id === reportDefinitionId) ?? null;
  const reportRuns = selectRunsForDefinition(reportDefinition, state.library.runs);
  const currentRunIndex = currentRun ? reportRuns.findIndex((run) => run.id === currentRun.id) : -1;
  const comparison =
    currentRunIndex >= 0 && reportRuns[currentRunIndex + 1]
      ? compareInspectionRuns(currentRun, reportRuns[currentRunIndex + 1])
      : null;
  return {
    definitions: savedInspections,
    runs: state.library.runs,
    cards: savedInspections.map((definition) => {
      const definitionRuns = selectRunsForDefinition(definition, state.library.runs);
      return { definition, runs: definitionRuns, latestRun: definitionRuns[0] ?? null };
    }),
    activeDefinition: savedInspections.find((definition) => definition.id === state.activeSavedInspectionId) ?? null,
    historyDefinition,
    historyRuns,
    historyDiagnostics: state.historyDiagnostics,
    reportDefinition,
    comparison,
    refresh: state.savedRunRefresh,
    contextOptions: state.contextOptions,
    selectedContext: state.contextOptions.filter((item) => item.selected),
    currentRun,
    savedDefinitionId: state.savedDefinitionId,
    composerPrefill: state.composerPrefill,
    conversation: state.conversation,
    storageError: state.storageError,
    toast: state.toast,
  };
}

function selectViewModel(state) {
  if (!state.workspace) {
    return {
      state,
      workspace: null,
      scope: null,
      readiness: null,
      committedChecks: [],
      planSummary: null,
      execution: [],
      report: null,
      playbook: selectPlaybookView(state),
      savedInspection: selectSavedInspectionView(state),
    };
  }
  return {
    state,
    workspace: state.workspace,
    scope: selectResolvedScope(state),
    readiness: selectPlanReadiness(state),
    committedChecks: selectCommittedChecks(state),
    planSummary: selectPlanSummary(state),
    execution: selectExecutionView(state),
    report: selectReportView(state),
    playbook: selectPlaybookView(state),
    savedInspection: selectSavedInspectionView(state),
  };
}

function createDemoSession(options = {}) {
  const library = options.library
    ? mergeInspectionLibraries(createEmptyInspectionLibrary(), options.library)
    : createEmptyInspectionLibrary();
  return deepFreeze({
    workspace: null,
    phase: 'intake',
    candidateDisposition: {},
    executionStep: -1,
    rcExpanded: false,
    playbookMatch: null,
    playbookDecision: null,
    playbookDriftReviewed: false,
    playbookProposal: null,
    taskInstance: null,
    library,
    contextOptions: [],
    conversation: [],
    activeRequest: null,
    activeSavedInspectionId: null,
    activeHistoryDefinitionId: null,
    savedRunRefresh: null,
    composerPrefill: options.composerPrefill ?? null,
    currentRunId: null,
    savedDefinitionId: null,
    storageError: null,
    toast: null,
    shareToast: null,
    historyDiagnostics: {
      status: options.historyDiagnostics?.status ?? 'available',
      rejectedRunCount: options.historyDiagnostics?.rejectedRunCount ?? 0,
    },
    actorId: normalizeActorId(options.actorId),
    nextTaskOrdinal:
      options.nextTaskOrdinal ??
      nextOrdinal(
        library.runs.map((run) => run.taskInstanceId),
        'INS',
        48,
      ),
    nextRunOrdinal:
      options.nextRunOrdinal ??
      nextOrdinal(
        library.runs.map((run) => run.id),
        'RUN',
        48,
      ),
    nextSavedOrdinal:
      options.nextSavedOrdinal ??
      nextOrdinal(
        library.savedInspections.map((definition) => definition.id),
        'SAVED',
        1,
      ),
  });
}

function nextOrdinal(ids, prefix, fallback) {
  const ordinals = ids
    .map((id) => new RegExp(`^${prefix}-(\\d+)(?:$|-)`).exec(String(id))?.[1])
    .filter(Boolean)
    .map(Number);
  return ordinals.length ? Math.max(...ordinals) + 1 : fallback;
}

function normalizeActorId(actorId) {
  return typeof actorId === 'string' ? actorId.replace(/[^a-zA-Z0-9]/g, '') : '';
}

function scopedId(prefix, ordinal, width, actorId) {
  const base = `${prefix}-${String(ordinal).padStart(width, '0')}`;
  return actorId ? `${base}-${actorId}` : base;
}

function taskId(ordinal, actorId) {
  return scopedId('INS', ordinal, 4, actorId);
}

function runId(ordinal, actorId) {
  return scopedId('RUN', ordinal, 4, actorId);
}

function savedInspectionId(ordinal, actorId) {
  return scopedId('SAVED', ordinal, 3, actorId);
}

function demoTimestamp(ordinal, offset = 0) {
  return new Date(Date.UTC(2026, 7, 16, 6, ordinal + offset)).toISOString();
}

function createTaskInstance(ordinal, sourceSavedInspectionId = null, actorId = '') {
  const id = taskId(ordinal, actorId);
  return {
    id,
    status: 'draft',
    startedAt: demoTimestamp(ordinal),
    sourceSavedInspectionId,
    sourcePlaybookRef: null,
    referencePlaybookRef: null,
    inspectionPlan: null,
    auditTrail: [{ type: 'task-created', taskInstanceId: id }],
  };
}

function updateTaskInstance(taskInstance, patch, auditEvent) {
  if (!taskInstance || taskInstance.status === 'locked') return taskInstance;
  return {
    ...taskInstance,
    ...patch,
    auditTrail: auditEvent ? [...taskInstance.auditTrail, auditEvent] : taskInstance.auditTrail,
  };
}

function playbookRef(match) {
  return match ? { ...match.playbookRef } : null;
}

function snapshotChecks(checks) {
  return checks.map((check) => ({ ...check, sourceRefs: [...check.sourceRefs] }));
}

function createInspectionPlan(checks, sourcePlaybookRef = null, sourceSavedInspectionId = null) {
  return {
    source: sourceSavedInspectionId ? 'saved-inspection' : sourcePlaybookRef ? 'approved-playbook' : 'generated',
    sourcePlaybookRef: sourcePlaybookRef ? { ...sourcePlaybookRef } : null,
    sourceSavedInspectionId,
    checkIds: checks.map((check) => check.id),
    checks: snapshotChecks(checks),
  };
}

function reconciliationAllowsExecution(workspace) {
  return workspace && !['Conflict', 'Unverifiable'].includes(workspace.reconciliation.status);
}

function disposeCandidate(state, action) {
  if (state.phase !== 'plan' || !state.workspace) return state;
  const candidate = state.workspace.candidateChecks.find((item) => item.id === action.candidateId);
  if (!candidate || !['accepted', 'rejected'].includes(action.disposition)) {
    return state;
  }
  const reason = action.reason?.trim() ?? '';
  if (action.disposition === 'rejected' && !reason) return state;
  return {
    ...state,
    candidateDisposition: {
      ...state.candidateDisposition,
      [candidate.id]: {
        status: action.disposition,
        reason: reason || null,
      },
    },
  };
}

function submitIntent(state, action, playbookCatalog, compileIntent) {
  if (state.phase !== 'intake') return state;
  const workspace = compileIntent(action.request);
  const ordinal = state.nextTaskOrdinal;
  return {
    ...createDemoSession({
      library: state.library,
      actorId: state.actorId,
      nextTaskOrdinal: ordinal + 1,
      nextRunOrdinal: state.nextRunOrdinal,
      nextSavedOrdinal: state.nextSavedOrdinal,
      historyDiagnostics: state.historyDiagnostics,
    }),
    workspace,
    contextOptions: createContextOptions(workspace),
    conversation: [
      { role: 'user', text: action.request.prompt },
      { role: 'assistant', text: `已识别：${workspace.declaredChange.entities[0]} 巡检` },
    ],
    activeRequest: { ...action.request },
    playbookMatch: matchInspectionPlaybook(workspace, playbookCatalog),
    taskInstance: createTaskInstance(ordinal, null, state.actorId),
  };
}

function toggleDraftContext(state, action) {
  if (state.phase !== 'intake' || !state.workspace) return state;
  const contextOptions = toggleContextSelection(state.contextOptions, action.contextId);
  return contextOptions === state.contextOptions ? state : { ...state, contextOptions };
}

function confirmInput(state) {
  if (state.phase !== 'intake' || !state.workspace) return state;
  return { ...state, phase: state.playbookMatch ? 'context' : 'plan' };
}

function dismissPlaybook(state) {
  if (state.phase !== 'context' || !state.playbookMatch || state.playbookDecision) return state;
  return {
    ...state,
    playbookDecision: 'dismissed',
    taskInstance: updateTaskInstance(
      state.taskInstance,
      {},
      { type: 'playbook-dismissed', playbookRef: playbookRef(state.playbookMatch) },
    ),
  };
}

function startPlaybookExecution(state) {
  if (
    state.phase !== 'context' ||
    state.playbookMatch?.status !== 'exact' ||
    state.playbookDecision ||
    !reconciliationAllowsExecution(state.workspace)
  ) {
    return state;
  }
  const checks = selectChecksForContext(state, state.playbookMatch.checks);
  return {
    ...state,
    phase: 'execution',
    playbookDecision: 'applied',
    taskInstance: updateTaskInstance(
      state.taskInstance,
      {
        status: 'executing',
        sourcePlaybookRef: playbookRef(state.playbookMatch),
        inspectionPlan: createInspectionPlan(checks, playbookRef(state.playbookMatch)),
      },
      { type: 'playbook-applied', playbookRef: playbookRef(state.playbookMatch) },
    ),
  };
}

function confirmPlaybookDifference(state) {
  if (
    state.phase !== 'context' ||
    state.playbookMatch?.status !== 'minor-drift' ||
    state.playbookDecision ||
    !reconciliationAllowsExecution(state.workspace)
  ) {
    return state;
  }
  return {
    ...state,
    phase: 'plan',
    playbookDecision: 'accepted-with-diff',
    taskInstance: updateTaskInstance(
      state.taskInstance,
      { sourcePlaybookRef: playbookRef(state.playbookMatch) },
      {
        type: 'playbook-differences-confirmed',
        playbookRef: playbookRef(state.playbookMatch),
        differenceIds: state.playbookMatch.differences.map((difference) => difference.id),
      },
    ),
  };
}

function reviewPlaybookDrift(state) {
  return state.phase === 'context' && state.playbookMatch?.status === 'major-drift'
    ? { ...state, playbookDriftReviewed: true }
    : state;
}

function regenerateFromPlaybook(state) {
  if (
    state.phase !== 'context' ||
    state.playbookMatch?.status !== 'major-drift' ||
    state.playbookDecision ||
    !state.playbookDriftReviewed
  ) {
    return state;
  }
  return {
    ...state,
    phase: 'plan',
    playbookDecision: 'regenerated',
    taskInstance: updateTaskInstance(
      state.taskInstance,
      { referencePlaybookRef: playbookRef(state.playbookMatch) },
      { type: 'playbook-regenerated', referencePlaybookRef: playbookRef(state.playbookMatch) },
    ),
  };
}

function acceptScope(state) {
  if (state.phase !== 'context' || !state.workspace) return state;
  if (state.playbookMatch && state.playbookDecision !== 'dismissed') return state;
  const { reconciliation } = state.workspace;
  return ['Conflict', 'Unverifiable'].includes(reconciliation.status) ? state : { ...state, phase: 'plan' };
}

function confirmPlan(state) {
  if (state.phase !== 'plan' || selectPlanReadiness(state).status !== 'ready') return state;
  const checks = selectCommittedChecks(state);
  return {
    ...state,
    phase: 'execution',
    executionStep: -1,
    taskInstance: updateTaskInstance(
      state.taskInstance,
      {
        status: 'executing',
        inspectionPlan: createInspectionPlan(
          checks,
          state.taskInstance.sourcePlaybookRef,
          state.taskInstance.sourceSavedInspectionId,
        ),
      },
      { type: 'plan-confirmed', checkIds: checks.map((check) => check.id) },
    ),
  };
}

function advanceExecution(state) {
  if (state.phase !== 'execution' || !state.workspace) return state;
  const lastIndex = state.workspace.execution.length - 1;
  const nextStep = state.executionStep + 1;
  if (nextStep < lastIndex) return { ...state, executionStep: nextStep };
  const taskInstance = updateTaskInstance(state.taskInstance, { status: 'locked' }, { type: 'task-locked' });
  const id = runId(state.nextRunOrdinal, state.actorId);
  const run = createInspectionRun({
    id,
    taskInstance,
    definitionId: state.activeSavedInspectionId,
    selectedContext: state.contextOptions,
    executionResults: state.workspace.execution,
    report: state.workspace.report,
    startedAt: taskInstance.startedAt,
    completedAt: demoTimestamp(state.nextRunOrdinal, 1),
  });
  return {
    ...state,
    phase: 'report',
    executionStep: lastIndex,
    taskInstance,
    currentRunId: id,
    nextRunOrdinal: state.nextRunOrdinal + 1,
    library: {
      ...state.library,
      revision: state.library.revision + 1,
      runs: [...state.library.runs, run],
    },
  };
}

function toggleRootCause(state) {
  return state.phase === 'report' && state.workspace?.report.rcAgent
    ? { ...state, rcExpanded: !state.rcExpanded }
    : state;
}

function submitPlaybookProposal(state) {
  if (state.phase !== 'report' || state.taskInstance?.status !== 'locked' || state.playbookProposal) return state;
  const source = state.taskInstance.sourcePlaybookRef;
  return {
    ...state,
    playbookProposal: {
      id: `PB-PROP-${state.taskInstance.id}`,
      kind: source ? 'update' : 'create',
      sourceTaskInstanceId: state.taskInstance.id,
      sourcePlaybookRef: source ? { ...source } : null,
      targetVersion: source ? source.version + 1 : 1,
      status: 'pending-approval',
    },
  };
}

function createPersonalSavedInspection(state, action) {
  if (
    state.phase !== 'report' ||
    state.taskInstance?.status !== 'locked' ||
    !state.currentRunId ||
    state.savedDefinitionId
  ) {
    return state;
  }
  const currentRun = state.library.runs.find((run) => run.id === state.currentRunId);
  if (!currentRun) return state;
  const id = savedInspectionId(state.nextSavedOrdinal, state.actorId);
  let definition;
  try {
    definition = createSavedInspectionDefinition({
      id,
      name: action.name,
      request: state.activeRequest,
      workspace: state.workspace,
      selectedContext: state.contextOptions,
      taskInstance: state.taskInstance,
      sourceRunId: currentRun.id,
      now: action.now ?? demoTimestamp(state.nextSavedOrdinal),
    });
  } catch {
    return state;
  }
  return {
    ...state,
    savedDefinitionId: id,
    nextSavedOrdinal: state.nextSavedOrdinal + 1,
    toast: '已保存，下次可从首页直接执行',
    library: {
      ...state.library,
      revision: state.library.revision + 1,
      savedInspections: [...state.library.savedInspections, definition],
    },
  };
}

function savedPlan(definition) {
  return {
    ...definition.inspectionPlan,
    source: 'saved-inspection',
    sourceSavedInspectionId: definition.id,
    sourcePlaybookRef: definition.inspectionPlan.sourcePlaybookRef
      ? { ...definition.inspectionPlan.sourcePlaybookRef }
      : null,
    checkIds: [...definition.inspectionPlan.checkIds],
    checks: snapshotChecks(definition.inspectionPlan.checks),
  };
}

function selectedSavedContext(definition, workspace) {
  const selectedIds = new Set(definition.selectedContext.map((item) => item.id));
  const current = createContextOptions(workspace).map((item) => ({ ...item, selected: selectedIds.has(item.id) }));
  return current.some((item) => item.selected)
    ? current
    : definition.selectedContext.map((item) => ({ ...item, selected: true }));
}

function requestSavedInspectionRun(state, action, compileSavedDefinition) {
  if (state.phase !== 'intake' || state.workspace) return state;
  const definition = state.library.savedInspections.find((item) => item.id === action.definitionId);
  if (!definition) return state;
  let workspace;
  try {
    workspace = compileSavedDefinition(definition.request);
  } catch {
    return state;
  }
  const refresh = classifySavedInspectionRefresh(definition, workspace);
  const ordinal = state.nextTaskOrdinal;
  let taskInstance = createTaskInstance(ordinal, definition.id, state.actorId);
  let phase = 'context';
  if (refresh.status === 'exact') {
    phase = 'execution';
    taskInstance = updateTaskInstance(
      taskInstance,
      { status: 'executing', inspectionPlan: savedPlan(definition) },
      { type: 'saved-inspection-applied', definitionId: definition.id, refreshStatus: 'exact' },
    );
  }
  return {
    ...createDemoSession({
      library: state.library,
      actorId: state.actorId,
      nextTaskOrdinal: ordinal + 1,
      nextRunOrdinal: state.nextRunOrdinal,
      nextSavedOrdinal: state.nextSavedOrdinal,
      historyDiagnostics: state.historyDiagnostics,
    }),
    phase,
    workspace,
    contextOptions: selectedSavedContext(definition, workspace),
    activeRequest: { ...definition.request },
    activeSavedInspectionId: definition.id,
    savedRunRefresh: refresh,
    taskInstance,
  };
}

function confirmSavedInspectionRun(state) {
  if (state.phase !== 'context' || state.savedRunRefresh?.status !== 'minor-drift') return state;
  const definition = state.library.savedInspections.find((item) => item.id === state.activeSavedInspectionId);
  if (!definition) return state;
  return {
    ...state,
    phase: 'execution',
    taskInstance: updateTaskInstance(
      state.taskInstance,
      { status: 'executing', inspectionPlan: savedPlan(definition) },
      {
        type: 'saved-inspection-drift-confirmed',
        definitionId: definition.id,
        differenceIds: state.savedRunRefresh.differences.map((difference) => difference.id),
      },
    ),
  };
}

function regenerateSavedInspection(state) {
  if (state.phase !== 'context' || state.savedRunRefresh?.status !== 'major-drift') return state;
  const definition = state.library.savedInspections.find((item) => item.id === state.activeSavedInspectionId);
  if (!definition) return state;
  return createDemoSession({
    library: state.library,
    actorId: state.actorId,
    nextTaskOrdinal: state.nextTaskOrdinal,
    nextRunOrdinal: state.nextRunOrdinal,
    nextSavedOrdinal: state.nextSavedOrdinal,
    composerPrefill: { ...definition.request },
    historyDiagnostics: state.historyDiagnostics,
  });
}

function resetSession(state) {
  return createDemoSession({
    library: state.library,
    actorId: state.actorId,
    nextTaskOrdinal: state.nextTaskOrdinal,
    nextRunOrdinal: state.nextRunOrdinal,
    nextSavedOrdinal: state.nextSavedOrdinal,
    historyDiagnostics: state.historyDiagnostics,
  });
}

function hydrateLibrary(state, action) {
  if (state.phase !== 'intake' || state.workspace || state.library.revision > 0) return state;
  return createDemoSession({
    library: action.library,
    actorId: state.actorId,
    historyDiagnostics: action.diagnostics,
  });
}

function mergeLibrary(state, action) {
  const library = mergeInspectionLibraries(state.library, action.library);
  const historyDiagnostics = action.diagnostics ?? state.historyDiagnostics;
  return JSON.stringify(library) === JSON.stringify(state.library) && historyDiagnostics === state.historyDiagnostics
    ? state
    : { ...state, library, historyDiagnostics };
}

function openSavedInspectionHistory(state, action) {
  if (state.phase !== 'intake' || state.workspace) return state;
  const exists = state.library.savedInspections.some((definition) => definition.id === action.definitionId);
  return exists ? { ...state, activeHistoryDefinitionId: action.definitionId } : state;
}

function closeSavedInspectionHistory(state) {
  return state.activeHistoryDefinitionId ? { ...state, activeHistoryDefinitionId: null } : state;
}

function markStorageFailure(state, action) {
  return { ...state, storageError: action.message || '本地保存失败', toast: null };
}

function setShareFeedback(state, action) {
  return state.phase === 'report' ? { ...state, shareToast: action.message ?? null } : state;
}

function createDemoReducer(options = {}) {
  const playbookCatalog = options.playbookCatalog ?? inspectionPlaybooks;
  const compileIntent = options.compileIntent ?? compileInspectionRequest;
  const compileSavedDefinition = options.compileSavedDefinition ?? compileInspectionRequest;
  const sessionHandlers = {
    INTENT_SUBMITTED: (state, action) => submitIntent(state, action, playbookCatalog, compileIntent),
    RESET: resetSession,
    LIBRARY_HYDRATED: hydrateLibrary,
    LIBRARY_MERGED: mergeLibrary,
    LIBRARY_SAVE_FAILED: markStorageFailure,
    SHARE_FEEDBACK_SET: setShareFeedback,
    CONTEXT_ITEM_TOGGLED: toggleDraftContext,
    INPUT_CONFIRMED: confirmInput,
    PLAYBOOK_DISMISSED: dismissPlaybook,
    PLAYBOOK_EXECUTION_STARTED: startPlaybookExecution,
    PLAYBOOK_DIFF_CONFIRMED: confirmPlaybookDifference,
    PLAYBOOK_DRIFT_REVIEWED: reviewPlaybookDrift,
    PLAYBOOK_REGENERATED: regenerateFromPlaybook,
    SCOPE_ACCEPTED: acceptScope,
    CANDIDATE_DISPOSED: disposeCandidate,
    PLAN_CONFIRMED: confirmPlan,
    EXECUTION_ADVANCED: advanceExecution,
    RC_TOGGLED: toggleRootCause,
    PLAYBOOK_PROPOSAL_SUBMITTED: submitPlaybookProposal,
    SAVED_INSPECTION_CREATED: createPersonalSavedInspection,
    SAVED_INSPECTION_HISTORY_OPENED: openSavedInspectionHistory,
    SAVED_INSPECTION_HISTORY_CLOSED: closeSavedInspectionHistory,
    SAVED_INSPECTION_RUN_REQUESTED: (state, action) => requestSavedInspectionRun(state, action, compileSavedDefinition),
    SAVED_INSPECTION_RUN_CONFIRMED: confirmSavedInspectionRun,
    SAVED_INSPECTION_REGENERATED: regenerateSavedInspection,
  };
  return (state, action) =>
    deepFreeze((sessionHandlers[action.type] ?? ((currentState) => currentState))(state, action));
}

const defaultReducer = createDemoReducer();

function demoReducer(state, action) {
  return defaultReducer(state, action);
}

function escapeHtml(value = '') {
  return String(value)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

function requireShareableRun(run) {
  if (!run?.report || !run.completedAt) throw new TypeError('A completed inspection run is required');
  return run.report;
}

function isoMinute(value) {
  return new Date(value).toISOString().slice(0, 16).replace('T', ' ');
}

function buildReportShareText(run, taskName) {
  const report = requireShareableRun(run);
  const evidence = report.keyEvidence.slice(0, 2).join('；');
  return [
    `结论：${report.actionLabel}`,
    `时间：${isoMinute(run.completedAt)}`,
    `任务：${String(taskName).trim()}`,
    `关键证据：${evidence}`,
    `结论边界：${report.scopeStatement}`,
  ].join('\n');
}

function buildReportFilename(run, taskName) {
  requireShareableRun(run);
  const safeName = [...String(taskName).trim()]
    .map((character) => (character.charCodeAt(0) < 32 || '<>:"/\\|?*'.includes(character) ? '-' : character))
    .join('')
    .replace(/-+/g, '-')
    .replace(/^[.\s-]+|[.\s-]+$/g, '')
    .slice(0, 80);
  const [date, time] = new Date(run.completedAt).toISOString().slice(0, 16).split('T');
  const stamp = `${date.replaceAll('-', '')}-${time.replace(':', '')}`;
  return `${safeName || '巡检报告'}-${stamp}.html`;
}

function buildStandaloneReportHtml(run, taskName) {
  const report = requireShareableRun(run);
  const name = escapeHtml(String(taskName).trim());
  const evidence = report.keyEvidence.map((item) => `<li>${escapeHtml(item)}</li>`).join('');
  const risks = report.residualRisks.map((item) => `<li>${escapeHtml(item)}</li>`).join('');
  const doctype = '<!' + 'doctype html>';
  return `${doctype}
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>${name} · 巡检报告</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#07101f;color:#edf6ff}
    body{max-width:920px;margin:0 auto;padding:32px 20px;background:#07101f}
    header,section{border:1px solid #29415f;border-radius:16px;background:#0e1d33;padding:22px;margin-bottom:14px}
    header{border-color:#397462;background:linear-gradient(145deg,#153b37,#0e1d33)}
    h1{font-size:30px;margin:8px 0}h2{font-size:16px;margin:0 0 12px}p,li{line-height:1.7;color:#b9cadc}
    .meta{color:#72e6a6;font-size:12px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .pair section{margin:0}.foot{font-size:12px;color:#738aa3;text-align:center;border:0;background:transparent}
    @media(max-width:560px){body{padding:16px 12px}.pair{grid-template-columns:1fr}h1{font-size:24px}}
  </style>
</head>
<body>
  <header><div class="meta">离线巡检报告 · ${escapeHtml(isoMinute(run.completedAt))}</div><h1>${escapeHtml(report.actionLabel)}</h1><p>${escapeHtml(report.title)}</p></header>
  <section><h2>${name}</h2><p>${escapeHtml(report.summary)}</p></section>
  <div class="pair"><section><h2>关键证据</h2><ul>${evidence}</ul></section><section><h2>结论边界</h2><p>${escapeHtml(report.scopeStatement)}</p><h2>残余风险</h2><ul>${risks}</ul></section></div>
  <section class="foot">本报告由 NOVA 巡检 Copilot 离线演示生成 · 数据为 mock</section>
</body>
</html>`;
}

const CONTEXT_GROUPS = [
  ['change', '近期变更'],
  ['service', '关联服务与依赖'],
  ['signal', '可用信号'],
];

function renderExamples() {
  return inspectionExamples
    .map(
      (example) => `
        <button class="example-fill" data-example-id="${example.id}" type="button">
          <span>填入示例</span>
          <strong>${escapeHtml(example.label)}</strong>
          <small>${escapeHtml(example.prompt)}</small>
        </button>`,
    )
    .join('');
}

function formatRunTime(value) {
  return value ? new Date(value).toLocaleString('zh-CN', { hour12: false }) : '—';
}

function runTone(run) {
  return ['Pause', 'Rollback'].includes(run?.report?.action) ? 'pause' : run ? 'proceed' : 'empty';
}

function renderMiniRunHistory(runs, diagnostics) {
  if (diagnostics?.status === 'degraded') return '<p class="run-history-unavailable">历史暂不可用</p>';
  if (!runs.length) return '<p class="run-history-empty">还没有执行记录</p>';
  const recent = runs.slice(0, 10).reverse();
  return `<div class="run-history-mini" aria-label="最近 ${recent.length} 次执行">${recent
    .map((run) => {
      const action = run.report?.actionLabel ?? run.report?.action ?? '未知结论';
      return `<span class="run-history-dot is-${runTone(run)}" title="${escapeHtml(formatRunTime(run.completedAt))} · ${escapeHtml(action)}"></span>`;
    })
    .join('')}<small>最近 ${recent.length} 次</small></div>`;
}

function renderSavedCard(card, diagnostics) {
  const { definition, runs, latestRun: run } = card;
  const action = run?.report?.actionLabel ?? run?.report?.action ?? '尚未执行';
  const completedAt = formatRunTime(run?.completedAt);
  return `<article class="saved-inspection-card" data-testid="saved-inspection-card">
    <button class="saved-inspection-copy" data-action="SAVED_INSPECTION_HISTORY_OPENED" data-definition-id="${escapeHtml(definition.id)}" type="button">
      <span class="readiness">本地 mock</span>
      <h3>${escapeHtml(definition.name)}</h3>
      <p>上次：${escapeHtml(action)} · ${escapeHtml(completedAt)}</p>
      ${renderMiniRunHistory(runs, diagnostics)}
    </button>
    <button class="saved-run-button" data-action="SAVED_INSPECTION_RUN_REQUESTED" data-definition-id="${escapeHtml(definition.id)}" type="button">直跑 <b>▶</b></button>
  </article>`;
}

function renderSavedInspectionHome(vm) {
  const { cards, historyDiagnostics, storageError } = vm.savedInspection;
  return `<section class="saved-inspection-home" data-testid="saved-inspection-home" aria-labelledby="saved-title">
    <header class="saved-inspection-heading">
      <div><h2 id="saved-title" data-stage-title>已保存巡检</h2><p>个人任务保存在当前浏览器</p></div>
      <span class="readiness">本地 mock</span>
    </header>
    ${storageError ? `<p class="storage-warning" role="status">${escapeHtml(storageError)}</p>` : ''}
    ${
      cards.length
        ? `<div class="saved-inspection-list">${cards.map((card) => renderSavedCard(card, historyDiagnostics)).join('')}</div>`
        : '<p class="saved-inspection-empty">还没有保存的巡检，从右侧对话开始 →</p>'
    }
  </section>`;
}

function renderHistoryEntry(run) {
  const action = run.report?.actionLabel ?? run.report?.action ?? '未知结论';
  return `<details class="saved-history-entry" data-run-id="${escapeHtml(run.id)}">
    <summary><span class="run-history-dot is-${runTone(run)}"></span><time>${escapeHtml(formatRunTime(run.completedAt))}</time><strong>${escapeHtml(action)}</strong><small>${escapeHtml(run.report?.summary ?? '')}</small></summary>
    ${renderHistoricalReportSnapshot(run)}
  </details>`;
}

function renderSavedInspectionHistory(vm) {
  const { historyDefinition: definition, historyRuns: runs, historyDiagnostics } = vm.savedInspection;
  const recent = runs.slice(0, 20);
  const earlier = runs.slice(20);
  return `<section class="saved-inspection-history" data-testid="saved-inspection-history" aria-labelledby="history-title">
    <header class="saved-history-heading">
      <div><button class="history-back" data-action="SAVED_INSPECTION_HISTORY_CLOSED" type="button">← 返回</button><h2 id="history-title" data-stage-title>${escapeHtml(definition.name)}</h2><p>创建于 ${escapeHtml(formatRunTime(definition.createdAt))} · 共执行 ${runs.length} 次</p></div>
      <button class="saved-run-button" data-action="SAVED_INSPECTION_RUN_REQUESTED" data-definition-id="${escapeHtml(definition.id)}" type="button">直跑 <b>▶</b></button>
    </header>
    <h3 class="saved-history-title">运行历史</h3>
    ${historyDiagnostics?.status === 'degraded' ? '<p class="storage-warning" role="status">历史暂不可用：已隔离损坏记录，仍可直跑</p>' : ''}
    ${recent.length ? `<div class="saved-history-list">${recent.map(renderHistoryEntry).join('')}</div>` : '<p class="saved-inspection-empty">还没有执行记录</p>'}
    ${earlier.length ? `<details class="saved-history-earlier"><summary>显示更早（${earlier.length}）</summary>${earlier.map(renderHistoryEntry).join('')}</details>` : ''}
  </section>`;
}

function renderContextGroup(options, kind, title) {
  const items = options.filter((item) => item.kind === kind);
  if (!items.length) return '';
  return `<section class="context-option-group" aria-labelledby="context-${kind}">
    <header><h3 id="context-${kind}">${title}</h3><span>${items.filter((item) => item.selected).length}/${items.length}</span></header>
    <div class="context-option-list">
      ${items
        .map(
          (
            item,
          ) => `<button class="context-option ${item.selected ? 'is-selected' : ''}" data-action="CONTEXT_ITEM_TOGGLED" data-context-id="${escapeHtml(item.id)}" aria-pressed="${item.selected}" type="button">
            <span class="context-check">${item.selected ? '✓' : '+'}</span>
            <span><strong>${escapeHtml(item.label)}</strong><small>${escapeHtml(item.detail)}</small></span>
          </button>`,
        )
        .join('')}
    </div>
  </section>`;
}

function renderContextSelection(vm) {
  return `<section class="context-selection" data-testid="context-selection" aria-labelledby="context-selection-title">
    <header class="stage-heading">
      <div><h2 id="context-selection-title" data-stage-title>确认巡检信息</h2><p>勾选本次要验证的范围</p></div>
      <button class="edit-intent" data-action="RESET" type="button">重新描述</button>
    </header>
    <div class="context-option-groups">
      ${CONTEXT_GROUPS.map(([kind, title]) => renderContextGroup(vm.savedInspection.contextOptions, kind, title)).join('')}
    </div>
    <button class="compile-button context-confirm" data-action="INPUT_CONFIRMED" type="button"><span>生成任务草案</span><b>→</b></button>
  </section>`;
}

function renderConversationComposer(vm) {
  const prefill = vm.savedInspection.composerPrefill ?? {};
  const conversation = vm.savedInspection.conversation;
  const busy = Boolean(vm.workspace);
  return `<div class="conversation-shell">
    <div class="conversation-log" aria-live="polite">
      ${
        conversation.length
          ? conversation
              .map((message) => `<p class="conversation-message ${message.role}">${escapeHtml(message.text)}</p>`)
              .join('')
          : '<p class="conversation-empty">描述要巡检的服务或变更</p>'
      }
    </div>
    <form class="conversation-form" data-intent-form>
      <textarea name="inspection-intent" rows="3" required ${busy ? 'disabled' : ''} placeholder="例如：巡检 payment-api 本周配置变更">${escapeHtml(prefill.prompt ?? '')}</textarea>
      <details class="conversation-details" ${prefill.targetService || prefill.contextReference ? 'open' : ''}>
        <summary>补充服务或电子流</summary>
        <input name="target-service" ${busy ? 'disabled' : ''} value="${escapeHtml(prefill.targetService ?? '')}" placeholder="目标服务（可选）" />
        <input name="context-reference" ${busy ? 'disabled' : ''} value="${escapeHtml(prefill.contextReference ?? '')}" placeholder="电子流 / 发布单（可选）" />
      </details>
      <button class="conversation-send" type="submit" ${busy ? 'disabled' : ''}>${busy ? '当前巡检进行中' : '发送'}</button>
    </form>
    ${!busy ? `<details class="conversation-examples"><summary>填入示例</summary><div class="example-grid">${renderExamples()}</div></details>` : ''}
  </div>`;
}

function renderIntake(vm) {
  if (vm.savedInspection.historyDefinition) return renderSavedInspectionHistory(vm);
  return vm.workspace ? renderContextSelection(vm) : renderSavedInspectionHome(vm);
}

function renderCandidate(candidate, disposition) {
  const accepted = disposition?.status === 'accepted';
  const rejected = disposition?.status === 'rejected';
  const status = accepted ? '已纳入正式计划' : rejected ? '已拒绝并记录理由' : '待处置';
  return `
    <article class="candidate-card ${accepted ? 'is-accepted' : ''} ${rejected ? 'is-rejected' : ''}">
      <header><span>${candidate.criticality === 'high' ? '高风险候选' : '候选检查'}</span><strong>${status}</strong></header>
      <h4>${escapeHtml(candidate.purpose)}</h4>
      <p class="single-line-note" title="${escapeHtml(candidate.rationale)}">${escapeHtml(candidate.rationale)}</p>
      <code>${escapeHtml(candidate.metric)}</code>
      ${
        !accepted && !rejected
          ? `<div class="candidate-actions">
              <button data-action="CANDIDATE_DISPOSED" data-candidate-id="${candidate.id}" data-disposition="accepted" type="button">纳入计划</button>
              <button class="button-ghost" data-action="CANDIDATE_DISPOSED" data-candidate-id="${candidate.id}" data-disposition="rejected" data-reason="专家确认该风险不属于本次变更边界" type="button">拒绝并留痕</button>
            </div>`
          : rejected
            ? `<small>拒绝理由：${escapeHtml(disposition.reason)}</small>`
            : ''
      }
    </article>`;
}

function renderSourceRefs(check, contextSources) {
  const sourceById = new Map(contextSources.map((source) => [source.id, source]));
  return check.sourceRefs
    .map((sourceId) => {
      const source = sourceById.get(sourceId);
      return `<li><span>${escapeHtml(source?.kind ?? '未知来源')}</span><strong>${escapeHtml(source?.label ?? sourceId)}</strong></li>`;
    })
    .join('');
}

function renderCheck(check, isCandidate, contextSources) {
  return `
    <details class="check-card ${isCandidate ? 'is-candidate-check' : ''}">
      <summary>
        <span class="check-index">${check.priority === 'required' ? '必' : '荐'}</span>
        <span class="check-summary">
          <span>${escapeHtml(check.severity)}</span>
          <strong>${escapeHtml(check.purpose)}</strong>
          <code>${escapeHtml(check.metric)}</code>
        </span>
        <span class="check-toggle">来源与判定依据⌄</span>
      </summary>
      <div class="check-body">
        <p>${escapeHtml(check.rationale)}</p>
        <dl>
          <div><dt>目标实体</dt><dd>${escapeHtml(check.entity)}</dd></div>
          <div><dt>执行能力</dt><dd>${escapeHtml(check.capability)}</dd></div>
          <div><dt>判定规则</dt><dd>${escapeHtml(check.rule)}</dd></div>
          <div><dt>时间与基线</dt><dd>${escapeHtml(check.window)} · ${escapeHtml(check.baseline)}</dd></div>
          <div><dt>失败动作</dt><dd>${escapeHtml(check.failureAction)}</dd></div>
          <div class="check-sources"><dt>事实来源</dt><dd><ul>${renderSourceRefs(check, contextSources)}</ul></dd></div>
        </dl>
      </div>
    </details>`;
}

function renderPlanStats(summary) {
  return `
    <div class="plan-stats" aria-label="任务草案分级统计">
      <div data-testid="plan-stat-required"><span>必查</span><strong>${summary.required}</strong></div>
      <div data-testid="plan-stat-recommended"><span>建议</span><strong>${summary.recommended}</strong></div>
      <div data-testid="plan-stat-pending"><span>待确认</span><strong>${summary.pending}</strong></div>
      <div><span>已忽略</span><strong>${summary.rejected}</strong></div>
    </div>`;
}

function renderSelectedContext(items) {
  if (!items.length) return '';
  return `<section class="plan-context" data-testid="selected-context-plan">
    <h3>本次巡检信息</h3>
    <ul>${items.map((item) => `<li><span>${escapeHtml(item.kind)}</span><strong>${escapeHtml(item.label)}</strong></li>`).join('')}</ul>
  </section>`;
}

function renderInspectionPlan(vm) {
  const disposition = vm.state.candidateDisposition;
  const candidates = vm.workspace.candidateChecks
    .map((candidate) => renderCandidate(candidate, disposition[candidate.id]))
    .join('');
  const acceptedIds = new Set(
    Object.entries(disposition)
      .filter(([, item]) => item.status === 'accepted')
      .map(([id]) => id),
  );
  return `
    <div class="plan-stage" data-testid="inspection-plan">
      <header class="stage-heading">
        <div><h2 data-stage-title>巡检任务</h2></div>
        <span class="readiness ${vm.readiness.status}">${vm.readiness.status === 'ready' ? '可确认' : '候选待处置'}</span>
      </header>
      ${renderSelectedContext(vm.savedInspection.selectedContext)}
      ${renderPlanStats(vm.planSummary)}
      <section class="plan-section" aria-labelledby="pending-title">
        <h3 id="pending-title">待确认项</h3>
        <div class="candidate-stack">${candidates}</div>
      </section>
      <section class="plan-section" aria-labelledby="formal-title">
        <h3 id="formal-title">正式检查</h3>
        <div class="check-stack">
          ${vm.committedChecks
            .map((check) => renderCheck(check, acceptedIds.has(check.id), vm.workspace.contextSources))
            .join('')}
        </div>
      </section>
    </div>`;
}

const STATUS_COPY = {
  exact: {
    stateLabel: '精准匹配',
    action: 'PLAYBOOK_EXECUTION_STARTED',
    actionLabel: '按方案直跑',
  },
  'minor-drift': {
    stateLabel: '需确认差异',
    action: 'PLAYBOOK_DIFF_CONFIRMED',
    actionLabel: '确认差异并继续',
  },
  'major-drift': {
    stateLabel: '禁止直跑',
    action: 'PLAYBOOK_REGENERATED',
    actionLabel: '重新生成（参考旧方案）',
  },
};

function renderMatchTitle(match) {
  if (match.status === 'exact') {
    return `命中方案：${escapeHtml(match.title)} · v${match.playbookRef.version}`;
  }
  if (match.status === 'major-drift') {
    return `方案 v${match.playbookRef.version} 不适用：${match.differences.length} 项重大差异`;
  }
  return '确认方案差异';
}

const DIRECTION_LABELS = {
  added: '新增',
  changed: '变更',
  removed: '失效',
};

function renderValidation(validation) {
  return `<li class="${escapeHtml(validation.status)}"><span>${escapeHtml(validation.label)}</span><strong>${escapeHtml(validation.detail)}</strong></li>`;
}

function renderDifferences(match) {
  return `<ul class="playbook-difference-list">
    ${match.differences
      .map(
        (
          difference,
        ) => `<li data-difference-dimension="${escapeHtml(difference.dimension)}" class="${escapeHtml(difference.severity)}">
          <span>${escapeHtml(difference.label)} · ${escapeHtml(DIRECTION_LABELS[difference.direction])}</span>
          <strong>${escapeHtml(difference.summary)}</strong>
        </li>`,
      )
      .join('')}
  </ul>`;
}

function renderDriftReview(match, driftReviewed) {
  if (match.status !== 'major-drift') return '';
  return driftReviewed
    ? '<p class="playbook-reviewed">✓ 已确认看完全部当前差异</p>'
    : `<button class="playbook-review-drift" data-action="PLAYBOOK_DRIFT_REVIEWED" type="button">确认已查看 ${match.differences.length} 项差异</button>`;
}

function renderMatchDetails(match, driftReviewed) {
  if (match.status === 'exact') {
    return `<details class="playbook-validation">
      <summary>五项校验通过 <span>查看详情</span></summary>
      <ul>${match.validations.map(renderValidation).join('')}</ul>
    </details>`;
  }
  const content = `${renderDifferences(match)}${renderDriftReview(match, driftReviewed)}`;
  return `<div class="playbook-differences-desktop">${content}</div>
    <details class="playbook-drawer">
      <summary>查看 ${match.differences.length} 项当前差异</summary>
      <div class="playbook-drawer-body">${content}</div>
    </details>`;
}

function renderMatchActions(match, driftReviewed) {
  const copy = STATUS_COPY[match.status];
  const disabled = match.status === 'major-drift' && !driftReviewed;
  const secondary =
    match.status === 'major-drift'
      ? ''
      : '<button class="playbook-dismiss" data-action="PLAYBOOK_DISMISSED" type="button">不用方案，重新生成</button>';
  return `<div class="playbook-actions">
    <button class="compile-button playbook-primary" data-action="${copy.action}" ${disabled ? 'disabled' : ''} type="button">
      <span>${disabled ? '看完差异后可重新生成' : copy.actionLabel}</span><b>→</b>
    </button>
    ${secondary}
  </div>`;
}

function renderPlaybookMatch(playbookView) {
  const match = playbookView?.match;
  if (!match) return '';
  const copy = STATUS_COPY[match.status];
  return `<section class="playbook-match ${match.status}" data-testid="playbook-match" data-match-status="${match.status}" aria-labelledby="playbook-match-title">
    <header class="playbook-match-header">
      <div><span class="match-state">${copy.stateLabel}</span><h2 id="playbook-match-title">${renderMatchTitle(match)}</h2></div>
      <div class="playbook-signals"><span class="readiness">匹配 ${match.score}%</span><span class="readiness">${escapeHtml(match.lastUsedLabel)}</span><span class="readiness">${match.differences.length} 项差异</span></div>
    </header>
    ${
      match.status === 'exact'
        ? '<div class="playbook-structure-note"><span class="info-tip" tabindex="0" aria-label="复用检查结构，证据重新采集" title="复用检查结构，证据重新采集">ⓘ</span><span>检查结构</span></div>'
        : `<div class="playbook-identity"><span>巡检方案</span><strong>${escapeHtml(match.title)} · v${match.playbookRef.version}</strong></div>`
    }
    ${match.status === 'minor-drift' ? `<p class="playbook-summary single-line-note" title="${escapeHtml(match.summary)}">${escapeHtml(match.summary)}</p>` : ''}
    ${renderMatchDetails(match, playbookView.driftReviewed)}
    ${renderMatchActions(match, playbookView.driftReviewed)}
  </section>`;
}

function renderPlaybookReference(playbookView) {
  const reference = playbookView?.reference;
  if (!reference) return '';
  return `<section class="playbook-reference" data-testid="playbook-reference">
    <span>旧方案仅作参考</span>
    <strong>${escapeHtml(reference.playbookRef.id)} · v${reference.playbookRef.version}</strong>
    <p>${escapeHtml(reference.summary)}</p>
  </section>`;
}

function renderPlaybookProposal(playbookView) {
  const task = playbookView?.taskInstance;
  if (!task || task.status !== 'locked') return '';
  const proposal = playbookView.proposal;
  const source = task.sourcePlaybookRef;
  const targetVersion = source ? source.version + 1 : 1;
  return `<section class="playbook-proposal" data-testid="playbook-proposal">
    <div><h3>保存方案</h3></div>
    <p class="single-line-note" title="历史任务 ${escapeHtml(task.id)} 已锁定">历史实例不受影响</p>
    ${
      proposal
        ? `<div class="playbook-proposal-status"><span>${proposal.kind === 'update' ? '方案更新' : '新方案'} v${proposal.targetVersion} · 待审批</span><strong>审批通过后，下次匹配才会生效</strong></div>`
        : `<button class="playbook-proposal-action" data-action="PLAYBOOK_PROPOSAL_SUBMITTED" type="button">${
            source ? `提交方案更新 → v${targetVersion}` : `保存为新方案 v${targetVersion}`
          }</button>`
    }
  </section>`;
}

function differenceList(differences) {
  return `<ul class="saved-refresh-differences">${differences
    .map((difference) => `<li>${escapeHtml(difference.summary ?? difference.id)}</li>`)
    .join('')}</ul>`;
}

function renderSavedInspectionRefresh(savedInspection) {
  const refresh = savedInspection?.refresh;
  const definition = savedInspection?.activeDefinition;
  if (!refresh || !definition || refresh.status === 'exact') return '';
  if (refresh.status === 'minor-drift') {
    return `<section class="saved-refresh reconciliation is-expanded" data-testid="saved-refresh" data-refresh-status="minor-drift">
      <span>已刷新当前事实</span>
      <h2>当前事实有差异</h2>
      <p>${escapeHtml(definition.name)} 的检查结构仍可执行，请先确认差异。</p>
      ${differenceList(refresh.differences)}
      <button class="compile-button" data-action="SAVED_INSPECTION_RUN_CONFIRMED" type="button"><span>仍要执行</span><b>→</b></button>
    </section>`;
  }
  return `<section class="saved-refresh reconciliation is-blocked" data-testid="saved-refresh" data-refresh-status="major-drift">
    <span>已刷新当前事实</span>
    <h2>当前结构已变化，不能直跑</h2>
    <p>${escapeHtml(definition.name)} 仅作参考；重新描述后会生成新任务。</p>
    ${differenceList(refresh.differences)}
    <button class="compile-button" data-action="SAVED_INSPECTION_REGENERATED" type="button"><span>回到对话重新生成</span><b>→</b></button>
  </section>`;
}

function renderSavedExecutionStatus(savedInspection) {
  if (savedInspection?.refresh?.status !== 'exact' || !savedInspection.activeDefinition) return '';
  return `<div class="saved-execution-status reconciliation is-exact" data-testid="saved-refresh" data-refresh-status="exact">
    <span>当前事实</span><strong>一致，已直接执行</strong>
    <p>${escapeHtml(savedInspection.activeDefinition.name)} · 新任务 ${escapeHtml(savedInspection.currentRun?.taskInstanceId ?? '执行中')}</p>
  </div>`;
}

function renderSelectedContextResults(run) {
  if (!run?.selectedContextResults?.length) return '';
  return `<section class="report-context-results" data-testid="selected-context-results">
    <h3>本次选择的巡检结果</h3>
    <div class="report-context-grid">${run.selectedContextResults
      .map(
        (item) =>
          `<article><span>${escapeHtml(item.kind)}</span><strong>${escapeHtml(item.label)}</strong><small>✓ ${escapeHtml(item.status)}</small></article>`,

function suggestedName(vm) {
  const entity = vm.workspace?.declaredChange?.entities?.[0] ?? '服务';

function renderPersonalSave(vm) {
  const saved = vm.savedInspection;

    return `<p class="save-toast" role="status">${escapeHtml(saved.toast ?? '已保存，下次可从首页直接执行')}</p>`;
  }
  return `<section class="personal-save" aria-labelledby="personal-save-title">
    <div><h3 id="personal-save-title">保存这次巡检</h3><p>保存后下次可从首页直接执行</p></div>

      <input name="saved-inspection-name" required value="${escapeHtml(suggestedName(vm))}" aria-label="巡检名称" />

function renderReportJourneyDetails(vm) {
  const run = vm.savedInspection.currentRun;
  return `${renderSelectedContextResults(run)}
    <section class="model-risk-summary">
      <h3>模型风险总结</h3>
      <ul>${vm.report.residualRisks.map((risk) => `<li>${escapeHtml(risk)}</li>`).join('')}</ul>

function formatReportTime(value) {
  if (!value) return '时间未知';
  return new Date(value).toLocaleString('zh-CN', { hour12: false });
}

function renderDecisionHero(report, extra = '') {
  return `<div class="decision-hero">
    <div><h2>${escapeHtml(report.actionLabel)}</h2><p>${escapeHtml(report.title)}</p></div>
    ${extra}
  </div>`;
}

function renderReportEvidence(report) {
  return `<div class="semantic-pair">
      <div><span>证据结论</span><code>${escapeHtml(report.evidenceVerdict)}</code></div>
      <div><span>行动决策</span><code>${escapeHtml(report.action)}</code></div>
    </div>
    <div class="evidence-badges">
      <span class="verified">✓ ${report.evidenceCounts.verified} 已验证</span>
      <span class="violated">! ${report.evidenceCounts.violated} 违例</span>
      <span class="unresolved">? ${report.evidenceCounts.unresolved} 未决</span>
    </div>
    <p class="report-summary single-line-note" title="${escapeHtml(report.summary)}">${escapeHtml(report.summary)}</p>
    <div class="report-columns">
      <section><h3>关键证据</h3><ul>${report.keyEvidence.map((item) => `<li>${escapeHtml(item)}</li>`).join('')}</ul></section>
      <section><h3>结论边界</h3><p>${escapeHtml(report.scopeStatement)}</p><h3>残余风险</h3><ul>${report.residualRisks.map((item) => `<li>${escapeHtml(item)}</li>`).join('')}</ul></section>
    </div>`;

function comparisonText(item) {
  if (item.kind === 'added') return `新增覆盖：${item.after.label}`;
  if (item.kind === 'removed') return `移除覆盖：${item.before.label}`;
  return `${item.label}：${item.before.fact} → ${item.after.fact}`;
}

function renderRunComparison(comparison) {
  if (!comparison) return '';
  const heading = `与上次相比（${formatReportTime(comparison.previousCompletedAt)} → 本次）`;
  if (comparison.summary === 'stable') {
    return `<section class="run-comparison is-stable" data-testid="run-comparison"><h3>${escapeHtml(heading)}</h3><p>→ 与上次结论一致</p></section>`;
  }
  const labels = {
    improved: ['✓', '改善'],
    worsened: ['✕', '恶化'],
    stable: ['→', '持平'],
    added: ['+', '新增'],
    removed: ['−', '移除'],
  };
  return `<section class="run-comparison" data-testid="run-comparison">
    <h3>${escapeHtml(heading)}</h3>
    <ul>${comparison.items
      .map((item) => {
        const [symbol, label] = labels[item.kind];
        return `<li class="is-${item.kind}"><span>${symbol}</span><div><strong>${label}</strong><p>${escapeHtml(comparisonText(item))}</p></div></li>`;
      })
      .join('')}</ul>
  </section>`;
}

function renderShareControls(message) {
  return `<div class="report-share" aria-label="分享当前报告">
    <button data-share-action="copy" type="button">复制摘要</button>
    <button data-share-action="export" type="button">导出报告</button>
    ${message ? `<p class="share-toast" role="status">${escapeHtml(message)}</p>` : ''}
  </div>`;
}

function renderHistoricalReportSnapshot(run) {
  const report = run.report;
  return `<div class="historical-report report-stage ${report.action.toLowerCase()}" data-testid="historical-report">
    <p class="historical-banner">历史快照 · ${escapeHtml(formatReportTime(run.completedAt))} · 不可修改</p>

    ${renderReportEvidence(report)}
    ${renderSelectedContextResults(run)}

function renderCurrentReport(vm) {
  const report = vm.report;
  return `<div class="report-stage ${report.action.toLowerCase()}" data-testid="final-report" data-current-run-id="${escapeHtml(vm.savedInspection.currentRun?.id ?? '')}">
